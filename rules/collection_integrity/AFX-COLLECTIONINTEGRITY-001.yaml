# GENERATED by scripts/gen_relocation_rule.py from catalog/. Do not edit.
#
# The names below are the environment variables the catalogue records as changing where an
# agent keeps its data, whether it keeps it, or what it obeys. They are generated because
# there are 96 of them across 21 agents and because a list of catalogue facts copied
# into a rule file is a list that stops being true without anybody noticing.
#
# The third of those is why this list is wider than its name suggests, and it is worth
# stating rather than leaving somebody to notice. Most of these move a directory. Some
# decide whether a record exists at all, such as the one that turns a credential store from
# a keyring entry into a file. And a few change what the agent was told rather than where it
# wrote: a variable that carries standing instructions in the environment, or one that
# replaces the filenames that count as instruction files. All three make a collection of the
# documented paths answer a different question than the one it looks like it answered, which
# is the finding this rule reports, so all three are here. A variable whose whole effect is
# to defeat attribution is a different finding and has a rule of its own in the
# anti_forensics pack; it is still in this list, because the collection question applies to
# it too.
#
# Deliberately excluded, and this is the whole of the exclusion: HOME, PATH, TMPDIR, USERPROFILE, XDG_CACHE_HOME, XDG_CONFIG_HOME, XDG_DATA_HOME, XDG_RUNTIME_DIR, XDG_STATE_HOME. Those are the
# platform's own variables. An agent's path is computed from them, which is why the
# catalogue carries them, but they are exported in ordinary profiles for ordinary reasons
# and a rule that matched them would fire on most developer machines.
id: AFX-COLLECTIONINTEGRITY-001
pack: collection_integrity
title: An agent was configured to write somewhere else, or not at all
severity: medium
description: >
  A shell profile, or the environment an agent ran in, exports a variable the catalogue
  records as changing where that agent keeps its data, whether it keeps it, or what it
  obeys. What was collected from the default paths is therefore not necessarily what that
  agent wrote, and not necessarily all of what it was told.
rationale: >
  This rule is about the case rather than about the endpoint, which is why it exists at
  all. Every other finding says something happened; this one says a part of the collection
  may be answering the wrong question. An agent whose home was moved leaves nothing at the
  path a collection searched, and nothing found there reads exactly like an agent that was
  never used. A few of these variables carry the instructions themselves rather than a
  path, in which case there is nothing further to collect and what the agent was told
  every turn exists only in the environment of the run. The variable is usually set for an
  ordinary reason, so this is not a suspicion about anybody: it is an instruction to go
  back for what the variable names before concluding anything from an empty result.
applies_to:
  kinds: [config.snapshot, prompt.history, command.exec, unparsed.record]
match:
  field: event_text
  # [^\S\n] rather than \s: the text a rule searches is the record's leaves one per line,
  # and \s matches a newline, so a name at the end of one line and an unrelated value at
  # the start of the next would otherwise match as an assignment.
  regex: '\b(AMP_DISABLE_AMP_COAUTHOR_TRAILER|AMP_DISABLE_AMP_THREAD_TRAILER|AMP_SKIP_UPDATE_CHECK|ANTHROPIC_CONFIG_DIR|CLAUDE_CODE_DEBUG_LOGS_DIR|CLAUDE_CODE_PLUGIN_CACHE_DIR|CLAUDE_CODE_PROJECT_DIR_NAME|CLAUDE_CODE_SKIP_PROMPT_HISTORY|CLAUDE_CONFIG_DIR|CLAUDE_DESKTOP_ADD_REPO|CLAUDE_PLUGIN_ROOT|CLINE_CONNECTORS_DB_PATH|CLINE_CONNECTOR_DATA_DIR|CLINE_CONNECTOR_SETTINGS_PATH|CLINE_CRON_DB_PATH|CLINE_DATA_DIR|CLINE_DB_DATA_DIR|CLINE_DIR|CLINE_GLOBAL_SETTINGS_PATH|CLINE_HOOKS_LOG_PATH|CLINE_MCP_SETTINGS_PATH|CLINE_PROVIDER_SETTINGS_PATH|CLINE_SESSION_DATA_DIR|CLINE_TASKS_DB_PATH|CLINE_TEAM_DATA_DIR|CODEX_HOME|CODEX_SQLITE_HOME|CONTEXT_FILE_NAMES|CONTINUE_GLOBAL_DIR|COPILOT_CACHE_HOME|COPILOT_HOME|COPILOT_PROVIDERS_CONFIG|CURSOR_CONFIG_DIR|CURSOR_DATA_DIR|CURSOR_SANDBOX_POLICY_DIR|CURSOR_TRANSCRIPT_PATH|FLATPAK_XDG_CONFIG_HOME|FLATPAK_XDG_DATA_HOME|FLATPAK_XDG_STATE_HOME|GEMINI_CLI_HOME|GEMINI_CLI_SYSTEM_DEFAULTS_PATH|GEMINI_CLI_SYSTEM_SETTINGS_PATH|GEMINI_CLI_TRUSTED_FOLDERS_PATH|GEMINI_SYSTEM_MD|GOOSE_DISABLE_KEYRING|GOOSE_MOIM_MESSAGE_FILE|GOOSE_MOIM_MESSAGE_TEXT|GOOSE_PATH_ROOT|GOOSE_RECIPE_GITHUB_REPO|GOOSE_RECIPE_PATH|HERMES_HOME|KILO_CONFIG_CONTENT|KILO_DB|KIRO_ACP_RECORD_PATH|KIRO_API_KEY|KIRO_CHAT_LOG_FILE|KIRO_HOME|KIRO_LOG_LEVEL|KIRO_LOG_NO_COLOR|OLLAMA_MODELS|OPENCODE_CONFIG|OPENCODE_CONFIG_CONTENT|OPENCODE_CONFIG_DIR|OPENCODE_DB|OPENCODE_DISABLE_CHANNEL_DB|OPENCODE_MODELS_PATH|OPENCODE_PLUGIN_META_FILE|OPENCODE_TEST_HOME|OPENCODE_TUI_CONFIG|PI_CODING_AGENT_DIR|PI_CODING_AGENT_SESSION_DIR|QWEN_CODE_FORCE_ENCRYPTED_FILE_STORAGE|QWEN_CODE_MCP_APPROVALS_PATH|QWEN_CODE_MEMORY_BASE_DIR|QWEN_CODE_MEMORY_LOCAL|QWEN_CODE_MEMORY_PROJECT_SCOPE|QWEN_CODE_PROFILE_STARTUP|QWEN_CODE_SYSTEM_DEFAULTS_PATH|QWEN_CODE_SYSTEM_SETTINGS_PATH|QWEN_DEBUG_LOG_FILE|QWEN_HOME|QWEN_RUNTIME_DIR|QWEN_SANDBOX|QWEN_SANDBOX_IMAGE|QWEN_SANDBOX_NET|QWEN_TELEMETRY_OUTFILE|Q_CLI_DATA_DIR|Q_DISABLE_TELEMETRY|Q_LOG_LEVEL|Q_LOG_STDOUT|Q_ZDOTDIR|SANDBOX|SEATBELT_PROFILE|VSCODE_EXTENSIONS|VSCODE_PORTABLE|WINDSURF_CONFIG_DIR)[^\S\n]*[=:][^\S\n]*\S'
tags:
  - collection-integrity
  - relocated-tree
false_positives:
  - >-
    A variable set to the location the agent uses anyway, which changes nothing and is
    common in a profile that spells out a default.
  - >-
    A mention in a configuration file or a script that explains the variable rather than
    setting it, since the rule searches the text a record holds. A question about the
    variable in a conversation is out of scope by kind and cannot reach this rule.
  - >-
    A variable that was exported after the period under investigation, since a profile
    says what is in force and not when a line was added to it.
references:
  - https://code.claude.com/docs/en/troubleshoot-install.md
tests:
  - name: an agent home exported in a shell profile
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "export:ANTHROPIC_CONFIG_DIR", text: "export ANTHROPIC_CONFIG_DIR=/opt/agents/elsewhere"}
  - name: the same variable in a command somebody ran
    match: true
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands: [{command: "ANTHROPIC_CONFIG_DIR=/tmp/scratch claude"}]
  - name: an unrelated variable
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "export:EDITOR", text: "export EDITOR=vim"}
  - name: the variable named with no value
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "export:ANTHROPIC_CONFIG_DIR", text: "# ANTHROPIC_CONFIG_DIR is unset here"}
