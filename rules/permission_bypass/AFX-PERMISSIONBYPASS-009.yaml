id: AFX-PERMISSIONBYPASS-009
pack: permission_bypass
title: A managed policy sits in a hive a non-administrator can write
severity: high
description: >
  A managed policy for an agent was found under the current user's registry hive rather
  than under the machine's. The user hive needs no administrative rights, so a policy there
  was not necessarily set by whoever administers this machine.
rationale: >
  The managed settings of one of these products are documented as being read from both
  hives, and the vendor's own guidance is to check both and compare. That is the whole
  finding. An organisation that deploys a policy deploys it to the machine hive, which
  needs rights an ordinary account does not have. A policy in the user hive is one the
  account under investigation could have written, and if the machine hive holds no policy
  at all then what looks like a corporate control is a setting the user chose for
  themselves. It is the registry's version of a project-level settings file overriding what
  an administrator meant to enforce, and unlike a file it leaves nothing in a working copy
  for anybody to notice.
applies_to:
  kinds: [config.snapshot]
match:
  all:
    # Only the reader for registry documents sets this field, so nothing else can reach
    # this rule: a settings file that happens to mention a hive cannot match.
    - field: raw.hive
      equals: "user"
    - field: raw.key
      regex: '(?i)\\Policies\\'
tags:
  - T1112
  - policy-in-user-hive
false_positives:
  - >-
    A machine administered per user, or a test deployment, where a policy in the user hive
    is deliberate. The finding says who could have written it, not who did.
  - >-
    An account that is itself an administrator, where the distinction between the two
    hives says nothing about rights. Whether the account was elevated is in the manifest
    of the collection rather than in this event.
  - >-
    A policy present in both hives with the same content, which is what a deployment that
    writes both looks like.
references:
  - https://code.claude.com/docs/en/settings
tests:
  - name: a policy value under the user's own hive
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      raw:
        key: "HKCU\\SOFTWARE\\Policies\\ClaudeCode"
        hive: user
        value_name: Settings
      payload: {text: "Settings = {}"}
  - name: the same policy under the machine hive
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      raw:
        key: "HKLM\\SOFTWARE\\Policies\\ClaudeCode"
        hive: machine
        value_name: Settings
      payload: {text: "Settings = {}"}
  - name: a user-hive key that is not a policy
    match: false
    event:
      kind: config.snapshot
      agent: ollama
      raw:
        key: "HKCU\\Environment"
        hive: user
        value_name: OLLAMA_MODELS
      payload: {text: "OLLAMA_MODELS = D:\\models"}
  - name: a settings file that mentions a hive
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {text: "policies live under HKCU\\SOFTWARE\\Policies"}
