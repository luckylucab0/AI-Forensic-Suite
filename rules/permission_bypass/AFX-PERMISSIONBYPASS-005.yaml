id: AFX-PERMISSIONBYPASS-005
pack: permission_bypass
title: A configuration starts every session in a mode that approves its own tool calls
severity: high
description: >
  A configuration sets the mode a session starts in to one that approves tool calls without
  asking. Claude Code spells this defaultMode bypassPermissions in its settings files, Cline
  calls the equivalent mode yolo, which its own preset code describes as guaranteeing that
  tool policies are enabled and auto-approved, Codex spells it approval_policy = never,
  which its vendor names as one of the two settings an organization forbids through its
  managed requirements file, and Warp's command line agent sets a per-action value to
  always_allow in the execution profile in its settings file.
rationale: >
  The two rules beside this one find a bypass somebody typed: a flag on a command line, or
  a mode changed part way through a session. This one is the version that needs typing
  once. A line in a settings file or in a schedule the agent wrote for itself means every
  session from then on starts with the prompt already answered, including the sessions
  nobody is present for.

  It also explains an absence twice over. A transcript with no approvals in it reads
  differently once this is known, and for Cline it removes evidence rather than only
  approvals: the vendor's own hook documentation states that hooks are disabled in yolo
  mode, and the hook log is the artifact that dates this agent's prompts. So a scheduled
  run in yolo mode approves everything and writes no audit line about any of it, and the
  vendor's cron documentation lists yolo as the default mode for a scheduled run.
applies_to:
  kinds: [config.snapshot]
match:
  any:
    # Claude Code, where the mode sits under permissions in a settings file, and where a
    # different product or version may put it at the top level of the same document.
    - field: raw.permissions.defaultMode
      equals: bypassPermissions
    - field: raw.defaultMode
      equals: bypassPermissions
    - field: payload.defaultMode
      equals: bypassPermissions
    # The same document reaching a case as one nobody has a parser for: the text views
    # render a mapping one leaf per line, so the setting is a `key = value` line and the
    # pattern has to stay on it. See the schema's note on \s crossing a field boundary.
    - field: event_text
      regex: '(?m)^[^\S\n]*defaultMode[^\S\n]*=[^\S\n]*bypassPermissions[^\S\n]*$'
    # Cline's equivalent, in a settings document or in a schedule the agent wrote itself.
    - field: event_text
      regex: '(?m)^[^\S\n]*mode[^\S\n]*=[^\S\n]*yolo[^\S\n]*$'
    # Cursor's command line product, whose configuration takes allowlist, auto-review or
    # unrestricted. Only the last is matched: the vendor names the three values and defines
    # none of them, and a rule that guessed what auto-review approves would be asserting
    # something nobody has stated.
    - field: raw.approvalMode
      equals: unrestricted
    - field: payload.approvalMode
      equals: unrestricted
    - field: event_text
      regex: '(?m)^[^\S\n]*approvalMode[^\S\n]*=[^\S\n]*unrestricted[^\S\n]*$'
    # Codex, whose configuration is TOML. The quotes the file has around the value are not
    # in the text a rule searches: the text views render a leaf as `key = value`, so the
    # pattern matches the value bare.
    - field: raw.approval_policy
      equals: never
    - field: event_text
      regex: '(?m)^[^\S\n]*approval_policy[^\S\n]*=[^\S\n]*never[^\S\n]*$'
    # Warp's command line agent, whose execution profile sets each action independently.
    # The vendor names three values and defines them: always_ask prompts, agent_decides
    # lets the agent choose and still prompts for a file edit every time, and always_allow
    # does not ask. Only the last is matched, and only for the two actions that change
    # something: reading a file without asking is not this finding. The same document also
    # carries a flag deciding whether auto-approve overrides the user's own command
    # denylist, and that one is deliberately not matched: its default is to override, so a
    # file that spells it out says nothing, and a file that sets it to false is somebody
    # tightening the control rather than loosening it.
    - field: event_text
      regex: '(?m)^[^\S\n]*(?:execute_commands|apply_code_diffs)[^\S\n]*=[^\S\n]*always_allow[^\S\n]*$'
tags:
  - T1562.001
  - permission-bypass
false_positives:
  - >-
    A machine that exists to run an agent unattended, in a container or a disposable virtual
    machine, which is what the vendors recommend these modes for. The finding is still
    correct: it says approvals were not asked for, not that asking was required.
  - >-
    A document that records the mode of a past run rather than setting it for future ones.
    Both are the same line in the same shape, and which one it is depends on the file, which
    is why the finding names the file it came from.
references:
  - https://code.claude.com/docs/en/permissions
  - https://docs.warp.dev/agents/cli/permissions-and-profiles/
  - https://cursor.com/docs/cli/reference/configuration
  - https://raw.githubusercontent.com/cline/cline/main/sdk/packages/core/src/extensions/tools/presets.ts
  - https://raw.githubusercontent.com/cline/cline/main/sdk/examples/hooks/README.md
  - https://raw.githubusercontent.com/cline/cline/main/sdk/examples/cron/README.md
  - https://developers.openai.com/codex/config-basic
tests:
  - name: the start mode set in a settings file
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      raw:
        permissions:
          defaultMode: bypassPermissions
          allow: ["Read(./src/**)"]
  - name: the same file as a document nobody has mapped
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      raw:
        permissions: {defaultMode: bypassPermissions}
  - name: a schedule the agent wrote for itself, in the mode that approves everything
    match: true
    event:
      kind: config.snapshot
      agent: cline
      raw:
        id: nightly-review
        schedule: "0 3 * * *"
        mode: yolo
        enabled: true
  - name: the command line product's configuration with approvals switched off
    match: true
    event:
      kind: config.snapshot
      agent: cursor
      raw:
        version: 1
        approvalMode: unrestricted
  - name: the middle setting of the same field, which nobody has defined
    match: false
    event:
      kind: config.snapshot
      agent: cursor
      # Deliberately not matched: the vendor lists the value and says nothing about what it
      # approves, and a finding has to rest on a statement rather than on the word.
      raw:
        version: 1
        approvalMode: auto-review
  - name: the approval policy that never asks
    match: true
    event:
      kind: config.snapshot
      agent: codex
      raw:
        model: o4-mini
        approval_policy: never
  - name: the approval policy that asks when the agent wants more
    match: false
    event:
      kind: config.snapshot
      agent: codex
      raw:
        approval_policy: on-request
  - name: a schedule that runs in the ordinary mode
    match: false
    event:
      kind: config.snapshot
      agent: cline
      raw:
        id: nightly-review
        schedule: "0 3 * * *"
        mode: act
  - name: a settings file that leaves the prompt in place
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      raw:
        permissions:
          defaultMode: default
          allow: ["Read(./src/**)"]
  - name: the mode that denies rather than approves
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      # dontAsk auto-denies what would otherwise prompt, which is the opposite of this
      # rule. A pattern that matched every mode with ask in the name would be wrong here.
      raw:
        permissions: {defaultMode: dontAsk}
  - name: one agent's execution profile allows every command without asking
    match: true
    event:
      kind: config.snapshot
      agent: warp
      payload: {execute_commands: always_allow}
  - name: the same profile's value that still prompts
    match: false
    event:
      kind: config.snapshot
      agent: warp
      payload: {execute_commands: agent_decides}
  - name: reading files without asking, which is not this finding
    match: false
    event:
      kind: config.snapshot
      agent: warp
      payload: {read_files: always_allow}
