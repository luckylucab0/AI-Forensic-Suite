id: AFX-SECRETS-005
pack: secrets
title: A secret was assigned to a named variable in view of the agent
severity: medium
description: >
  A variable or key whose name says it holds a credential, assigned a value of plausible
  length, appears in this record. This is the shape that catches the credentials no vendor
  prefix identifies: a database password, an internal service token, a signing key.
rationale: >
  Most credentials have no recognisable prefix, so a pack that only matched known shapes
  would report the ones that are easy to find and miss the ones that are specific to the
  organization. Matching the assignment rather than the value is deliberately broad, which
  is why this rule is medium: it is a lead to read rather than a conclusion.
match:
  field: event_text
  # [^\S\n] rather than \s: \s matches a newline, and the text a rule searches is the
  # record's leaves one per line, so a key on one line and an unrelated long string on the
  # next would have matched as an assignment.
  regex: '(?i)\b(?:api[_-]?key|secret|passwd|password|client[_-]?secret|access[_-]?token|auth[_-]?token|private[_-]?key)\b[^\S\n]*[:=][^\S\n]*["'']?[A-Za-z0-9_\-/+.]{8,}'
redact: true
tags:
  - T1552.001
  - credential-in-transcript
false_positives:
  - >-
    A placeholder, which this rule cannot tell from a value. Both password=changeme and
    password=REDACTED match, and both are common in documentation and in templates.
  - A configuration file the agent read that holds an environment variable name rather
    than a value, such as password=$DB_PASSWORD.
  - A key name in a schema or a type definition, where the value is a type rather than a
    secret.
tests:
  - name: a password in a connection string the agent built
    match: true
    event:
      kind: command.exec
      agent: codex
      payload:
        commands: [{command: "psql 'host=db password=s3cr3t-value-here dbname=app'"}]
  - name: a token assigned in a file the agent wrote
    match: true
    event:
      kind: file.write
      agent: claude_code
      payload:
        files: [{path: "/src/app/.env", operation: write}]
        text: "AUTH_TOKEN = \"abcd1234efgh5678\""
  - name: the word password with no value
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "where is the password stored"}
  - name: a value too short to be a credential
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "password: abc"}
