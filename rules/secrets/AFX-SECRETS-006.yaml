id: AFX-SECRETS-006
pack: secrets
title: A credential was passed to a command as a flag
severity: high
description: >
  A command line carries a credential as the value of an option such as --api-key, --token
  or --password. Cursor's command line agent documents --api-key as one of its two ways of
  authenticating, and the same shape appears in every tool that offers one.
rationale: >
  A credential given as a flag is written down twice by the operating system before anything
  the agent does: into the shell history file, which this suite collects, and into the
  process table, where anything running as any user on the machine could read it while the
  command ran. Neither copy is deleted when the credential is rotated, so a shell history is
  a credential store that nobody thinks of as one, and the rule that matches an assignment
  does not see this shape because a flag and its value are separated by a space rather than
  by an equals sign.

  It is high rather than critical because the value may be a placeholder from a document
  somebody pasted, and because the finding names an exposure rather than a use.
match:
  field: event_text
  # A space is allowed between the flag and its value, which the assignment rule could not
  # allow: [^\S\n] rather than \s, because the text a rule searches is one leaf per line and
  # \s would cross into the next line and read an unrelated string as the value.
  #
  # The value has to start with a character a credential starts with, which is what keeps
  # "--token $CURSOR_API_KEY" out: a variable reference is a reference to a secret rather
  # than the secret itself. A hyphen is allowed inside the value and not at its start, so
  # "--password-file /run/secrets/db" is not read as a password either.
  regex: '(?i)--(?:api[_-]?key|access[_-]?token|auth[_-]?token|token|password|secret)(?:=|[^\S\n]+)["'']?[A-Za-z0-9_/+.][A-Za-z0-9_\-/+.]{11,}'
redact: true
tags:
  - T1552.003
  - credential-in-transcript
false_positives:
  - >-
    A placeholder in a README, a runbook or a help text, which this rule cannot tell from a
    value. It matches because the text is what is on disk.
  - >-
    A value that is long enough to look like a credential and is not one, such as a job name
    or a file name given to an option whose name mentions a token.
references:
  - https://cursor.com/docs/cli/reference/authentication
tests:
  - name: the documented flag of a command line agent
    match: true
    event:
      kind: command.exec
      agent: cursor
      payload:
        commands: [{command: "cursor-agent --api-key sk_live_0123456789abcdef 'ship it'"}]
  - name: the same thing written with an equals sign
    match: true
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands: [{command: "curl -H auth --token=ghp_0123456789abcdefghij https://example.org/api"}]
  - name: a shell history line that authenticated a tool
    match: true
    event:
      kind: command.exec
      agent: crosscutting
      payload:
        commands: [{command: "some-tool login --password hunter2-hunter2-hunter2"}]
  - name: the environment variable rather than the value
    match: false
    event:
      kind: command.exec
      agent: cursor
      # The recommended way to do it, and the one that keeps the value out of the history.
      payload:
        commands: [{command: "cursor-agent --api-key $CURSOR_API_KEY 'ship it'"}]
  - name: a flag that names a file holding the secret
    match: false
    event:
      kind: command.exec
      agent: crosscutting
      payload:
        commands: [{command: "some-tool login --password-file /run/secrets/db"}]
  - name: a value too short to be a credential
    match: false
    event:
      kind: command.exec
      agent: crosscutting
      payload:
        commands: [{command: "some-tool --token abc123"}]
