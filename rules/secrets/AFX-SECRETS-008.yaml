id: AFX-SECRETS-008
pack: secrets
title: A credential file was copied into every worktree the agent creates
severity: medium
description: >
  A worktree include list names a file whose name says it holds credentials. The vendor
  documents this list as the gitignored files to copy into every worktree the agent
  creates, so a name here means copies of that file exist beside every checkout on the
  machine rather than only in the main one.
rationale: >
  This is a finding about where to look rather than about a value. The list is written by
  the author of the repository and it is an explicit inventory: it says, in the author's
  own words, which files git was deliberately keeping out of the repository and which of
  those the agent is to duplicate anyway. Every worktree is then a second copy of the
  credential, in a directory the developer may not think of as holding one, outside
  whatever protects the original. The vendor's own documentation names .env and secrets
  configuration as the examples, so this is the documented use of the feature and not an
  abuse of it, which is exactly why it is easy to leave in place and forget.
applies_to:
  kinds: [config.snapshot]
match:
  all:
    - field: payload.key
      # Only the include list writes this key, so no other configuration reaches this rule.
      regex: '^include:'
    - field: payload.text
      regex_any:
        - '(?i)(^|[/\\])\.env(\.|$)'
        - '(?i)\b(secrets?|credentials?|\.netrc|id_rsa|id_ed25519|\.pem|\.p12|keystore|serviceaccount)\b'
        - '(?i)\.(pem|key|p12|pfx|jks)$'
# Deliberately not redacted, which every other rule in this pack is. Redaction replaces a
# match with its shape, and the match here is a file name the author of the repository
# wrote down rather than a credential: a finding saying a ten character name beginning
# ".env" was copied into every worktree would hide the one thing it exists to report. No
# value is read from the file and none is quoted. tests/unit/test_rules.py holds the
# exemption with this reason.
tags:
  - T1552.001
  - credential-at-rest
false_positives:
  - >-
    A file named for secrets that holds only names, such as a template or an example
    environment file checked in for documentation. The list says what is copied and not
    what is in it.
  - >-
    An entry that no longer exists on disk. The list is the author's intent at the time it
    was written, and the worktrees it applied to may have been removed since.
  - >-
    A repository where the feature was never used, since the file is read whether or not
    the agent ever created a worktree. The vendor also documents that the list is not
    processed when a hook replaces the default worktree behaviour.
references:
  - https://code.claude.com/docs/en/worktrees.md
tests:
  - name: an environment file on the include list
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "include:.env.local", text: ".env.local"}
  - name: a secrets configuration file
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "include:config/secrets.yaml", text: "config/secrets.yaml"}
  - name: a private key
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "include:deploy/id_ed25519", text: "deploy/id_ed25519"}
  - name: an ordinary build artifact on the include list
    match: false
    event:
      kind: config.snapshot
      agent: claude_code
      payload: {key: "include:node_modules/", text: "node_modules/"}
  - name: the same name in an ignore file rather than an include list
    match: false
    event:
      kind: config.snapshot
      agent: windsurf
      payload: {key: "ignore:.env", text: ".env"}
