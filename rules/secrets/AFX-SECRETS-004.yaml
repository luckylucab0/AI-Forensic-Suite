id: AFX-SECRETS-004
pack: secrets
title: A source forge personal access token reached an agent transcript
severity: high
description: >
  A token in the documented prefixed shape a major source forge issues appears in this
  record. The prefixes cover personal access tokens, OAuth tokens, user-to-server and
  server-to-server tokens and refresh tokens.
rationale: >
  This token is usually the one with the most reach in a developer's possession: it can read
  private repositories, push code, and in many configurations act on the organization's
  behalf. It is also the credential a coding agent has the most reason to be handed, which
  is what makes a transcript a likely place to find one.
match:
  field: event_text
  regex: '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
redact: true
tags:
  - T1552.001
  - credential-in-transcript
false_positives:
  - A token already revoked, which the forge does on publication but which the transcript
    cannot say.
  - A token of this shape used in a test fixture.
references:
  - https://github.blog/security/application-security/behind-githubs-new-authentication-token-formats/
tests:
  - name: a token in a git remote
    match: true
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands:
          - command: "git remote add origin https://ghp_0123456789abcdefghijklmnopqrstuvwx@example.org/a/b"
  - name: a token in a tool result
    match: true
    event:
      kind: tool.result
      agent: copilot
      payload: {output: "GITHUB_TOKEN=ghs_0123456789abcdefghijklmnopqrstuvwx"}
  - name: a prefix without a token
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "tokens start with ghp_ these days"}
  - name: an ordinary git command
    match: false
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands: [{command: "git remote -v"}]
