id: AFX-SECRETS-003
pack: secrets
title: A model provider API token reached an agent transcript
severity: high
description: >
  A token in the shape several model providers issue, an sk- prefix followed by a long
  opaque string, appears in this record.
rationale: >
  This is the credential that pays for inference, and one of the few in a developer's
  possession that bills by use. A token in a transcript is both an unrotated secret and a
  spending risk, and a transcript is a file that gets copied into bug reports and support
  tickets more readily than a credential store ever would be.
match:
  field: event_text
  regex: '\bsk-[A-Za-z0-9_-]{20,}\b'
redact: true
tags:
  - T1552.001
  - credential-in-transcript
false_positives:
  - A revoked or example token quoted in documentation or in a test.
  - >-
    Another vendor's identifier that happens to use the same prefix, which is not rare.
    The prefix is a convention rather than a registered scheme.
tests:
  - name: a token exported in a shell command
    match: true
    event:
      kind: command.exec
      agent: codex
      payload:
        commands:
          - command: "export API_KEY=sk-abcdefghijklmnopqrstuvwxyz0123"
  - name: a token pasted into a prompt
    match: true
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "use sk-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa for this"}
  - name: a short sk- string, which is not a token
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "the sk- prefix"}
  - name: an ordinary sentence
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "which API key should I use"}
