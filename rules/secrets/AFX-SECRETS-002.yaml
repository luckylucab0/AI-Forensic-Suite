id: AFX-SECRETS-002
pack: secrets
title: A private key block reached an agent transcript
severity: critical
description: >
  The opening line of a PEM private key block appears in this record. Matched on the header
  rather than on the key material, because the header is the part that is the same across
  every key type and cannot occur by accident.
rationale: >
  A private key in a transcript is the strongest form of this finding. Unlike an API token
  it usually cannot be rotated without touching every system that trusts it, the header is
  unambiguous so there is little room for a false positive, and the reason a key ends up in
  a conversation is almost always that somebody pasted a file they should not have.
match:
  field: event_text
  regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----'
redact: true
tags:
  - T1552.004
  - credential-in-transcript
false_positives:
  - A test key committed to a repository on purpose, which many projects carry for their
    own test suites.
  - Documentation that shows the shape of a key file without a real key in it.
references:
  - https://www.rfc-editor.org/rfc/rfc7468
tests:
  - name: a key pasted into a prompt
    match: true
    event:
      kind: user.prompt
      agent: claude_code
      payload:
        text: "why does this fail\n-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaA\n"
  - name: a key in a tool result
    match: true
    event:
      kind: tool.result
      agent: copilot
      payload:
        output: "-----BEGIN RSA PRIVATE KEY-----"
  - name: the public half, which is not a secret
    match: false
    event:
      kind: tool.result
      agent: copilot
      payload:
        output: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5 alice@example.org"
  - name: a mention of the words without a block
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "should I commit my private key"}
