id: AFX-SECRETS-007
pack: secrets
title: A credential was carried in an authorization header
severity: high
description: >
  An HTTP authorization header with a value appears in this record: a bearer token, a
  basic-auth blob, or an API key header. The header names itself, so unlike a bare string
  this is a credential in a request rather than a string that looks like one.
rationale: >
  This is the shape a credential takes at the moment it is used, and it is the one shape
  the other rules in this pack miss. They match a token by its vendor prefix or by the name
  of the variable it was assigned to, and a header has neither: the token is whatever the
  service issued, and the name in front of it is Authorization, which no rule about a
  variable called api_key will ever see. It matters most where the request is not in the
  transcript at all. A wrapper function in a shell environment adds the header to every
  call it makes, and the transcript records the wrapper's name, so the credential is only
  ever visible in the environment the agent ran in.
match:
  field: event_text
  # [^\S\n] rather than \s throughout: the text a rule searches is the record's leaves one
  # per line, and \s matches a newline, so a header name at the end of one line and an
  # unrelated string at the start of the next would otherwise match as a header.
  regex_any:
    # Bearer, token and the other schemes that carry an opaque credential. The value has
    # to be long enough to be one: a header naming a scheme and nothing after it is a
    # template, and that is the commonest thing in a documentation page.
    - '(?i)\bauthorization[^\S\n]*[:=][^\S\n]*["'']?(?:bearer|token|basic|apikey)[^\S\n]+[A-Za-z0-9_\-./+=]{12,}'
    # The header several services use instead of Authorization, with the same value rule.
    - '(?i)\b(?:x-api-key|x-auth-token|api-key|proxy-authorization)[^\S\n]*[:=][^\S\n]*["'']?[A-Za-z0-9_\-./+=]{12,}'
redact: true
tags:
  - T1552.001
  - credential-in-transcript
false_positives:
  - >-
    A documentation example or a template, where the value is a placeholder of plausible
    length such as YOUR_API_KEY_HERE or a row of x characters. This rule cannot tell a
    placeholder from a credential, and neither can the file it is reading.
  - >-
    A header in a recorded response or in a log the agent read rather than one it sent,
    which is still a credential on the endpoint but says nothing about the agent using it.
  - >-
    A test fixture in the working copy, which is where deliberately invalid tokens of the
    right shape live.
references:
  - https://datatracker.ietf.org/doc/html/rfc9110#name-authorization
tests:
  - name: a bearer token in a wrapper function in the captured shell environment
    match: true
    event:
      kind: config.snapshot
      agent: claude_code
      payload:
        key: "function:deploy"
        text: "deploy () {\n  curl -H \"Authorization: Bearer sk_live_examplekey0123456789\" https://files.example.org/deploy\n}"
  - name: a basic auth blob on a command line
    match: true
    event:
      kind: command.exec
      agent: codex
      payload:
        commands: [{command: "curl -H 'Authorization: Basic YWxpY2U6bm90LWEtcmVhbC1wYXNz' https://api.example.org/"}]
  - name: an api key header in a configured request
    match: true
    event:
      kind: config.snapshot
      agent: cline
      payload: {text: "x-api-key = abcd1234efgh5678ijkl"}
  - name: a header named in documentation with no value
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "which authorization header does the api want"}
  - name: a scheme with nothing after it
    match: false
    event:
      kind: assistant.text
      agent: claude_code
      payload: {text: "set Authorization: Bearer <token> on every request"}
