id: AFX-SECRETS-001
pack: secrets
title: A cloud provider access key reached an agent transcript
severity: high
description: >
  An access key identifier in the shape a major cloud provider issues appears somewhere in
  this record: a prompt, a tool argument, a tool result or a field no parser mapped. The
  whole record is searched rather than the fields somebody thought to map, because a
  credential can sit anywhere in one.
rationale: >
  A key that reached a transcript has left the developer's control twice over. It was sent
  to a model provider as part of the conversation, and it is now on disk in a file that is
  not a secret store, that is not encrypted, and that synchronisation and backup tools
  treat as ordinary text. Whether the key was used is a separate question; that it has to
  be rotated is not.
applies_to:
  kinds: [any]
match:
  field: event_text
  regex: '\bAKIA[0-9A-Z]{16}\b'
redact: true
tags:
  - T1552.001
  - credential-in-transcript
false_positives:
  - A key of this shape quoted in documentation, a test fixture or an example, which is
    common in a repository that teaches cloud usage.
  - A key that was already revoked before the conversation, which the transcript cannot say.
references:
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html
tests:
  - name: a key in a tool argument
    match: true
    event:
      kind: tool.call
      agent: claude_code
      payload:
        tool: Bash
        input:
          command: "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE aws s3 ls"
  - name: a key in a field no parser mapped, reached through the raw record
    match: true
    event:
      kind: unparsed.record
      agent: codex
      payload: {}
      raw:
        some_field_nobody_maps: "AKIAIOSFODNN7EXAMPLE"
  - name: an ordinary command
    match: false
    event:
      kind: tool.call
      agent: claude_code
      payload:
        tool: Bash
        input: {command: "aws s3 ls"}
  - name: a string that is the right length and the wrong prefix
    match: false
    event:
      kind: user.prompt
      agent: claude_code
      payload: {text: "BKIAIOSFODNN7EXAMPLE is not one"}
