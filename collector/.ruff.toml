# The collectors run on whatever interpreter an endpoint already has, which in a corporate
# fleet means Python 3.8 is the realistic floor. Pinning the target here makes ruff reject
# newer syntax at lint time instead of at collection time on someone's evidence.
#
# See docs/adr/0004-two-single-file-collectors.md.

extend = "../pyproject.toml"
target-version = "py38"

[lint]
# pyupgrade would rewrite 3.8-compatible code into syntax the target cannot run.
ignore = ["UP", "E501"]

[lint.per-file-ignores]
# A collector is a command line tool whose output is its interface, it must walk paths the
# operating system gives it, and it deliberately reads files that may be unreadable.
#
# S108 (insecure temporary directory) is a false positive here and worth spelling out: the
# embedded catalogue contains paths where AGENTS write their own files, and one of them is
# under /tmp. The collector reads that path as evidence; it never writes there. Suppressing
# the rule for a data literal is right, and the alternative would be to hide a real
# artifact location from the catalogue to please a linter.
"*.py" = ["T20", "S101", "PTH", "S108"]
