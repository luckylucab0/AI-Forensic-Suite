# Continuous integration.
#
# Three properties this pipeline is built to protect, in order of how badly a regression
# would hurt:
#
#   1. The collectors and the pre-commit scripts must run on interpreters much older than
#      the analyzer's, because they execute on endpoints and on contributors' machines.
#      That is checked against a real old interpreter, not by inspection.
#   2. Generated artifacts must never drift from the catalogue and rules they come from.
#      Each generator has a --check mode, and CI runs it.
#   3. Nothing organization-specific may enter the repository. The guard runs here too, so
#      it also covers a commit pushed without local hooks installed.
#
# Actions are pinned by commit SHA rather than by tag. A tag can be moved to point at
# different code; for a security tool whose CI has write access to nothing but is read by
# people deciding whether to trust it, the pin is cheap insurance. The comment after each
# SHA records which tag it was, so updates stay reviewable.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing in this pipeline writes to the repository or to any package registry.
permissions:
  contents: read

env:
  # Reproducible resolution: the lock file decides, and a drifted lock fails rather than
  # being silently updated.
  UV_FROZEN: "1"

jobs:
  checks:
    name: ${{ matrix.os }} / lint, types, tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The OpSec job needs history to be able to look past the tip. The default of a
          # single commit would make that check meaningless.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Viewer structure and JavaScript parse
        run: uv run python scripts/check_viewer.py

      - name: German docs current with their English source
        run: uv run python scripts/check_translations.py --check

      - name: Catalogue validates against its schema
        run: uv run python -c "from pathlib import Path; from agentforensics.catalog import load_catalogue; c = load_catalogue(Path('catalog')); print(len(c.artifacts), 'artifacts in', len(c), 'agent catalogue(s)')"

      - name: Generated artifact documentation current with the catalogue
        run: uv run python scripts/gen_artifact_docs.py --check

      # The check that decides whether a collection looks for artifacts where they are or
      # where they used to be. A stale embedded catalogue produces a bundle that is missing
      # evidence without anything in it saying so.
      - name: Embedded catalogue current in both collectors
        run: uv run python scripts/build_collectors.py --check

      # Same failure mode one step further out: somebody takes a Velociraptor artifact or a
      # KAPE target out of exporters/generated and runs it against a fleet. If it lags the
      # catalogue it searches last month's locations and reports clean hosts.
      - name: Generated collection rules current with the catalogue
        run: uv run python scripts/gen_collection_rules.py --check

      # A rule that fires on everything passes every positive sample it has, so the
      # samples are only worth anything with the negative ones beside them, which the
      # loader enforces. This step is what makes them run outside the test suite too, so a
      # pack handed to an operator is checkable the same way.
      - name: Every rule agrees with its own samples
        run: uv run agentforensics scan --self-test

      # Same failure mode as the other generated documents: a rule reference that lags the
      # rules describes detections that are not the ones running.
      - name: docs/RULES.md current with the rule files
        run: uv run python scripts/gen_rule_docs.py --check

      # The unified-log artifact's VQL is checked as text by the test suite, which cannot
      # tell whether the engine does what the query means. This step runs it for real when
      # a Velociraptor binary is available. Unconditional on purpose: without a runner the
      # script does nothing and exits 0, so the day a binary can be fetched here the check
      # starts working without anybody remembering to enable it.
      - name: Generated VQL runs and returns the unified format
        run: uv run python scripts/check_velociraptor_vql.py --runner "${VELOCIRAPTOR:-}"
        env:
          VELOCIRAPTOR: ${{ vars.VELOCIRAPTOR_BINARY }}

  legacy-interpreter:
    name: Python 3.8 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Provide Python 3.8
        # 3.8 is long past end of life, which is exactly why this job exists: corporate
        # fleets still run it, and the collector has to work there. uv fetches a
        # standalone build, so this does not depend on the runner image still shipping it.
        run: uv python install 3.8

      - name: Compile under 3.8
        # Catches syntax newer than the target, which is the failure that would otherwise
        # only appear on an endpoint, mid-collection, on somebody's evidence.
        run: |
          set -euo pipefail
          files=$(git ls-files 'collector/*.py' 'scripts/*.py')
          if [ -z "$files" ]; then echo "nothing to compile"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          uv run --no-project --python 3.8 python -m py_compile $files

      - name: Run the pre-commit scripts under 3.8
        # Compiling proves the syntax parses. Running proves the standard library calls
        # exist in that version, which py_compile cannot tell us.
        run: |
          set -euo pipefail
          uv run --no-project --python 3.8 python scripts/check_viewer.py
          uv run --no-project --python 3.8 python scripts/check_translations.py --check
          # No denylist in CI by default, so this exercises the skip path.
          uv run --no-project --python 3.8 python scripts/opsec_check.py --mode tracked

  windows-powershell-51:
    name: PowerShell 5.1 compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install
        run: uv sync --all-extras --dev

      # powershell.exe, not pwsh. The runner has both, and only the first one is Windows
      # PowerShell 5.1, which is what a corporate endpoint has and what collect.ps1 is
      # written against. pwsh is PowerShell 7 and differs in ways that matter here: a
      # `u{...} escape parses there and is a syntax error on 5.1, Set-Content defaults to a
      # different encoding, and a .NET API added after 4.7 may be absent on the endpoint
      # even though it is present on the runner.
      - name: Report the interpreter under test
        shell: powershell
        run: |
          $PSVersionTable | Out-String
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "this job must run under Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
            exit 1
          }

      - name: Parse collect.ps1 under 5.1
        shell: powershell
        # Parsing is separate from running, because a syntax error newer than the target is
        # the failure that would otherwise appear on an endpoint, mid-collection, on
        # somebody's evidence.
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "collector/collect.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            Write-Error "collect.ps1 does not parse under PowerShell $($PSVersionTable.PSVersion)"
            exit 1
          }
          Write-Host "parsed clean, $($tokens.Count) tokens"

      - name: Serializer parity under 5.1
        shell: powershell
        # The manifest is diffed between the two collectors, so the JSON has to be
        # identical. -SelfTest prints fixed structures and Python checks them.
        run: |
          $ErrorActionPreference = 'Stop'
          # No shell redirection: PowerShell 5.1's `>` writes UTF-16LE, so the file could
          # not be read back as UTF-8. The checker runs the collector itself and decodes
          # one pipe with one stated encoding.
          uv run python tests/conformance/check_selftest.py --powershell powershell.exe

      - name: Collect a synthetic profile under 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          uv run python tests/fixtures/generate.py --out synthetic-home
          powershell -NoLogo -NoProfile -File collector/collect.ps1 -Out bundle-51 -Root synthetic-home -TargetOs windows
          if ($LASTEXITCODE -gt 1) { Write-Error "collection failed with $LASTEXITCODE"; exit 1 }
          uv run agentforensics verify bundle-51

      - name: Conformance suite against collect.ps1 under 5.1
        shell: powershell
        # The same tests the POSIX collector passes, run against the PowerShell one on the
        # platform it is written for. AFX_POWERSHELL pins the interpreter so the suite
        # cannot quietly fall back to pwsh and report a pass for the wrong runtime.
        env:
          AFX_POWERSHELL: powershell.exe
        run: uv run pytest tests/conformance -q

  opsec:
    name: OpSec guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan tracked content and history
        env:
          OPSEC_DENYLIST: ${{ secrets.OPSEC_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${OPSEC_DENYLIST:-}" ]; then
            echo "No OPSEC_DENYLIST secret is configured."
            echo "Running the guard anyway, which exercises its skip path, so a fork and"
            echo "an outside contributor are never blocked by a secret they cannot have."
            python3 scripts/opsec_check.py --mode tracked
            exit 0
          fi
          # Written to the gitignored path the tool expects, removed immediately after.
          # Never echoed: GitHub masks known secrets in logs, but relying on that to hide
          # the thing this repository exists to keep hidden would be careless.
          printf '%s\n' "$OPSEC_DENYLIST" > .opsec-denylist
          trap 'rm -f .opsec-denylist' EXIT
          python3 scripts/opsec_check.py --mode tracked --require-denylist
          # The working tree is only the present. History is what actually gets published.
          if git log -p --all | grep -i -q -f .opsec-denylist; then
            echo "::error::A denied string appears in git history. See CONTRIBUTING."
            exit 1
          fi
          echo "History is clean against the denylist."
