# JetBrains AI Assistant artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: jetbrains_ai
title: JetBrains AI Assistant
vendor: JetBrains
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/JetBrains/
- https://raw.githubusercontent.com/JetBrains/
- https://www.jetbrains.com/
- https://plugins.jetbrains.com/
references:
- https://github.com/alanchik66/HUNDESALON_NIKA/blob/main/tools/optimize-webstorm-memory.ps1
- |-
  https://raw.githubusercontent.com/JetBrains/intellij-community/master/native/repair-utility/helpers/global_variables.go
- |-
  https://raw.githubusercontent.com/JetBrains/intellij-community/master/platform/credential-store-impl/src/credentialStore/keePass/KeePassCredentialStore.kt
- |-
  https://raw.githubusercontent.com/JetBrains/intellij-community/master/plugins/mcp-server/src/com/intellij/mcpserver/impl/McpClientDetector.kt
artifacts:
- id: jetbrains_ai.base_directories
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\JetBrains\<Product><Version>\'
  - '%APPDATA%\JetBrains\<Product><Version>\plugins\'
  - '%LOCALAPPDATA%\JetBrains\<Product><Version>\'
  - '%LOCALAPPDATA%\JetBrains\<Product><Version>\log\'
  - ~/.cache/JetBrains/<Product><Version>/
  - ~/.cache/JetBrains/<Product><Version>/log/
  - ~/.config/JetBrains/<Product><Version>/
  - ~/.local/share/JetBrains/<Product><Version>/
  - ~/Library/Application Support/JetBrains/<Product><Version>/
  - ~/Library/Application Support/JetBrains/<Product><Version>/plugins/
  - ~/Library/Caches/JetBrains/<Product><Version>/
  - ~/Library/Logs/JetBrains/<Product><Version>/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/JetBrains/intellij-community/master/platform/util/src/com/intellij/openapi/application/PathManager.java
  source_kind: source_code
  volatility: |-
    A product-version upgrade creates a NEW <Product><Version> tree and JetBrains prompts to import from the old one; the old tree usually survives on disk, so multiple versions' worth of AI history coexist. Deleting a version directory destroys its AI history.
  notes: |-
    CANONICAL, from JetBrains' own repair-utility source (www.jetbrains.com and junie.jetbrains.com are unreachable from this environment, so this is the authoritative substitute). Four maps verified verbatim: defaultConfigDirLocation {darwin: ${HOME}/Library/Application Support/JetBrains/{dataDirectoryName}/, linux: ${HOME}/.config/JetBrains/{dataDirectoryName}/, windows: %APPDATA%/JetBrains/{dataDirectoryName}/}; defaultSystemDirLocation {darwin: ${HOME}/Library/Caches/JetBrains/..., linux: ${HOME}/.cache/JetBrains/..., windows: %LOCALAPPDATA%/JetBrains/...}; defaultLogsDirLocation {darwin: $HOME/Library/Logs/JetBrains/..., linux: $HOME/.cache/JetBrains/{dataDirectoryName}/log/, windows: %LOCALAPPDATA%/JetBrains/{dataDirectoryName}/log/}. The plugins row is from the corroborating community research doc (tinesoft/aikill, direct macOS inspection). Overrides: idea.config.path / idea.system.path / idea.log.path / idea.plugins.path in idea.properties, which global_variables.go looks for at defaultSystemDir/idea.properties, $HOME/idea.properties, {ideaPackage}/bin/idea.properties, and via the $<IDE>_PROPERTIES env var - check these before trusting the defaults. Also note $HOME/.local/share/JetBrains/Toolbox/apps/ for Toolbox-managed installs.

    Re-sourced by the verification pass: the file cited before states the config, cache and log trees but its only plugins entry is inside the installation directory, and its only .local/share strings are unrelated. The path manager builds the per-platform plugin directory, which is also why the Linux spelling correctly has no plugins suffix.
  parser: null
- id: jetbrains_ai.password_safe
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\JetBrains\<Product><Version>\c.kdbx'
  - '%APPDATA%\JetBrains\<Product><Version>\c.pwd'
  - ~/.config/JetBrains/<Product><Version>/c.kdbx
  - ~/.config/JetBrains/<Product><Version>/c.pwd
  - ~/Library/Application Support/JetBrains/<Product><Version>/c.kdbx
  - ~/Library/Application Support/JetBrains/<Product><Version>/c.pwd
  - ~/Library/Application Support/JetBrains/<Product><Version>/options/security.xml
  format: binary
  sensitivity: secret
  collect_priority: normal
  legacy: true
  status: verified
  source: |-
    https://raw.githubusercontent.com/JetBrains/intellij-community/master/platform/credential-store-impl/src/credentialStore/keePass/mainKey.kt
  source_kind: source_code
  unsourced_paths:
  - ~/Library/Application Support/JetBrains/<Product><Version>/options/security.xml
  volatility: |-
    A kdbx moved to another machine WITHOUT its main-key file causes the platform to silently generate a new main password and WIPE the KeePass contents - so never let an acquired copy be opened by a live IDE.
  notes: |-
    ANSWERS THE BRIEF'S QUESTION ON RECOVERABILITY. Verified from JetBrains source: `const val DB_FILE_NAME: String = "c.kdbx"`, `fun getDefaultDbFile(): Path = PathManager.getOriginalConfigDir().resolve(DB_FILE_NAME)` and `fun getDefaultMainPasswordFile(): Path = PathManager.getOriginalConfigDir().resolve(MAIN_KEY_FILE_NAME)`, with `internal const val MAIN_KEY_FILE_NAME = "c.pwd"` and `private const val OLD_MAIN_PASSWORD_FILE_NAME = "pdb.pwd"` in credentialStore/keePass/mainKey.kt. So both files sit directly in the IDE CONFIG dir (NOT in options/), current names c.kdbx + c.pwd, legacy main-key name pdb.pwd - glob for all three. WHAT THIS MEANS OPERATIONALLY: (1) The DEFAULT provider is ProviderType.KEYCHAIN - the native OS store (macOS Keychain, Windows Credential Manager/DPAPI, Linux libsecret/KWallet) - in which case NO c.kdbx exists at all and the AI Assistant / JetBrains Account tokens are NOT recoverable from the filesystem alone; you need the keychain. (2) KeePass (ProviderType.KEEPASS) is an opt-in alternative, in which case c.kdbx is a standard KDBX database. If the user set no main password, c.pwd holds the (obfuscated, base64) key next to the db and the store is effectively recoverable; if they set one, or chose EncryptionType.PGP_KEY, it is not. (3) The db path is user-overridable: PasswordSafeConfigurable.kt writes `settings.keepassDb = newDbFile.toString()` for any file ending in .kdbx. ALWAYS read options/security.xml first - PasswordSafeSettings is @State(name="PasswordSafe", storages=[Storage("security.xml", roamingType=DISABLED)]) - to learn which provider, which db path and which encryption type are in force. Metadata + hash only; record the provider verdict in the report.

    Re-sourced by the verification pass: the store cited before really does build the database file against the configuration directory, but the main key filename is only imported there and is defined in this file. The settings file that records which storage backend is in use is declared in a third file, so it is marked unsourced here.
  parser: null
- id: jetbrains_ai.disabled_plugins
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\JetBrains\<Product><Version>\disabled_plugins.txt'
  - ~/.config/JetBrains/<Product><Version>/disabled_plugins.txt
  - ~/Library/Application Support/JetBrains/<Product><Version>/disabled_plugins.txt
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/JetBrains/intellij-community/master/platform/core-impl/src/com/intellij/ide/plugins/DisabledPluginsState.kt
  source_kind: source_code
  volatility: |-
    Rewritten whole whenever a plugin is enabled or disabled, so it holds the current state and one mtime rather than a history. An identifier that was disabled and re-enabled leaves nothing behind here.
  notes: |-
    One plugin identifier per line, and the line that matters for this family is the one naming the AI plugin. Several entries in this catalogue tell an analyst to check whether the AI features were turned off, and until now nothing collected the file that says so: the agent's own directories look identical whether the plugin was disabled yesterday or never installed, because a disabled plugin still has its configuration, its caches and its history on disk from before.

    So this is what makes an absence readable. A conversation store that stops on a date, with this file naming the AI plugin and carrying an mtime on that date, is a user who switched the feature off. The same store with no such line is a user who stopped using it, or a retention period, or a collection that missed a tree.

    The file is in the configuration directory, which the platform's own path manager resolves per platform and which the entry for this family's base directories records. It is therefore relocated by the same properties that move everything else here, and the entry for those properties is the one to read first on a host where this file is absent from all three documented places.

    Not this product's file. It belongs to the IDE platform, so it lists whatever the user disabled, and a line about the AI plugin is one line among however many others.
  parser: text_config
- id: jetbrains_ai.ide_logs
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%LOCALAPPDATA%\JetBrains\<Product><Version>\log\idea.log'
  - ~/.cache/JetBrains/<Product><Version>/log/idea.log
  - ~/Library/Logs/JetBrains/<Product><Version>/acp.log
  - ~/Library/Logs/JetBrains/<Product><Version>/idea.log
  - ~/Library/Logs/JetBrains/<Product><Version>/idea.log.*
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/JetBrains/intellij-community/master/platform/platform-impl/src/com/intellij/idea/LoggerFactory.java
  source_kind: source_code
  unsourced_paths:
  - ~/Library/Logs/JetBrains/<Product><Version>/acp.log
  volatility: |-
    Rotated (idea.log.1, .2, ...) and capped - the oldest AI activity is lost first. Collect the whole log directory, not just idea.log.
  notes: |-
    The per-OS log roots are verified from JetBrains' own defaultLogsDirLocation map. The AI-specific value is verified by the aikill researcher grepping a live idea.log and finding Junie plugin-load lines plus internal matterhorn-namespaced module diagnostics (org.jetbrains.junie_$implicit) - i.e. idea.log dates AI-plugin activation and load even when the transcript stores are gone. acp.log is named by the junie-export README, which injects 'matching excerpts from the relevant idea*.log files and acp.log' into its debug output - ACP is the Agent Client Protocol layer that fronts Junie (agentId 'acp.registry.junie'), so acp.log is the agent-transport log. I did not confirm acp.log's exact directory; glob for it across the log root. Product-agnostic caveat: the executable-named log file is idea.log even in non-IntelliJ products in most versions, but confirm per product.

    Re-sourced by the verification pass: neither log filename appears in the file cited before. The logger factory resolves the main log file against the log directory. The agent protocol log has no source the pass could find, so it is marked unsourced.
  parser: text_log
- id: jetbrains_ai.log_data
  category: log
  root: user_profile
  os:
  - windows
  - macos
  - linux
  paths:
  - '%LOCALAPPDATA%\JetBrains\<Product><Version>\ai-assistant-log-data\'
  - ~/.cache/JetBrains/<Product><Version>/ai-assistant-log-data/
  - ~/Library/Caches/JetBrains/<Product><Version>/ai-assistant-log-data/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://github.com/alanchik66/HUNDESALON_NIKA/blob/main/tools/optimize-webstorm-memory.ps1
  source_kind: community
  volatility: Explicitly enumerated as a deletion target by disk-cleanup scripts.
  notes: |-
    HONEST CAVEAT: I have exactly ONE attesting source for this path - a third-party PowerShell cleanup script that joins $env:LOCALAPPDATA "JetBrains\$WebStormVersion" with 'ai-assistant-log-data' (alongside aia-task-history under $env:APPDATA). The Windows form is therefore verified-as-observed; the macOS and Linux forms are my extrapolation onto the confirmed system/caches roots and should be treated as unverified. The directory's contents and format are NOT characterised anywhere I could reach. Worth globbing for and dumping wholesale, but do not document a format we have not seen.
  parser: text_log
- id: jetbrains_ai.mcp_config
  category: mcp_config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - $XDG_CONFIG_HOME/JetBrains/Air/mcp.json
  - '%APPDATA%\JetBrains\Air\mcp.json'
  - <project>/.air/mcp.json
  - ~/.config/JetBrains/Air/mcp.json
  - ~/Library/Application Support/JetBrains/Air/mcp.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/JetBrains/intellij-community/master/plugins/mcp-server/src/com/intellij/mcpserver/impl/McpClientDetector.kt
  source_kind: official
  notes: |-
    AGENT WE DID NOT HAVE ON THE LIST. JetBrains' own McpClientDetector.kt has a dedicated AirClient with global config at (mac) ~/Library/Application Support/JetBrains/Air/mcp.json, (windows) %APPDATA%/JetBrains/Air/mcp.json, (linux) $XDG_CONFIG_HOME (falling back to ~/.config) + /JetBrains/Air/mcp.json, and project scope <workspace>/.air/mcp.json. Note the directory is 'JetBrains/Air' with NO version suffix - it does not follow the <Product><Version> convention, so a <Product><Version> glob will miss it. Recommend adding 'jetbrains_air' as its own agent key and researching its transcript store separately.
  parser: json_generic
- id: jetbrains_ai.aia_task_history
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\JetBrains\<Product><Version>\aia-task-history\'
  - ~/.config/JetBrains/<Product><Version>/aia-task-history/
  - ~/Library/Application Support/JetBrains/<Product><Version>/aia-task-history/<session-id>.agentsession
  - ~/Library/Application Support/JetBrains/<Product><Version>/aia-task-history/<session-id>.checkpoints
  - ~/Library/Application Support/JetBrains/<Product><Version>/aia-task-history/<session-id>.events
  - ~/Library/Application Support/JetBrains/<Product><Version>/aia-task-history/<session-id>.lastid
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/TheDartsCo/orbit/main/src-tauri/src/adapters/jetbrains.rs
  source_kind: community
  volatility: |-
    Routinely targeted by third-party 'free up IDE disk space' scripts (e.g. alanchik66/HUNDESALON_NIKA tools/optimize-webstorm-memory.ps1 deletes $APPDATA\JetBrains\<ver>\aia-task-history and $LOCALAPPDATA\JetBrains\<ver>\ai-assistant-log-data outright). Collect before any cleanup tooling runs.
  notes: |-
    THE key agentic-run artifact for JetBrains and entirely absent from the brief. Sits in the CONFIG root (not caches). Four sibling files share one <sessionId> stem, verified from the orbit adapter's own grouping logic (`match ext { "agentsession" => ..., "events" => ..., "lastid" => ..., "checkpoints" => ... }`) and cross-checked against junie-export, which auto-discovers 'aia-task-history directories under the relevant JetBrains roots' and decodes the .events stream. Session ids observed as UUIDs (e.g. 22222222-2222-2222-2222-222222222222.events). The .agentsession file is the attribution key: its content is `<agentId>:<providerSessionId>`, e.g. 'acp.registry.junie:108400aa-5329-47a8-bee1-4526086335d0' - so this is where you learn WHICH agent (Junie vs another ACP-registered agent) ran the session, and Junie-side session ids of the form session-260605-142954-2shc appear here. The .checkpoints sibling is a per-session file-snapshot reference (contents not characterised).

    Record structure: FORMAT of .events: NOT SQLite. First line is the literal header 'AUI_EVENTS_V1', then newline-delimited base64-encoded JSON records. Record types (fully-qualified): com.intellij.ml.llm.chat.shared.ChatSessionUserPromptEvent (fields: type, id.id, prompt, attachments[].url as file:// URIs, agentId.id) and com.intellij.ml.llm.chat.shared.ChatSessionMessageBlockEvent (wrapping event.kind from com.intellij.ml.llm.aui.events.api.*). Known block kinds: AgentThoughtBlockUpdatedEvent, MarkdownBlockUpdatedEvent, ToolBlockUpdatedEvent (text, status, details, toolType), TerminalBlockUpdatedEvent, ViewFilesBlockUpdatedEvent, FileChangesBlockUpdatedEvent, ResultBlockUpdatedEvent. TerminalBlockUpdatedEvent and FileChangesBlockUpdatedEvent are the execution-evidence goldmine. Correlation to the workspace XML is by exact prompt-text match, not by uid (junie-export notes 'the XML message UIDs are not directly present as primary keys in the .events stream').
  parser: prose_document
- id: jetbrains_ai.path_properties
  title: Path properties and VM options
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_CONFIG_HOME/JetBrains/<Product><Version>/*.vmoptions
  - $XDG_CONFIG_HOME/JetBrains/<Product><Version>/idea.properties
  - '%APPDATA%\JetBrains\<Product><Version>\*.vmoptions'
  - '%APPDATA%\JetBrains\<Product><Version>\idea.properties'
  - '%USERPROFILE%\idea.properties'
  - ~/.config/JetBrains/<Product><Version>/*.vmoptions
  - ~/.config/JetBrains/<Product><Version>/idea.properties
  - ~/Library/Application Support/JetBrains/<Product><Version>/*.vmoptions
  - ~/Library/Application Support/JetBrains/<Product><Version>/idea.properties
  - ~/idea.properties
  format: text
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/JetBrains/intellij-community/master/platform/util/src/com/intellij/openapi/application/PathManager.java
  source_kind: source_code
  volatility: |-
    Written by hand or by the IDE's own "edit custom properties" action and never pruned, so one of these files usually predates everything else in the tree it describes.
  notes: |-
    THE RELOCATION CHANNEL OF THIS WHOLE FAMILY, and the catalogue had no entry for it. Every other product here moves its data tree with an environment variable, which this catalogue declares and the collectors read. These IDEs move theirs with a properties file instead, so there is nothing in the environment to read and a collection of the documented directories comes back empty with no way to tell that from an IDE nobody used.

    Five properties do it, all of them from platform/util/src/com/intellij/openapi/application/PathManager.java: idea.config.path, idea.system.path, idea.plugins.path, idea.log.path and idea.paths.selector, the last of which renames the per-product directory that every path in this catalogue's other entries is keyed by.

    Where the files are, in the order loadProperties() reads them: the file named by the idea.properties.file property, then idea.properties in the custom options directory, which is the default configuration path for the product, then idea.properties in the user's home directory, then one per installation bin directory. The first and the last are not globbable from a profile, so they are not paths here: the first is named by a property whose value is only in the process, and the last is inside whatever installation directory the IDE was installed into. The two that are collectable are here, and they are the ones a user actually edits.

    The *.vmoptions files beside them matter for the same reason. The launcher passes their contents to the JVM, so a -Didea.config.path=... line in one of them relocates the tree exactly as the properties file does, and the file is also where an analyst sees that somebody changed the agent's memory limits or added an agent flag.
  parser: text_config
