# pi artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: pi
title: pi
vendor: pi
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/earendil-works/
- https://raw.githubusercontent.com/earendil-works/
references:
- https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/docs/session-format.md
- https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
env_overrides:
- name: PI_CODING_AGENT_DIR
  effect: |-
    Relocates the agent's whole directory: its credentials, its model list, its settings, its extensions, its tools, its prompts, its skills, its themes, its managed binaries, its debug log and its sessions all hang off it. Every path in this file has a spelling rooted at this variable for that reason. The variable that was declared here before it moves the sessions alone, so a tree relocated with this one was collected as nothing at all while the collection reported success.

    The name itself is not fixed. The product builds it from its own application name, so a fork published under another name reads another variable, keeps its directory under another dot directory and writes a debug log under another file name. Read the installed package's own configuration before concluding a host has none of this.
  source: https://github.com/earendil-works/pi/blob/19451accdeec671c1f4da9eafac8fc270f510ef4/packages/coding-agent/src/config.ts
- name: PI_CODING_AGENT_SESSION_DIR
  effect: |-
    Relocates the session transcripts. The variable's name is defined in the agent's configuration module; the documentation page that describes the session format does not state it, which is why the path rooted at it is marked unsourced.
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
artifacts:
- id: pi.skills
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - $PI_CODING_AGENT_DIR/skills/**
  - ~/.pi/agent/skills/**
  - <project>/.pi/skills/**
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/earendil-works/pi/blob/19451accdeec671c1f4da9eafac8fc270f510ef4/packages/coding-agent/src/core/package-manager.ts
  source_kind: source_code
  volatility: Persistent until removed.
  notes: |-
    The fourth kind of thing this agent loads from its own directories, and the one the catalogue did not have.

    Extensions, prompts and themes were entries already. Skills are loaded the same way and from the same two roots, and they are the one of the four that is plain instruction text: a directory per skill with a markdown description the model is given. So this is instruction surface, and an entry set that had the other three collected the machinery and left out the words.

    A project skill only loads where the project is marked trusted in the settings, which makes that flag worth reading beside this: an untrusted project's skills are on disk and were not in force.
  parser: instructions
- id: pi.agents_skills
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.agents/skills/**
  - <project>/.agents/skills/**
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/earendil-works/pi/blob/19451accdeec671c1f4da9eafac8fc270f510ef4/packages/coding-agent/src/core/package-manager.ts
  source_kind: source_code
  volatility: Persistent until removed. Belongs to no single product, so no product's uninstall removes it.
  notes: |-
    A skills directory that is not this agent's own, and that it reads anyway.

    Beside its own directories the product loads skills from a vendor-neutral one in the user's home, and from the same directory in every ancestor of the working directory up from the project. That second part is the one to act on: a skill placed high up a shared path applies to every project underneath it, and it is not inside any repository an analyst would think to look in.

    Because the directory belongs to no product, a skill here can have been written for a different agent entirely and still be in force for this one. Attribute it to the file rather than to the product, and date it from the filesystem.

    The ancestor walk only happens where the project is trusted, and a directory that resolves to the one in the home is not walked twice.
  parser: instructions
- id: pi.models
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.pi/agent/models.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
  source_kind: source_code
  volatility: Persistent until edited.
  notes: |-
    Custom model and base-URL definitions: reveals proxied or self-hosted inference endpoints, which is where traffic-side evidence would have to be sought.

    Record structure: config.ts getModelsPath() = join(getAgentDir(), 'models.json').
  parser: json_generic
- id: pi.settings
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.pi/
  - ~/.pi/agent/settings.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
  source_kind: source_code
  unsourced_paths:
  - <project>/.pi/
  volatility: Persistent until edited.
  notes: |-
    Read this and the env overrides BEFORE globbing for sessions: the session directory is independently relocatable, so ~/.pi/agent/sessions being empty does not mean no sessions exist.

    The verification pass found no project-local lookup in the cited configuration module; the settings manager is what implements it.
  parser: json_generic
- id: pi.auth
  category: credentials
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.pi/agent/auth.json
  format: json
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
  source_kind: source_code
  volatility: Persistent until logout.
  notes: |-
    Record metadata and hash only.

    Record structure: config.ts getAuthPath() returns join(getAgentDir(), 'auth.json').
  parser: null
- id: pi.bin
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.pi/agent/bin/
  - ~/.pi/agent/themes/
  - ~/.pi/server/
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
  source_kind: source_code
  unsourced_paths:
  - ~/.pi/server/
  volatility: Persistent until removed.
  notes: |-
    bin/ dates the install and proves the agent had bundled fast file-search tooling (fd, rg) available regardless of what was installed system-wide. The existence of ~/.pi/server indicates the experimental server mode was used, i.e. potentially remote-driven sessions.

    The verification pass found the word server absent from the cited configuration module. The experimental server module joins the home directory with .pi and server, so the path is real but not stated where this entry points.
  parser: null
- id: pi.extensions
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - $PI_CODING_AGENT_DIR/extensions/**
  - $PI_CODING_AGENT_DIR/tools/**
  - ~/.pi/agent/extensions/**
  - ~/.pi/agent/tools/**
  - <project>/.pi/extensions/**
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://github.com/earendil-works/pi/blob/19451accdeec671c1f4da9eafac8fc270f510ef4/packages/coding-agent/src/core/package-manager.ts
  source_kind: source_code
  volatility: Persistent until removed.
  notes: |-
    These are executable TypeScript loaded into the agent. Treat as user-supplied code: a modified edit.ts or a bespoke tool is both a capability grant and, potentially, the malicious component itself. Collect content, not just filenames. Recategorised from install_evidence to instructions: this entry's own note says to collect the content and not the filenames, which is the opposite of what install evidence is for, and the catalogue already files a hook script referenced by an agent's settings as an instruction. The event kind names a hook script as an example of one, so executable code an agent loads belongs with the rest of the instruction surface rather than with proof that a product was installed.

    An earlier pass noted that the configuration module it was cited against does not name extensions at all. The loader that does is the package manager, which is what this entry rests on now, and reading it settled two things the entry had wrong: the directories are trees rather than a flat list of TypeScript files, and the same loader reads them from the project as well as from the home. A project's extensions only load where the project is marked trusted in the settings, so read that flag beside this: an untrusted project's code is on disk and was not loaded.
  parser: instructions
- id: pi.prompts
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - $PI_CODING_AGENT_DIR/prompts/**
  - ~/.pi/agent/prompts/**
  - <project>/.pi/prompts/**
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://github.com/earendil-works/pi/blob/19451accdeec671c1f4da9eafac8fc270f510ef4/packages/coding-agent/src/core/package-manager.ts
  source_kind: source_code
  volatility: Persistent until edited.
  notes: |-
    Prompt templates; compare mtimes to session timestamps to see which template version was in force.

    The same loader that reads the extensions reads these, from the project as well as from the home, which the entry did not say. A prompt template in a repository arrives with the repository.

    Record structure: the home directory is built as the agent directory joined with prompts; the project one is the product's own dotted directory joined with the same name.
  parser: instructions
- id: pi.debug_log
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.pi/agent/pi-debug.log
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/src/config.ts
  source_kind: source_code
  volatility: Only written when debug logging is enabled; rotation not implemented in the code reviewed.
  notes: |-
    When present, usually the only place raw request/response detail survives outside the session tree.

    Record structure: config.ts getDebugLogPath() = join(getAgentDir(), `${APP_NAME}-debug.log`), so the filename derives from APP_NAME (pi-debug.log for the pi build). Forks under a different APP_NAME will use a different filename.
  parser: text_log
- id: pi.sessions
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $PI_CODING_AGENT_SESSION_DIR/**/*.jsonl
  - ~/.pi/agent/sessions/--<encoded-cwd>--/<iso-timestamp>_<session-id>.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/earendil-works/pi/main/packages/coding-agent/docs/session-format.md
  source_kind: official
  unsourced_paths:
  - $PI_CODING_AGENT_SESSION_DIR/**/*.jsonl
  volatility: Auto-saved and retained; no documented expiry. Nothing is written at all when --no-session
    is used.
  notes: |-
    The tree structure is the forensic headline: abandoned branches remain in the file. A naive line-by-line reader will present discarded or retracted turns as if they were the real conversation, and will miss that the operator branched away from something. Reconstruct via id/parentId and identify the active leaf. model_change and thinking_level_change entries give a timeline of capability changes mid-session.

    The verification pass confirmed the default session directory and found no environment variable on the cited page: the module defines the variable's name but the documentation page does not state it, so the relocated spelling is marked unsourced.
  parser: pi
