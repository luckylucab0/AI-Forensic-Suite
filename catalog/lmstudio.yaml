# LM Studio artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: lmstudio
title: LM Studio
vendor: Element Labs
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/lmstudio-ai/
- https://raw.githubusercontent.com/lmstudio-ai/
- https://lmstudio.ai/
references:
- https://github.com/lmstudio-ai/docs/blob/main/0_app/2_mcp/index.mdx
- https://github.com/lmstudio-ai/docs/blob/main/0_app/5_advanced/import-model.md
- https://github.com/lmstudio-ai/docs/blob/main/1_developer/0_core/headless_llmster.mdx
- https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/l/lm-studio.rb
artifacts:
- id: lmstudio.presets
  title: Configuration presets
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.lmstudio\config-presets\'
  - ~/.lmstudio/config-presets/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/lmstudio-ai/docs/main/0_app/3_presets/index.md
  source_kind: official
  volatility: Persists until the user deletes the preset.
  notes: |-
    A preset IS an instruction file by another name, because it carries the system prompt. Split out of a combined presets-and-hub entry by the source verification pass, which found that no single vendor page states both directories.
  parser: instructions
- id: lmstudio.hub_downloads
  title: Presets downloaded from the hub
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.lmstudio\hub\'
  - ~/.lmstudio/hub/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/lmstudio-ai/docs/main/0_app/3_presets/import.md
  source_kind: official
  volatility: Persists until the user deletes the downloaded preset.
  notes: |-
    The vendor's own import page says presets downloaded from the hub or shared by the user are stored here. That provenance is the point: anything in this directory carries a system prompt that came from a remote source, which makes it the same class of evidence as an instruction file pulled out of a repository, and part of the prompt-injection surface rather than a record of what the user wrote.

    Split out of a combined presets-and-hub entry by the source verification pass, which found the presets directory and the hub directory stated on two different vendor pages.
  parser: instructions
- id: lmstudio.cli_and_server
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.lmstudio\bin\lms.exe'
  - ~/.lmstudio/bin/lms
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://github.com/lmstudio-ai/docs/blob/main/1_developer/0_core/headless_llmster.mdx
  source_kind: official
  notes: |-
    Confirmed via GitHub code search content match. Presence of lms in shell history or a systemd unit is direct proof of headless local-inference use. LM Studio also exposes an agentic act() API (docs 1_python/2_agent/act.md, 2_typescript/3_agent/act.md) and per-request MCP plugins, so a local runner here is a genuine tool-executing agent, not just a chat box.

    Record structure: Documented systemd example invokes /home/YOUR_USERNAME/.lmstudio/bin/lms daemon up, lms load <model> --yes, and lms server start - so on Linux look for a user systemd unit referencing this path.
  parser: null
- id: lmstudio.models
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.lmstudio\models\*\*\*'
  - ~/.lmstudio/models/*/*/*
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://github.com/lmstudio-ai/docs/blob/main/0_app/5_advanced/import-model.md
  source_kind: official
  notes: |-
    Confirmed via GitHub code search content match on import-model.md. The models root is user-relocatable in Settings, so read the app settings before assuming this path. Equivalent in evidential value to ollama.model_manifests.

    Record structure: Documented layout: ~/.lmstudio/models/ -> publisher/ -> model/ -> model-file.gguf. Enumerate directory names only; never copy weights. The publisher/model names are the evidence.
  parser: null
- id: lmstudio.macos_app_support_and_logs
  category: log
  root: user_profile
  os:
  - macos
  paths:
  - ~/Library/Application Support/LM Studio/
  - ~/Library/Caches/ai.elementlabs.lmstudio/
  - ~/Library/HTTPStorages/ai.elementlabs.lmstudio/
  - ~/Library/Logs/LM Studio/
  - ~/Library/Preferences/ai.elementlabs.lmstudio.plist
  - ~/Library/Saved Application State/ai.elementlabs.lmstudio.savedState/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/Homebrew/homebrew-cask/master/Casks/l/lm-studio.rb
  source_kind: community
  volatility: Application logs typically rotate; capture the whole Logs directory.
  notes: |-
    ~/Library/Logs/LM Studio is the timestamped counterpart to the untimestamped conversation JSON - use it to place model loads and server requests on a timeline. Note the vendor identifier is ai.elementlabs, not anything containing 'lmstudio.ai'.

    Record structure: Cask lm-studio version 0.4.24,1, app bundle "LM Studio.app", bundle identifiers ai.elementlabs.lmstudio and ai.elementlabs.lmstudio.helper.
  parser: null
- id: lmstudio.mcp_config
  category: mcp_config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.lmstudio\mcp.json'
  - ~/.lmstudio/mcp.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://github.com/lmstudio-ai/docs/blob/main/0_app/2_mcp/index.mdx
  source_kind: official
  notes: |-
    The FILE and its schema are documented and verified; the exact on-disk LOCATION is not stated in any page I could read, so the ~/.lmstudio/ placement above is my inference from LM Studio's other paths and must be treated as recollection, needs verification. That a local runner can now launch arbitrary MCP subprocesses makes this a high-value target once the path is pinned down.

    Record structure: Docs state: "Starting 0.3.17 (b10), LM Studio supports both local and remote MCP servers. You can add MCPs by editing the app's mcp.json file... LM Studio currently follows Cursor's mcp.json notation" - so the SCHEMA is Cursor's mcpServers shape. Remote entries may carry an `auth` object; the OAuth callback is http://127.0.0.1:33389/mcp-oauth-callback.
  parser: json_generic
- id: lmstudio.conversations
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.lmstudio\conversations\'
  - ~/.lmstudio/conversations/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/lmstudio-ai/docs/main/0_app/1_basics/chat.md
  source_kind: official
  volatility: |-
    One file per conversation; deleting a chat in the UI deletes the file, so unallocated-space carving for JSON with LM Studio's role/content shape is worthwhile.
  notes: |-
    Full local transcripts in plain JSON - the richest single artifact in this family and directly comparable to a cloud agent's transcript. Includes the system prompt and per-message model identity, so you can attribute which local model produced which answer.

    Record structure: Official docs: "Conversations are stored in JSON format. It is NOT recommended to edit them manually, nor to rely on their structure." Treat the schema as unstable across versions and parse defensively; version-sniff before mapping fields.
  parser: json_generic
