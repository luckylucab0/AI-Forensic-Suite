    Work delegated to background subagents is recorded here rather than in the main transcript, so a main transcript that shows a delegation and no detail is expected, not evidence of tampering. Same per-session-directory layout as file-history. These DO expire at 30 days while the main transcripts do not, which makes an old case look as though the agent did far less autonomous work than it did.
