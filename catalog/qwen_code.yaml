# Qwen Code artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: qwen_code
title: Qwen Code
vendor: Qwen Team, Alibaba Group
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/QwenLM/qwen-code
- https://qwenlm.github.io/qwen-code-docs/
- https://www.npmjs.com/package/@qwen-code/qwen-code
description: |-
  Qwen Code is an open-source command line coding agent (npm package @qwen-code/qwen-code) that began as a fork of Google's Gemini CLI and has since diverged very far from it, adding a daemon and browser Web Shell, an SDK, workflows, subagents, managed memory and scheduled channel runs. Everything user-level lives under ~/.qwen (relocatable with QWEN_HOME, and the runtime output subset again with QWEN_RUNTIME_DIR). The one thing an analyst must know is that the conversation transcripts are NOT where the upstream layout or even the fork's own stale code comment says: they are per-session append-only JSONL under ~/.qwen/projects/<cwd-with-non-alphanumerics-replaced-by-hyphens>/chats/, they have NO retention policy and are never deleted on a schedule, while the pre-edit file backups and subagent transcripts beside them DO expire after 30 days and the raw model API logs after 7.
env_overrides:
- name: QWEN_HOME
  effect: |-
    Replaces ~/.qwen as the global configuration directory (absolute, relative to cwd, or leading ~). Moves settings, credentials, trusted folders, MCP approvals, memory, skills, plans, file-history, the projects/ transcript tree and almost everything else in one go. Project-level .qwen directories are unaffected. An empty string counts as unset. Collect the process environment first: with this set, the default ~/.qwen holds nothing and a default-path collection returns 'agent never used'. The one exception is ~/.qwen/source.json, which the installer writes to the real home directory regardless.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: QWEN_RUNTIME_DIR
  effect: |-
    Overrides only the runtime output base (conversations, logs, todos) while configuration stays under QWEN_HOME. Because transcripts, the tmp/<project-hash> tree, debug logs and the projects/ tree hang off the runtime base, this can split the evidence across two filesystems. It takes precedence over the runtimeOutputDir setting.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: QWEN_CODE_SYSTEM_SETTINGS_PATH
  effect: |-
    Overrides the system settings file path. System settings have the highest precedence of all settings files, so the policy actually in force may be at an arbitrary path.
  source: https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/
- name: QWEN_CODE_SYSTEM_DEFAULTS_PATH
  effect: |-
    Overrides the system defaults file path (the lowest-precedence layer).
  source: https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/
- name: QWEN_CODE_MCP_APPROVALS_PATH
  effect: |-
    Relocates mcpApprovals.json wholesale. Set, and ~/.qwen/mcpApprovals.json is empty or absent while MCP approval decisions exist elsewhere.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/cli/src/config/mcpApprovals.ts#L49
- name: QWEN_CODE_MEMORY_BASE_DIR
  effect: |-
    Moves the managed auto-memory base (both the projects/<...>/memory tiers and ~/.qwen/memories) away from the runtime base directory.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/memory/paths.ts#L68
- name: QWEN_CODE_MEMORY_LOCAL
  effect: |-
    =1 moves project auto-memory into <project>/.qwen/memory instead of under the user profile, which puts model-written memory inside the working copy where it may be committed.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/memory/paths.ts#L113
- name: QWEN_CODE_MEMORY_PROJECT_SCOPE
  effect: |-
    =workspace keys project auto-memory on the resolved workspace directory instead of the nearest git root, so the memory directory name for one project differs between the two modes.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/memory/paths.ts#L93
- name: QWEN_CODE_FORCE_ENCRYPTED_FILE_STORAGE
  effect: |-
    =true switches MCP OAuth tokens from plaintext ~/.qwen/mcp-oauth-tokens.json to the OS keychain where available, or to ~/.qwen/mcp-oauth-tokens-v2.json with AES-256-GCM. Absence of the plaintext file then means nothing.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/features/mcp.md
- name: QWEN_DEBUG_LOG_FILE
  effect: |-
    =1 turns on the per-session debug log at ~/.qwen/debug/<session-id>.txt. Unset (the normal state) makes almost every internal debug call a no-op, so an empty debug directory is expected rather than suspicious.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/conversations-recovery.md
- name: QWEN_TELEMETRY_OUTFILE
  effect: |-
    Writes OpenTelemetry data to the named file instead of exporting it over OTLP, creating an on-disk telemetry artifact at an operator-chosen path. Pairs with QWEN_TELEMETRY_LOG_PROMPTS and QWEN_TELEMETRY_INCLUDE_SENSITIVE_SPAN_ATTRIBUTES, which decide whether prompt text lands in it.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: QWEN_CODE_PROFILE_STARTUP
  effect: |-
    =1 writes JSON startup timing reports to ~/.qwen/startup-perf/. Minor, but it is an extra directory under the global dir that confirms the tool ran.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: SEATBELT_PROFILE
  effect: |-
    Do not move artifacts but decide whether confinement ran at all and with which profile or image, including a custom profile read from <project>/.qwen/sandbox-macos-<name>.sb. Needed to answer whether a safety control was in place, and the project rejects all four from project-scoped .env files for exactly that reason.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: QWEN_SANDBOX
  effect: |-
    Do not move artifacts but decide whether confinement ran at all and with which profile or image, including a custom profile read from <project>/.qwen/sandbox-macos-<name>.sb. Needed to answer whether a safety control was in place, and the project rejects all four from project-scoped .env files for exactly that reason.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: QWEN_SANDBOX_IMAGE
  effect: |-
    Do not move artifacts but decide whether confinement ran at all and with which profile or image, including a custom profile read from <project>/.qwen/sandbox-macos-<name>.sb. Needed to answer whether a safety control was in place, and the project rejects all four from project-scoped .env files for exactly that reason.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
- name: QWEN_SANDBOX_NET
  effect: |-
    Do not move artifacts but decide whether confinement ran at all and with which profile or image, including a custom profile read from <project>/.qwen/sandbox-macos-<name>.sb. Needed to answer whether a safety control was in place, and the project rejects all four from project-scoped .env files for exactly that reason.
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
artifacts:
- id: qwen_code.conversation_transcript
  title: Conversation transcript (per session JSONL)
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\projects\<sanitized-project-path>\chats\<session-id>.jsonl'
  - '%USERPROFILE%\.qwen\projects\<sanitized-project-path>\chats\archive\<session-id>.jsonl'
  - ~/.qwen/projects/<sanitized-project-path>/chats/<session-id>.jsonl
  - ~/.qwen/projects/<sanitized-project-path>/chats/archive/<session-id>.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/services/chatRecordingService.ts#L1126
  source_kind: source_code
  record_types:
  - assistant
  - system
  - system/agent_bootstrap
  - system/agent_launch_prompt
  - system/agent_retry
  - system/agent_session_ready
  - system/at_command
  - system/attribution_snapshot
  - system/background_task_completed
  - system/branch_checkpoint
  - system/chat_compression
  - system/cron
  - system/custom_title
  - system/file_history_snapshot
  - system/goal_runtime
  - system/goal_state
  - system/mid_turn_user_message
  - system/notification
  - system/parent_session
  - system/realtime_message
  - system/rewind
  - system/session_artifact_event
  - system/session_artifact_snapshot
  - system/session_model
  - system/session_source
  - system/session_sources_snapshot
  - system/slash_command
  - system/turn_result
  - system/ui_telemetry
  - system/user_text_elements
  - tool_result
  - user
  volatility: |-
    Nothing in the fork deletes these on a schedule. They are removed only by explicit user or API action (session delete, which also unlinks the sidecars and the matching ~/.qwen/file-history/<session-id>/ directory) or moved into chats/archive/ by session archive. Records are append-only: a rewind is written as a system/rewind record and the rewound turns are re-rooted onto a dead branch rather than erased, so the abandoned branch is still on disk. If general.chatRecording is set to false no transcript is written at all (getTranscriptPath() returns an empty string).
  notes: |-
    Primary evidence. Append-only JSONL, one record per line, tree structured: every record carries uuid, parentUuid, sessionId, ISO 8601 timestamp, type, optional subtype, cwd, CLI version and gitBranch. Linear history is reconstructed by walking parentUuid from the tail, so a parser that just reads lines in order will show abandoned branches as if they were real turns, and a parser that only follows the live chain will hide them. Traps: (1) the service's own docstring says 'File location: ~/.qwen/tmp/<project_id>/chats/', which is stale upstream text and NOT where the code writes; the code joins Storage.getProjectDir(), which is <runtime-base>/projects/<sanitizeCwd(projectRoot)>. Collecting only ~/.qwen/tmp/ (the upstream Gemini CLI layout) finds no transcripts. (2) <sanitized-project-path> is not a hash: sanitizeCwd() replaces every character that is not [A-Za-z0-9] with '-' (and lowercases on Windows), so '/home/alice/work/app' becomes '-home-alice-work-app' and the original project path is readable straight off the directory name. (3) the SAME project reached through a different path spelling (symlink, /var vs /private/var, a git worktree under <repo>/.qwen/worktrees/<slug>) produces a DIFFERENT projects/ leaf, so sessions for one logical project can be split across several directories. (4) system/file_history_snapshot records are the index that maps a prompt to the pre-edit file copies under ~/.qwen/file-history/, which do expire.
  parser: gemini
- id: qwen_code.session_sidecars
  title: Per-session sidecar files (runtime status, worktree, pull request)
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\projects\<sanitized-project-path>\chats\<session-id>.pr.json'
  - '%USERPROFILE%\.qwen\projects\<sanitized-project-path>\chats\<session-id>.runtime.json'
  - '%USERPROFILE%\.qwen\projects\<sanitized-project-path>\chats\<session-id>.worktree.json'
  - ~/.qwen/projects/<sanitized-project-path>/chats/<session-id>.pr.json
  - ~/.qwen/projects/<sanitized-project-path>/chats/<session-id>.runtime.json
  - ~/.qwen/projects/<sanitized-project-path>/chats/<session-id>.worktree.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/services/sessionService.ts#L921
  source_kind: source_code
  record_types:
  - pr_session
  - runtime_status
  - worktree_session
  volatility: |-
    The runtime-status sidecar tracks a live process and is deliberately transient; the worktree sidecar is cleared when the worktree is removed. All three are unlinked when the session is deleted. No age-based expiry.
  notes: |-
    Deliberately co-located with the transcripts so external observers can scan one directory for live sessions. The runtime sidecar carries sessionId and workDir, which is how the tool re-attributes a session whose recorded cwd hashes to a different project (for example a git worktree). For an analyst these are the cheap way to tell which sessions were live at collection time and which working copy each one was driving.
  parser: json_generic
- id: qwen_code.prompt_terminal_ledger
  title: Per-session prompt terminal ledger
  category: prompt_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\projects\<sanitized-project-path>\chats\<session-id>.ledger.jsonl'
  - ~/.qwen/projects/<sanitized-project-path>/chats/<session-id>.ledger.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/services/sessionService.ts#L999
  source_kind: source_code
  volatility: |-
    Append-only sidecar next to the transcript; removed with the session. No age-based expiry.
  notes: |-
    The code calls it the 'per-session prompt terminal ledger' and an append-only sidecar whose absence must be read as 'no ledger evidence' rather than 'nothing happened'. Useful as a cross-check on the transcript: if the transcript was edited or truncated the ledger may still carry the prompt terminations.
  parser: jsonl_generic
- id: qwen_code.prompt_history_log
  title: Prompt history log (logs.json)
  category: prompt_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\tmp\<project-hash>\logs.json'
  - ~/.qwen/tmp/<project-hash>/logs.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/core/logger.ts#L178
  source_kind: source_code
  record_types:
  - model_switch
  - user
  volatility: |-
    Rewritten atomically as a whole-file JSON array, so a failed write can lose the tail. Not swept by housekeeping.
  notes: |-
    Flat JSON array of {sessionId, messageId, timestamp, type, message}. type is 'user' (the raw prompt the user typed) or 'model_switch' (with fromModel, toModel and a reason of vision_auto_switch, manual, fallback or other). This survives independently of the transcript, so it is the fallback source for 'what did the user ask' when a transcript is missing, and the place where an automatic model switch is visible. <project-hash> here is sha256(projectRoot) in full hex (lowercased path on Windows) - a DIFFERENT keying scheme from the projects/ directory used for transcripts, so the same project appears under two different directory names in ~/.qwen.
  parser: gemini
- id: qwen_code.shell_history
  title: Shell command history
  category: shell_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\tmp\<project-hash>\shell_history'
  - ~/.qwen/tmp/<project-hash>/shell_history
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/settings.md
  source_kind: official
  volatility: |-
    Grows in place; not swept by housekeeping.
  notes: |-
    The project documentation states the location verbatim ('Location: ~/.qwen/tmp/<project_hash>/shell_history') and the source constructs the same path from getProjectTempDir(). Plain text, one command per line. Because it is keyed on the project hash rather than a session id it mixes every session in that project, so correlate with the transcripts for attribution.
  parser: null
- id: qwen_code.project_temp_spill
  title: 'Project temp directory: truncated tool output, captured background shell output, checkpoints'
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\tmp\<project-hash>\background-shells\<session-id>\shell-bg_<hex>.output'
  - '%USERPROFILE%\.qwen\tmp\<project-hash>\checkpoint-<tag>.json'
  - '%USERPROFILE%\.qwen\tmp\<project-hash>\checkpoints\*'
  - '%USERPROFILE%\.qwen\tmp\<project-hash>\tool-results\*'
  - ~/.qwen/tmp/<project-hash>/<tool-name>_<hex>
  - ~/.qwen/tmp/<project-hash>/background-shells/<session-id>/shell-bg_<hex>.output
  - ~/.qwen/tmp/<project-hash>/checkpoint-<tag>.json
  - ~/.qwen/tmp/<project-hash>/checkpoints/*
  - ~/.qwen/tmp/<project-hash>/tool-results/*
  format: directory
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: |-
    The checkpoints/ subdirectory is deleted recursively at EVERY CLI startup (cleanupCheckpoints() is awaited during startup in packages/cli/src/llm.tsx), so it only ever holds the current run. The truncated tool-output and background-shell files are not swept and persist.
  notes: |-
    High value and easy to miss. When a tool result is too large the full content is written here and only a preview goes into the transcript, so the transcript alone understates what the agent read; the same directory holds web_fetch payloads (the content actually pulled from the network) and the captured stdout/stderr of background shells. Collect live: anything under checkpoints/ is gone the next time the CLI starts. checkpoint-<tag>.json files are user-saved conversation checkpoints where <tag> is percent-encoded.
  parser: null
- id: qwen_code.user_settings
  title: User settings (permissions, approval mode, MCP servers, inline API keys)
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\settings.json'
  - ~/.qwen/settings.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/
  source_kind: official
  contains_credentials:
  - env
  - mcpServers.*.env
  - mcpServers.*.headers
  - mcpServers.*.oauth.clientSecret
  - modelProviders.*.customHeaders
  volatility: |-
    Rewritten in place whenever a setting or a persisted permission changes. Legacy files are renamed to a backup on configuration migration, so a *.json backup beside it can preserve an older state.
  notes: |-
    The single most informative configuration artifact. Carries tools.approvalMode (whose DEFAULT in this fork is 'auto', an LLM classifier that auto-approves actions it judges safe, with 'yolo' auto-approving everything), permissions.allow / permissions.ask / permissions.deny, mcpServers, hooks, telemetry, general.chatRecording and general.cleanupPeriodDays. Choosing 'always allow' on a tool confirmation writes a rule into permissions.allow at user or workspace scope, so this file is the durable record of granted permissions. JSON with comments is accepted (values are read through strip-json-comments), so a strict JSON parser can fail on a valid file. String values may be $VAR / ${VAR} references resolved at load time, so a key can look absent here and still be set. The env object holds API keys in plaintext by the project's own documented recommendation.
  parser: json_generic
- id: qwen_code.project_settings
  title: Project settings and the project .qwen directory
  category: config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.qwen/sandbox-macos-<profile>.sb
  - <project>/.qwen/sandbox.Dockerfile
  - <project>/.qwen/settings.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/
  source_kind: official
  contains_credentials:
  - env
  - mcpServers.*.env
  - mcpServers.*.headers
  volatility: |-
    Lives in the working copy, so git history may hold prior versions. Rewritten when a workspace-scoped permission is persisted.
  notes: |-
    Overrides user settings, and is the surface an attacker-supplied repository would use: it can declare mcpServers, hooks and permissions.allow. Not loaded at all when the folder is untrusted, which is why trustedFolders.json has to be read alongside it - a rule here that looks active may never have been applied. A few keys are read from operator scopes only and are ignored here (review policy, ui.brand.name), so presence in this file is not proof of effect. The custom sandbox profile and Dockerfile are the record of how confinement was configured for this project.
  parser: json_generic
- id: qwen_code.system_settings
  title: System settings and system defaults
  category: config
  root: system
  os:
  - macos
  - windows
  - linux
  paths:
  - /Library/Application Support/QwenCode/settings.json
  - /Library/Application Support/QwenCode/system-defaults.json
  - /etc/qwen-code/settings.json
  - /etc/qwen-code/system-defaults.json
  - 'C:\ProgramData\qwen-code\settings.json'
  - 'C:\ProgramData\qwen-code\system-defaults.json'
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://qwenlm.github.io/qwen-code-docs/en/users/configuration/settings/
  source_kind: official
  volatility: |-
    Administrator managed; changes only when an operator edits it.
  notes: |-
    System settings have the HIGHEST precedence of the files and system defaults the lowest, so both ends of the precedence chain live here. Either path can be moved by QWEN_CODE_SYSTEM_SETTINGS_PATH or QWEN_CODE_SYSTEM_DEFAULTS_PATH, so check the process environment before concluding the default path is authoritative. Note the macOS directory is spelled 'QwenCode' while the Linux and Windows ones are 'qwen-code'.
  parser: json_generic
- id: qwen_code.trusted_folders
  title: Trusted folders decisions
  category: permissions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\trustedFolders.json'
  - ~/.qwen/trustedFolders.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/docs/users/configuration/trusted-folders.md
  source_kind: official
  volatility: |-
    Appended to the first time the user answers the trust prompt for a folder; entries are not expired.
  notes: |-
    The durable record of which directories the user let the tool treat as trusted. Forensically decisive: in an untrusted folder the workspace .qwen/settings.json is not loaded at all, so a project-declared MCP server or hook only ever ran if the folder appears here as trusted. The project documentation describes the file as the central store and tells users to inspect it directly. When an IDE is connected the IDE's own trust decision is consulted first, so a folder can be effectively trusted without an entry here.
  parser: json_generic
- id: qwen_code.mcp_approvals
  title: MCP server approval decisions
  category: permissions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.qwen\mcpApprovals.json'
  - ~/.qwen/mcpApprovals.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/QwenLM/qwen-code/blob/12b8cbc4de2a237e01a0ab0c81d2da254b27e435/packages/cli/src/config/mcpApprovals.ts#L49
  source_kind: source_code
  record_types:
  - approved
  - rejected
  volatility: |-
    Written when the user approves or rejects a project-scoped MCP server; entries are not expired. Relocatable by QWEN_CODE_MCP_APPROVALS_PATH, in which case the default path holds nothing.
  notes: |-
