    Swept by the same housekeeping pass and the same general.cleanupPeriodDays cutoff (default 30 days) as the file-history backups, excluding the active session. Unlike file-history the ROOT directory is deliberately left in place for file watchers, so an empty subagents/ directory is the normal post-sweep state.
