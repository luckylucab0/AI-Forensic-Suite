# Visual Studio Code host storage artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: vscode
title: Visual Studio Code host storage
vendor: Microsoft
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/microsoft/
- https://raw.githubusercontent.com/microsoft/
- https://github.com/MicrosoftDocs/
- https://raw.githubusercontent.com/MicrosoftDocs/
- https://code.visualstudio.com/
- https://learn.microsoft.com/
description: |-
  Visual Studio Code and its forks, as a storage host rather than as an agent. A dozen agentic extensions keep their conversations under workspaceStorage and globalStorage or inside state.vscdb, so these paths are worth collecting even when it is not yet known which extension was installed.
references:
- https://github.com/microsoft/vscode-discussions/discussions/748
- |-
  https://raw.githubusercontent.com/microsoft/vscode-docs/main/docs/configure/settings.md
- |-
  https://raw.githubusercontent.com/microsoft/vscode-docs/main/docs/configure/extensions/extension-marketplace.md
artifacts:
- id: vscode.state_vscdb
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Code\User\globalStorage\state.vscdb'
  - ~/.config/Code/User/globalStorage/state.vscdb
  - ~/Library/Application Support/Code/User/globalStorage/state.vscdb
  - ~/Library/Application Support/Code/User/globalStorage/state.vscdb.backup
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/microsoft/vscode/main/src/vs/platform/storage/electron-main/storageMain.ts
  source_kind: source_code
  contains_credentials:
  - SecretStorage ItemTable rows
  volatility: |-
    Rewritten continuously while the editor runs; SQLite may carry -wal/-shm siblings. Cleared by 'reset user data'.
  notes: |-
    OPERATIONAL SPLIT: this one file holds BOTH non-secret extension globalState (collect as evidence) and SecretStorage ciphertext (do not exfiltrate). Recommend the collector copy state.vscdb (+ .backup) as normal evidence but treat the ItemTable rows under the secret key prefix as secret. Cline <=3.x stored its task index here via context.globalState.update("taskHistory", ...) and its API keys via context.secrets.store(...) - verified in https://raw.githubusercontent.com/cline/cline/v3.20.0/src/core/storage/state.ts. Secrets are encrypted with Electron safeStorage (AES-128-CBC); the key lives in the macOS Keychain item 'Code Safe Storage' / 'Code - Insiders Safe Storage', Windows DPAPI via Chromium OSCrypt, Linux libsecret/KeyStorageLinux. Without that keychain material the ciphertext is unrecoverable - so acquire keychain artifacts separately or record the secret as non-recoverable.

    Re-sourced after a new guard caught the previous citation: it was a discussion thread in one of the vendor's repositories, which the provenance check accepted because the URL sits under the vendor's organization while the text was written by a member of the public. The vendor's own storage implementation declares the filename and joins it onto the global storage directory, and declares the same filename again for the per-workspace store, which is what fixes both spellings.
  parser: sqlite_generic
- id: vscode.extension_dirs
  category: install_evidence
  root: user_profile
  os:
  - windows
  - macos
  - linux
  paths:
  - '%USERPROFILE%\.vscode\extensions\'
  - ~/.cursor/extensions/
  - ~/.vscode-insiders/extensions/
  - ~/.vscode-server/extensions/
  - ~/.vscode/extensions/
  - ~/.windsurf/extensions/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/microsoft/vscode-docs/main/docs/configure/extensions/extension-marketplace.md
  source_kind: official
  volatility: |-
    Old versions are removed on update, but extensions.json in the parent directory retains install/update bookkeeping.
  notes: |-
    Only ~/.vscode and ~/.vscode-insiders are vendor-documented; the FORK paths (~/.cursor/extensions, ~/.windsurf/extensions) follow VS Code's convention and I corroborated ~/.cursor only indirectly (it appears as an allowlisted subpath in public sandbox profiles alongside ~/.vscode). Treat the fork spellings as medium confidence until confirmed on a live install. Extensions to look for: anthropic.claude-code, openai.chatgpt / openai.codex, github.copilot and github.copilot-chat, google.gemini-cli-vscode-ide-companion, saoudrizwan.claude-dev (Cline), continue.continue. Also sweep the sibling user-data dirs (%APPDATA%\Code, ~/Library/Application Support/Code, ~/.config/Code) which hold each extension's globalStorage/workspaceStorage - often where an extension's own chat history lives.

    Record structure: Verbatim per-OS paths from the official docs: Windows %USERPROFILE%\.vscode\extensions, macOS ~/.vscode/extensions, Linux ~/.vscode/extensions. Relocatable via `--extensions-dir <dir>` or the VSCODE_EXTENSIONS environment variable ("particularly useful in enterprise settings where centralized extension management is desired"). Each subdirectory is named publisher.name-version, which alone gives you the agent extension and its exact version; read its package.json for more. Also parse ../extensions/extensions.json for the install metadata index.
  parser: null
- id: vscode.extension_install_evidence
  category: install_evidence
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.vscode\extensions\'
  - ~/.vscode-server/extensions/
  - ~/.vscode/extensions/extensions.json
  - ~/.vscode/extensions/kilocode.kilo-code-*/
  - ~/.vscode/extensions/rooveterinaryinc.roo-cline-*/
  - ~/.vscode/extensions/saoudrizwan.claude-dev-*/
  format: json
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: unverified
  source: recollection
  source_kind: recollection
  volatility: |-
    Removed on uninstall, but extensions.json often retains stale entries and the versioned directory name preserves the exact version that ran.
  notes: |-
    recollection, needs verification - I did not fetch a source that states the VS Code extensions-directory layout, so the exact paths here must be confirmed against Microsoft's documentation before they go in the catalogue as verified. Forensic value if confirmed is high and cheap: the versioned directory name pins WHICH version of Cline/Roo/Kilo ran, which is what lets us decide between the mutually exclusive layouts above (Cline 3.x shadow-git vs 4.x workspace refs; Kilo legacy tasks vs kilo.db; Roo pre/post customStoragePath).
  parser: null
- id: vscode.mcp_config
  title: MCP server configuration
  category: mcp_config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.vscode/mcp.json
  - <vscode-user>/mcp.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://code.visualstudio.com/docs/copilot/customization/mcp-servers
  source_kind: official
  volatility: Persistent until edited. The workspace file is usually version-controlled, so git history gives authorship and timing for it.
  notes: |-
    The inventory of external tools the editor's agent mode could reach, with their command lines and environment, which is where an inline secret ends up. Two scopes: the vendor states the workspace file as .vscode/mcp.json, shared through source control, and a user-level mcp.json in the user profile folder, which it reaches through a command rather than by naming the path. Enumerate the user-level file under every product variant, the same set as the user data roots entry.

    Added by the source verification pass, which found these two paths claimed by a cross-cutting entry that rested on a different vendor's documentation. One correction came out of it: a user-level file directly under ~/.vscode is not what the vendor describes, and that spelling has been dropped.
  parser: null
- id: vscode.user_data_roots
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Code\User\globalStorage\'
  - ~/.config/Code/User/globalStorage/
  - ~/.config/VSCodium/User/globalStorage/
  - ~/.vscode-server/data/User/globalStorage/
  - ~/Library/Application Support/Code - Insiders/User/globalStorage/
  - ~/Library/Application Support/Code/User/globalStorage/
  format: binary
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/microsoft/vscode/main/src/vs/platform/environment/common/environmentService.ts
  source_kind: source_code
  volatility: Persists until the editor variant's user-data dir is deleted; survives extension uninstall
    in most cases.
  notes: |-
    The editor's own environment service joins the user data path with `User` and then with `globalStorage`, which is what fixes this layout. The per-platform user data path itself is given by the vendor's settings documentation as %APPDATA%\Code\User on Windows, $HOME/Library/Application Support/Code/User on macOS and $HOME/.config/Code/User on Linux.

    This root is NOT one path. Enumerate every editor variant present on the image: Code, 'Code - Insiders', VSCodium, Cursor, Windsurf, plus the remote roots ~/.vscode-server/data/User and ~/.vscode-remote/data/User. Only the Code variant is vendor-stated; the others are the same relative layout under a differently named product directory and were not separately confirmed, so a miss under one of them is inconclusive rather than proof the variant was unused.

    Record structure: every Cline-family extension hangs its tree off <vscode-user>/globalStorage/<publisher.extension-lowercased>/.
  parser: null
