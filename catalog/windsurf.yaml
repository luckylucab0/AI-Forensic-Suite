  source_kind: community
  volatility: |-
    Token formats have changed across eras; ~/.codeium/config.json is the LEGACY location and is described as gone on current builds, so its presence dates the install. Collect before restart.
  notes: |-
    RECORD HASH AND METADATA ONLY for these. The state.vscdb file itself must still be collected under windsurf.ide_global_state_vscdb — apply this as an export-time redaction of one key, never a file-level skip. Rated CRITICAL by a DFIR catalogue because the key is stored unencrypted. The nvim plugin path is a separate Codeium install footprint on the same host.

    The catalogued path had an explanation appended to it, kept here: ~/Library/Application Support/Windsurf/User/globalStorage/state.vscdb  (ItemTable key: windsurfAuthStatus)

    The catalogued path had an explanation appended to it, kept here: %APPDATA%\Windsurf\User\globalStorage\state.vscdb  (ItemTable key: windsurfAuthStatus)

    The catalogued path had an explanation appended to it, kept here: ~/.config/Windsurf/User/globalStorage/state.vscdb  (ItemTable key: windsurfAuthStatus)

    Record structure: KEY-SCOPED for the SQLite path: only the windsurfAuthStatus ItemTable row is secret, and its JSON has an apiKey field. Observed API key formats: 'devin-session-token$<JWT>' (Cognition era), 'sk-ws-01-*' and 'cog_*' (older). ~/.codeium/config.json is plaintext JSON holding the API key. credentials.toml uses a windsurf-api-key method id, reflecting the shared lineage. A CSRF token additionally lives only in the running language_server process environment (WINDSURF_CSRF_TOKEN), readable from /proc/<pid>/environ on Linux — memory/process evidence, not disk.
