# Windsurf artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: windsurf
title: Windsurf
vendor: Cognition
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/Exafunction/
- https://raw.githubusercontent.com/Exafunction/
- https://github.com/codeium/
- https://raw.githubusercontent.com/codeium/
- https://windsurf.com/
- https://docs.windsurf.com/
- https://codeium.com/
# The product was renamed and its documentation host now redirects here, so this is the
# same vendor writing about the same product rather than a third party.
- https://docs.devin.ai/
- https://windsurf-stable.codeiumdata.com/
- https://devin.ai/
description: |-
  The Codeium editor, renamed Devin Desktop in mid-2026, whose agent is called Cascade. Two things about its storage decide what a collection means. First, the rename: the application reads both the legacy Windsurf and Codeium paths and the new Devin paths, writes new data to the Devin paths, and copies everything from the legacy paths to the new ones the first time it runs after the upgrade. So the same content can exist in two trees and a timestamp under a Devin path may be the migration rather than the user, which makes the legacy tree the better timeline evidence where both exist. Second, the vendor documents the directories that hold conversations and memories and says nothing at all about the files inside them, which are opaque binary blobs. The one parseable record of a conversation is the transcript file the hook interface exposes, and the product keeps only the hundred most recent of those.
references:
- |-
  https://github.com/depalmar/ai-dfir-toolkit/blob/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/docs/RESEARCH-2026-08-14.md
- |-
  https://raw.githubusercontent.com/LayerNorm/overlay-web/6cf2cbfe09e0f25ebabf9986f1566183f477a48b/docs/develop/traversing-agent-conversations.md
- |-
  https://raw.githubusercontent.com/dayearleo/windsurf-local-user-data-decryption/0e9e057aa9962284517db9c4963c5275eff7df00/SKILL.md
- |-
  https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/codeium-windsurf.yml
env_overrides:
- name: WINDSURF_CONFIG_DIR
  effect: |-
    Claimed by community tooling to select the configuration directory. An exhaustive search of both of the vendor's documentation corpora and every repository in its code hosting organization found no occurrence of this name, and the only variables the vendor documents are an API key and a service key, so treat it as a lead rather than as a fact. What the vendor does document, and what actually moves the tree, is one configuration directory per release channel: the stable channel under .codeium/windsurf, the next channel under .codeium/windsurf-next and the insiders channel under .codeium/windsurf-insiders. A collector that looks only at the stable directory finds nothing on a prerelease install.
artifacts:
- id: windsurf.cascade_transcripts
  title: Conversation transcripts
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.windsurf\transcripts\*.jsonl'
  - ~/.devin/transcripts/*.jsonl
  - ~/.windsurf/transcripts/*.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://docs.windsurf.com/windsurf/cascade/hooks
  source_kind: official
  record_types:
  - user_input
  - planner_response
  - code_action
  volatility: |-
    Capped at one hundred files, with the oldest pruned by modification time when a new conversation starts. So the transcript of a conversation can be gone while the conversation itself is still listed in the interface, and a hundred sessions of ordinary use is enough to lose the oldest. Written with owner-only permissions.
  notes: |-
    The single most valuable artifact for this agent, and it was missing from this catalogue until the vendor verification pass found it. Everything else the vendor publishes about conversations names an opaque binary directory. This is a plain-text record of an entire conversation, one JSON object per line, each a step with a type and a status. The vendor's own description of what a line can carry is file contents, command outputs, tool arguments, search results and the rules that were applied, which covers most of the questions this suite exists to answer, including which instruction file actually fired on a given turn.

    Two traps. The file is per trajectory and named after the trajectory identifier, so tying it to a conversation in the interface needs the identifier, not the title. And the vendor exposes the path to hooks at runtime rather than as a documented location, with a note that it is absent when transcripts are disabled: an empty directory can therefore mean the feature was switched off rather than that nothing happened.

    Record structure: one JSON object per line with a type and a status. Types seen in the vendor's worked example are user_input, which carries the applied rules and the user's own text, planner_response, and code_action, which carries a path and the new content.
  parser: jsonl_generic
- id: windsurf.system_config
  title: Machine-wide administrator configuration
  category: instructions
  root: system
  os:
  - macos
  - linux
  - windows
  paths:
  - /Library/Application Support/Windsurf/hooks.json
  - /Library/Application Support/Windsurf/rules/*.md
  - /Library/Application Support/Windsurf/skills/
  - /Library/Application Support/Windsurf/workflows/
  - /etc/windsurf/hooks.json
  - /etc/windsurf/rules/*.md
  - /etc/windsurf/skills/
  - /etc/windsurf/workflows/
  - C:\ProgramData\Windsurf\hooks.json
  - C:\ProgramData\Windsurf\rules\*.md
  - C:\ProgramData\Windsurf\skills\
  - C:\ProgramData\Windsurf\workflows\
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.devin.ai/desktop/devin-desktop-faq
  source_kind: official
  volatility: Deployed by administrators through endpoint management, so it persists and changes outside the user's control and without any trace in the user's own directories.
  notes: |-
    Added by the vendor verification pass. An administrator can deploy rules, workflows, skills and hooks machine-wide, read-only to the user, and the vendor states that the hooks here run first in the merge order. That makes this the answer to a specific and otherwise unanswerable question: agent behaviour that nothing in the user's own directories accounts for. A blocking hook here can also stop an action the analyst would otherwise expect to see attempted, so an absent action is not proof the agent never tried.

    Collect it even when the user's own directories look complete, and read it before concluding that an instruction the agent followed came from the user.
  parser: instructions
- id: windsurf.worktrees
  title: Agent-created git worktrees
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.windsurf\worktrees\*'
  - ~/.devin/worktrees/*
  - ~/.windsurf/worktrees/*
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://docs.windsurf.com/windsurf/cascade/worktrees
  source_kind: official
  volatility: |-
    At most twenty per workspace, with older ones removed automatically when a new one is created. So agent-written code here is deleted on a schedule the user never sees and does not control.
  notes: |-
    Added by the vendor verification pass. The agent creates git worktrees outside the user's own checkout for parallel sessions, organized by repository name. Two reasons this matters more than a cache directory would. The code the agent wrote lives here rather than in the checkout the analyst is looking at, so a diff of the user's repository can show nothing while the agent wrote a great deal. And the vendor states that by default these worktrees are not shown in the editor's source control panel, so the user may not know they exist either.
  parser: null
- id: windsurf.plans
  title: Agent plan files
  category: transcript
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.windsurf\plans\'
  - <project>/.devin/plans/
  - <project>/.windsurf/plans/
  - ~/.devin/plans/plan-*.md
  - ~/.devin/plans/
  - ~/.windsurf/plans/
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://docs.devin.ai/desktop/cascade/modes
  source_kind: official
  volatility: Persistent markdown files the vendor describes as kept across the session, so they survive the conversation they belong to.
  notes: |-
    Added by the vendor verification pass. A record of what the agent intended to do, written separately from the conversation, which makes it readable on its own and useful when the conversation record has been pruned or is an opaque blob. The vendor describes a mode in which the agent researches with read-only commands, keeps a persistent plan file, and asks for approval before implementing, so a plan with no corresponding edits is the expected shape of a refused or abandoned run rather than an anomaly.
  parser: prose_document
- id: windsurf.acp_registry
  title: Local agent registry
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.windsurf\acp\registry.json'
  - ~/.windsurf-next/acp/registry.json
  - ~/.windsurf/acp/registry.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.devin.ai/desktop/acp
  source_kind: official
  volatility: Persists until edited.
  notes: |-
    Added by the vendor verification pass. The vendor states that a user can configure their own agents by editing this file, which points the editor at a local agent binary of the user's choosing. Two consequences for an investigation. The agent that ran a conversation may not be this vendor's at all, so this file is part of answering which agent actually ran. And it is a way to route work through a binary that none of this catalogue's other entries describe, which makes it worth reading in any question about a control that was bypassed.
  parser: json_generic
- id: windsurf.ignore_files
  title: Ignore files
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.codeium\.codeiumignore'
  - <project>/.codeiumignore
  - <project>/.devinignore
  - <project>/.windsurfignore
  - ~/.codeium/.codeiumignore
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://docs.windsurf.com/context-awareness/windsurf-ignore
  source_kind: official
  volatility: Version-controlled in the repository case, so git history gives authorship and timing. The global one is untracked and carries only its mtime.
  notes: |-
    Added by the vendor verification pass. Forensically this is the inverse of every other entry here: it does not record what the agent did, it records what the agent was configured never to read, write or index. Two uses. A file the analyst expected the agent to have touched, and which it did not, may be explained here rather than by the agent's behaviour. And a rule added to one of these files shortly before the period under investigation is worth its own look, because it is a way to keep material out of the agent's context and therefore out of every transcript.

    The vendor documents a global ignore file in the configuration directory for enforcing rules across all repositories, which applies in addition to the per-repository files rather than instead of them.
  parser: text_config
- id: windsurf.plugin_log
  title: Plugin log
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.codeium\codeium.log'
  - ~/.codeium/codeium.log
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: |-
    https://docs.windsurf.com/troubleshooting/plugins-gathering-logs
  source_kind: official
  volatility: A log file, so expect rotation or truncation. The vendor gives no retention statement.
  notes: |-
    Added by the vendor verification pass, from the vendor's own instructions for gathering logs. This is the log of the plugin surfaces rather than of the editor, so it is the artifact to look for when the agent was used from inside another development environment rather than from this vendor's own editor.

    The vendor also documents a diagnostics bundle the user can download from the agent panel, and states no output path for it. Ask the user or look in the download directory rather than expecting it somewhere predictable.
  parser: text_log
- id: windsurf.ide_user_data
  title: Editor user data directory
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Devin\User\settings.json'
  - '%APPDATA%\Windsurf\User\keybindings.json'
  - '%APPDATA%\Windsurf\User\settings.json'
  - '%APPDATA%\Windsurf\argv.json'
  - ~/.config/Windsurf/User/settings.json
  - ~/Library/Application Support/Devin/User/settings.json
  - ~/Library/Application Support/Windsurf/User/keybindings.json
  - ~/Library/Application Support/Windsurf/User/settings.json
  - ~/Library/Application Support/Windsurf/User/snippets/
  - ~/Library/Application Support/Windsurf/Workspaces/
  - ~/Library/Application Support/Windsurf/argv.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.devin.ai/desktop/devin-desktop-faq
  source_kind: official
  volatility: |-
    Persists until edited. The vendor states that the renamed application reads the new directory when it exists, and copies the legacy directory's contents into it on first run, so a timestamp here may be the migration rather than the user.
  notes: |-
    Added by the vendor verification pass, which also settled where this product's settings file actually lives. It is the editor's own user data directory, inherited from the editor this product is derived from, and it is a different tree from the agent configuration directory under .codeium. An entry here used to claim a settings file under the agent configuration directory, which was wrong.

    The workspace list is the part worth reading first: it is the record of which projects were opened in this editor, which is how a collection finds the working copies the agent's project-anchored artifacts hang off.
  parser: json_generic
- id: windsurf.global_rules
  category: instructions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codeium\windsurf\memories\global_rules.md'
  - ~/.codeium/windsurf-insiders/memories/global_rules.md
  - ~/.codeium/windsurf-next/memories/global_rules.md
  - ~/.codeium/windsurf/memories/global_rules.md
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://docs.windsurf.com/windsurf/cascade/memories
  source_kind: official
  unsourced_paths:
  - ~/.codeium/windsurf-insiders/memories/global_rules.md
  - ~/.codeium/windsurf-next/memories/global_rules.md
  volatility: |-
    Single file, overwritten in place, no history. A 6,000-character cap is enforced, so content is truncated rather than rotated.
  notes: |-
    TWO LOCATIONS, BOTH LIVE: ~/.codeium/windsurf/memories/global_rules.md is current; ~/.codeium/windsurf/global_rules.md is the pre-1.8.3 location that one rules-adapter still probes as a fallback. Collect both. The %APPDATA%\Codeium\windsurf\... form is from a single source that explicitly labelled its own non-macOS paths as unverified — prefer %USERPROFILE%\.codeium\windsurf\.
  parser: instructions
- id: windsurf.embedding_database
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codeium\windsurf\database\<hash>\'
  - ~/.codeium/windsurf/database/<hash>/embedding_database.sqlite
  - ~/.codeium/windsurf/database/<hash>/embedding_database.sqlite-shm
  - ~/.codeium/windsurf/database/<hash>/embedding_database.sqlite-wal
  - ~/.codeium/windsurf/database/<md5-of-workspace-id>/
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/LayerNorm/overlay-web/6cf2cbfe09e0f25ebabf9986f1566183f477a48b/docs/develop/traversing-agent-conversations.md
  source_kind: community
  volatility: |-
    EXPIRES: the language_server is launched with --indexed_files_retention_period_days 30, so indexed file data ages out after ~30 days. Also the directory users are most often told to delete ('rm -rf ~/.codeium/windsurf/database/*') to fix Cascade problems.
  notes: |-
    Confirmed independently by a live Windsurf process command line captured in a public system report (…--database_dir /home/alice/.codeium/windsurf/database/9c0694567290725d9dcba14ade58e297 --indexed_files_retention_period_days 30 --workspace_id file_home_alice_Desktop_<project> --codeium_dir .codeium/windsurf --windsurf_version 1.12.6…). That command line is also the cleanest source for the workspace_id naming scheme (file_ + absolute path with separators flattened).

    Record structure: One directory per workspace hash, holding the local embedding/search index. Concurrent language_servers on the same hash contend on lockfiles. The hash is passed to the process as --database_dir.
  parser: sqlite_generic
- id: windsurf.code_tracker_and_settings
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codeium\user_settings.pb'
  - ~/.codeium/user_settings.pb
  - ~/.codeium/windsurf/code_tracker/
  - ~/.codeium/windsurf/installation_id
  - ~/.codeium/windsurf/user_settings.pb
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.devin.ai/desktop/devin-desktop-faq
  source_kind: official
  unsourced_paths:
  - ~/.codeium/windsurf/code_tracker/
  - ~/.codeium/windsurf/installation_id
  - ~/.codeium/windsurf/user_settings.pb
  notes: |-
    installation_id is the stable per-install identifier for correlating a host to server-side records — the Windsurf analogue of Cursor's machineid. code_tracker/ is the AI-vs-human edit-attribution analogue of Cursor's ai-code-tracking.db, but its internal format is not documented in any source I could reach.

    Path correction from the vendor verification pass: the vendor's own table of the per-user configuration directory puts the settings file one level above where this entry had it, directly under .codeium rather than under the channel directory. A collector globbing only the channel directory would have missed it, so both spellings are listed and the deeper one is marked unsourced. The code tracker directory and the installation identifier do not occur anywhere in either of the vendor's documentation corpora or in any of its repositories, so they rest on independent research alone and are marked unsourced too.
  parser: null
- id: windsurf.hooks
  category: config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codeium\hooks.json'
  - '%USERPROFILE%\.codeium\windsurf\hooks.json'
  - <project>/.windsurf/hooks.json
  - ~/.codeium/hooks.json
  - ~/.codeium/windsurf/hooks.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.windsurf.com/windsurf/cascade/hooks
  source_kind: official
  notes: |-
    Hooks are ARBITRARY LOCAL COMMAND EXECUTION on agent events — a persistence and code-execution primitive as much as a config. Confirmed by a rules-sync research doc and an independent agent-guardrail tool's coverage matrix.

    Confirmed by the vendor verification pass, which found the hooks page states three levels that are loaded and merged: the editor's user-level file, the plugin's user-level file one directory up, and the workspace file. The third level is the machine-wide one, which has its own entry here and runs first in the merge order.
  parser: json_generic
- id: windsurf.ide_global_state_vscdb
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Devin\User\globalStorage\state.vscdb'
  - '%APPDATA%\Devin\User\globalStorage\state.vscdb.backup'
  - '%APPDATA%\Devin\User\globalStorage\state.vscdb-shm'
  - '%APPDATA%\Devin\User\globalStorage\state.vscdb-wal'
  - '%APPDATA%\Windsurf - Next\User\globalStorage\state.vscdb'
  - '%APPDATA%\Windsurf - Next\User\globalStorage\state.vscdb-shm'
  - '%APPDATA%\Windsurf - Next\User\globalStorage\state.vscdb-wal'
  - '%APPDATA%\Windsurf Insiders\User\globalStorage\state.vscdb'
  - '%APPDATA%\Windsurf Insiders\User\globalStorage\state.vscdb-shm'
  - '%APPDATA%\Windsurf Insiders\User\globalStorage\state.vscdb-wal'
  - '%APPDATA%\Windsurf\User\globalStorage\state.vscdb'
  - '%APPDATA%\Windsurf\User\globalStorage\state.vscdb-shm'
  - '%APPDATA%\Windsurf\User\globalStorage\state.vscdb-wal'
  - ~/.config/Devin/User/globalStorage/state.vscdb
  - ~/.config/Devin/User/globalStorage/state.vscdb.backup
  - ~/.config/Devin/User/globalStorage/state.vscdb-shm
  - ~/.config/Devin/User/globalStorage/state.vscdb-wal
  - ~/.config/Windsurf/User/globalStorage/state.vscdb
  - ~/.config/Windsurf/User/globalStorage/state.vscdb-shm
  - ~/.config/Windsurf/User/globalStorage/state.vscdb-wal
  - ~/Library/Application Support/Devin/User/globalStorage/state.vscdb
  - ~/Library/Application Support/Devin/User/globalStorage/state.vscdb.backup
  - ~/Library/Application Support/Devin/User/globalStorage/storage.json
  - ~/Library/Application Support/Devin/User/globalStorage/state.vscdb-shm
  - ~/Library/Application Support/Devin/User/globalStorage/state.vscdb-wal
  - ~/Library/Application Support/Windsurf - Next/User/globalStorage/state.vscdb
  - ~/Library/Application Support/Windsurf - Next/User/globalStorage/state.vscdb-shm
  - ~/Library/Application Support/Windsurf - Next/User/globalStorage/state.vscdb-wal
  - ~/Library/Application Support/Windsurf/User/globalStorage/state.vscdb
  - ~/Library/Application Support/Windsurf/User/globalStorage/state.vscdb-shm
  - ~/Library/Application Support/Windsurf/User/globalStorage/state.vscdb-wal
  - ~/Library/Application Support/Windsurf/User/globalStorage/storage.json
  - ~/Library/Application Support/Windsurf/machineId
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/codeium-windsurf.yml
  source_kind: community
  contains_credentials:
  - auth_credentials
  volatility: WAL-mode like all VS Code state DBs — take -wal and -shm. ItemTable is last-write-wins.
  notes: |-
    PRODUCT FOLDER NAME IS NOT STABLE. Confirmed variants: Windsurf, 'Windsurf - Next', 'Windsurf-Next', 'Windsurf Insiders', and after the Cognition rebrand 'Devin' and 'Devin - Next'. A sweep keyed only on 'Windsurf' misses current installs; macOS uses /Applications/Devin.app while Windows still uses \Windsurf — the naming trap runs both ways. The .pb trajectory store is SHARED between Windsurf and Devin Desktop, but session titles/cwd live in each IDE's OWN state.vscdb, so a session created in one may be invisible in the other's UI. Third-party extensions hosted inside Windsurf keep their own stores here too, e.g. globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json and roo_mcp_settings.json.

    This file also holds credential material. That is recorded here rather than as a separate entry, because a separate entry marked secret would stop the collector copying a file that is itself the evidence. Folded in from windsurf.auth_credentials: RECORD HASH AND METADATA ONLY for these. The state.vscdb file itself must still be collected under windsurf.ide_global_state_vscdb — apply this as an export-time redaction of one key, never a file-level skip. Rated CRITICAL by a DFIR catalogue because the key is stored unencrypted. The nvim plugin path is a separate Codeium install footprint on the same host.

    The catalogued path had an explanation appended to it, kept here: ~/Library/Application Support/Windsurf/User/globalStorage/state.vscdb  (ItemTable key: windsurfAuthStatus)

    The catalogued path had an explanation appended to it, kept here: %APPDATA%\Windsurf\User\globalStorage\state.vscdb  (ItemTable key: windsurfAuthStatus)

    The catalogued path had an explanation appended to it, kept here: ~/.config/Windsurf/User/globalStorage/state.vscdb  (ItemTable key: windsurfAuthStatus)

    Record structure: Standard VS Code ItemTable(key, value BLOB). Windsurf-specific keys: windsurfAuthStatus (JSON containing an apiKey field plus base64-encoded protobuf blobs for the cached allowed-models list) and windsurf.settings.cachedPlanInfo (quota/usage counters: quotaUsage, or usedMessages/messages and usedFlowActions/flowActions in newer shapes). Generic VS Code chat keys worth checking: chat.ChatSessionStore.index (observed EMPTY: {"version":1,"entries":{}}), aiService.prompts, workbench.panel.aichat.view.aichat.chatdata, agentSessions.model.cache. CONVERSATION CONTENT IS NOT HERE — only session metadata (title, cwd, lastActivity) and UI state.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.10.31, one installation and one trivial conversation each. Under the current product name this database exists on both, and it does not have the sidecars this entry assumed.

        There is no write ahead log and no shared memory file beside it on either operating system. What sits beside it instead is a full second copy of the database under the same name with a backup suffix, the same size as the original, and it is a database in its own right rather than a journal. That is the opposite of the usual acquisition rule, and both halves matter: collecting only the sidecars named in this entry gets nothing, and a copy that is byte for byte a second database is readable after the original has been overwritten. The backup spellings are in this entry now for all three operating systems.

        Three key groups were read, names only, and are worth knowing before the file is opened. The credential keys are still spelled under the old brand, so a search for the current product name finds neither of them. Three telemetry keys carry the first, current and last session dates, which gives first and last use of the product without touching a transcript. And one key group per session carries the session start time and the count of user messages, keyed by a readable session name, so an analyst can answer when a session ran and how much the user said in it without opening a single message store.
  parser: vscode_state
