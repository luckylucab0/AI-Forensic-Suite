  - C:\Program Files\Windsurf\
  - ~/.codeium/<version>/language_server_linux_x64
  - ~/.codeium/<version>/language_server_macos_arm
  - ~/.codeium/<version>/language_server_windows_x64.exe
  - ~/.windsurf-server/data/logs/<timestamp>/1-windsurf.log
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/codeium-windsurf.yml
  source_kind: community
  volatility: |-
    ~/.windsurf-server logs rotate per launch. Language-server binaries are DOWNLOADED AT RUNTIME into a version-named directory — hash them against the vendor build, because this is a remote-binary-origin supply-chain surface.
  notes: |-
    ~/.windsurf-server/... is the remote/SSH server-side footprint, a completely separate tree from ~/.codeium. The ~/.codeium/<version>/language_server_* path is where the hardcoded AES key physically lives — it is the artifact you carve the key out of if a future version rotates it.

    Record structure: Version is encoded in the ~/.codeium/<version>/ directory name and also passed on the command line as --windsurf_version. Windows process-creation detection: Sysmon Event ID 1 where Image ends with Windsurf.exe or language_server_windows_x64.exe; parent/child relationships reveal the tool-execution chain. Network indicator: egress to *.codeium.com and *.windsurf.com on 443/TCP during full-codebase indexing.
  parser: null
