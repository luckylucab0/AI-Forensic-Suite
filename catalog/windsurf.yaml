- id: windsurf.cascade_trajectories
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - $WINDSURF_CONFIG_DIR/cascade/<cascade-id>.pb
  - '%USERPROFILE%\.codeium\windsurf\cascade\<cascade-id>.pb'
  - ~/.codeium/windsurf/cascade/<cascade-id-uuid>.pb
  - ~/.codeium/windsurf/cascade/<cascade-id-uuid>.pb.archived
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/dayearleo/windsurf-local-user-data-decryption/0e9e057aa9962284517db9c4963c5275eff7df00/SKILL.md
  source_kind: community
  volatility: |-
    HIGHEST-PRIORITY VOLATILITY IN THIS FAMILY. Archived sessions become ZERO-BYTE `.pb.archived` placeholders — archiving DESTROYS the content, it does not move it. Each StartCascade writes ~20 MB and nothing cleans up, so users and 'fix Windsurf' scripts routinely `rm -rf ~/.codeium/windsurf/*`. Collect this directory first, before any restart, archive or cache clear.
  notes: |-
    THIS IS THE CORRECTION THAT MATTERS MOST FOR WINDSURF: Cascade conversations are NOT in state.vscdb and are NOT SQLite or JSON. Because the key is global and hardcoded, the encryption is obfuscation, not a security boundary — anyone holding the .pb files can decrypt them, which is what makes this collectable. Corroborated by four independent repositories (a dedicated key-recovery/decryption toolkit, a session-export SDK, a collector architecture doc, and an Antigravity adapter — Google's Antigravity shares the same Codeium language-server lineage AND the same key). Validated against Windsurf 1.110.1 (macOS arm64) on 2026-05-13. Files are named by cascade_id (UUID v4). THE SAME DIRECTORY IS SHARED between Windsurf and the rebranded Devin Desktop, so one acquisition covers both products.

    Provenance: no vendor source states this path. The product is closed source and its documentation does not describe its on-disk layout, so the location rests on independent research. It is collected all the same, and reported as unverified, so an empty result reads as inconclusive rather than as proof the agent was never used.
