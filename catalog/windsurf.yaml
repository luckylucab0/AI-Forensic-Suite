  category: permissions
  root: registry
  os:
  - windows
  paths:
  - /Applications/Devin.app/Contents/Resources/app/policies
  - /etc/windsurf/policies/policy.json
  - C:\Windows\PolicyDefinitions\en-US\windsurf.adml
  - C:\Windows\PolicyDefinitions\windsurf.admx
  - HKCU\Software\Policies\Windsurf\<ProductName>
  - HKLM\Software\Policies\Windsurf\<ProductName>
  format: registry
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://github.com/depalmar/ai-dfir-toolkit/blob/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/docs/RESEARCH-2026-08-14.md
  source_kind: community
  volatility: |-
    Machine-wide and administrator-writable — changes here are an administrative action, not user activity, and are unlikely to be cleaned up by the user.
  notes: |-
    Retrieved as a code-search snippet from a research-audit log inside a DFIR toolkit repo that quotes the vendor's enterprise-policies page verbatim; I could not reach the vendor page itself (docs.devin.ai blocked). Marked medium confidence for that reason. Forensically important: this is where an administrator (or an attacker with admin) can enable hooks and rules for every user on the machine — a system-wide agent-configuration backdoor with no per-user artifact.

    Record structure: <ProductName> is the channel name, e.g. Software\Policies\Windsurf\Windsurf or Software\Policies\Windsurf\WindsurfInsiders — deliberately contrasted with VS Code's Software\Policies\Microsoft\<ProductName>. The Linux path is likewise contrasted with VS Code's /etc/vscode/policy.json. A machine-wide system.json in these same administrator-writable directories reportedly also carries system-level RULES AND HOOKS.
  parser: null
