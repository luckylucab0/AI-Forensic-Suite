    Explicitly described by an independent instrumentation project as a 'narrow legacy DB history fallback' behind the authoritative Cascade transcript. Do not build the Windsurf parser on this.

    Record structure: ItemTable only. Legacy VS Code chat keys (aiService.prompts, workbench.panel.aichat.view.aichat.chatdata) can be populated on older builds and are the only SQLite-resident Windsurf chat text; treat as a narrow legacy fallback, not the primary transcript. workspace.json beside it maps the hash to a folder URI.
  parser: vscode_state
