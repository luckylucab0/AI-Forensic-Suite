    Newer convention than .windsurfrules and frequently missed. ~/.codeium/windsurf/skills/ and <repo>/.windsurf/skills/ independently confirmed by a community host inspection (both present but empty) and a cross-agent skills registry.

    Confirmed by the vendor verification pass against the storage-location tables on the workflows and skills pages. One thing those pages add that matters more than the paths: the product also discovers skills in the cross-vendor .agents/skills directories and, when reading another vendor's configuration is switched on, in that vendor's skills directories as well. So an instruction that steered a session here can physically live in a directory nobody would attribute to this agent.
