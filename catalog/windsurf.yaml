    The single most widely corroborated Windsurf path — attested verbatim in dozens of vendor-neutral MCP server READMEs, an MCP security scanner, an enterprise MCP config sweep, and a DFIR catalogue. Also reachable by deep link windsurf://windsurf-mcp-registry?serverName=<name>, which makes silent server registration a real attack path.

    Record structure: { "mcpServers": { "<name>": { "command", "args", "env", "serverUrl" } } }. Per-server `env` blocks carry plaintext API keys and bearer tokens — hash those values, keep the rest. An empty install reads exactly {"mcpServers":{}}.
