    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.10.31. This entry carried only the paths spelled with the old product name, so on a current installation it collected nothing at all, which is the failure this catalogue is built to avoid because the collection reports success. The spellings under the current name are in the entry now, with the full backup copy beside each database, and so is the file that maps the opaque directory name back to the folder that was open.

