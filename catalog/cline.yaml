  legacy: true
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/apps/vscode/src/core/storage/disk.ts
  source_kind: source_code
  volatility: Deleted when the user deletes a task or clears history from the Cline UI. No automatic
    age-based expiry found.
  notes: |-
    All four names verified verbatim from GlobalFileNames in disk.ts: apiConversationHistory="api_conversation_history.json", contextHistory="context_history.json", uiMessages="ui_messages.json", taskMetadata="task_metadata.json". The task dir is built by ensureTaskDirectoryExists(taskId) -> getGlobalStorageDir("tasks", taskId). Corroborated by apps/vscode/src/core/controller/file/openDiskConversationHistory.ts, which joins HostProvider.get().globalStorageFsPath + "tasks" + taskId + "api_conversation_history.json". NOTE: in Cline 4.x this is treated as the LEGACY store - apps/vscode/src/sdk/legacy-state-reader.ts reads it for migration - so on a 4.x endpoint expect it alongside the ~/.cline tree.

    Record structure: api_conversation_history.json is an Anthropic MessageParam array (role + content blocks: text / tool_use / tool_result) per docs/enterprise-solutions/monitoring/prompt-storage.mdx. ui_messages.json is Cline's own say/ask event stream; token accounting lives in say/api_req_started events. task_metadata.json carries files_in_context.
