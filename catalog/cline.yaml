  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/apps/vscode/src/core/storage/disk.ts
  source_kind: source_code
  volatility: Lives in the repo - shares the repo's fate and is usually committed, so also recoverable
    from git history.
  notes: |-
    Both forms exist and both are verified from GlobalFileNames verbatim: clineRules=".clinerules" (single file) and workflows=".clinerules/workflows", hooksDir=".clinerules/hooks", clineruleSkillsDir=".clinerules/skills" (directory form). docs/customization/cline-rules.mdx shows the directory form with per-concern .md files. docs/customization/skills.mdx lists the skill search order '.cline/skills/ (recommended), .clinerules/skills/, .claude/skills/'. NOTABLE CROSS-CONTAMINATION: Cline deliberately also ingests other agents' rule files - cursorRulesDir=".cursor/rules", cursorRulesFile=".cursorrules", windsurfRules=".windsurfrules", agentsRulesFile="AGENTS.md". So the presence of .cursorrules is NOT by itself evidence that Cursor was used. .clinerules/hooks is the highest-risk sub-artifact: it holds user-authored scripts Cline executes (CHANGELOG 3.56.0: 'Hook scripts now run from the workspace repository root instead of filesystem root').
