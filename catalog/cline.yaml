  - ~/.cline/data/settings/cline_mcp_settings.json
  - ~/Documents/Cline/MCP/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
  source_kind: source_code
  notes: |-
    Two live locations. disk.ts: GlobalFileNames.mcpSettings = "cline_mcp_settings.json" and getMcpSettingsFilePath() resolves it inside ensureSettingsDirectoryExists() = getGlobalStorageDir("settings"); ensureMcpServersDirectoryExists() points at "Cline/MCP" under Documents (installed MCP server code). paths.ts: CLINE_MCP_SETTINGS_FILE_NAME = "cline_mcp_settings.json", resolveMcpSettingsPath() = join(resolveClineDataDir(), "settings", <that>). The brief's path is correct but incomplete - the ~/.cline copy must be collected too. Treat as normal sensitivity but expect embedded env vars / bearer tokens for remote MCP servers; flag for review.

    Re-sourced by the verification pass, same cause as the global rules entry.
  parser: json_generic
- id: cline.rules_project
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.agents/skills/
