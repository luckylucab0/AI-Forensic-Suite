  - <vscode-user>/globalStorage/saoudrizwan.claude-dev/cache/remote_config_<orgId>.json
  - <vscode-user>/globalStorage/saoudrizwan.claude-dev/settings/cline_recommended_models.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/apps/vscode/src/core/storage/disk.ts
  source_kind: source_code
  unsourced_paths:
  - <vscode-user>/globalStorage/saoudrizwan.claude-dev/settings/cline_recommended_models.json
  volatility: Cache is regenerable.
  notes: |-
    ensureCacheDirectoryExists() = getGlobalStorageDir("cache"). GlobalFileNames.clineRecommendedModels = "cline_recommended_models.json" and remoteConfig = (orgId) => `remote_config_${orgId}.json`. The remote_config_<orgId>.json filename LEAKS THE ENTERPRISE ORG ID - useful for attribution, and a reason to sanitise before publishing sample data.

    Path correction from the source verification pass: remote config is built as path.join(await ensureCacheDirectoryExists(), remoteConfig(organizationId)), and that helper returns the cache directory, so the file sits under cache/ and not under settings/ as this entry previously claimed. The recommended-models file is declared only as a filename constant with no directory join anywhere, so its placement under settings/ is unsourced.
  parser: json_generic
