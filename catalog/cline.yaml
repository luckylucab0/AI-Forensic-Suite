- id: cline.agent_schedules
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.cline/schedules/
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
  source_kind: source_code
  volatility: |-
    A schedule the agent created for itself, so it persists until something removes it. Removing the schedule removes the only record of why a run happened, while the run's own transcript stays in the session store, which is the pairing to look for.
  notes: |-
    Found by the source verification pass while re-sourcing the rules and MCP entries, and missing from this catalogue until then. The resolver's own comment calls these agent-created schedules and user-level routines, which is the forensically interesting part: this is the agent arranging to run itself later, with no user present at the time of the run. Read it together with the cron database and the cron specification directories, and treat a run in the session store with no matching interactive prompt as expected rather than anomalous when a schedule exists.
  parser: json_generic
