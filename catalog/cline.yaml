- id: cline.sqlite_dbs
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cline/data/db/connectors.db
  - ~/.cline/data/db/cron.db
  - ~/.cline/data/db/tasks.db
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
  source_kind: source_code
  volatility: SQLite - collect any -wal/-shm siblings in the same pass or lose the most recent writes.
  notes: |-
    resolveDbDataDir() = join(resolveClineDataDir(), "db"); resolveTasksDbPath/resolveConnectorsDbPath/resolveCronDbPath resolve tasks.db, connectors.db, cron.db inside it. tasks.db is the session/task index that the VS Code history view and `cline` CLI read; cron.db holds scheduled/recurring agent runs (a persistence-mechanism artifact in its own right). Overridable via $CLINE_DB_DATA_DIR.

    One gap the verification pass surfaced here: the resolver file describes two of these databases as living alongside a sessions.db, twice, and contains no resolver for that file. So a fourth database is referenced by the vendor's own code and its location is stated nowhere. Glob the database directory rather than the three filenames, and expect a file this catalogue does not name.
  parser: sqlite_generic
