    resolveConnectorDataDir() = join(dataDir,"connectors"); resolveConnectorSettingsPath() = join(that,"settings.json"); resolveConnectorLogPath(channel, instanceKey) = join(dataDir, "logs", "connectors", safeChannel, `${safeKey}.log`); ensureHookLogDir() = join(dataDir, "logs"). Hook logs are the record of what user-authored hook scripts did - a high-value execution-evidence artifact.
