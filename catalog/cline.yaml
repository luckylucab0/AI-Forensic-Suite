  - <vscode-user>/globalStorage/saoudrizwan.claude-dev/tasks/<taskId>/task_metadata.json
  - <vscode-user>/globalStorage/saoudrizwan.claude-dev/tasks/<taskId>/ui_messages.json
  format: json
  sensitivity: normal
