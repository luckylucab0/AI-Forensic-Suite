# Cline artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: cline
title: Cline
vendor: Cline
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/cline/
- https://raw.githubusercontent.com/cline/
- https://cline.bot/
- https://docs.cline.bot/
references:
- https://raw.githubusercontent.com/cline/cline/main/apps/vscode/package.json
- https://raw.githubusercontent.com/cline/cline/main/apps/vscode/src/core/storage/disk.ts
- https://raw.githubusercontent.com/cline/cline/main/apps/vscode/src/shared/storage/storage-context.ts
- https://raw.githubusercontent.com/cline/cline/main/docs/enterprise-solutions/monitoring/prompt-storage.mdx
env_overrides:
# Every one of these is read by the path resolver in the vendor's own shared storage
# module. They were found by the source verification pass, which noticed that a file
# cited for four artifacts also resolved thirteen relocations that nothing in this
# catalogue mentioned.
- name: CLINE_DIR
  effect: |-
    Relocates the agent's entire home directory, which the resolver otherwise builds as .cline under the home directory. Everything else on this list hangs off it, so a collection keyed on ~/.cline finds nothing on such a host and cannot tell that apart from the agent never having run. The directory can also be set programmatically by the embedding application, in which case no environment variable records it.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_DATA_DIR
  effect: |-
    Relocates the data directory, which holds the session transcripts, the task store, the databases, the secrets file and the settings. Set independently of the home directory, so a host can have the configuration tree in the default place and the evidence somewhere else entirely.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_SESSION_DATA_DIR
  effect: |-
    Relocates the session store on its own. This is the conversation record, so it is the single most consequential variable on this list for an investigation.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_TEAM_DATA_DIR
  effect: |-
    Relocates the shared team configuration tree.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_CONNECTOR_DATA_DIR
  effect: |-
    Relocates the connector tree, which holds the connector settings and the per-channel logs of what the agent sent outward.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_CONNECTOR_SETTINGS_PATH
  effect: |-
    Moves the connector settings file on its own, independently of the connector tree.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_DB_DATA_DIR
  effect: |-
    Relocates the database directory that holds the task, cron and connector databases.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_TASKS_DB_PATH
  effect: |-
    Moves the task database, one of the two transcript stores, on its own.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_CRON_DB_PATH
  effect: |-
    Moves the cron database on its own. That database is the record of scheduled autonomous runs, so losing it loses the explanation for a session nobody started by hand.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_CONNECTORS_DB_PATH
  effect: |-
    Moves the connector database on its own.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_HOOKS_LOG_PATH
  effect: |-
    Moves the hook audit log, the one artifact that dates a prompt, to any path at all rather than to a directory under the data root. A collection that searches only the data directory finds nothing on such a host, and the absence looks exactly like an agent that ran without hooks. Read by the audit writer, by the session manifest store and by the team child session manager, all three of which fall back to the data directory's logs folder when it is unset.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/core/src/hooks/hook-file-hooks.ts
- name: CLINE_GLOBAL_SETTINGS_PATH
  effect: |-
    Moves the global settings file, which is where an approval or a permission relaxation would be recorded.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_MCP_SETTINGS_PATH
  effect: |-
    Moves the MCP server inventory, which is the list of external tools the agent could reach and often carries their credentials inline.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
- name: CLINE_PROVIDER_SETTINGS_PATH
  effect: |-
    Moves the provider settings file, which records which model endpoint the agent was talking to.
  source: |-
    https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
