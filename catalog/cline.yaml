- id: cline.checkpoint_refs_in_workspace
  category: file_snapshot
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.git/logs/refs/cline/checkpoints/
  - <project>/.git/packed-refs
  - <project>/.git/refs/cline/checkpoints/<session-id>/<runCount>
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/core/src/hooks/checkpoint-hooks.ts
  source_kind: source_code
  unsourced_paths:
  - <project>/.git/logs/refs/cline/checkpoints/
  - <project>/.git/packed-refs
  volatility: |-
    Deleted by deleteCheckpointRefs() when the session/task is deleted. Stash objects become unreachable and GC-able once the ref is gone - but may survive in .git/objects until `git gc`.
  notes: |-
    CLINE 4.x MECHANISM CHANGE - this is the single biggest correction to the brief's checkpoint model. There is no longer a shadow repo in globalStorage. Cline runs `git stash create` in the USER'S OWN workspace and then `git update-ref refs/cline/checkpoints/<sessionId>/<runCount> <sha>` in that same repo. The source comment states the intent: 'Store the stash commit under a private ref namespace so it is invisible to the user's normal git stash list workflow. refs/stash is what populates that list; writing to any other ref path keeps the object reachable (GC-safe) without surfacing it to the user.' Consequences for us: (a) per-tool-use workspace snapshots live inside the evidence repo itself, so a repo-only acquisition already contains them; (b) `git stash list` will NOT show them - you must enumerate refs/cline/**; (c) untracked-at-snapshot files are captured as a THIRD PARENT of the stash commit (createUntrackedParentCommit / createWorktreeStashCommit), so a naive two-parent stash read misses them; (d) checkpoints only exist if the workspace is a git repo - SdkController.ts surfaces 'Checkpoints require the workspace to be a git repository.'

    The verification pass confirmed the private ref namespace the extension writes and found nothing in the cited source about the repository layout the refs land in: packed-refs and the reflog are properties of the version control system, so those two paths are marked unsourced here.
  parser: null
- id: cline.checkpoint_scratch
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cline/data/checkpoint-scratch/<key>/index
  - ~/.cline/data/checkpoint-scratch/<key>/pathspec
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/core/src/hooks/checkpoint-hooks.ts
  source_kind: source_code
  volatility: |-
    SCRATCH_DIR_MAX_AGE_MS = 14 * 24 * 60 * 60 * 1000 - directories idle for 14 days are reaped opportunistically by pruneStaleScratchDirs(); also removed by deleteCheckpointRefs(). COLLECT EARLY.
  notes: |-
    HIGH-VALUE, SHORT-LIVED. checkpointScratchDir(cwd, sessionId) = join(resolveClineDataDir(), "checkpoint-scratch", sha256(`${cwd}\0${sessionId}`).hex.slice(0,32)). The source comment says it deliberately avoids the OS tmpdir because 'the index and pathspec files enumerate workspace paths' - i.e. these two files are a FILE LISTING of the victim workspace, including untracked files, at checkpoint time, and the index carries git's stat cache (size + mtime + mode per path). Directory mtime is refreshed every turn, so mtime is a per-session last-activity timestamp. The 32-hex key is sha256(cwd + NUL + sessionId) so it can be recomputed to attribute a scratch dir to a known workspace + session id.

    Record structure: `index` is a standard git index file (GIT_INDEX_FILE); parse with any git index reader. `pathspec` is a plain path list.
  parser: null
- id: cline.checkpoints_shadow_git_legacy
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - <vscode-user>/globalStorage/saoudrizwan.claude-dev/checkpoints/<cwdHash>/.git/
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/v3.20.0/src/integrations/checkpoints/CheckpointUtils.ts
  source_kind: source_code
  volatility: |-
    Survives task deletion in some versions (see issue #9631 checkpoint-corruption reports); orphaned <cwdHash> dirs persist after the workspace is deleted.
  notes: |-
    CLINE 3.x MECHANISM. CheckpointUtils.ts getShadowGitPath() documents the layout verbatim as 'globalStorage/ checkpoints/ {cwdHash}/ .git/'. hashWorkingDir() is NOT a cryptographic hash: it iterates the cwd characters multiplying by 31 and accumulating char codes, then renders a 13-character numeric string - which means an analyst can BRUTE-FORCE / precompute the hash for candidate workspace paths to attribute a checkpoint dir to a project. Exclusions are written by writeExcludesFile() from src/integrations/checkpoints/CheckpointExclusions.ts into the shadow repo's info/exclude. Related known bug: the feature has renamed real .git dirs to .git_disabled in monorepos (issue #9590), and the 4.x CHANGELOG has an entry 'Retry nested git restore and prevent silent .git_disabled leftovers in checkpoints' - so look for stray .git_disabled directories in the workspace as checkpoint-activity evidence.

    Record structure: A bare git repo: every checkpoint is a commit whose tree is the full workspace state at that tool call. `git log` / `git cat-file` recovers per-tool-use file snapshots with timestamps.
  parser: null
