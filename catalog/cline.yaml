- id: cline.hooks_audit_log
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cline/data/logs/hooks.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/core/src/hooks/hook-file-hooks.ts
  source_kind: source_code
  volatility: No rotation or pruning of this file appears in the sources read. It is opened
    with appendFileSync on every event, so it grows across sessions and holds runs whose
    session directory may be long gone.
  notes: |-
    The vendor calls this observability telemetry and says replay does not need it, which undersells what is in it for an investigation. createHookAuditHooks() appends one JSON object per line for agent_start, agent_resume, prompt_submit, tool_call, tool_result, agent_end, agent_abort and agent_error, and the session store appends session_shutdown the same way. Each line carries an ISO timestamp, the tool name and its input, the tool result with its duration and success flag, the text of the prompt somebody submitted, the task id, the root session id, the agent and parent agent ids for a subagent, the workspace roots, the user id and the client version.

    It matters most for the times. In the canonical messages file a timestamp is present on assistant turn messages only, so a prompt there cannot be placed on a clock. Every line here is dated, which makes this the one artifact that dates what a person asked.

    The path is resolved by ensureHookLogDir() = join(resolveClineDataDir(), "logs") in sdk/packages/shared/src/storage/paths.ts, so it moves with CLINE_DIR and CLINE_DATA_DIR, and CLINE_HOOKS_LOG_PATH moves this file on its own to any path at all. One file per data directory rather than one per session: it is appended to by the CLI, the desktop sidecar and the team child session manager alike.
  parser: cline_cli
