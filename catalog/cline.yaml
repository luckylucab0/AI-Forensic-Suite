  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
  source_kind: source_code
  volatility: |-
    The resolver's comment says this lives under the data directory rather than the operating system temporary directory precisely so that temp reapers never delete it, which means work here survives a reboot and is not cleaned up on its own.
  notes: |-
    Found by the source verification pass, and missing from this catalogue until then. Every session the user started without a working directory writes its files here instead of into a project. That makes this the place to look for agent-written files that belong to no repository and would therefore appear in no git history, which is the hardest class of agent output to account for otherwise.
