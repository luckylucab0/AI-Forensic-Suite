- id: cline.cli_sessions
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cline/data/sessions/<session-id>/<session-id>.hooks.jsonl
  - ~/.cline/data/sessions/<session-id>/<session-id>.json
  - ~/.cline/data/sessions/<session-id>/<session-id>.messages.json
  - ~/.cline/data/sessions/<session-id>/subagents/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/cline/cline/main/sdk/packages/shared/src/storage/paths.ts
  source_kind: source_code
  unsourced_paths:
  - ~/.cline/data/sessions/<session-id>/<session-id>.hooks.jsonl
  - ~/.cline/data/sessions/<session-id>/<session-id>.json
  - ~/.cline/data/sessions/<session-id>/<session-id>.messages.json
  - ~/.cline/data/sessions/<session-id>/subagents/
  volatility: No automatic pruning found in the sources read.
  notes: |-
    resolveSessionDataDir() = join(resolveClineDataDir(), "sessions"). File naming verified three ways: sdk/packages/core/docs/messages-contract-v1.md states the canonical path '~/.cline/data/sessions/<sessionId>/<sessionId>.messages.json'; sdk/packages/core/src/runtime/host/local-runtime-host.ts builds join(sessionDir, `${sessionId}.messages.json`) and join(sessionDir, `${sessionId}.json`); apps/examples/desktop-app/README.md names `<sessionId>.hooks.jsonl` as observability telemetry. Child/teammate sessions use a compound id of the form <rootSessionId>__teamtask__<agent>__<hash> (see sdk/packages/core/src/runtime/host/history.test.ts), which is how sub-agent transcripts are correlated to their parent.

    The hooks file named here is the one path on this entry that a writer contradicts. The README of the vendor's own desktop example lists <sessionId>.hooks.jsonl among the session artifacts, and the only writers of a hooks log in the SDK append to one shared file under the data directory's logs folder, which is catalogued separately as cline.hooks_audit_log. Both are collected and neither is dropped: a file the documentation names is worth looking for even when the code reads otherwise, and concluding there was no hook trace because one of the two places is empty is the mistake this entry exists to prevent.

    The verification pass confirmed the sessions directory and none of the file layout inside it: the resolver states the directory, and the three filenames and the subagents directory appear nowhere on that page. This is a transcript artifact, so treat a session directory that contains none of these filenames as a layout this catalogue has wrong rather than as an empty session, and collect the directory whole.
  parser: cline_cli
