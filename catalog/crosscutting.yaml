- id: crosscutting.shell_bash_history
  category: shell_history
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - $HISTFILE
  - ~/.bash_history
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://git.savannah.gnu.org/git/bash.git
  source_kind: source_code
  volatility: |-
    HISTFILESIZE truncates the file by removing the OLDEST entries whenever it is assigned. Default HISTSIZE is 500 after startup files are read. By default bash writes only at shell exit, so a killed terminal or a crashed box can lose the entire session.
  notes: |-
    HISTFILE default IS documented for bash, unlike zsh: "The name of the file in which command history is saved... The default value is ~/.bash_history. If unset, the command history is not saved when a shell exits." HISTCONTROL suppressions to account for: ignorespace ("lines which begin with a space character are not saved"), ignoredups, erasedups ("causes all previous lines matching the current line to be removed from the history list before that line is saved") - erasedups actively destroys earlier evidence of repeated agent invocations.
