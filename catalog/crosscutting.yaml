# Cross-cutting evidence artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: crosscutting
title: Cross-cutting evidence
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/npm/
- https://raw.githubusercontent.com/npm/
- https://github.com/Homebrew/
- https://raw.githubusercontent.com/Homebrew/
- https://github.com/pypa/
- https://raw.githubusercontent.com/pypa/
- https://github.com/astral-sh/
- https://raw.githubusercontent.com/astral-sh/
- https://github.com/ollama/
- https://raw.githubusercontent.com/ollama/
- https://github.com/agentsmd/
- https://raw.githubusercontent.com/agentsmd/
- https://github.com/google-gemini/
- https://raw.githubusercontent.com/google-gemini/
- https://github.com/fish-shell/
- https://raw.githubusercontent.com/fish-shell/
- https://github.com/zsh-users/
- https://raw.githubusercontent.com/zsh-users/
- https://github.com/MicrosoftDocs/
- https://raw.githubusercontent.com/MicrosoftDocs/
- https://github.com/github/
- https://raw.githubusercontent.com/github/
- https://github.com/cline/
- https://raw.githubusercontent.com/cline/
- https://github.com/JetBrains/
- https://raw.githubusercontent.com/JetBrains/
- https://code.claude.com/
- https://www.gnu.org/
- https://git.savannah.gnu.org/
- https://learn.microsoft.com/
- https://docs.npmjs.com/
- https://docs.brew.sh/
- https://agents.md/
description: |-
  Evidence that belongs to no single agent: shell history showing how an agent was invoked and with which flags, package manager traces proving it was installed, and the instruction-file conventions that several agents read, which are the surface through which injected instructions reach an agent.
references:
- https://code.claude.com/docs/en/setup
- https://github.com/Adyen/adyen-web/blob/main/.windsurf/rules/code-guide.md
- https://github.com/cline/cline/blob/main/.clinerules/hooks/README.md
- https://github.com/cline/cline/blob/main/docs/customization/cline-rules.mdx
artifacts:
- id: crosscutting.npm_global_install_dirs
  category: install_evidence
  root: system
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\npm\'
  - '%APPDATA%\npm\node_modules\'
  - /opt/homebrew/lib/node_modules/
  - /usr/local/bin/
  - /usr/local/lib/node_modules/
  - ~/.nvm/versions/node/*/lib/node_modules/
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/npm/cli/latest/docs/lib/content/configuring-npm/folders.md
  source_kind: official
  unsourced_paths:
  - /opt/homebrew/lib/node_modules/
  - ~/.nvm/versions/node/*/lib/node_modules/
  volatility: |-
    Overwritten in place on upgrade, so the installed version reflects only the CURRENT state; use ~/.npm/_logs for the install history.
  notes: |-
    The prefix is NOT fixed - it follows the node install, so nvm/fnm/volta/asdf and Homebrew node all relocate it. Resolve it from `npm prefix -g` on a live box, or on an image enumerate candidate node installs. Agent packages to look for: @anthropic-ai/claude-code (plus its per-platform optional deps such as @anthropic-ai/claude-code-darwin-arm64), @openai/codex, @google/gemini-cli, @github/copilot.

    The verification pass confirmed the prefix-relative locations and the two documented default prefixes, and found the package manager and version manager paths absent from the page. They are the same prefix-relative layout under a prefix a third party chose, which is exactly the kind of path worth collecting and not worth calling vendor-stated.
  parser: null
- id: crosscutting.npm_debug_logs
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%LOCALAPPDATA%\npm-cache\_logs\*-debug-*.log'
  - ~/.npm/_logs/*-debug-*.log
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/npm/cli/latest/docs/lib/content/using-npm/logging.md
  source_kind: official
  unsourced_paths:
  - '%LOCALAPPDATA%\npm-cache\_logs\*-debug-*.log'
  - ~/.npm/_logs/*-debug-*.log
  volatility: |-
    PRUNED AGGRESSIVELY - COLLECT FIRST. Verbatim: "Log files will be removed from the logs-dir when the number of log files exceeds logs-max, with the oldest logs being deleted first." logs-max defaults to 10 (visible as `logs-max:10` in npm's own log-file test snapshot), so roughly the last ten npm invocations survive. On a busy dev box that can be hours.
  notes: |-
    HIGH-VALUE and HIGHLY PERISHABLE. Directory is `_logs` inside the npm cache (verbatim: "The default location of the logs directory is a directory named _logs inside the npm cache"), and the cache is "~/.npm on Posix, or %LocalAppData%/npm-cache on Windows". Relocatable via the logs-dir config; --logs-max=0 turns logging off.

    The verification pass found the cited page states only that logs go in a directory named with an underscore prefix inside the cache, with neither the cache path nor the filename pattern. Both spellings of the glob are marked unsourced; the directory itself is what the page supports.
  parser: null
- id: crosscutting.homebrew_prefixes
  category: install_evidence
  root: system
  os:
  - macos
  - linux
  paths:
  - /home/linuxbrew/.linuxbrew/
  - /home/linuxbrew/.linuxbrew/Cellar/
  - /opt/homebrew/
  - /opt/homebrew/Caskroom/
  - /opt/homebrew/Cellar/
  - /opt/homebrew/bin/
  - /usr/local/
  - /usr/local/Cellar/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/Homebrew/brew/main/docs/Installation.md
  source_kind: official
  unsourced_paths:
  - /home/linuxbrew/.linuxbrew/Cellar/
  - /opt/homebrew/Caskroom/
  - /opt/homebrew/Cellar/
  - /opt/homebrew/bin/
  - /usr/local/Cellar/
  volatility: |-
    Verbatim from the docs: "Homebrew keeps old versions on disk after upgrades. Run `brew cleanup` periodically to reclaim disk space." That is good for us - the Cellar often holds a VERSION HISTORY of an agent, not just the current build.
  notes: |-
    CHECK BOTH PREFIXES ON APPLE SILICON. Homebrew's own Common-Issues.md notes that "Migration Assistant or an x86_64 terminal on Apple Silicon can leave both /usr/local and /opt/homebrew installations active" - so two independent sets of agent installs can coexist on one Mac, at different versions. Custom prefixes are supported (Support-Tiers.md), so do not treat the three defaults as exhaustive; prefer resolving `brew --prefix`. Relevant casks: claude-code, claude-code@latest, chatgpt, chatgpt-classic, ollama-app, lm-studio.

    The verification pass confirmed the three prefixes and found that the cited page names neither the formula nor the cask directory under them, and shows the binary directory only as a template inside one example.
  parser: null
- id: crosscutting.pipx_home_and_bin
  category: install_evidence
  root: system
  os:
  - linux
  - macos
  - windows
  paths:
  - '%LOCALAPPDATA%\pipx\pipx\venvs\*\'
  - /opt/pipx/
  - ~/.local/bin/
  - ~/.local/pipx/
  - ~/.local/share/pipx/venvs/*/
  - ~/Library/Application Support/pipx/venvs/*/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/pypa/pipx/main/docs/reference/environment-variables.rst
  source_kind: official
  notes: |-
    VERSION-DEPENDENT PATHS - a real dating signal. Verbatim: "After version 1.16.0, pipx moved its default paths from ~/.local/pipx to per-platform user directories from the platformdirs library." So finding ~/.local/pipx means an older pipx (or an old install never migrated), and the collector must check both. Relevant for Python-based agents installed this way (aider-chat, various MCP servers).

    Record structure: Verbatim PIPX_HOME: "Root directory for pipx virtual environments. Default: platformdirs.user_data_path(\"pipx\") - Linux ~/.local/share/pipx, macOS ~/Library/Application Support/pipx, Windows %LOCALAPPDATA%\\pipx\\pipx." PIPX_BIN_DIR: "Directory for application entry-point symlinks. Default: ~/.local/bin." PIPX_MAN_DIR: "~/.local/share/man". PIPX_SHARED_LIBS: "$PIPX_HOME/shared". PIPX_GLOBAL_HOME: "/opt/pipx". Each venv directory is named for the package; read venvs/<pkg>/pipx_metadata.json for the pinned version, the injected packages and the exposed entry points.
  parser: null
- id: crosscutting.uv_tool_dir
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/uv/tools/*/
  - '%APPDATA%\uv\data\tools\*\'
  - '%LOCALAPPDATA%\uv\cache\'
  - ~/.cache/uv/
  - ~/.local/bin/
  - ~/.local/share/uv/python/
  - ~/.local/share/uv/tools/*/
  format: toml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/astral-sh/uv/main/docs/reference/storage.md
  source_kind: official
  volatility: The cache is prunable (`uv cache clean`); tool installs persist.
  notes: |-
    uv is now the common installer for Python MCP servers and agents, so this dir often reveals tooling that never appears in pip or pipx. Note uv and pipx SHARE ~/.local/bin - a shim there tells you a tool exists but not which installer put it; resolve the symlink target to attribute it.

    Record structure: Documented: tools default to a `tools/` subdirectory of the persistent data directory - Unix $XDG_DATA_HOME/uv or $HOME/.local/share/uv, Windows %APPDATA%\uv\data - i.e. ~/.local/share/uv/tools and %APPDATA%\uv\data\tools; override UV_TOOL_DIR. Python installs go to python/ (UV_PYTHON_INSTALL_DIR). Cache: Unix $XDG_CACHE_HOME/uv or $HOME/.cache/uv, Windows %LOCALAPPDATA%\uv\cache. Executables land in $XDG_BIN_HOME, else $XDG_DATA_HOME/../bin, else $HOME/.local/bin (Windows %USERPROFILE%\.local\bin); overrides UV_PYTHON_BIN_DIR, UV_TOOL_BIN_DIR, UV_INSTALL_DIR. Each tools/<name>/ venv has a uv-receipt.toml naming the requested spec.
  parser: null
- id: crosscutting.windows_appdata_program_dirs
  category: install_evidence
  root: user_profile
  os:
  - windows
  paths:
  - '%APPDATA%\'
  - '%LOCALAPPDATA%\Ollama\'
  - '%LOCALAPPDATA%\Packages\'
  - '%LOCALAPPDATA%\Programs\'
  - '%LOCALAPPDATA%\Programs\Ollama\'
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://learn.microsoft.com/en-us/windows/win32/shell/knownfolderid
  source_kind: official
  unsourced_paths:
  - '%LOCALAPPDATA%\Ollama\'
  - '%LOCALAPPDATA%\Packages\'
  - '%LOCALAPPDATA%\Programs\Ollama\'
  notes: |-
    The %LOCALAPPDATA%\Programs pattern is why AI tooling so often installs without admin rights and without appearing in Add/Remove Programs - enumerate it directly rather than trusting the uninstall registry. %TEMP%\ollama* is a reminder to sweep %TEMP% for agent-extracted runners generally.

    Re-sourced by the verification pass, which flagged a generic platform layout resting on one application's troubleshooting guide. The platform vendor's known folder reference gives the roaming folder as %USERPROFILE%\AppData\Roaming and the local folder as %USERPROFILE%\AppData\Local, which is what these two roots are. The packaged-application container under the local folder is not on that page, and neither are the two directories of the one application the previous source covered, so those three stay marked unsourced. The Programs directory under the local folder is the one that matters for this entry and is a known folder in its own right.
  parser: null
- id: crosscutting.windows_execution_evidence_files
  category: install_evidence
  root: system
  os:
  - windows
  paths:
  - '%SystemRoot%\AppCompat\Programs\Amcache.hve'
  - '%SystemRoot%\AppCompat\Programs\Amcache.hve.LOG1'
  - '%SystemRoot%\AppCompat\Programs\Amcache.hve.LOG2'
  - '%SystemRoot%\Prefetch\*.pf'
  - '%SystemRoot%\System32\Tasks\'
  - '%SystemRoot%\System32\sru\SRUDB.dat'
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/ForensicArtifacts/artifacts/main/artifacts/data/windows.yaml
  source_kind: community
  volatility: |-
    Prefetch is capped at 1024 entries on modern Windows and can be disabled entirely on SSD-era builds, so an absent .pf file is never evidence that a binary did not run. SRUDB.dat is written from memory periodically, so the most recent network usage may not be on disk yet.
  notes: |-
    Not agent artifacts, and not parsed here. They are the operating system's own record that a binary executed, which is what answers the question an agent's own files cannot: whether the agent ran at all on a host where its data directory has been deleted.

    Scope is deliberately pointers only. This tool records presence, paths, hashes and timestamps and hands the files to the examiner's existing tooling, because parsers for these formats exist and are better than anything this project would write: AmcacheParser, PECmd, AppCompatCacheParser, SrumECmd.

    What each one proves about an agent. Amcache carries the binary's SHA-1 and publisher metadata, so it identifies what ran even after the file was renamed or deleted. Prefetch gives first run, last run, a run count and the files touched in the first ten seconds of execution. SRUDB.dat holds per-application network byte counts, which is the single best way to show how much data an agent sent. The Tasks directory holds the XML of scheduled tasks, which is where a persistent agent invocation would be defined.

    Separated from the registry keys that used to sit in the same entry, because one artifact cannot be both a file and a registry key: the collector resolved neither and the whole entry was silently absent from every Windows bundle.
  parser: null
- id: crosscutting.windows_execution_evidence_registry
  category: install_evidence
  root: registry
  os:
  - windows
  paths:
  - HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run
  - HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce
  - HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks
  - HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\AppCompatCache
  - HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\AppCompatibility
  - HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\bam\State\UserSettings\*
  - HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\bam\UserSettings\*
  - HKEY_USERS\<sid>\Software\Microsoft\Windows\CurrentVersion\Explorer\UserAssist\*\Count
  - HKEY_USERS\<sid>\Software\Microsoft\Windows\CurrentVersion\Run
  - HKEY_USERS\<sid>\Software\Microsoft\Windows\CurrentVersion\RunOnce
  format: registry
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/ForensicArtifacts/artifacts/main/artifacts/data/windows.yaml
  source_kind: community
  volatility: |-
    ShimCache is written to the registry mainly at shutdown, so a hive read from a live host can lag behind by the whole current uptime. BAM entries are per-SID and are removed with the profile.
  notes: |-
    Registry keys, so only the PowerShell collector can read them, and only on the host itself rather than from a mounted image.

    ShimCache proves a path was observed by the system and preserves the modification time as it was before any later timestomping. BAM gives a per-SID last-run FILETIME.

    UserAssist is listed with a warning attached: it records GUI launches with a run count and a last-run time, ROT13-encoded, and it does not record command-line launches. Command line is exactly how every agent in this catalogue is started, so an empty UserAssist means nothing here and must not be reported as absence of use.

    Two of these came from Eric Zimmerman's RECmd batch files rather than from the ForensicArtifacts set, namely UserAssist and the scheduled-task TaskCache keys. Treat them as community sourced.
  parser: null
- id: crosscutting.hook_scripts
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.clinerules/hooks/
  - ~/Documents/Cline/Hooks/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://github.com/cline/cline/blob/main/.clinerules/hooks/README.md
  source_kind: official
  volatility: |-
    Executable bits and mtimes matter as much as the content - record mode, owner and timestamps, not just the script text.
  notes: |-
    THE SHARPEST INJECTION SURFACE IN THIS WHOLE FAMILY, and the one most likely to be missed. A hook is arbitrary code that the agent runs automatically on tool use or prompt submission, and a workspace hook arrives with the repository - so cloning a hostile repo plus enabling hooks is remote code execution by design. Collect the script bodies verbatim (they are evidence, not secrets), plus mode/owner/mtime, and diff workspace hooks against the repo's git history to spot ones that were never committed. Cline's own docs even ship a PreToolUse guard example (docs/customization/clineignore.mdx) showing the copy-and-chmod workflow, which is what to grep shell history for.
  parser: null
- id: crosscutting.mcp_config_files
  category: mcp_config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.mcp.json
  - ~/.claude.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://code.claude.com/docs/en/setup
  source_kind: official
  volatility: |-
    Edited by hand and by `claude mcp add`-style commands; no history is kept, so only the file mtime dates a change. Collect early - these are small and cheap.
  notes: |-
    Claude Code's own paths are vendor-confirmed: the uninstall docs instruct `rm ~/.claude.json` and project-level `rm -f .mcp.json`. The remaining locations are corroborated consistently across many independent third-party integration docs (Cursor global ~/.cursor/mcp.json and project .cursor/mcp.json; Claude Desktop claude_desktop_config.json at ~/Library/Application Support/Claude on macOS, %APPDATA%\Claude on Windows, ~/.config/Claude on Linux; Gemini CLI ~/.gemini/settings.json, confirmed in the CLI's own README "Configure MCP servers in ~/.gemini/settings.json"; Copilot CLI $HOME/.copilot/mcp-config.json, confirmed in the fetched GitHub docs) - hence verified overall, though individual spellings are community-corroborated rather than each vendor-documented. TREAT AS A TOP-PRIORITY ARTIFACT: an MCP config is the clearest on-disk statement of what external capability an agent was granted, and inline env secrets mean the collector should record metadata plus hash for any value that looks like a credential while still copying the structure.

    Narrowed to what its source states. The verification pass found this entry claiming thirteen paths across six vendors on one vendor's documentation page, which states two of them. Every other path now sits with the vendor that owns it: the editor, the two closed-source editors, the command line agent of one vendor, and the desktop application, which has its own file in this catalogue since the research pass that added it. Two spellings were dropped rather than moved, because reading the real pages showed they do not exist: a user-level project server file directly under the profile, where the vendor's Windows example is actually its user configuration file, and a user-level editor server file directly under a dot-directory in the home directory, where the vendor puts it in the editor's user profile folder instead.

    What is left is the genuinely cross-cutting part: the convention that a project carries a server inventory at its root, which more than one agent reads, and the user-level file of the agent whose page this is. Read it together with the per-vendor entries rather than instead of them.
  parser: null
- id: crosscutting.instructions_agents_md
  category: project_instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/**/AGENTS.md
  - <project>/AGENTS.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/agentsmd/agents.md/main/components/HowToUseSection.tsx
  source_kind: source_code
  volatility: |-
    Version-controlled in the repo, so git history gives you authorship and timing for free - `git log -p --follow AGENTS.md` is the single highest-value command for an injection question. Also check for uncommitted local modifications.
  notes: |-
    CONFIRMED AS THE EMERGING CROSS-VENDOR STANDARD, described by its own project as "A simple, open format for guiding coding agents" providing "a dedicated, predictable place to provide context and instructions to help AI coding agents work on your project". Independent corroboration of multi-vendor adoption: GitHub's official docs list `AGENTS.md` as a first-class instruction source for both Copilot coding agent and Copilot CLI ("In Git root and cwd") and describe it as "Cross-tool / agent-agnostic" and "Always-on rules shared across AI agents"; Cursor and Cline read it too. Canonical repo is agentsmd/agents.md (the agents.md site itself is egress-blocked here). PRIMARY INJECTION SURFACE: a repo-supplied AGENTS.md is untrusted input that every major agent loads automatically without the user seeing it.

    Record structure: NESTED AND HIERARCHICAL - do not stop at the repo root. Verbatim from the agents.md site source: "Large monorepo? Use nested AGENTS.md files for subprojects... Place another AGENTS.md inside each package. Agents automatically read the nearest file in the directory tree, so the closest one takes precedence and every subproject can ship tailored instructions. For example, at time of writing the main OpenAI repo has 88 AGENTS.md files." So collect every AGENTS.md in the tree with its depth, and reconstruct precedence nearest-first.
  parser: null
- id: crosscutting.instructions_claude_md
  category: project_instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - /Library/Application Support/ClaudeCode/CLAUDE.md
  - /etc/claude-code/CLAUDE.md
  - <project>/**/CLAUDE.local.md
  - <project>/**/CLAUDE.md
  - <project>/.claude/CLAUDE.md
  - <project>/.claude/rules/**/*.md
  - <project>/CLAUDE.local.md
  - <project>/CLAUDE.md
  - C:\Program Files\ClaudeCode\CLAUDE.md
  - ~/.claude/CLAUDE.md
  - ~/.claude/rules/**/*.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://code.claude.com/docs/en/memory
  source_kind: official
  volatility: |-
    Git-tracked in the project case; ~/.claude/CLAUDE.md is user-global and untracked, so it has no history and only its mtime.
  notes: |-
    CROSS-VENDOR READ - worth stressing. GitHub's own Copilot CLI reference table lists `CLAUDE.md` as an instruction source it loads "In Git root and cwd", and adds "Copilot CLI also uses .claude/CLAUDE.md"; Copilot's cloud agent lists `/CLAUDE.md` among its supported custom-instruction files; Cline reads .claude/skills/. So a CLAUDE.md is NOT evidence that Claude Code specifically was used - several agents consume it. Anthropic's own uninstall docs confirm the surrounding config: `rm -rf ~/.claude`, `rm ~/.claude.json`, project `rm -rf .claude` and `rm -f .mcp.json`, and note that "The VS Code extension, the JetBrains plugin, and the Desktop app also write to ~/.claude/".

    Record structure: Two tiers: user-global ~/.claude/CLAUDE.md and per-project CLAUDE.md discovered up and down the tree, plus the .claude/CLAUDE.md spelling. Collect all of them with paths, and treat the union as the effective prompt.
  parser: null
- id: crosscutting.instructions_clinerules
  category: project_instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.claude/skills/
  - <project>/.cline/remote-config/
  - <project>/.cline/skills/
  - <project>/.clineignore
  - <project>/.clinerules
  - <project>/.clinerules/
  - <project>/.clinerules/*.md
  - <project>/.clinerules/skills/
  - <project>/.clinerules/workflows/
  - ~/Documents/Cline/Rules/
  - ~/Documents/Cline/Workflows/
  format: markdown
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: verified
  source: https://github.com/cline/cline/blob/main/docs/customization/cline-rules.mdx
  source_kind: official
  unsourced_paths:
  - <project>/.claude/skills/
  - <project>/.cline/remote-config/
  - <project>/.cline/skills/
  - <project>/.clineignore
  - <project>/.clinerules/skills/
  - <project>/.clinerules/workflows/
  - ~/Documents/Cline/Workflows/
  volatility: |-
    When Cline converts a legacy single-file .clinerules into a directory it renames the original to `.clinerules.bak` as a backup - look for that file, it preserves the pre-migration instruction text.
  notes: |-
    Confirmed via GitHub code search content matches across cline/cline docs and source. THE REMOTE-CONFIG PATH IS THE STANDOUT FINDING: instructions, skills and workflows can be pushed to the workstation from a remote config server and land on disk under .cline/remote-config/ - that is a centrally-administered injection channel with no repo history to audit, and aafs should collect it and flag its provenance explicitly.

    The verification pass confirmed the rule file and rule directory on the cited pages and none of the seven paths above, which cover skills, workflows, remote configuration and the ignore file. The agent's own catalogue file carries sourced entries for several of them.
  parser: null
- id: crosscutting.instructions_copilot_instructions
  category: project_instructions
