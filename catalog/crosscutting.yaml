- id: crosscutting.shell_bash_history
  category: shell_history
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - $HISTFILE
  - ~/.bash_history
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/pexip/os-bash/c36eb24bedb80d6783fe1b1f7470acb97eb603a8/doc/bash.1
  source_kind: source_code
  volatility: |-
    HISTFILESIZE truncates the file by removing the OLDEST entries whenever it is assigned. Default HISTSIZE is 500 after startup files are read. By default bash writes only at shell exit, so a killed terminal or a crashed box can lose the entire session.
  notes: |-
    HISTFILE default IS documented for bash, unlike zsh: "The name of the file in which command history is saved... The default value is ~/.bash_history. If unset, the command history is not saved when a shell exits." HISTCONTROL suppressions to account for: ignorespace ("lines which begin with a space character are not saved"), ignoredups, erasedups ("causes all previous lines matching the current line to be removed from the history list before that line is saved") - erasedups actively destroys earlier evidence of repeated agent invocations.

    Record structure: TIMELINEABLE ONLY IF HISTTIMEFORMAT WAS SET AT THE TIME. Verbatim: "If this variable is set, time stamps are written to the history file so they may be preserved across shell sessions. This uses the history comment character to distinguish timestamps from other history lines." In practice that is a line `#<unix_epoch>` immediately preceding its command. Parse a `#`-prefixed all-digits line as the timestamp for the following command, and tolerate files that mix timestamped and untimestamped regions (the user turned it on partway through).
  parser: null
- id: crosscutting.shell_fish_history
  category: shell_history
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - $XDG_DATA_HOME/fish/${fish_history}_history
  - $XDG_DATA_HOME/fish/fish_history
  - ~/.local/share/fish/fish_history
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/fish-shell/fish-shell/master/src/history/yaml_backend.rs
  source_kind: source_code
  volatility: Rewritten wholesale on save, so the previous generation is a good carving target.
  notes: |-
    The `paths` list is a gift no other shell gives: it ties an agent invocation to the specific files in play. Session/file name is controlled by the `fish_history` variable - docs: "The default value (when the variable is unset) is `fish` which corresponds to $XDG_DATA_HOME/fish/fish_history"; setting it to e.g. `fun` yields fun_history, and setting it to the empty string disables history entirely. Glob *_history in that directory rather than assuming one filename.

    Record structure: BEST-IN-CLASS FOR TIMELINING - timestamps are unconditional, no opt-in needed. Verbatim source comment: "Our history format is nearly-valid YAML (but isn't quite). Here it is:\n\n  - cmd: ssh blah blah blah\n    when: 2348237\n    added_when: 2348238\n    paths:\n      - /path/to/something\n      - /path/to/something_else\n\nNewlines are replaced by \\n. Backslashes are replaced by \\\\." So: `when` = unix epoch seconds of last add, `added_when` = epoch of first add, and `paths` records file paths referenced by the command. DO NOT USE A STRICT YAML PARSER - the format is deliberately "nearly-valid"; write a line-oriented parser and unescape \\n and \\\\ yourself.
  parser: null
- id: crosscutting.shell_psreadline_history
  category: shell_history
  root: user_profile
  os:
  - windows
  - macos
  - linux
  paths:
  - $XDG_DATA_HOME/powershell/PSReadLine/*_history.txt
  - '%APPDATA%\Microsoft\Windows\PowerShell\PSReadLine\*_history.txt'
  - '%APPDATA%\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
  - ~/.local/share/powershell/PSReadLine/ConsoleHost_history.txt
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/MicrosoftDocs/PowerShell-Docs/main/reference/7.7/PSReadLine/Set-PSReadLineOption.md
  source_kind: official
  volatility: |-
    Default HistorySaveStyle is SaveIncrementally - "Save history after each command is executed and share across multiple instances of PowerShell" - which is good news: a crashed or killed console still leaves a record. SaveNothing disables the file. MaximumHistoryCount caps it and no default is documented.
  notes: |-
    KEY ADDITION the brief missed: the filename is per-HOST, not fixed. Verbatim: "The filename is stored in a variable `$($Host.Name)_history.txt`, for example `ConsoleHost_history.txt`." So the VS Code integrated terminal, the ISE and other embedders each write their OWN history file in the same directory. Glob *_history.txt - an agent driven from inside VS Code will be invisible if you only read ConsoleHost_history.txt. Documented defaults: Windows "$Env:APPDATA\Microsoft\Windows\PowerShell\PSReadLine\$($Host.Name)_history.txt"; non-Windows "$Env:XDG_DATA_HOME/powershell/PSReadLine/$($Host.Name)_history.txt" or "$HOME/.local/share/powershell/PSReadLine/$($Host.Name)_history.txt".

    Record structure: NO TIMESTAMPS AT ALL. Plain UTF-8 text, one command per line, multi-line commands continued with a trailing backtick. This file CANNOT be timelined internally - you get ordering plus the file's own MACB times only. To date a PowerShell agent invocation you must corroborate with Prefetch/Amcache/UserAssist or the agent's own logs.
  parser: null
- id: crosscutting.shell_zsh_history
  category: shell_history
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - $HISTFILE
  - ~/.zhistory
  - ~/.zsh_history
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zsh-users/zsh/master/Doc/Zsh/options.yo
  source_kind: source_code
  volatility: |-
    SAVEHIST caps the file and oldest entries are dropped. HIST_EXPIRE_DUPS_FIRST and HIST_IGNORE_SPACE cause silent omissions - a leading space means the command was never recorded, which is NOT evidence of absence of the command.
  notes: |-
    IMPORTANT CORRECTION to the brief's framing: zsh itself has NO default HISTFILE. The manual says only "The file to save the history in when an interactive shell exits. If unset, the history is not saved" and gives no default. ~/.zsh_history is a convention supplied by the OS/distro rc files (macOS /etc/zshrc, oh-my-zsh, etc.), so the collector must read HISTFILE from the user's dotfiles and follow it rather than hardcoding the name. Likewise the history file is only written when SAVEHIST is non-zero. For aafs this file is the primary proof that a CLI agent was invoked at all (`claude`, `codex`, `gemini`, `ollama run`, `lms`, `aider`, `npx ...`).

    Record structure: TIMELINEABLE ONLY IF EXTENDED_HISTORY IS SET. Verbatim from the zsh manual: EXTENDED_HISTORY "Save each command's beginning timestamp (in seconds since the epoch) and the duration (in seconds) to the history file", in the format `: <beginning time>:<elapsed seconds>;<command>`. Without it, lines are bare commands with no timestamps. Also verbatim: INC_APPEND_HISTORY appends "as soon as they are entered" (so a killed shell still leaves a record); APPEND_HISTORY only writes at shell exit; SHARE_HISTORY both imports and appends, interleaving commands from concurrent shells into one file so ORDER DOES NOT IMPLY ONE SESSION; HIST_IGNORE_SPACE removes lines whose first character is a space.
  parser: null
- id: crosscutting.npm_npx_cache
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%LOCALAPPDATA%\npm-cache\_npx\*\package.json'
  - ~/.npm/_npx/*/node_modules/
  - ~/.npm/_npx/*/package.json
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/npm/cli/blob/latest/workspaces/config/lib/definitions/definitions.js
  source_kind: source_code
  volatility: |-
    Persists until `npm cache clean` or manual removal; survives package upgrades. Directory mtime dates the npx run.
  notes: |-
    MAJOR ADDITION beyond the brief's one-line mention. This is the cleanest proof available that a one-shot agent or MCP server was executed without ever being installed globally - exactly how most MCP servers are launched (`npx -y some-mcp-server`). Sibling cache dirs at the same level: _cacache (the content-addressable package cache, which contains the actual downloaded tarballs and registry metadata) and _tuf.

    Record structure: EXCELLENT ARTIFACT, EASY TO PARSE. npxCache = join(cache, '_npx') (definitions.js flatten: flatOptions.npxCache = join(obj.cache, '_npx')). Each entry is _npx/<hash>/ containing a package.json that libnpmexec writes with a custom key: pkgJson.update({ _npx: { packages } }). So `jq ._npx.packages` on every _npx/*/package.json gives you the exact list of package@version specs the user ran via npx, per cache entry. npm's own `npm cache ls` prints these as "valid npx cache entry with key <hash> / packages: ...". Binaries are linked at _npx/<hash>/node_modules/.bin.
  parser: null
