# Goose artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: goose
title: Goose
vendor: Block
description: |-
  The Goose command line agent and the Goose desktop app, which share one configuration
  tree and one session store. Three things make this family awkward and all three cost
  evidence if they are not known. The product keeps its data in three directories rather
  than one, splitting configuration, data and state the way the freedesktop specification
  does, so the conversations and the logs are not siblings. macOS has two trees rather than
  one: the vendor's environment guide gives the application support directory as the macOS
  root, while the code at the library version the lockfile pins resolves macOS to the same
  freedesktop directories as Linux, so an upgraded machine can hold both and a recent
  install holds only the second. And one environment variable relocates all of it at once.
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/block/
- https://raw.githubusercontent.com/block/
- https://block.github.io/
references:
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/config-files.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/recipes/session-recipes.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/context-engineering/index.md
- https://raw.githubusercontent.com/block/goose/main/crates/goose/src/config/paths.rs
env_overrides:
- name: GOOSE_PATH_ROOT
  effect: |-
    Moves the whole tree. config/paths.rs reads this variable first and, when it holds an absolute path, builds every directory under it as <root>/config, <root>/data, <root>/state and <root>/.agents, ignoring the platform defaults entirely. A relative value is discarded and the defaults apply, which the module has a test for. Every path in this file is then wrong by exactly one prefix, and a collection keyed on the defaults reports an agent that never ran.
  source: https://raw.githubusercontent.com/block/goose/main/crates/goose/src/config/paths.rs
- name: GOOSE_MOIM_MESSAGE_FILE
  effect: |-
    Names a file whose contents are injected into the model's working memory on every turn, anywhere on disk. It is standing instructions to the agent at a path nothing else in this catalogue records, so it is collected only if somebody reads the variable off the environment first. The vendor's own example of what belongs in it is a set of security guardrails, which makes its absence or its alteration the difference between an agent that was told not to send code off the machine and one that was not.
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- name: GOOSE_MOIM_MESSAGE_TEXT
  effect: |-
    The same injection carried as literal text rather than as a file, concatenated with the file when both are set. There is then no file to collect at all: what the agent was told every turn exists only in the environment of the process, so look for it in shell profiles, service definitions and pipeline configuration rather than on the filesystem.
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- name: CONTEXT_FILE_NAMES
  effect: |-
    Replaces the filenames that count as hint files. The default is the two this catalogue records and the variable takes a JSON array of any names at all, including another product's rule file. A collection that searches for the documented two then finds nothing while the agent was reading standing instructions out of a third filename on every turn.
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- name: GOOSE_RECIPE_PATH
  effect: |-
    Additional directories recipes are read from, separated by colons on Unix and by semicolons on Windows. No default recipe directory is documented at all, so this variable is frequently the only record of where the reusable agent runs on a host actually live.
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- name: GOOSE_RECIPE_GITHUB_REPO
  effect: |-
    A repository recipes are searched in, given as an owner and a name. A recipe that ran from there was never on the endpoint as a file, so the instruction the agent followed is in no filesystem collection and the session record is the only local trace of it.
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- name: GOOSE_DISABLE_KEYRING
  effect: |-
    Decides whether the provider credentials exist on disk at all. Unset, the secrets are in the operating system's keyring and there is no file; set to anything, the product writes them to secrets.yaml in plain text. So this variable is what turns the credential entry in this file from something that is never there into something that is, and its presence in a profile is itself worth reporting.
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
artifacts:
- id: goose.config
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\config\config.yaml'
  - ~/.config/goose/config.yaml
  - ~/Library/Application Support/Block/goose/config/config.yaml
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/config-files.md
  source_kind: official
  unsourced_paths:
  - ~/Library/Application Support/Block/goose/config/config.yaml
  volatility: Persistent until edited.
  notes: |-
    The 'extensions' block is the MCP inventory: which external tools the agent could reach, with full command lines. Provider API keys are documented as NOT belonging here (keyring is preferred) but operators often put them here anyway.

    Record structure: Holds provider selection, model, enabled extensions (including MCP servers and their commands/args), context strategy and memory limits. Doubles as the MCP config - there is no separate mcp.json.

    The application support spelling is this product's legacy macOS tree and is collected beside the current one rather than instead of it. The reason is in this agent's description: the vendor's environment guide gives that directory as the macOS root and states that a root holds config, data and state subdirectories, while the code at the library version the lockfile pins resolves macOS to the same freedesktop directories as Linux. The leaf under the root is this catalogue's own join of the two documented facts, which is why it is marked unsourced, and an upgraded machine is the case where searching only the current tree finds nothing that is there.
  parser: yaml_generic
- id: goose.recipes
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/*.yaml
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/recipes/session-recipes.md
  source_kind: official
  volatility: Unknown.
  notes: |-
    recollection, needs verification - no default directory is documented. Recipes define reusable parameterised agent runs and are strong evidence of intent and repetition.

    Variable location, not globbable: <directories listed in GOOSE_RECIPE_PATH>

    Record structure: The recipes doc states recipes are found in 'the current directory or GOOSE_RECIPE_PATH directories' (colon-separated on Unix, semicolon-separated on Windows) but does NOT document a default recipe directory. Resolve GOOSE_RECIPE_PATH from the user's shell profile/environment rather than guessing a path.

    A collection takes this and a reading of a directory tree cannot attribute it, which is worth knowing before an empty result is read as an absence. The pattern is any file of one extension in the working copy, which is what the product means by a recipe and is true. The collector can act on it because it knows where the working copies are, out of the agent's own state. The analyzer's matcher does not: it has no state file and matches below any directory, so acting on this pattern there would hand every file of that extension on the disk to this agent, and it refuses it instead.

        The consequence is narrow and worth stating plainly. In a bundle the file arrives with this entry's name on it, because the collector wrote the attribution into the manifest. In a directory tree or a mounted image read without one, the file is collected and reported as claimed by nothing, which is a lead somebody follows rather than an answer.

    Two ways to find one after all, both added by the pass that read the vendor's own guides. The configuration file lists slash commands as a command name and the path to the recipe it runs, so config.yaml, which this catalogue already collects, names recipe files by absolute path and is the cheapest place to start. And GOOSE_RECIPE_GITHUB_REPO points recipe lookup at a remote repository, in which case the recipe that ran was never a file on this machine at all.
  parser: yaml_generic
