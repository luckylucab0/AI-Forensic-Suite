- id: goose.llm_request_logs
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\logs\llm_request.*.jsonl'
  - ~/.local/state/goose/logs/llm_request.*.jsonl
  - ~/Library/Application Support/Block/goose/data/logs/llm_request.*.jsonl
  - ~/Library/Application Support/Block/goose/state/logs/llm_request.*.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  record_types:
  - 'one request and response per file: model configuration, input payload, response data, token usage'
  unsourced_paths:
  - ~/Library/Application Support/Block/goose/data/logs/llm_request.*.jsonl
  - ~/Library/Application Support/Block/goose/state/logs/llm_request.*.jsonl
  volatility: |-
    A numbered rotation of ten. The vendor states the files keep the ten most recent completed requests, llm_request.0.jsonl through llm_request.9.jsonl, so the eleventh request back is overwritten rather than aged out. On a machine that has kept working after the incident these hold minutes rather than days.
  notes: |-
    The one place on the endpoint where the prompt as the model received it exists. A session record holds the conversation as the product keeps it; this holds the raw payload that was sent, which is what an instruction injected from a file, a rule or a tool result actually turned into. The vendor's own description is 'the raw request and response data sent to language model providers', with the model configuration, the input payload, the response and the token usage in each file.

    It sits directly under the logs directory rather than in the cli/ or server/ subdirectory, which is why the two entries for those do not reach it: their patterns end at the subdirectory. Collect it first, because ten files is a very short window.

    Caution on reading it: this is what left the device. An analyst asking which data was sent to a provider can answer that question from these files and from nothing else in this family.

    The application support spelling is this product's legacy macOS tree and is collected beside the current one rather than instead of it. The reason is in this agent's description: the vendor's environment guide gives that directory as the macOS root and states that a root holds config, data and state subdirectories, while the code at the library version the lockfile pins resolves macOS to the same freedesktop directories as Linux. The leaf under the root is this catalogue's own join of the two documented facts, which is why it is marked unsourced, and an upgraded machine is the case where searching only the current tree finds nothing that is there.

