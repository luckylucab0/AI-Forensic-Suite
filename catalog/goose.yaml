  - ~/Library/Application Support/Block/goose/config/agents/
  volatility: Not swept. A project copy is usually committed, so git history carries its authorship and timing.
  notes: |-
    A custom agent is a markdown file with YAML frontmatter that the user delegates work to by name, so it is a named set of standing instructions plus whatever capability the frontmatter grants. The vendor names two current directories and then four compatibility ones, two of which are another product's, and the code confirms the shared pair: config/paths.rs builds the home directory joined with .agents and then agents or plugins.

    Worth an explicit note for an investigation. The agent file is where an instruction the user never typed becomes the thing the agent was told to do, and delegation is how it reaches a session without appearing in the prompt history at all: the transcript shows a delegation by name and the words behind that name are only in this file.

    ~/.agents is nobody's private directory. Several agents in this catalogue read it, so attributing a file there to one product by its path alone is wrong, and the same file may have steered more than one of them.
  parser: instructions
- id: goose.plugins
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.agents\plugins\'
  - <project>/.agents/plugins/
  - ~/.agents/plugins/
  format: text
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/context-engineering/hooks.md
  source_kind: official
  volatility: |-
    Not swept. A plugin installed with auto-update is replaced from its git source before its skills are loaded, so the copy on disk can be newer than the one that ran and the older content exists only in that remote repository.
  notes: |-
    Executable content, and the highest-value entry of this group for that reason. A plugin directory may carry hooks/hooks.json, which registers commands the product runs on tool events, with a matcher regular expression deciding which tool calls they fire on. A hook can block a tool call outright, which means this is both a persistence mechanism and a control the agent's own record will not explain: the session shows a tool call that did not happen and the reason is in a JSON file somewhere else.

    Where to look next once one is found. Whether it actually ran is in the settings file, which is a separate entry: a plugin named in disabledPlugins is skipped during discovery. Whether it came from outside the machine is in the plugin's own install metadata, written by the install command when the plugin was cloned from a git repository, which is also what the update command reads. A plugin copied in by hand has no such metadata and is discovered anyway.

    The directory is shared with other products in this catalogue, so a plugin found there is not by itself evidence that this agent ran.

    Not read as records. The tree holds JSON, markdown and shell scripts together, so it is collected whole and read as text, and the hook configuration inside it has no parser of its own yet.
  parser: instructions
- id: goose.sessions_db
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - ~/.local/share/goose/sessions/sessions.db
  - ~/.local/share/goose/sessions/sessions.db-shm
  - ~/.local/share/goose/sessions/sessions.db-wal
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-shm
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-wal
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
  source_kind: official
  unsourced_paths:
  - ~/.local/share/goose/sessions/sessions.db-shm
  - ~/.local/share/goose/sessions/sessions.db-wal
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-shm
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-wal
  volatility: |-
    No automatic expiry documented. Deleting a session in Goose Desktop also removes it from the CLI and the docs state the action cannot be undone - i.e. a SQL delete, so carving the SQLite freelist and the -wal file may still recover it.
  notes: |-
    macOS is ambiguous in the vendor's own documentation and must be checked in BOTH places: the sessions doc gives ~/.local/share/goose/... for 'macOS and Linux', while the environment-variables doc gives ~/Library/Application Support/Block/goose/ as the macOS root. Collect both trees.

    What the code says, which neither doc does. crates/goose/src/config/paths.rs calls etcetera's choose_app_strategy with top_level_domain 'Block', author 'Block' and app_name 'goose', and takes config_dir, data_dir and state_dir from it, with state falling back to data. At the version the lockfile pins, 0.11.0, choose_app_strategy is the Windows strategy on Windows and the XDG strategy on every other platform including macOS: the library has a separate choose_native_strategy for the Apple layout and this is not it. So current code puts macOS on the same ~/.config/goose, ~/.local/share/goose and ~/.local/state/goose as Linux, and the Windows tree is %APPDATA%\Block\goose\ with a config, data or cache segment appended, which is where that shape comes from.

    That leaves the application-support tree as a legacy one rather than a current one, which is why both are still worth collecting: goose's own source keeps the author string 'Block' with the comment that changing it would orphan existing user directories, naming ~/Library/Application Support/Block/goose/ as the example, so a machine that has been upgraded can hold both.

    Re-sourced by the verification pass, which found the base path on the cited page only inside command examples. The environment variable guide states the path root and its per-platform defaults. Note the contradiction the pass surfaced: that guide puts the macOS tree under the application support directory while the logs guide maps macOS to the same .local/share path as Linux, so search both. The two sidecars follow from the journal mode and are marked unsourced.
  parser: sqlite_generic
