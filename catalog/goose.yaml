  - ~/Library/Application Support/Block/goose/config/settings.json
  volatility: Persistent until edited. Not swept and not rotated.
  notes: |-
    The settings file, which this catalogue did not have at all until the pass that added the plugin and hook entries beside it. It is where plugins are switched off: disabledPlugins names the ones the product skips during discovery, so a plugin directory that is on disk and named here did not run, and one that is on disk and not named here did. That distinction is the whole question once a hook is found on a machine, and neither the plugin tree nor the session record answers it.

    Three scopes, and the third is the one to look at. The vendor documents a user file, a project file that a team shares through the repository, and settings.local.json for project settings that are deliberately not shared with teammates. The last one is therefore normally untracked, which means it has no history behind it and a change to it is visible only as an mtime.

    Note the directory. The project settings are under <project>/.config/goose/, not under the <project>/.goose/ that carries this product's other project state, so a collection that walks the product's own project directory does not reach them.

    The Windows and macOS spellings are this catalogue's join of the documented user file onto the documented configuration directory for those platforms, so they are marked unsourced.
