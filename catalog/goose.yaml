    A skill is a directory holding a SKILL.md with YAML frontmatter, and it enters the model's context when the agent decides it is relevant. That makes it an instruction surface that needs no user action at all, which is the property that matters here: nobody typed it and nobody approved it for that session.

    The vendor documents three current locations, a global one, a project one and the ones plugins bring, and then a backward compatibility list of three more. Two of those three belong to other products, which has the consequence this catalogue keeps meeting: a skill file under another vendor's directory is not evidence that the other product ran, and a finding about this agent may have its cause in a directory nobody would think to attribute to it.

