  notes: |-
    Project-scoped standing instructions to the agent. Because they are usually committed, git history gives an authenticated timeline of who changed the agent's marching orders and when.

    Re-sourced by the verification pass: the page cited before lists the two filenames as the default of a context-file setting, with no directory and no statement that they are project-level. The hints guide states the project root and the per-level lookup.

    Three things this entry did not have. There is a global hints file, at .goosehints in the configuration directory, which applies to every session in every directory and is untracked by any repository, so it is the copy nobody reviews. Hints are hierarchical: the product loads the configured filenames from the working directory up to the repository root, and then loads more from nested subdirectories as it reads files under them, which is how a standing instruction reaches a session from a directory a reviewer of the project root never opens. And the two filenames are not fixed. CONTEXT_FILE_NAMES, declared with this agent's other variables at the top of this file, replaces them with any JSON array of names, so a collection that searches for these two can find nothing on a host where the agent was reading its instructions out of a third.

    The Windows and macOS spellings of the global file are this catalogue's join of the documented filename onto the documented configuration directory and are marked unsourced.
