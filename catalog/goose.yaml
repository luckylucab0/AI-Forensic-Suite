# Goose artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: goose
title: Goose
vendor: Block
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/block/
- https://raw.githubusercontent.com/block/
- https://block.github.io/
references:
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/config-files.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
- https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/recipes/session-recipes.md
artifacts:
- id: goose.config
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\config\config.yaml'
  - ~/.config/goose/config.yaml
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/config-files.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    The 'extensions' block is the MCP inventory: which external tools the agent could reach, with full command lines. Provider API keys are documented as NOT belonging here (keyring is preferred) but operators often put them here anyway.

    Record structure: Holds provider selection, model, enabled extensions (including MCP servers and their commands/args), context strategy and memory limits. Doubles as the MCP config - there is no separate mcp.json.
  parser: yaml_generic
- id: goose.recipes
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/*.yaml
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/recipes/session-recipes.md
  source_kind: official
  volatility: Unknown.
  notes: |-
    recollection, needs verification - no default directory is documented. Recipes define reusable parameterised agent runs and are strong evidence of intent and repetition.

    Variable location, not globbable: <directories listed in GOOSE_RECIPE_PATH>

    Record structure: The recipes doc states recipes are found in 'the current directory or GOOSE_RECIPE_PATH directories' (colon-separated on Unix, semicolon-separated on Windows) but does NOT document a default recipe directory. Resolve GOOSE_RECIPE_PATH from the user's shell profile/environment rather than guessing a path.

    A collection takes this and a reading of a directory tree cannot attribute it, which is worth knowing before an empty result is read as an absence. The pattern is any file of one extension in the working copy, which is what the product means by a recipe and is true. The collector can act on it because it knows where the working copies are, out of the agent's own state. The analyzer's matcher does not: it has no state file and matches below any directory, so acting on this pattern there would hand every file of that extension on the disk to this agent, and it refuses it instead.

        The consequence is narrow and worth stating plainly. In a bundle the file arrives with this entry's name on it, because the collector wrote the attribution into the manifest. In a directory tree or a mounted image read without one, the file is collected and reported as claimed by nothing, which is a lead somebody follows rather than an answer.
  parser: yaml_generic
- id: goose.secrets
  category: credentials
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\config\secrets.yaml'
  - ~/.config/goose/secrets.yaml
  format: yaml
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    Record metadata and hash only. Presence of this file (rather than keyring use) is itself notable: it means GOOSE_DISABLE_KEYRING was set, often in headless/CI or deliberately non-standard deployments.

    Record structure: Only present when file-based secret storage is in use, i.e. GOOSE_DISABLE_KEYRING is set. Otherwise secrets live in the OS keyring (macOS Keychain / Windows Credential Manager / libsecret) and are not in the filesystem at all.
  parser: null
- id: goose.prompts
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\config\prompts\'
  - ~/.config/goose/prompts/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/config-files.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    Custom prompts are where jailbreak or policy-evasion instructions are usually planted; compare mtimes against session times.

    Record structure: Custom prompt templates.
  parser: instructions
- id: goose.cli_logs
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\logs\cli\'
  - ~/.local/state/goose/logs/cli/
  - ~/.local/state/goose/logs/cli/YYYY-MM-DD/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  volatility: |-
    SELF-DELETING: organised into date-based subdirectories with automatic deletion of entries older than two weeks. Collect first.
  notes: |-
    Highest-volatility artifact in the Goose family. If the endpoint has been powered on for more than two weeks after the incident these are already gone.

    Record structure: Date-stamped subdirectories (e.g. cli/2025-11-13/). Note logs live under the XDG STATE dir (~/.local/state/goose) while sessions live under the DATA dir (~/.local/share/goose) - two different trees.
  parser: text_log
- id: goose.desktop_log
  category: log
  root: user_profile
  os:
  - macos
  - windows
  paths:
  - '%APPDATA%\Block\goose\logs\main.log'
  - ~/Library/Application Support/Goose/logs/main.log
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  volatility: Electron main-process log; rotation behaviour not documented.
  notes: |-
    Establishes Desktop app launch/quit times, which bracket session activity independently of the session store.

    Record structure: Note the macOS Desktop log uses ~/Library/Application Support/Goose/ (capital G, no 'Block' segment) - a third macOS directory distinct from both ~/.config/goose and ~/Library/Application Support/Block/goose.
  parser: text_log
- id: goose.server_logs
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\logs\server\'
  - ~/.local/state/goose/logs/server/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  volatility: 'SELF-DELETING: same two-week automatic cleanup as the CLI logs.'
  notes: |-
    The JSON-RPC capture is the best available record of actual MCP tool invocations and their arguments - often the only place the agent's side effects are logged verbatim. Two-week window: collect first.

    Record structure: Captures goosed daemon activity, JSON-RPC traffic and extension (MCP) initialisation.
  parser: text_log
- id: goose.llm_request_logs
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\logs\llm_request.*.jsonl'
  - ~/.local/state/goose/logs/llm_request.*.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  record_types:
  - 'one request and response per file: model configuration, input payload, response data, token usage'
  volatility: |-
    A numbered rotation of ten. The vendor states the files keep the ten most recent completed requests, llm_request.0.jsonl through llm_request.9.jsonl, so the eleventh request back is overwritten rather than aged out. On a machine that has kept working after the incident these hold minutes rather than days.
  notes: |-
    The one place on the endpoint where the prompt as the model received it exists. A session record holds the conversation as the product keeps it; this holds the raw payload that was sent, which is what an instruction injected from a file, a rule or a tool result actually turned into. The vendor's own description is 'the raw request and response data sent to language model providers', with the model configuration, the input payload, the response and the token usage in each file.

    It sits directly under the logs directory rather than in the cli/ or server/ subdirectory, which is why the two entries for those do not reach it: their patterns end at the subdirectory. Collect it first, because ten files is a very short window.

    Caution on reading it: this is what left the device. An analyst asking which data was sent to a provider can answer that question from these files and from nothing else in this family.
  parser: jsonl_generic
- id: goose.command_history
  category: prompt_history
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\history.txt'
  - ~/.config/goose/history.txt
  - ~/.local/state/goose/history.txt
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  record_types:
  - one typed line per entry
  volatility: |-
    Persistent across sessions by design, and no expiry is documented. Deleting a session does not touch it.
  notes: |-
    What the user typed, kept across sessions so the product can recall previous commands. The vendor's logs guide states the purpose in as many words and gives two of the three paths.

    Forensically this is the prompt history of this agent and it survives the deletion of the session it belongs to, which makes it the one place a question the user asked stays after they have removed the conversation.

    Three paths because the product reads two and writes one. crates/goose-cli/src/session/mod.rs sets history_file to Paths::state_dir().join('history.txt') and old_history_file to Paths::config_dir().join('history.txt'), then loads whichever of the two exists and always saves to the first. So the current Unix-like location is ~/.local/state/goose/history.txt and ~/.config/goose/history.txt is the older one, which the documentation still gives and which is still read where it exists. On Windows the state directory does not exist in the library this product builds its paths with, so state falls back to data and the one Windows path is the documented one.

    Written by rustyline, which is in the lockfile and whose API this file calls: add_history_entry while typing and save_history on exit. That library writes either plain lines or its escaped v2 format with a #V2 first line, and the reader here takes whichever the file is in.
  parser: prompt_history
- id: goose.memory
  category: memory
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.goose/memory/
  - ~/.config/goose/memory/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/mcp/memory-mcp.md
  source_kind: official
  volatility: Persists independently of sessions; not covered by session deletion.
  notes: |-
    Survives session deletion. Facts the agent chose to remember often summarise work whose transcript has since been purged - a reliable secondary source when sessions are missing.

    Record structure: Two scopes: global under the goose config dir, and local under .goose/memory/ in the working directory.
  parser: memory
- id: goose.permissions
  category: permissions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\config\permission.yaml'
  - '%APPDATA%\Block\goose\config\permissions\tool_permissions.json'
  - ~/.config/goose/permission.yaml
  - ~/.config/goose/permissions/tool_permissions.json
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/config-files.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    Directly answers 'was the agent allowed to act without a human in the loop' - the central question in most agent-misuse investigations. A tool moved from 'ask' to 'always allow' with a recent mtime is a key finding.

    Record structure: permission.yaml is YAML; permissions/tool_permissions.json is JSON. Records per-tool allow/deny/ask decisions.
  parser: yaml_generic
- id: goose.hints
  category: project_instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.goosehints
  - <project>/AGENTS.md
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/context-engineering/using-goosehints.md
  source_kind: official
  volatility: Lives in the repo; recoverable from git history even when the working copy is clean.
  notes: |-
    Project-scoped standing instructions to the agent. Because they are usually committed, git history gives an authenticated timeline of who changed the agent's marching orders and when.

    Re-sourced by the verification pass: the page cited before lists the two filenames as the default of a context-file setting, with no directory and no statement that they are project-level. The hints guide states the project root and the per-level lookup.
  parser: instructions
- id: goose.sessions_db
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - ~/.local/share/goose/sessions/sessions.db
  - ~/.local/share/goose/sessions/sessions.db-shm
  - ~/.local/share/goose/sessions/sessions.db-wal
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-shm
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-wal
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
  source_kind: official
  unsourced_paths:
  - ~/.local/share/goose/sessions/sessions.db-shm
  - ~/.local/share/goose/sessions/sessions.db-wal
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-shm
  - ~/Library/Application Support/Block/goose/data/sessions/sessions.db-wal
  volatility: |-
    No automatic expiry documented. Deleting a session in Goose Desktop also removes it from the CLI and the docs state the action cannot be undone - i.e. a SQL delete, so carving the SQLite freelist and the -wal file may still recover it.
  notes: |-
    macOS is ambiguous in the vendor's own documentation and must be checked in BOTH places: the sessions doc gives ~/.local/share/goose/... for 'macOS and Linux', while the environment-variables doc gives ~/Library/Application Support/Block/goose/ as the macOS root. Collect both trees.

    What the code says, which neither doc does. crates/goose/src/config/paths.rs calls etcetera's choose_app_strategy with top_level_domain 'Block', author 'Block' and app_name 'goose', and takes config_dir, data_dir and state_dir from it, with state falling back to data. At the version the lockfile pins, 0.11.0, choose_app_strategy is the Windows strategy on Windows and the XDG strategy on every other platform including macOS: the library has a separate choose_native_strategy for the Apple layout and this is not it. So current code puts macOS on the same ~/.config/goose, ~/.local/share/goose and ~/.local/state/goose as Linux, and the Windows tree is %APPDATA%\Block\goose\ with a config, data or cache segment appended, which is where that shape comes from.

    That leaves the application-support tree as a legacy one rather than a current one, which is why both are still worth collecting: goose's own source keeps the author string 'Block' with the comment that changing it would orphan existing user directories, naming ~/Library/Application Support/Block/goose/ as the example, so a machine that has been upgraded can hold both.

    Re-sourced by the verification pass, which found the base path on the cited page only inside command examples. The environment variable guide states the path root and its per-platform defaults. Note the contradiction the pass surfaced: that guide puts the macOS tree under the application support directory while the logs guide maps macOS to the same .local/share path as Linux, so search both. The two sidecars follow from the journal mode and are marked unsourced.
  parser: sqlite_generic
- id: goose.sessions_db_windows
  category: transcript
  root: user_profile
  os:
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\sessions\sessions.db'
  - '%APPDATA%\Block\goose\data\sessions\sessions.db-shm'
  - '%APPDATA%\Block\goose\data\sessions\sessions.db-wal'
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/environment-variables.md
  source_kind: official
  volatility: Same as the macOS/Linux database.
  notes: |-
    recollection, needs verification

    Record structure: Derived, not stated: the environment-variables doc gives the Windows root as %APPDATA%\Block\goose\ and says goose creates config/, data/ and state/ subdirectories under the root, and the logs doc confirms %APPDATA%\Block\goose\data\logs\. The sessions/sessions.db leaf is therefore inferred from the documented Linux layout. Verify on a live image before relying on it.
  parser: sqlite_generic
- id: goose.sessions_jsonl_legacy
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%APPDATA%\Block\goose\data\sessions\*.jsonl'
  - ~/.local/share/goose/sessions/*.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Block\goose\data\sessions\*.jsonl'
  volatility: |-
    Orphaned but NOT deleted. The doc states: 'Legacy .jsonl files remain on disk but are no longer managed by goose.' They therefore persist indefinitely and are never rotated, even after the SQLite import.
  notes: |-
    Forensically excellent: because goose stopped managing these files, they are a frozen snapshot of pre-1.10.0 activity that a user deleting sessions through the modern UI will NOT remove. Always collect them even when sessions.db is present.

    Re-sourced by the verification pass: the logs guide states the pre-1.10.0 per-session file layout and the directory it lived in. It carries no Windows path at all, so the Windows spelling is marked unsourced.
  parser: jsonl_generic
