  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/block/goose/main/documentation/docs/guides/logs.md
  source_kind: official
  record_types:
  - one typed line per entry
  unsourced_paths:
  - ~/Library/Application Support/Block/goose/config/history.txt
  - ~/Library/Application Support/Block/goose/data/history.txt
  - ~/Library/Application Support/Block/goose/state/history.txt
  volatility: |-
    Persistent across sessions by design, and no expiry is documented. Deleting a session does not touch it.
  notes: |-
    What the user typed, kept across sessions so the product can recall previous commands. The vendor's logs guide states the purpose in as many words and gives two of the three paths.

    Forensically this is the prompt history of this agent and it survives the deletion of the session it belongs to, which makes it the one place a question the user asked stays after they have removed the conversation.

    Three current paths because the product reads two and writes one; the three legacy macOS spellings below are a separate question. crates/goose-cli/src/session/mod.rs sets history_file to Paths::state_dir().join('history.txt') and old_history_file to Paths::config_dir().join('history.txt'), then loads whichever of the two exists and always saves to the first. So the current Unix-like location is ~/.local/state/goose/history.txt and ~/.config/goose/history.txt is the older one, which the documentation still gives and which is still read where it exists. On Windows the state directory does not exist in the library this product builds its paths with, so state falls back to data and the one Windows path is the documented one.

    Written by rustyline, which is in the lockfile and whose API this file calls: add_history_entry while typing and save_history on exit. That library writes either plain lines or its escaped v2 format with a #V2 first line, and the reader here takes whichever the file is in.

    The application support spelling is this product's legacy macOS tree and is collected beside the current one rather than instead of it. The reason is in this agent's description: the vendor's environment guide gives that directory as the macOS root and states that a root holds config, data and state subdirectories, while the code at the library version the lockfile pins resolves macOS to the same freedesktop directories as Linux. The leaf under the root is this catalogue's own join of the two documented facts, which is why it is marked unsourced, and an upgraded machine is the case where searching only the current tree finds nothing that is there.

    Two macOS legacy spellings rather than one, and the reason is worth stating. This file lives in the state directory on Linux, and neither the application support layout nor the Windows one has a state directory at all: the code falls back to the data directory where the platform has none, which is where the data segment in the Windows path comes from, while the vendor's environment guide says a root holds a state subdirectory. Nobody has said which of the two an upgraded macOS machine has, so both are searched. At most one of them will exist and an empty search is the cheaper failure. This entry gets a third spelling, under config, because it already records that the product reads an older copy out of the configuration directory and writes the current one to the state directory, so a legacy tree can hold the file under either name.
  parser: prompt_history
