    Three bytes that say the sandbox policy was migrated to a newer form, and which form. It is here because a marker is the cheapest possible statement about which policy the agent was running under, and the policy is what decides whether a command the transcript shows could actually touch the filesystem.

    Read it together with the permission and requirement files this catalogue already carries: those say what the rules are now, and this says which generation of the rules the install has been through.
