# OpenAI Codex CLI artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: codex
title: OpenAI Codex CLI
vendor: OpenAI
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/openai/
- https://raw.githubusercontent.com/openai/
- https://openai.com/
- https://developers.openai.com/
description: |-
  The Codex command line agent, and the Codex app and IDE extension that share its data
  tree. One directory holds the conversations, the prompt history, seven SQLite state
  databases and the credentials, which makes it the richest single tree of any agent here
  after Claude Code.
references:
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/config/mod.rs
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/lib.rs
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/recorder.rs
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/list.rs
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/compression.rs
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/state/src/lib.rs
- https://raw.githubusercontent.com/openai/codex/main/codex-rs/state/src/sqlite.rs
env_overrides:
- name: CODEX_HOME
  effect: |-
    Moves the whole Codex directory away from ~/.codex, taking the rollouts, the prompt history, the state databases and auth.json with it. A collection keyed on ~/.codex alone finds nothing on such a host, which is indistinguishable from Codex never having run. Resolved by find_codex_home(), which falls back to ~/.codex.
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/config/mod.rs
- name: CODEX_SQLITE_HOME
  effect: |-
    Moves only the SQLite state databases out of the Codex home, so the rollouts can be present while the thread index, the logs database and the memories are somewhere else entirely. The constant is SQLITE_HOME_ENV = "CODEX_SQLITE_HOME".
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/state/src/lib.rs
artifacts:
- id: codex.sqlite_write_ahead_logs
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\*.sqlite-shm'
  - '%USERPROFILE%\.codex\*.sqlite-wal'
  - ~/.codex/*.sqlite-shm
  - ~/.codex/*.sqlite-wal
  format: binary
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/state/src/sqlite.rs
  source_kind: source_code
  unsourced_paths:
  - '%USERPROFILE%\.codex\*.sqlite-shm'
  - '%USERPROFILE%\.codex\*.sqlite-wal'
  - ~/.codex/*.sqlite-shm
  - ~/.codex/*.sqlite-wal
  volatility: |-
    Destroyed by a clean shutdown. Every Codex database is opened with journal_mode(SqliteJournalMode::Wal), so the newest writes live in the -wal sidecar until a checkpoint folds them into the main file. Collect the sidecars together with the database or lose the most recent activity, which is usually the activity under investigation.
  notes: |-
    Not an artifact in its own right so much as the missing half of every other .sqlite entry here. A bundle holding state_5.sqlite without state_5.sqlite-wal can be internally consistent and still be missing the last session, and nothing in the database says so.

    The verification pass confirmed that the databases are opened in write-ahead logging mode and found no mention of the sidecar filenames. They follow from the journal mode rather than from anything the vendor published, so they are marked unsourced. Collect them regardless: uncommitted transcript records live in the write-ahead log and are lost if only the main database file is taken.
  parser: sqlite_generic
- id: codex.rollouts
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\sessions\'
  - ~/.codex/sessions/
  - ~/.codex/sessions/<year>/<month>/<day>/
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/recorder.rs
  source_kind: source_code
  volatility: |-
    No age-based deletion was found in the sources read, but rollouts older than seven days are rewritten in place as Zstandard archives by a background worker (MIN_ROLLOUT_AGE = 7 * 24 * 60 * 60 seconds, spawn_rollout_compression_worker). A running Codex can therefore compress a file while it is being collected, which is why this is first rather than normal.
  notes: |-
    The primary evidence for Codex: the full conversation, one JSON object per line. precompute_new_rollout_path() builds CODEX_HOME/sessions/YYYY/MM/DD/ from the session start time, so the directory tree alone dates activity even if the files cannot be read, and the year, month and day are zero-padded two-digit components.

    Record structure: the first record is a SessionMeta whose fields answer most of the who and where questions on their own: session_id, id, forked_from_id, forked_from_ordinal_exclusive, parent_thread_id, timestamp, cwd, runtime_workspace_roots, originator, cli_version, agent_nickname, agent_role, agent_path, source, thread_source, model_provider, base_instructions, dynamic_tools, selected_capability_roots, memory_mode, history_mode, history_base, subagent_history_start_ordinal, multi_agent_version, context_window. forked_from_id means a conversation can continue in a different file, so one rollout is not necessarily the whole story.

    thread_source distinguishes where the session came from. INTERACTIVE_SESSION_SOURCES lists SessionSource::Cli, SessionSource::VSCode, SessionSource::Custom("atlas") and SessionSource::Custom("chatgpt"), so this one tree holds the CLI, the IDE extension and the desktop app together.
  parser: codex
- id: codex.rollouts_compressed
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\sessions\**\rollout-*.jsonl.*.tmp'
  - '%USERPROFILE%\.codex\sessions\**\rollout-*.jsonl.zst'
  - '%USERPROFILE%\.codex\sessions\**\rollout-compress-*.tmp'
  - ~/.codex/sessions/**/rollout-*.jsonl.*.tmp
  - ~/.codex/sessions/**/rollout-*.jsonl.zst
  - ~/.codex/sessions/**/rollout-compress-*.tmp
  format: binary
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/compression.rs
  source_kind: source_code
  volatility: |-
    These ARE the older sessions. A background worker compresses any rollout at least seven days old in place, writing through a .tmp file, so the plain .jsonl form exists only for the last week of activity.
  notes: |-
    The single most likely way to miss almost everything. A collection or a viewer that globs rollout-*.jsonl finds the last seven days and silently reports nothing older, on a host where a year of conversations is sitting right next to it under a different extension. Constants: COMPRESSED_SUFFIX = ".zst", TEMP_SUFFIX = ".tmp".

    Glob correction from the source verification pass: an interrupted compression leaves either a tempfile named with the prefix rollout-compress- and the suffix .tmp, or a file named <name>.jsonl.<operation>.<pid>.<counter>.tmp. Neither ends in .jsonl.tmp, which is what this entry globbed for, so a partially compressed transcript was unreachable.
  parser: codex
- id: codex.archived_sessions
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\archived_sessions\'
  - ~/.codex/archived_sessions/
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/compression.rs
  source_kind: source_code
  volatility: |-
    Where a rollout goes when the user archives a thread rather than where it goes when it ages. Nothing in the sources read deletes this tree on a timer.
  notes: |-
    ARCHIVED_SESSIONS_SUBDIR = "archived_sessions", a sibling of sessions/ and not a subdirectory of it, so a collection rooted at sessions/ misses every archived conversation. Archiving is a user action, which makes a populated tree here more interesting than the same content under sessions/: somebody chose to take these out of the list they see.

    Re-sourced by the verification pass: the module cited before declares the two directory names as peer constants but never joins either to a root, while the compression module joins both to the same parent side by side, which is what makes this directory a sibling of the sessions directory rather than a child.
  parser: codex
- id: codex.prompt_history
  category: prompt_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\history.jsonl'
  - ~/.codex/history.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
  source_kind: source_code
  volatility: |-
    Trimmed from the front, not by age. The schema documents history.max_bytes as "If set, the maximum size of the history file in bytes. The oldest entries are dropped once the file exceeds this limit", so on a busy host the earliest prompts are already gone and the file gives no sign of how many.
  notes: |-
    What the user typed, across every project, in one file. Worth collecting even when the rollouts are present: it survives the deletion of a conversation, and it is the cheapest way to see that a session existed at all.
  parser: codex
- id: codex.state_databases
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\goals_1.sqlite'
  - '%USERPROFILE%\.codex\logs_2.sqlite'
  - '%USERPROFILE%\.codex\memories_1.sqlite'
  - '%USERPROFILE%\.codex\memories_v2_1.sqlite'
  - '%USERPROFILE%\.codex\queue_1.sqlite'
  - '%USERPROFILE%\.codex\state_5.sqlite'
  - '%USERPROFILE%\.codex\thread_history_1.sqlite'
  - ~/.codex/goals_1.sqlite
  - ~/.codex/logs_2.sqlite
  - ~/.codex/memories_1.sqlite
  - ~/.codex/memories_v2_1.sqlite
  - ~/.codex/queue_1.sqlite
  - ~/.codex/state_5.sqlite
  - ~/.codex/thread_history_1.sqlite
  format: sqlite
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/state/src/sqlite.rs
  source_kind: source_code
  volatility: |-
    Live databases in WAL mode, rewritten continuously while Codex runs. Collect them with their -wal and -shm sidecars, see codex.sqlite_write_ahead_logs.
  notes: |-
    Seven databases, each with a schema version baked into its filename, which is why the paths are listed individually and a `*.sqlite` glob is kept alongside them in codex.sqlite_glob: the next version is state_6.sqlite and this list will be wrong before the tool is.

    memories_1.sqlite and memories_v2_1.sqlite are the agent's persistent memory, which is a different question from what it was told in one session: content here influences future sessions the user may not connect to it, and it is where an injected instruction would persist. thread_history_1.sqlite indexes the rollouts, so it can name conversations whose files have been deleted.

    CODEX_SQLITE_HOME moves all seven out of the Codex home.
  parser: codex_state
- id: codex.sqlite_glob
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\*.sqlite'
  - ~/.codex/*.sqlite
  format: sqlite
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/state/src/sqlite.rs
  source_kind: source_code
  volatility: |-
    As codex.state_databases.
  notes: |-
    Deliberately redundant with codex.state_databases. Every one of those filenames carries a schema version, and the vendor bumps it: an analyst running this tool against a newer Codex than the catalogue knows about would otherwise collect nothing and see a clean directory. The named entries give attribution, this one gives coverage, and the manifest records both claims on a file.
  parser: codex_state
- id: codex.log_dir
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\log\'
  - ~/.codex/log/
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/config/mod.rs
  source_kind: source_code
  volatility: |-
    Rewritten per run. The sources read do not state a rotation policy, and the field is only populated when logging is configured, so an empty directory says nothing about whether Codex ran.
  notes: |-
    log_dir defaults to $CODEX_HOME/log. Setting it explicitly also turns on the terminal UI text log, so the presence of content here can mean the user was debugging Codex, which is context worth having.
  parser: text_log
- id: codex.config
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\*.config.toml'
  - '%USERPROFILE%\.codex\config.toml'
  - ~/.codex/*.config.toml
  - ~/.codex/config.toml
  format: toml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/config/mod.rs
  source_kind: source_code
  volatility: Persistent until edited.
  notes: |-
    CONFIG_TOML_FILE = "config.toml" in the Codex home, plus per-profile files named <profile>.config.toml (CONFIG_PROFILE_V2_SUFFIX), resolved by resolve_profile_v2_config_path(). A profile can carry its own model provider and its own instructions file, so the active profile decides which of several configurations was in force and reading only config.toml can describe a setup that was not the one used.

    Also here: model_catalog_json and model_instructions_file, both paths to files elsewhere on disk that shape the agent's behaviour, and experimental_compact_prompt_file. Follow them: they are prompt-injection surface that lives outside every directory this catalogue names.
  parser: toml_generic
- id: codex.mcp_and_notify
  category: mcp_config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\config.toml'
  - ~/.codex/config.toml
  format: toml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
  source_kind: source_code
  volatility: Persistent until edited.
  notes: |-
    Codex keeps its MCP servers inside config.toml rather than in a separate file, so the same bytes are both the configuration artifact and the MCP artifact. Listed twice on purpose: a report grouped by category would otherwise show no MCP configuration for an agent that has one.

    The notify hook also lives here and runs an external program on agent events, which makes it an execution path configured by a text file.
  parser: toml_generic
- id: codex.requirements_and_permissions
  category: permissions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\permissions.toml'
  - '%USERPROFILE%\.codex\requirements.toml'
  - ~/.codex/permissions.toml
  - ~/.codex/requirements.toml
  format: toml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/config/mod.rs
  source_kind: source_code
  unsourced_paths:
  - '%USERPROFILE%\.codex\permissions.toml'
  - '%USERPROFILE%\.codex\requirements.toml'
  - ~/.codex/permissions.toml
  - ~/.codex/requirements.toml
  volatility: Persistent until edited.
  notes: |-
    The two files that decide what the agent was allowed to do without asking. allow_managed_hooks_only is honoured only in requirements.toml and is ignored in config.toml, so a control that looks configured can have no effect: check which file a restriction is written in before reporting that it was in force.

    The verification pass found neither filename resolved to a location in the cited source. The permissions spelling occurs there only as part of a module path, which is the likely origin of the filename, and the requirements file appears in prose and error strings with no directory ever given, described as a layer an administrator sets rather than a per-user file. All four paths are marked unsourced, and the placement under the user's configuration directory is the part to distrust most.
  parser: toml_generic
- id: codex.auth
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\auth.json'
  - ~/.codex/auth.json
  format: json
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
  source_kind: source_code
  volatility: Rewritten on login and on token refresh.
  notes: |-
    The schema's AuthCredentialsStoreMode documents the file option as "Persist credentials in CODEX_HOME/auth.json". Metadata and a hash only: its existence and its timestamps date the login, which is the forensic question, and the token itself is a liability in a bundle.

    Mode "keyring" puts the same credential in the operating system keystore instead and "auto" prefers the keyring when one is available, so an absent auth.json does not mean the user was not signed in.
  parser: null
- id: codex.session_index
  title: Session index
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\session_index.jsonl'
  - '%USERPROFILE%\.codex\session_index.jsonl.tmp'
  - ~/.codex/session_index.jsonl
  - ~/.codex/session_index.jsonl.tmp
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/session_index.rs
  source_kind: source_code
  volatility: |-
    Append-only in normal use, so it grows and keeps superseded lines. It is rewritten whole in one place only, when a thread is deleted through the product, and that rewrite goes through a temporary file and a rename, which leaves the previous index in unallocated space.
  notes: |-
    An index of the conversations, one JSON object per line, with a thread id, a thread name and an update time. Small, and worth more than its size: it is the one file in this tree that says a conversation existed without holding it.

    Why it is collected first. Name updates are append-only, so a thread renamed three times has three lines and the newest wins, which means the index carries names a user replaced and the product no longer shows. And an id in the index with no rollout file beside it in sessions is a transcript that left the disk: delete_thread removes the matching lines, so a missing rollout with its index line intact is a file removed outside the product rather than a conversation deleted through it.

    The temporary file is in this entry for the same reason. The delete path writes session_index.jsonl.tmp and renames it, so a crash mid-delete leaves the pre-delete index on disk under that name.
  parser: jsonl_generic
- id: codex.external_agent_imports
  title: Imported sessions of other agents
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\external_agent_session_imports.json'
  - ~/.codex/external_agent_session_imports.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/external-agent-migration/src/sessions/ledger.rs
  source_kind: source_code
  volatility: |-
    Rewritten in place as imports happen, so it holds the current ledger and one modification time rather than a history of when each import ran. The per-record import time inside it is what dates them.
  notes: |-
    A ledger of conversations this product took from another agent, and there is nothing else like it in this catalogue. Per imported session it records the source path on disk, the SHA-256 of that file's content, the thread id it became here, when it was imported, the source file's own modification time, the connector names found in it and its title.

    What that answers. It proves another agent's transcript was read and copied into this one, names the file it came from, and hashes it, so the copy in this product can be tied to the original even after the original is deleted. An examiner who finds a conversation here that predates this product's installation should look here first.

    A second list beside the imports records sources that were detected and not imported, with the connector names seen in them, so the file also says which other agents' data the product found on the machine.
  parser: json_generic
- id: codex.shell_snapshots
  title: Captured shell environments
  category: log
  root: user_profile
  os:
  - macos
  - linux
  paths:
  - ~/.codex/shell_snapshots/
  - ~/.codex/shell_snapshots/<thread-id>.<nanos>.sh
  - ~/.codex/shell_snapshots/<thread-id>.tmp-<nanos>
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/shell_snapshot.rs
  source_kind: source_code
  volatility: |-
    Three days, and it is enforced rather than incidental: SNAPSHOT_RETENTION is 3 * 24 hours and a background cleanup deletes every snapshot older than that except the active session's. So an absent snapshot for a session from last week is the documented default and not a sign that anybody removed it.
  notes: |-
    A shell script per session, capturing the environment the agent's commands ran in. The name is the thread id, a nanosecond nonce and the shell's extension, so a snapshot ties an environment to a conversation and to a moment.

    Why this is evidence rather than housekeeping. A command in a transcript is only half the answer; what it did depends on the aliases, functions, PATH and exported variables in force, and this file is that half. It is also the only place in this tree where the agent records the machine's own shell configuration as it found it.

    Read it as potentially holding secrets even though this entry is not marked secret. The capture substitutes dummy values for credentials it brokers, and the module asserts that a brokered credential never reaches the file outside the exported environment, which says nothing about an API key the user exported themselves.

    Windows is not in the os list on purpose. write_shell_snapshot refuses PowerShell and cmd with a not-supported-yet error, so an absent snapshot directory on Windows means the feature does not run there rather than that the agent was not used.
  parser: text_log
- id: codex.installation_id
  title: Installation identifier
  category: install_evidence
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\installation_id'
  - ~/.codex/installation_id
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/src/installation_id.rs
  source_kind: source_code
  volatility: |-
    Written once and kept. resolve_installation_id creates the file if it is missing and returns what is in it otherwise, so the value survives upgrades and is only lost if the codex home is removed.
  notes: |-
    One UUID, in one file, created the first time the product needed it. Two things follow and both matter to an examiner.

    It dates first use. The file is created on the first run that resolves it and never rewritten, so its creation time is the earliest evidence in this tree of the product running on this machine, and it is a cheaper answer than reasoning about the oldest conversation.

    It correlates this machine with server-side records. The same value is sent as installation_id in the metadata of the product's requests, so it is a durable pseudonymous handle for this install rather than a local detail, and it is what ties a device to whatever the vendor holds.
  parser: text_config
- id: codex.thread_writer_locks
  title: Thread writer locks
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\thread-writer-locks\'
  - ~/.codex/thread-writer-locks/
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/rollout/src/writer_lock.rs
  source_kind: source_code
  volatility: |-
    A lock file exists while a thread is being written and is cleaned up afterwards, so what is here on a live endpoint is roughly what is being written now, and what is here on an image is what was open when the machine stopped.
  notes: |-
    One lock file per thread the product is writing, plus a coordination lock. The contents are not the point; the names are, because a lock file is named for its thread id.

    Forensically this is a small but hard statement: a lock left behind names a conversation that was being written when the process died, which is where a truncated rollout comes from. On a live endpoint it also says which conversations are open right now, which is the difference between collecting a complete transcript and collecting one mid-write.
  parser: null
- id: codex.plugin_store
  title: Installed plugins and their staging
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\plugins\'
  - ~/.codex/plugins/
  - ~/.codex/plugins/.codex-remote-plugin-install.json
  - ~/.codex/plugins/.remote-plugin-install-staging/
  - ~/.codex/plugins/cache/
  - ~/.codex/plugins/data/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core-plugins/src/store.rs
  source_kind: source_code
  volatility: |-
    Install-time state. A plugin removed through the product leaves its cache directory behind in the general case, so this tree tends to over-report rather than under-report what was installed.
  notes: |-
    Which extra capabilities the agent had, which is the same question this catalogue asks of an MCP configuration and a different answer: a plugin here brings its own hooks, skills, MCP servers and commands with it, so the inventory of installed plugins is an inventory of what the agent could do beyond its defaults.

    The cache directory holds one directory per marketplace and one per plugin under it, so the layout alone names the plugins and where they came from without anything being parsed. The install metadata file beside it records a remote install with its schema version, and the staging directory is where a remote plugin is unpacked, so a directory left there is an install that did not finish.

    The data directory is the plugins' own writable state, which means a plugin's records of what it did are here rather than in the conversation.
  parser: json_generic
- id: codex.curated_plugin_clone
  title: The curated plugin marketplace, as a git clone
  category: install_evidence
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\.tmp\marketplaces\'
  - '%USERPROFILE%\.codex\.tmp\plugins\'
  - ~/.codex/.tmp/marketplaces/
  - ~/.codex/.tmp/plugins/
  - ~/.codex/.tmp/plugins.sha
  - ~/.codex/.tmp/plugins.sync.lock
  - ~/.codex/.tmp/plugins/.git/FETCH_HEAD
  - ~/.codex/.tmp/plugins/.git/shallow
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/core-plugins/src/startup_sync.rs
  source_kind: source_code
  volatility: |-
    Refreshed on startup when it is stale, and a stale temporary directory is removed after ten minutes. The git metadata inside is what keeps the history: FETCH_HEAD is rewritten on every fetch, so it dates the last sync.
  notes: |-
    The product keeps the curated plugin catalogue as a shallow git clone on disk, fetched from a named remote at startup. That makes this an unusual artifact for this catalogue: a network destination recorded in a file rather than inferred.

    Three things come out of it. The remote is in the clone's own config, so the file says where the catalogue came from. FETCH_HEAD and the recorded commit in plugins.sha date the last successful sync, which dates a startup with network access. And the lock file beside them is what a concurrent or interrupted sync leaves behind.

    The clone is the whole catalogue rather than a selection, so its plugin directories are the vendor's list and not a statement about this user. What the user installed is in codex.plugin_store beside this.
  parser: null
- id: codex.connector_caches
  title: Cached tool and catalogue responses
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\cache\'
  - ~/.codex/cache/
  - ~/.codex/cache/bundled_plugin_exclusions/
  - ~/.codex/cache/codex_apps_server_info/
  - ~/.codex/cache/codex_apps_tools/
  - ~/.codex/cache/remote_plugin_catalog/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/connectors/src/connector_runtime/persistence.rs
  source_kind: source_code
  unsourced_paths: []
  volatility: |-
    Caches with their own schema versions and, for the remote catalogue, a three hour time to live. The tool cache is capped at 32 MB. So what is here is the last refresh rather than a series of them.
  notes: |-
    What the agent was told it could call. The tool cache holds the tool lists the connectors advertised, keyed by a hash of the connector identity, which makes it the on-disk record of the tool surface a conversation had available, including tools that have since been withdrawn.

    The server info cache beside it holds what each connector said about itself. The remote catalogue cache holds the plugin catalogue as fetched, and on the measured machine it was the largest single file in the tree at twenty-three megabytes, which is worth knowing before a collection is sized.

    The exclusion cache is the fourth: it records which bundled plugins were held back, so it says what the agent did not have as well as what it did.
  parser: json_generic
- id: codex.system_skills
  title: Bundled system skills
  category: instructions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\skills\.system\'
  - ~/.codex/skills/.system/
  - ~/.codex/skills/.system/.codex-system-skills.marker
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/skills/src/lib.rs
  source_kind: source_code
  volatility: |-
    Reinstalled from the binary when the marker does not match, so the tree is a copy of what the installed version ships and a modification to it is undone on the next start.
  notes: |-
    Instructions the product installs for itself, unpacked from the binary into the skills directory under a dot-system name, with a marker file that records which version is unpacked.

    Why an instruction entry rather than a cache. These are instructions the agent obeys, and the question this suite asks about any instruction is who wrote it. Here the answer is the vendor, and that is worth being able to say: a skill under this directory is not something the user or a repository introduced, so an examiner comparing the instruction surface can set these aside and look at the rest.

    The marker is how a modified copy shows up. It is a hash with a salt rather than a version string, so a system skill that was edited in place stops matching and is replaced, which means an edit here is short-lived and its trace is the replacement.
  parser: instructions
