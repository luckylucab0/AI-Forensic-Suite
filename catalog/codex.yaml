    A socket exists while the pairing runs. It is not a file with contents, so an image records that it existed and nothing about what went through it.
  notes: |-
    The socket the terminal agent and an editor use to share context. Its presence is the evidence: it means the agent was wired into an editor rather than run on its own, which changes what the agent could see of the working copy.

    A collector must not try to read it, and this one does not: a socket is not a regular file, so the manifest records it with that reason and moves on. The entry exists so that the reason is recorded rather than the path being absent from the catalogue altogether.

    A second spelling with a zero suffix is in the module beside the first, for a second concurrent pairing.
