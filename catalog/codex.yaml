  notes: |-
    Half a megabyte of state under a name the command line product does not build. It was measured in the codex home of a current install, and a search of the vendor's open source repository for this filename finds nothing, so it is written by the desktop application or by a plugin rather than by the code this catalogue can read.

    Collect the backup as well as the file. They were the same size on the measured machine, which is what a rewrite-then-replace leaves, and the backup is therefore the state before the last change: the one comparison in this tree that can show what a setting used to be.

