  source_kind: observed
  volatility: |-
    In write-ahead log mode, so the newest records are in the log rather than the database and the three files have to be taken together.
  notes: |-
    A database in a subdirectory of the codex home, under a name that suggests a development build. Nothing in the vendor's open source repository creates it, so it belongs to the desktop application and its schema rests on nothing this catalogue can read.

    It is filed as a transcript on the measured evidence of its location rather than on its contents, which is a claim worth being explicit about: it sits beside the conversation stores in a tree whose other databases hold threads, and the generic SQLite reader states the schema it actually finds. If that schema turns out to be something else, this entry is what has to change.

    One observed filename from one machine. A different build may name it differently, which is why the directory around it is claimed by the entry beside this one: a store under another name is still collected, and is still reported as unread rather than missed.
