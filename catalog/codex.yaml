- id: codex.app_side_stores
  title: Side stores of the desktop application
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.codex\sqlite\'
  - '%USERPROFILE%\.codex\vendor_imports\'
  - ~/.codex/computer-use/
  - ~/.codex/sqlite/
  - ~/.codex/vendor_imports/
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on macOS 26.5.2 in the codex home of a current install
  source_kind: observed
  volatility: |-
    Unknown. These were measured rather than read out of code, so nothing here rests on a documented lifetime.
  notes: |-
    Three directories in the codex home that the open source command line product does not create, grouped in one entry because they share exactly that: they were measured, and the code this catalogue can read does not build them.

    The first held a signed application bundle with an embedded provisioning profile and a small configuration file beside it. An executable application placed inside the user's home directory by an agent is install evidence of the strongest kind, and its name says it is the computer-use component, so its presence is evidence that a component able to drive the machine's own interface was installed.

    The second held a database and its write-ahead log under a name suggesting a development build. It matters because it is a database in a subdirectory: the glob this catalogue already has for the state databases does not descend, so without this entry a store in here is collected by nothing. The database itself has an entry of its own, codex.app_side_database, because a directory entry has no format a reader can dispatch on and a store claimed only by one arrives in a case as a file nobody could open.

    The third held a cache of curated skills. It is here rather than with the skills entry because nothing in the vendor's source names it, and a guess about which component owns it would be worse than the gap.
