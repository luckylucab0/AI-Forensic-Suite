  source: https://raw.githubusercontent.com/openai/codex/main/codex-rs/tui/src/inline_visualization.rs
  source_kind: source_code
  volatility: |-
    No expiry was found in the module that builds these paths, so what is here is every visualization the product has written unless somebody removed it.
  notes: |-
    Output the agent produced for the user to look at, filed by date and thread. The date is not the file's own: it comes from the timestamp inside the thread id, which is a version 7 UUID, so the directory tree dates the conversation even if every file under it is unreadable and even if the file times were changed.

    That makes this a cross-check on the transcript tree. A thread id here with no rollout under sessions is the same finding as one in the session index without a rollout, from a second direction.

    The viewer directory is a sibling of the visualizations directory rather than a child, which a pattern that stops at the first tree misses.
