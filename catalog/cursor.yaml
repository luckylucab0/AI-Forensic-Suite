- id: cursor.chat_session_meta_json
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/chats/<md5-hex-of-abs-workspace-path>/<session-uuid>/meta.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/skillsynchq/txcript/c545075461a45edf609a252b8be932ad3a6c5052/docs/formats/cursor.md
  source_kind: community
  volatility: Rewritten on each session update; updatedAtMs is the last-touch timestamp.
  notes: |-
    Sidecar beside store.db. This is the cheap session index for triage: title plus timestamps without opening the SQLite store. Do not confuse with the store.db `meta` TABLE, which is hex-encoded.

    Re-checked against the vendor's own documentation by a second verification pass, after its site became reachable. The result is stronger than an absent source. The vendor documents around twenty paths under the same agent directory, among them the agent, skill, subagent, command and worktree directories and the configuration, hook and authentication files, and a chats directory is not one of them. Nothing in two hundred and fifty documentation pages, three changelogs, the data-use and security pages or the vendor's code hosting organization mentions this layout: no hit for the database filename, for the prompt history filename, for a chats directory, or for an md5 keyed directory level. Control searches against the same sources returned hundreds of results, so the absence is real rather than a failed search.

    A first hand measurement has since settled it in this layout's favour, for one operating system out of two. On a clean macOS 26.5 host running product version 3.21.16, the directory exists exactly as described: a hash keyed level under a chats directory, a session identifier under that, and inside it the store with a write ahead log holding almost all of its content, the per session input history and the metadata file. On a Windows 11 26200 host measured the same day with the same product version it does not exist at all, and a recursive search for every one of those filenames across the whole user profile found none of them. So this layout is real, it is not universal, and an agent directory on Windows without it is the ordinary case rather than a cleared one.

    There is also a contradicting lead, which is why this stays unverified rather than being dropped. Both the vendor's own cookbook and its software development kit documentation describe a per-workspace state root keyed by a slug, under a projects directory, not by a hash of the workspace path under a chats directory. This catalogue carries both layouts, and both of them were then found on the same macOS host at the same time, side by side under the same agent directory. They are not two guesses at one store: the slug keyed one holds the per project agent transcripts and the hash keyed one holds the command line product's own sessions. Collect the whole agent directory rather than either path list.
  parser: json_generic
