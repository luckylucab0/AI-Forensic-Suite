- id: cursor.global_state_vscdb
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Cursor\User\globalStorage\state.vscdb'
  - '%APPDATA%\Cursor\User\globalStorage\state.vscdb-shm'
  - '%APPDATA%\Cursor\User\globalStorage\state.vscdb-wal'
  - ~/.config/Cursor/User/globalStorage/state.vscdb
  - ~/.config/Cursor/User/globalStorage/state.vscdb-shm
  - ~/.config/Cursor/User/globalStorage/state.vscdb-wal
  - ~/Library/Application Support/Cursor/User/globalStorage/state.vscdb
  - ~/Library/Application Support/Cursor/User/globalStorage/state.vscdb-shm
  - ~/Library/Application Support/Cursor/User/globalStorage/state.vscdb-wal
  - ~/Library/Application Support/Cursor/User/globalStorage/state.vscdb.backup
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tclahr/uac/db563110cb9d2d3a5ad8aa985c267205d45ce4da/artifacts/files/applications/ai_tools/cursor.yaml
  source_kind: community
  contains_credentials:
  - auth_tokens
  volatility: |-
    cursorDiskKV is append-only per message/checkpoint/blob with NO observed pruning — excellent retention. But WAL-mode: acquire .vscdb + -wal + -shm together, and note that the WAL checkpoints on Cursor exit. state.vscdb.backup is a stale snapshot (one teardown found it ~2 months older than the live DB) and is therefore a free second point in time. Observed live sizes: 48.5 MB main / 41.2 MB backup; 839-2937 rows per key family.
  notes: |-
    THE primary Cursor IDE / Composer / in-editor-agent transcript store. As of early 2026 message text lives in individual bubbleId rows, NOT in a conversationMap field inside composerData — older extractors that only read composerData will silently return empty conversations. Cursor 3.0 (2026-04-02) centralised the chat index from the per-workspace DBs into composerHeaders here, each row carrying a workspaceIdentifier. Chat data stays LOCAL even for remote-SSH workspaces.

    This file also holds credential material. That is recorded here rather than as a separate entry, because a separate entry marked secret would stop the collector copying a file that is itself the evidence. Folded in from cursor.auth_tokens: IMPORTANT FOR THE COLLECTOR: this entry marks the KEYS secret, not the database. The same state.vscdb MUST still be collected in full under cursor_ide.global_state_vscdb — that is the primary transcript evidence. Implement this as a redaction rule applied during export, never as a file-level skip. cursorAuth/cachedEmail is also the cleanest account-attribution artifact in the whole Cursor footprint.

    The catalogued path had an explanation appended to it, kept here: ~/Library/Application Support/Cursor/User/globalStorage/state.vscdb  (ItemTable keys: cursorAuth/accessToken, cursorAuth/refreshToken, cursorAuth/cachedEmail)

    The catalogued path had an explanation appended to it, kept here: %APPDATA%\Cursor\User\globalStorage\state.vscdb  (same ItemTable keys)

    The catalogued path had an explanation appended to it, kept here: ~/.config/Cursor/User/globalStorage/state.vscdb  (same ItemTable keys)

    Variable location, not globbable: macOS Keychain: generic-password cursor-access-token / cursor-refresh-token / cursor-api-key; service 'Cursor Safe Storage' account 'Cursor Key'

    Record structure: Tables: ItemTable(key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB); cursorDiskKV(key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB); and since Cursor 3.0 a real relational table composerHeaders(composerId TEXT PRIMARY KEY, workspaceId TEXT, createdAt INTEGER, lastUpdatedAt INTEGER, isArchived INTEGER, isSubagent INTEGER, recency INTEGER, checkpointAt INTEGER, value TEXT). cursorDiskKV key families: composerData:<composerId> (conversation metadata, model config, context, changed/added/removed files, checkpoints, branches/worktrees, subagent links, todos, token breakdown; fields name, isAgentic, fullConversationHeadersOnly[], _v schema version observed at 13); bubbleId:<composerId>:<bubbleId> (ONE ROW PER MESSAGE — text, type (1=user, 2=assistant), codeBlocks, toolResults, toolFormerData, tokenCount{inputTokens,outputTokens}, images, thinkingDurationMs, todos[], mcpDescriptors, relevantFiles, recentlyViewedFiles, pullRequests, errorDetails; largest single row observed 1.49 MB); checkpointId:<composerId>:<checkpointId> (file-state manifests {files, nonExistentFiles, activeInlineDiffs}); messageRequestContext:<composerId>:<messageId> (full prompt-building context snapshot); composer.content.<hash> and agentKv:blob:<contentId> (content-addressed agent messages, tool payloads, raw provider request/response bodies including SYSTEM PROMPTS, plaintext source, binary protobuf and JPEG attachments — the single largest family, ~2937 rows / 30 MB observed, i.e. ~80% of DB bloat); ofsContent:<contentId> (original-file snapshots); inlineDiff:*. ItemTable keys: composer.composerData, composer.composerHeaders, cursorAuth/* (see cursor_ide.auth_tokens), cursorTrustedExtensionAuthAccess, terminal command/directory history, recently-opened paths, browser-automation history, MCP OAuth secret envelopes in byte-array Buffer form, per-workspace Git IPC secret. Values are predominantly UTF-8 JSON stored in a BLOB column (so SELECT returns bytes — decode before parsing); agentKv:blob values are mixed JSON/binary/JPEG and must be sniffed.
  parser: vscode_state
