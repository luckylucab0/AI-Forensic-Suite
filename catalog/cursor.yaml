  source_kind: community
  volatility: |-
    MCP servers spawn at IDE/agent start; capture the config BEFORE remediation because it is the record of what the agent was authorised to execute. One teardown found this file at mode 0600 while the surrounding ~/.cursor was 0755.
  notes: |-
    Flagged as an execution primitive and highest-value config by two DFIR catalogues. MCP OAuth/client-registration secret envelopes are additionally stored in the IDE's state.vscdb ItemTable in byte-array Buffer form.

    Record structure: { "mcpServers": { "<id": { "command", "args", "env", "url", "disabled" } } }. The per-server `env` block routinely holds plaintext API keys and bearer tokens — hash those values on export while keeping the rest of the file. Project-scoped .cursor/mcp.json travels with the repository, so it can arrive on a host via git clone with no local user action.

