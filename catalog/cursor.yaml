# Cursor artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: cursor
title: Cursor
vendor: Anysphere
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/cursor/
- https://raw.githubusercontent.com/cursor/
- https://github.com/getcursor/
- https://raw.githubusercontent.com/getcursor/
- https://cursor.com/
- https://downloads.cursor.com/
- https://docs.cursor.com/
- https://www.cursor.com/
description: |-
  A closed-source editor derived from VS Code, whose agent keeps its data in two trees: the editor's own user data directory, which follows the layout it inherited, and a per-user agent directory under the home directory. The vendor documents the second tree's configuration files thoroughly and documents nothing at all about where conversations are stored, which is why the transcript entries here rest on independent research and are marked unverified. Two negative findings from the vendor's own pages are worth knowing before an acquisition. There is no first-party statement that privacy mode changes what is written to local disk: it is documented as a control over cloud training and retention, so a privacy-mode user's conversations should still be expected on the endpoint. And there is no documented way to export or delete local conversation history, with account deletion explicitly leaving local data in place, so material can outlive the account it belongs to.
references:
- https://cursor.com/docs/agent/overview
- https://cursor.com/docs/cli/reference/permissions
- |-
  https://github.com/AltimateAI/vscode-dbt-power-user/blob/5fc912ee821cf1e42feb826ad48f9a01e2e98a80/documentation/docs/setup/cursor_installation_workaround.md
- |-
  https://github.com/pradipta/wallfacer/blob/94a58b79a47c4e815e60ffe6bfc5fb604351d2c3/internal/agent/cursor/cursor.go
- |-
  https://raw.githubusercontent.com/OpenAgentsInc/openagents/a2de475d2ee3a2f00865944c79c15600c1ada45c/docs/teardowns/2026-07-11-cursor-product-teardown.md
- |-
  https://raw.githubusercontent.com/VasiHemanth/tokentelemetry/0d691ae343ed31991e504a738bb1b288eea3b2ee/docs/research/harness-survey/harness-cursor-vscode.md
env_overrides:
- name: CURSOR_DATA_DIR
  effect: |-
    Relocates the command line agent's whole directory. Its own code reads this variable and falls back to the product directory under the home only when it is unset, and every subdirectory is built from the result, the per-project directory among them. So a host with this set keeps its agent state somewhere this catalogue cannot predict, and a collection of the default path returns nothing while reporting success. The self-hosted worker takes the same variable and documents its own default besides.
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
- name: CURSOR_SANDBOX_POLICY_DIR
  effect: |-
    Relocates the directory of sandbox policies, which is where the rules that decide what the agent may run without asking are kept. Its own code resolves this variable first and falls back to the directory under the product's home. A policy set here and collected from the default path reads as no policy in force.
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
- name: CURSOR_CONFIG_DIR
  effect: |-
    Relocates the agent configuration directory that the command line interface reads, which the vendor otherwise resolves to .cursor under the home directory or, on Linux and BSD, to a cursor directory under the base configuration directory. A collection keyed on the default finds nothing on such a host.
  source: https://cursor.com/docs/cli/reference/configuration
- name: CURSOR_TRANSCRIPT_PATH
  effect: |-
    Not a relocation the user sets but a value the agent passes to a hook script, holding the path of the conversation transcript for that run. It is the only documented way to learn where a transcript actually is, because the vendor states no path for one. The vendor also says it is present only when transcripts are enabled, so its absence means the feature was off rather than that the run had no conversation.
  source: https://cursor.com/docs/hooks
artifacts:
- id: cursor.hooks
  title: Hook scripts and configuration
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - /Library/Application Support/Cursor/hooks.json
  - /etc/cursor/hooks.json
  - C:\ProgramData\Cursor\hooks.json
  - <project>/.cursor/hooks.json
  - <project>/.cursor/hooks/
  - ~/.cursor/hooks.json
  - ~/.cursor/hooks/
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://cursor.com/docs/hooks
  source_kind: official
  volatility: |-
    Persists until edited. The script directory holds whatever the configuration points at, and nothing sweeps it.
  notes: |-
    Added by the vendor verification pass. Three scopes, and the machine-wide one is the reason to collect this even when the user's own directories look complete: an administrator can place a hook there that the user cannot see or remove, and a blocking hook explains an action the analyst expected to find attempted and did not.

    The scripts matter more than the configuration. A hook is an executable the agent runs at a lifecycle point, so the script directory is where a persistence mechanism or an exfiltration step would live, and it is content this catalogue cannot predict: collect the directory whole rather than a list of filenames. The hook interface is also how a collector learns where a conversation transcript is, since the vendor states no path for one and passes it to the script instead.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. No hook file and no hook directory existed on either host, at any of the seven paths in this entry, and recursive searches for the filename across both user profiles found nothing.

        That is the expected result and it is worth recording rather than assuming. A hook is something somebody writes, and both measurements were of installations nobody had configured. The value of the empty result is what it rules out: on these endpoints there was no interception of the agent's tool calls, nothing rewriting what it read, and nothing running on the endpoint's behalf between the model and the tools. On an endpoint under investigation, a populated hook file is one of the first things to read, and an empty one is now a measured baseline rather than a guess.
  parser: json_generic
- id: cursor.worktrees
  title: Agent-created git worktrees
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.cursor\worktrees\*'
  - ~/.cursor/worktrees/*
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://cursor.com/docs/cli/using
  source_kind: official
  volatility: |-
    The vendor documents cleanup settings and a limit for these, so agent-written code here is removed on a schedule rather than kept.
  notes: |-
    Added by the vendor verification pass. The agent creates git worktrees under the home directory, organized by repository name, so the code it wrote is not in the checkout an analyst is looking at. A diff of the user's repository can show nothing while the agent wrote a great deal, and this is where the difference is.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. The directory was not present on either host and a recursive search for its name found it nowhere. It is created when the agent makes itself a working copy, which neither measurement did, so this is a feature nobody used rather than a path that is wrong. The entry is the vendor's own and stays verified.
  parser: null
- id: cursor.retrieval_index
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/Library/Application Support/Cursor/CachedData/
  - |-
    ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/anysphere.cursor-retrieval/embeddable_files.txt
  - |-
    ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/anysphere.cursor-retrieval/high_level_folder_description.txt
  - ~/.cache/cursor-compile-cache/
  - ~/Library/Caches/cursor-compile-cache/v<runtime-version>-<arch>-<hash>-<uid>/
  - ~/Library/Caches/cursor-compile-cache/
  format: text
  sensitivity: normal
  collect_priority: first
  status: unverified
  source: |-
    https://raw.githubusercontent.com/OpenAgentsInc/openagents/a2de475d2ee3a2f00865944c79c15600c1ada45c/docs/teardowns/2026-07-11-cursor-product-teardown.md
  source_kind: community
  volatility: Overwritten wholesale on each index rebuild — no history.
  notes: |-
    FILE-NAME INVENTORY, not content: proves which files existed in a workspace and were eligible for upload to the vendor's indexing service, even if the files themselves are gone. Low session linkage. CachedData is keyed by commit hash (219 MB / 11 directories observed) and is useful only for version dating.

    Record structure: embeddable_files.txt is a newline-delimited list of workspace-relative paths (100,000 unique paths / 9.51 MB observed, mean 94 chars, max 273). high_level_folder_description.txt is a one-line marker (39 bytes observed). A 'Crepe' local index (index.bin, postings.bin, metadata.json, built by the bundled crepectl helper) is referenced but was not present in the audited profile.

    Measured first hand on a clean macOS 26.5 host running product version 3.21.16. The compile cache exists and its subdirectory names are the evidence in it: each one names a runtime version, an architecture, a content hash and the numeric user identifier. Two of them were created during the measurement, and the two different runtime versions in their names date an update that happened between the first and the second launch. That makes a listing of this directory a version history for the command line agent, without a single file being opened, and it survived the uninstall.

        The Linux spelling was missing from this entry and is here now. The Windows one lives in cursor.install_dirs, because on Windows the whole command line agent installs under local application data and the cache is created beside it on the first invocation.
  parser: text_config
- id: cursor.mdm_policy
  category: permissions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.cursor/policy.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
  source_kind: source_code
  volatility: |-
    Written by whoever manages the endpoint rather than by the user, and not cleaned up by the product. A change to it is an administrative action.
  notes: |-
    The managed sign-in policy, which decides who this agent will let sign in on this machine.

    Its own code reads an environment variable first and falls back to this file, so an endpoint can carry the policy in either place and the file is the one that survives a reboot. For an investigation it answers a question the transcripts cannot: whether the agent was restricted to an organisation's accounts, and therefore whether a session belongs to a managed identity or a personal one.

    The citation is the product's own command line package rather than a page or a repository: this vendor publishes no source and its documentation does not mention this path. The package is a pinned build, it is fetchable by anybody, and the construction quoted above is in its bundled JavaScript, so the finding is reproducible by unpacking it and searching for the same literal. The installer at the vendor's install URL names whichever build is current.

    Record structure: a JSON document. The variant delivered by the variable carries the same document as a value.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. The file was not present on either host and a recursive search for its name across the whole user profile found it nowhere.

        The entry is unchanged and stays verified, because the path comes from the product's own shipped code rather than from a write-up, and because a managed policy file is written by whoever manages the endpoint rather than by the product. An unmanaged machine has none. What the measurement adds is how to read the empty result: no policy was in force on this endpoint, which is an answer, and not that the collector looked in the wrong place.
  parser: json_generic
- id: cursor.cli_workspaces
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.cursor/cli-workspaces.json
  - ~/.cursor/ide_state.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
  source_kind: source_code
  volatility: Rewritten as workspaces are saved and as the editor's state changes. No history of its own.
  notes: |-
    Two small documents that name the directories this agent was pointed at.

    The first is the list of saved workspaces, which the command line accepts by name instead of by path. A name here is a directory somebody worked in often enough to save, and the entry survives the directory being deleted.

    The second is the state the command line reads to find out what the editor beside it is doing. It is how the two halves of this product join up, and for an analyst it is the link between a terminal session and an editor window.

    The citation is the product's own command line package rather than a page or a repository: this vendor publishes no source and its documentation does not mention this path. The package is a pinned build, it is fetchable by anybody, and the construction quoted above is in its bundled JavaScript, so the finding is reproducible by unpacking it and searching for the same literal. The installer at the vendor's install URL names whichever build is current.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. Neither file was present on either host and a recursive search for both names across the whole user profile found neither.

        Both paths are built by the product's own shipped command line package, so they stay, and this is the case ADR 0037 keeps a measurement away from. The reading of the absence is that the command line interface was installed on both hosts but never signed in and never used against a workspace, which is exactly the state that produces no workspace list and no editor state file. An endpoint where somebody used the command line agent should have them.
  parser: json_generic
- id: cursor.computer_use_sidecar
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.cursor/cursor-computer-use/**
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
  source_kind: source_code
  volatility: Installed on demand and left in place.
  notes: |-
    An application this agent installs under the user's home so that it can drive the machine itself.

    This is the capability worth finding early. An agent that edits files and runs commands is one thing; a sidecar for computer use means it could act on the desktop, which is outside every artifact this catalogue collects and leaves its traces in the operating system's own input and accessibility records instead.

    Its presence dates when the machine gained that capability. An environment variable can point the product at a different application, which the code reads before falling back to this path, so an absence here is not an absence of the capability.

    The citation is the product's own command line package rather than a page or a repository: this vendor publishes no source and its documentation does not mention this path. The package is a pinned build, it is fetchable by anybody, and the construction quoted above is in its bundled JavaScript, so the finding is reproducible by unpacking it and searching for the same literal. The installer at the vendor's install URL names whichever build is current.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. The directory was not present on either host and a recursive search for its name found it nowhere. It stays, because the path is from the product's own shipped package, and because what it would prove is worth a glob: a populated directory here is an endpoint where the agent was driving the screen and the keyboard rather than only the files.

        The related finding from the same measurements is in cursor.project_mcp_definitions and it is the stronger one. The tool definitions for screen control were present on both hosts in the shipped state, under the per-project agent directory, without anybody enabling anything. The capability was configured and the sidecar had not run.
  parser: null
- id: cursor.worktree_setup
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.cursor/worktrees.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
  source_kind: source_code
  volatility: Persistent until edited. Arrives and leaves with the repository.
  notes: |-
    Setup scripts that run when this agent makes itself a working copy.

    The product creates isolated worktrees and then runs the setup declared in this file in them. The file lives in the repository, so it arrives with a clone, and running the agent in a hostile checkout is enough to execute what it names.

    Its own code gates that on the workspace being trusted, and says so out loud when it skips. So read the trust decision beside this: an untrusted workspace's setup is on disk and did not run, and the command line carries a flag that skips it and another that trusts the workspace without prompting.

    The citation is the product's own command line package rather than a page or a repository: this vendor publishes no source and its documentation does not mention this path. The package is a pinned build, it is fetchable by anybody, and the construction quoted above is in its bundled JavaScript, so the finding is reproducible by unpacking it and searching for the same literal. The installer at the vendor's install URL names whichever build is current.
  parser: json_generic
- id: cursor.worker_data
  category: log
  root: system
  os:
  - macos
  - linux
  - windows
  paths:
  - /opt/cursor/**
  - ~/.local/share/cursor-agent/**
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://downloads.cursor.com/lab/2026.09.18-9a7762b/linux/x64/agent-cli-package.tar.gz
  source_kind: source_code
  volatility: |-
    Written while a worker runs and kept afterwards. Relocated whole by the data directory variable this file declares.
  notes: |-
    Where this product keeps its installed builds, and where a self-hosted worker keeps what it did.

    Two things live here and the second is the reason the entry is collected first. The versioned builds under the user's share directory are install evidence: which versions of the agent this machine has had, each a complete tree with its own date.

    The worker is the other half. The product can run as a worker that connects to the vendor and executes tool calls on this machine, driven from outside it, and its own help says this directory holds that worker's logs, artifacts and recording data. An endpoint with a populated worker directory was being operated remotely, which is a different investigation from one where somebody sat at the keyboard. The default is the system path where it is writable and the user's share directory otherwise.

    The citation is the product's own command line package rather than a page or a repository: this vendor publishes no source and its documentation does not mention this path. The package is a pinned build, it is fetchable by anybody, and the construction quoted above is in its bundled JavaScript, so the finding is reproducible by unpacking it and searching for the same literal. The installer at the vendor's install URL names whichever build is current.
  parser: null
- id: cursor.agent_cli_state
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/commands/*.md
  - ~/.cursor/agent-cli-state.json
  - ~/.cursor/browser-logs/
  - ~/.cursor/hooks.json
  - ~/.cursor/sandbox-policies/
  - ~/.cursor/snapshots/
  - ~/.cursor/worktrees/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/OpenAgentsInc/openagents/a2de475d2ee3a2f00865944c79c15600c1ada45c/docs/teardowns/2026-07-11-cursor-product-teardown.md
  source_kind: community
  volatility: browser-logs and snapshots are transient working state and are the first things a cleanup
    deletes.
  notes: |-
    Grab-bag of cursor-agent auxiliary state. Individually each path has 1-2 sources; collectively they are confirmed by a full ~/.cursor teardown, a cleanup tool's exclusion list, and a devcontainer seeding script. Treat each as medium confidence.

    Three paths left this entry when the vendor documentation became reachable and could carry them: the subagent definitions are cursor.subagents, the skills are cursor.skills, and the plugin folder is cursor.plugins. What is left here is the state that still rests on a teardown of one machine.

    Record structure: skills-cursor/.sync-manifest.json is skill-sync bookkeeping. hooks.json configures preToolUse / beforeReadFile style gates and is the record of what interception was active. sandbox-policies/ and worktrees/ appear in a container-seeding script's list of cursor-agent state dirs.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. Of the paths left in this grab-bag, none existed on either host: no command directory, no command line state file, no browser log directory, no hook file, no sandbox policy directory, no snapshot directory and no worktree directory. The shipped skills directory, which did exist on both, is now its own entry as cursor.bundled_skills.

        That is not a reason to drop any of them, and the distinction is the one ADR 0037 draws. Each of these is a feature directory: the hook file exists once somebody writes a hook, the worktree directory once the agent makes itself a working copy, the sandbox policies once a policy is set. An installation where none of them exists is an installation where none of those features was used, which is itself an answer to give an analyst. What it does mean is that the teardown these paths came from was of a machine somebody had worked on for a while, and a fresh endpoint will not look like it.
  parser: json_generic
- id: cursor.project_metadata
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/projects-metadata.json
  - ~/.cursor/projects/<escaped-abs-cwd>/mcp-approvals.json
  - ~/.cursor/projects/<escaped-abs-cwd>/canvases/
  - ~/.cursor/projects/<escaped-abs-cwd>/repo.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/poe-platform/poe-code/77505a0e76b178ef7fde1fd3089dbf5d3b4fbcfb/docs/research/cursor-agent-research.md
  source_kind: community
  notes: |-
    repo.json and mcp-approvals.json each come from a single source; projects-metadata.json from a separate audit listing. High value for mapping the opaque escaped-cwd directory names back to real project paths and for proving what the agent was authorised to invoke.

    Record structure: repo.json = repository metadata with a project UUID. mcp-approvals.json = which MCP servers the user approved for this project (a consent/authorisation record). projects-metadata.json observed at the ~/.cursor root in one home-directory audit tree listing.
  parser: json_generic
- id: cursor.auth_credentials
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - $XDG_CONFIG_HOME/cursor/auth.json
  - ~/.config/cursor/auth.json
  - ~/.cursor/auth.json
  format: json
  sensitivity: secret
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  volatility: |-
    Refresh tokens ROTATE on each run — a token captured after the fact is not the token that was in use. Collect metadata and hash before any agent restart or logout.
  notes: |-
    RECORD HASH AND METADATA ONLY, never copy contents. Also note CURSOR_API_KEY / CURSOR_AUTH_TOKEN environment variables as a non-file credential path.

    The catalogued path had an explanation appended to it, kept here: ~/.cursor/cli-config.json  (key: authInfo)

    Record structure: JSON with accessToken, refreshToken, apiKey (often null), bedrockCredentials (often null). Written at mode 0600 inside 0700 directories by tooling that manages it. macOS additionally/preferentially uses Keychain generic-password items named cursor-access-token, cursor-refresh-token, cursor-api-key, plus a safeStorage master key at service 'Cursor Safe Storage', account 'Cursor Key'. AGENT_CLI_CREDENTIAL_STORE=file forces the file store. One source states the macOS file credential store ignores CURSOR_CONFIG_DIR and always reads ~/.cursor/auth.json.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16 with command line agent 2026.09.18-9a7762b, one installation and one trivial conversation each. The Windows spelling of this file, under the editor's application data directory, was removed from this entry: it did not exist there and a recursive search for the filename across the whole user profile, the agent directory, the editor profile and both command line directories did not find it anywhere. Three write-ups name it and it is not there, which is the shape of a path that was copied from one catalogue into the next.

    What the measurement found instead is where an analyst should go. On Windows the account binding sits in the editor's own key value store, under adminSettings.cachedAuthId and alongside a cloud agent repository key that carries the provider and the account identifier in the key name itself. On macOS there is a generic keychain password item for the product's safe storage, which is the Electron key that unwraps cookies and tokens, and it survives every uninstall because it does not hang off the application bundle. The remaining file paths in this entry were not measured and stay as they were.

    The macOS measurement found the keychain item this entry's notes predicted, and it is worth stating as a finding rather than as a possibility: a generic password item named for the product's safe storage was present, and it was still present after the application bundle had been deleted. It does not hang off the bundle, so nothing about removing the product removes it.

        The file that holds it is the login keychain, which this catalogue claims once, under claude_code.macos_keychain_credentials, because one path is one manifest entry. Do not add a second claim on it here. What belongs here is the item name to ask for once the keychain is open, and the fact that its presence alone says this product was signed in on this account at some point, on a machine where nothing else may say so.
  parser: null
- id: cursor.commit_checkpoints
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Cursor\User\globalStorage\anysphere.cursor-commits\checkpoints\'
  - '%APPDATA%\Cursor\User\globalStorage\anysphere.cursor-retrieval\checkpoints\'
  - ~/.config/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/
  - ~/.config/Cursor/User/globalStorage/anysphere.cursor-retrieval/checkpoints/<uuid>/
  - ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/<id>/diffs/<uuid>
  - ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-retrieval/checkpoints/<uuid>/
  - ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/<id>/files/<uuid>
  - |-
    ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/<id>/metadata.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tuo-lei/vibe-replay/28d7d853daa121f1c06b17c8d44732aebd891f0b/website/src/content/blog/cursor-local-storage.md
  source_kind: community
  volatility: |-
    Bounded by Cursor's own rewind retention (6 checkpoint rows observed in one survey). A sibling workspaceStorage/<hash>/snapshots/ directory is expected by the code but was ABSENT in an audited profile.
  notes: |-
    PRE-EDIT FILE CONTENT, which recovers what a file looked like before the agent touched it, including changes never committed to git. metadata.json.agentRequestId joins to cursorDiskKV agentKv:* and to ai_code_hashes.requestId, giving a file change to prompt linkage.

    The vendor states the behaviour and not the location, so the paths stay unverified and the entry stays collected. What the vendor's agent page does state is worth the acquisition decision on its own: a checkpoint is created automatically before a significant change, it captures every modified file, it is stored locally and separately from git, and restoring one reverts the files WITHOUT removing anything from the conversation. So a transcript can describe an edit that no longer exists in the working tree and say nothing about the restore, and this directory is where the intermediate state went.

    Record structure: metadata.json fields: agentRequestId, requestFiles, deduplicatedGitInfos, workspaceId, startTrackingDateUnixMilliseconds. Diff payload fields: fsPath, fileUuid, diffChanges, gitInfo, kind. files/<uuid> are pre-edit file bodies.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16 with command line agent 2026.09.18-9a7762b, one installation and one trivial conversation each. Neither host had the extension directory this entry was built around. The namespace named after the product's commit feature does not exist on either operating system, and a recursive search for it across both editor profiles returned nothing. What does exist on both, in the same parent directory, is a checkpoints directory under the retrieval extension's namespace, keyed by a session identifier. Its paths are in this entry now beside the catalogued ones, because the catalogued ones may still be right for a version nobody measured and both cost one glob.

    Be honest about what that second directory is: nobody opened it. The name says checkpoints and the parent extension is the one that indexes the workspace, so it may be the pre-edit store this entry describes or it may be indexing state that happens to share the word. Collect it, and let the metadata.json field list in this entry decide which of the two it is once an analyst has one in front of them.
