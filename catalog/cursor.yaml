# Cursor artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: cursor
title: Cursor
vendor: Anysphere
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/cursor/
- https://raw.githubusercontent.com/cursor/
- https://github.com/getcursor/
- https://raw.githubusercontent.com/getcursor/
- https://cursor.com/
- https://docs.cursor.com/
- https://www.cursor.com/
description: |-
  A closed-source editor derived from VS Code, whose agent keeps its data in two trees: the editor's own user data directory, which follows the layout it inherited, and a per-user agent directory under the home directory. The vendor documents the second tree's configuration files thoroughly and documents nothing at all about where conversations are stored, which is why the transcript entries here rest on independent research and are marked unverified. Two negative findings from the vendor's own pages are worth knowing before an acquisition. There is no first-party statement that privacy mode changes what is written to local disk: it is documented as a control over cloud training and retention, so a privacy-mode user's conversations should still be expected on the endpoint. And there is no documented way to export or delete local conversation history, with account deletion explicitly leaving local data in place, so material can outlive the account it belongs to.
references:
- https://cursor.com/docs/agent/overview
- https://cursor.com/docs/cli/reference/permissions
- |-
  https://github.com/AltimateAI/vscode-dbt-power-user/blob/5fc912ee821cf1e42feb826ad48f9a01e2e98a80/documentation/docs/setup/cursor_installation_workaround.md
- |-
  https://github.com/pradipta/wallfacer/blob/94a58b79a47c4e815e60ffe6bfc5fb604351d2c3/internal/agent/cursor/cursor.go
- |-
  https://raw.githubusercontent.com/OpenAgentsInc/openagents/a2de475d2ee3a2f00865944c79c15600c1ada45c/docs/teardowns/2026-07-11-cursor-product-teardown.md
- |-
  https://raw.githubusercontent.com/VasiHemanth/tokentelemetry/0d691ae343ed31991e504a738bb1b288eea3b2ee/docs/research/harness-survey/harness-cursor-vscode.md
env_overrides:
- name: CURSOR_CONFIG_DIR
  effect: |-
    Relocates the agent configuration directory that the command line interface reads, which the vendor otherwise resolves to .cursor under the home directory or, on Linux and BSD, to a cursor directory under the base configuration directory. A collection keyed on the default finds nothing on such a host.
  source: https://cursor.com/docs/cli/reference/configuration
- name: CURSOR_TRANSCRIPT_PATH
  effect: |-
    Not a relocation the user sets but a value the agent passes to a hook script, holding the path of the conversation transcript for that run. It is the only documented way to learn where a transcript actually is, because the vendor states no path for one. The vendor also says it is present only when transcripts are enabled, so its absence means the feature was off rather than that the run had no conversation.
  source: https://cursor.com/docs/hooks
artifacts:
- id: cursor.hooks
  title: Hook scripts and configuration
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - /Library/Application Support/Cursor/hooks.json
  - /etc/cursor/hooks.json
  - C:\ProgramData\Cursor\hooks.json
  - <project>/.cursor/hooks.json
  - <project>/.cursor/hooks/
  - ~/.cursor/hooks.json
  - ~/.cursor/hooks/
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://cursor.com/docs/hooks
  source_kind: official
  volatility: |-
    Persists until edited. The script directory holds whatever the configuration points at, and nothing sweeps it.
  notes: |-
    Added by the vendor verification pass. Three scopes, and the machine-wide one is the reason to collect this even when the user's own directories look complete: an administrator can place a hook there that the user cannot see or remove, and a blocking hook explains an action the analyst expected to find attempted and did not.

    The scripts matter more than the configuration. A hook is an executable the agent runs at a lifecycle point, so the script directory is where a persistence mechanism or an exfiltration step would live, and it is content this catalogue cannot predict: collect the directory whole rather than a list of filenames. The hook interface is also how a collector learns where a conversation transcript is, since the vendor states no path for one and passes it to the script instead.
  parser: json_generic
- id: cursor.worktrees
  title: Agent-created git worktrees
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.cursor\worktrees\*'
  - ~/.cursor/worktrees/*
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://cursor.com/docs/cli/using
  source_kind: official
  volatility: |-
    The vendor documents cleanup settings and a limit for these, so agent-written code here is removed on a schedule rather than kept.
  notes: |-
    Added by the vendor verification pass. The agent creates git worktrees under the home directory, organized by repository name, so the code it wrote is not in the checkout an analyst is looking at. A diff of the user's repository can show nothing while the agent wrote a great deal, and this is where the difference is.
  parser: null
- id: cursor.retrieval_index
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/Library/Application Support/Cursor/CachedData/
  - |-
    ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/anysphere.cursor-retrieval/embeddable_files.txt
  - |-
    ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/anysphere.cursor-retrieval/high_level_folder_description.txt
  - ~/Library/Caches/cursor-compile-cache/
  format: text
  sensitivity: normal
  collect_priority: first
  status: unverified
  source: |-
    https://raw.githubusercontent.com/OpenAgentsInc/openagents/a2de475d2ee3a2f00865944c79c15600c1ada45c/docs/teardowns/2026-07-11-cursor-product-teardown.md
  source_kind: community
  volatility: Overwritten wholesale on each index rebuild — no history.
  notes: |-
    FILE-NAME INVENTORY, not content: proves which files existed in a workspace and were eligible for upload to the vendor's indexing service, even if the files themselves are gone. Low session linkage. CachedData is keyed by commit hash (219 MB / 11 directories observed) and is useful only for version dating.

    Record structure: embeddable_files.txt is a newline-delimited list of workspace-relative paths (100,000 unique paths / 9.51 MB observed, mean 94 chars, max 273). high_level_folder_description.txt is a one-line marker (39 bytes observed). A 'Crepe' local index (index.bin, postings.bin, metadata.json, built by the bundled crepectl helper) is referenced but was not present in the audited profile.
  parser: text_config
- id: cursor.agent_cli_state
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/commands/*.md
  - ~/.cursor/agent-cli-state.json
  - ~/.cursor/browser-logs/
  - ~/.cursor/hooks.json
  - ~/.cursor/sandbox-policies/
  - ~/.cursor/skills-cursor/
  - ~/.cursor/snapshots/
  - ~/.cursor/worktrees/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/OpenAgentsInc/openagents/a2de475d2ee3a2f00865944c79c15600c1ada45c/docs/teardowns/2026-07-11-cursor-product-teardown.md
  source_kind: community
  volatility: browser-logs and snapshots are transient working state and are the first things a cleanup
    deletes.
  notes: |-
    Grab-bag of cursor-agent auxiliary state. Individually each path has 1-2 sources; collectively they are confirmed by a full ~/.cursor teardown, a cleanup tool's exclusion list, and a devcontainer seeding script. Treat each as medium confidence.

    Three paths left this entry when the vendor documentation became reachable and could carry them: the subagent definitions are cursor.subagents, the skills are cursor.skills, and the plugin folder is cursor.plugins. What is left here is the state that still rests on a teardown of one machine.

    Record structure: skills-cursor/.sync-manifest.json is skill-sync bookkeeping. hooks.json configures preToolUse / beforeReadFile style gates and is the record of what interception was active. sandbox-policies/ and worktrees/ appear in a container-seeding script's list of cursor-agent state dirs.
  parser: json_generic
- id: cursor.project_metadata
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/projects-metadata.json
  - ~/.cursor/projects/<escaped-abs-cwd>/mcp-approvals.json
  - ~/.cursor/projects/<escaped-abs-cwd>/repo.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/poe-platform/poe-code/77505a0e76b178ef7fde1fd3089dbf5d3b4fbcfb/docs/research/cursor-agent-research.md
  source_kind: community
  notes: |-
    repo.json and mcp-approvals.json each come from a single source; projects-metadata.json from a separate audit listing. High value for mapping the opaque escaped-cwd directory names back to real project paths and for proving what the agent was authorised to invoke.

    Record structure: repo.json = repository metadata with a project UUID. mcp-approvals.json = which MCP servers the user approved for this project (a consent/authorisation record). projects-metadata.json observed at the ~/.cursor root in one home-directory audit tree listing.
  parser: json_generic
- id: cursor.auth_credentials
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - $XDG_CONFIG_HOME/cursor/auth.json
  - '%APPDATA%\Cursor\auth.json'
  - ~/.config/cursor/auth.json
  - ~/.cursor/auth.json
  format: json
  sensitivity: secret
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  volatility: |-
    Refresh tokens ROTATE on each run — a token captured after the fact is not the token that was in use. Collect metadata and hash before any agent restart or logout.
  notes: |-
    RECORD HASH AND METADATA ONLY, never copy contents. Also note CURSOR_API_KEY / CURSOR_AUTH_TOKEN environment variables as a non-file credential path.

    The catalogued path had an explanation appended to it, kept here: ~/.cursor/cli-config.json  (key: authInfo)

    Record structure: JSON with accessToken, refreshToken, apiKey (often null), bedrockCredentials (often null). Written at mode 0600 inside 0700 directories by tooling that manages it. macOS additionally/preferentially uses Keychain generic-password items named cursor-access-token, cursor-refresh-token, cursor-api-key, plus a safeStorage master key at service 'Cursor Safe Storage', account 'Cursor Key'. AGENT_CLI_CREDENTIAL_STORE=file forces the file store. One source states the macOS file credential store ignores CURSOR_CONFIG_DIR and always reads ~/.cursor/auth.json.
  parser: null
- id: cursor.commit_checkpoints
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Cursor\User\globalStorage\anysphere.cursor-commits\checkpoints\'
  - ~/.config/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/
  - ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/<id>/diffs/<uuid>
  - ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/<id>/files/<uuid>
  - |-
    ~/Library/Application Support/Cursor/User/globalStorage/anysphere.cursor-commits/checkpoints/<id>/metadata.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tuo-lei/vibe-replay/28d7d853daa121f1c06b17c8d44732aebd891f0b/website/src/content/blog/cursor-local-storage.md
  source_kind: community
  volatility: |-
    Bounded by Cursor's own rewind retention (6 checkpoint rows observed in one survey). A sibling workspaceStorage/<hash>/snapshots/ directory is expected by the code but was ABSENT in an audited profile.
  notes: |-
    PRE-EDIT FILE CONTENT, which recovers what a file looked like before the agent touched it, including changes never committed to git. metadata.json.agentRequestId joins to cursorDiskKV agentKv:* and to ai_code_hashes.requestId, giving a file change to prompt linkage.

    The vendor states the behaviour and not the location, so the paths stay unverified and the entry stays collected. What the vendor's agent page does state is worth the acquisition decision on its own: a checkpoint is created automatically before a significant change, it captures every modified file, it is stored locally and separately from git, and restoring one reverts the files WITHOUT removing anything from the conversation. So a transcript can describe an edit that no longer exists in the working tree and say nothing about the restore, and this directory is where the intermediate state went.

    Record structure: metadata.json fields: agentRequestId, requestFiles, deduplicatedGitInfos, workspaceId, startTrackingDateUnixMilliseconds. Diff payload fields: fsPath, fileUuid, diffChanges, gitInfo, kind. files/<uuid> are pre-edit file bodies.
  parser: json_generic
- id: cursor.local_file_history
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Cursor\User\History\'
  - ~/.config/Cursor/User/History/
  - ~/Library/Application Support/Cursor/User/History/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tclahr/uac/db563110cb9d2d3a5ad8aa985c267205d45ce4da/artifacts/files/applications/ai_tools/cursor.yaml
  source_kind: community
  volatility: |-
    VS Code prunes local history by count and age per the workbench.localHistory.* settings; 25 resource histories observed in one profile.
  notes: |-
    Inherited VS Code artifact, NOT AI-specific — but it is the fallback record of agent-driven edits when Cursor's own checkpoints have aged out. Explicitly named as a collection target by the UAC Cursor artifact file.

    Record structure: Standard VS Code local-history layout: one directory per tracked resource containing an entries.json manifest (resource URI + timestamped entry list) plus the numbered content snapshots themselves.
  parser: json_generic
- id: cursor.extensions
  category: install_evidence
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\extensions\extensions.json'
  - ~/.cursor-server/extensions/
  - ~/.cursor/extensions/
  - ~/.cursor/extensions/extensions.json
  - ~/Library/Application Support/Cursor/extensions/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://github.com/AltimateAI/vscode-dbt-power-user/blob/5fc912ee821cf1e42feb826ad48f9a01e2e98a80/documentation/docs/setup/cursor_installation_workaround.md
  source_kind: community
  volatility: |-
    extensions.json is rebuilt from the directory on next launch if deleted; a sibling .obsolete file marks pending removals.
  notes: |-
    User-installed extensions live in ~/.cursor/extensions/ (confirmed by a third-party install guide with explicit macOS/Linux and Windows paths, a Metasploit persistence module's target list, and multiple theme installers). SEPARATELY, one full product teardown places the ~17 FIRST-PARTY extensions (cursor-agent-exec, cursor-agent-worker, cursor-browser-automation, cursor-mcp, cursor-retrieval, cursor-commits, cursor-shadow-workspace, cursor-always-local, …) under ~/Library/Application Support/Cursor/extensions/. Collect BOTH. ~/.cursor-server/extensions/ is the remote/SSH server-side copy. This directory is a known IDE-extension persistence location.

    Record structure: extensions.json is a JSON ARRAY of installed-extension records (identifier, version, location, metadata). Each extension unpacks to its own <publisher>.<name>-<version>/ directory beside it.
  parser: json_generic
- id: cursor.install_and_machine_identity
  category: install_evidence
  root: registry
  os:
  - windows
  paths:
  - HKCU\Software\Classes\cursor\shell\open\command
  - HKCU\Software\Microsoft\Windows\CurrentVersion\Run
  format: registry
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  volatility: |-
    Machine-wide persistence keys. An administrative action rather than user activity, and unlikely to be cleaned up by the user.
  notes: |-
    The registry half of this product's install evidence. The filesystem paths that used to sit in this entry are now cursor.install_dirs, cursor.machine_identity_storage, cursor.machine_identity_file and cursor.macos_preferences: an entry declared root: registry is skipped whole by the analyzer's path matcher, so those files were collected and then claimed by nothing, and the entry also declared os: windows, so the macOS ones were never collected at all.

    Variable location, not globbable: HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\<Cursor GUID>

    Record structure: the Uninstall key yields InstallLocation and DisplayVersion. The cursor:// protocol-handler command key and the Run key are persistence-relevant.
  parser: null
- id: cursor.install_dirs
  category: install_evidence
  root: user_profile
  os:
  - windows
  paths:
  - '%LOCALAPPDATA%\Programs\cursor\'
  - '%LOCALAPPDATA%\cursor-updater\'
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  notes: |-
    Split out of cursor.install_and_machine_identity, which declared root: registry and was therefore skipped whole by the analyzer's path matcher.

    Record structure: bundle version dating comes from the application's own product.json under the install directory.
  parser: null
- id: cursor.machine_identity_storage
  category: install_evidence
  root: user_profile
  os:
  - macos
  paths:
  - ~/Library/Application Support/Cursor/User/globalStorage/statsig-cache.json
  - ~/Library/Application Support/Cursor/User/globalStorage/storage.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  volatility: |-
    The telemetry identifiers are stable across launches and are exactly what account-resetter tools rewrite, so a mismatch between these and the machineid file beside them is a tamper indicator.
  notes: |-
    Split out of cursor.install_and_machine_identity, which declared root: registry and os: windows, so this document was skipped by the analyzer's path matcher and never collected on the platform it exists on.

    Record structure: storage.json holds window state, profile association, theme and splash state, shutdown timing, openedPathsList and backupWorkspaces.folders[].folderUri, which is the resolver for the workspace hashes other entries are keyed by, and telemetry.machineId, devDeviceId and sqmId.
  parser: json_generic
- id: cursor.machine_identity_file
  category: install_evidence
  root: user_profile
  os:
  - macos
  paths:
  - ~/Library/Application Support/Cursor/machineid
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  volatility: |-
    Stable across launches and rewritten by account-resetter tools, so a mismatch with the telemetry identifiers in storage.json is a tamper indicator.
  notes: |-
    Split out of cursor.install_and_machine_identity for the reason given there. One identifier on one line, and its value only means something next to the telemetry identifiers in storage.json.
  parser: null
- id: cursor.macos_preferences
  category: install_evidence
  root: user_profile
  os:
  - macos
  paths:
  - ~/Library/Preferences/com.todesktop.230313mzl4w4u92.plist
  format: plist
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  notes: |-
    Split out of cursor.install_and_machine_identity for the reason given there. The bundle identifier is com.todesktop.230313mzl4w4u92, a ToDesktop-built Electron application, which is why a sweep keyed on the string Cursor misses this file, the HTTPStorages beside it and the ByHost updater plist.
  parser: plist_generic
- id: cursor.ai_code_tracking_db
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/ai-tracking/*.db
  - ~/.cursor/ai-tracking/*.db-shm
  - ~/.cursor/ai-tracking/*.db-wal
  - ~/.cursor/ai-tracking/ai-code-tracking.db
  - ~/.cursor/ai-tracking/ai-code-tracking.db-shm
  - ~/.cursor/ai-tracking/ai-code-tracking.db-wal
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tuo-lei/vibe-replay/28d7d853daa121f1c06b17c8d44732aebd891f0b/website/src/content/blog/cursor-local-storage.md
  source_kind: community
  volatility: |-
    Observed empty (0 active rows) on one surveyed machine while still carrying schema — an empty DB is not proof of no AI-assisted editing.
  notes: |-
    The single best Cursor artifact for AI-vs-human code attribution per commit, and conversation_summaries is a lightweight session index that avoids re-parsing every JSONL. ai_code_hashes.conversationId and the checkpoint metadata.agentRequestId cross-join with cursorDiskKV composerData/agentKv ids — this is the pivot that ties a commit to a specific prompt. Confirmed by three independent sources.

    Record structure: Six tables. ai_code_hashes: links code hashes to a source category ('cli' or 'composer'), file name/extension, requestId, conversationId, timestamp, model. scored_commits: commitHash, branchName, tabLinesAdded, composerLinesAdded, humanLinesAdded, v1AiPercentage, v2AiPercentage, message/date. tracked_file_content: git path, conversation, model, timestamp. conversation_summaries: title, TLDR, overview, bullets, model, mode. ai_deleted_files. tracking_state.
  parser: sqlite_generic
- id: cursor.logs
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Cursor\logs\'
  - ~/.config/Cursor/logs/
  - ~/Library/Application Support/Cursor/User/process-monitor/
  - ~/Library/Application Support/Cursor/logs/*/window*/workbench.mcp.*.log
  - ~/Library/Application Support/Cursor/logs/<launch-timestamp>/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tclahr/uac/db563110cb9d2d3a5ad8aa985c267205d45ce4da/artifacts/files/applications/ai_tools/cursor.yaml
  source_kind: community
  volatility: |-
    One directory per application launch, rotated by VS Code's own log-folder-per-launch scheme. Observed: 11 launch directories / 860 files / 142 MB spanning ~3 weeks. Older launches are dropped, so the log window is short.
  notes: |-
    Note the log directory is a SIBLING of User/, not inside it (…/Cursor/logs, not …/Cursor/User/logs) — the UAC artifact file collects both paths explicitly.

    Record structure: Per-launch subdirectories containing window, renderer, extension-host, terminal, Git, MCP, grep and indexing/retrieval logs. workbench.mcp.*.log records MCP connect/oauth/allowlist events — unstructured text but the only timeline of MCP server startup and authorisation. process-monitor/ holds 1.5 MB of timestamped process logs.
  parser: text_log
- id: cursor.mcp_config
  category: mcp_config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\mcp.json'
  - <project>/.cursor/mcp.json
  - <project>/.mcp.json
  - ~/.cursor/mcp.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/depalmar/ai-dfir-toolkit/d3cf3577f6db374b3e196e1a05c0cd6708b9655d/artifacts/catalog/cursor.yml
  source_kind: community
  volatility: |-
    MCP servers spawn at IDE/agent start; capture the config BEFORE remediation because it is the record of what the agent was authorised to execute. One teardown found this file at mode 0600 while the surrounding ~/.cursor was 0755.
  notes: |-
    Flagged as an execution primitive and highest-value config by two DFIR catalogues. MCP OAuth/client-registration secret envelopes are additionally stored in the IDE's state.vscdb ItemTable in byte-array Buffer form.

    Record structure: { "mcpServers": { "<id": { "command", "args", "env", "url", "disabled" } } }. The per-server `env` block routinely holds plaintext API keys and bearer tokens — hash those values on export while keeping the rest of the file. Project-scoped .cursor/mcp.json travels with the repository, so it can arrive on a host via git clone with no local user action.
  parser: json_generic
- id: cursor.cli_config
  category: permissions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - $XDG_CONFIG_HOME/cursor/cli-config.json
  - '%USERPROFILE%\.cursor\cli-config.json'
  - '%USERPROFILE%\.cursor\cli-config.json.bad'
  - <project>/.cursor/cli.json
  - ~/.cursor/cli-config.json
  - ~/.cursor/cli-config.json.bad
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://cursor.com/docs/cli/reference/configuration
  source_kind: official
  contains_credentials:
  - auth_credentials
  volatility: |-
    Allowlist entries accumulate as the user approves commands, so this file grows into a de-facto record of every tool class ever permitted. One reported bug wrote project-scoped approvals into the global file instead of <project>/.cursor/cli.json. The vendor states the CLI repairs missing fields by itself and that a corrupted file is backed up as .bad and recreated, so the .bad copy is an earlier configuration the product preserved and the live file may be younger than the behaviour it is being read to explain.
  notes: |-
    THE PERMISSION RECORD FOR THE COMMAND LINE PRODUCT, and the file to read before any transcript from it. The vendor documents the four locations, the precedence CURSOR_CONFIG_DIR, then $XDG_CONFIG_HOME/cursor on Linux and BSD, then ~/.cursor, and states that only permissions can be set per project while every other setting is global.

    Two fields decide how much of a session was ever shown to anybody. approvalMode takes allowlist, auto-review or unrestricted, and the page names the values without defining them, so treat anything other than allowlist as a question for the transcript rather than as a proven bypass. sandbox.mode and sandbox.networkAccess decide whether the agent ran confined and whether it could reach the network at all.

    The permission grammar has four kinds and is exact-string matched: Shell(commandBase) where commandBase is the first token of the command line and where the vendor documents a Shell(curl:*) form for arguments, Read(pathOrGlob), Write(pathOrGlob), and WebFetch(domainOrPattern) where the page states that a fetch prompts unless a domain is allowed and shows WebFetch(*) as the entry that allows every domain. An allow list is therefore also an egress record: the domains in it are the ones the agent could reach without asking.

    This file also holds credential material, which is recorded here rather than as a separate entry, because a separate entry marked secret would stop the collector copying a file that is itself the evidence. Folded in from cursor.auth_credentials: RECORD HASH AND METADATA ONLY, never copy contents. The credential claim rests on third-party research rather than on the vendor page: newer builds are reported to store them in this same file under a top-level authInfo key. Also note CURSOR_API_KEY and CURSOR_AUTH_TOKEN as a non-file credential path.
  parser: json_generic
- id: cursor.project_instructions
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/**/AGENTS.md
  - <project>/.cursor/rules/
  - <project>/.cursor/rules/**/*.mdc
  - <project>/.cursor/rules/*.mdc
  - <project>/.cursorrules
  - <project>/AGENTS.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://cursor.com/docs/context/rules
  source_kind: official
  unsourced_paths:
  - <project>/.cursorrules
  volatility: Version-controlled in most repos, so git history gives you the change timeline for free.
    Check `git log` on these paths and check for uncommitted modifications.
  notes: |-
    PRIMARY PROMPT-INJECTION SURFACE. Anyone who can land a rule file in a repository gets standing instructions for every contributor who opens it, and two of the four rule types need no user action at all: alwaysApply puts the file in every session, and a glob-scoped rule puts it in every session that touches a matching file. Collect the full text, not the filenames.

    Record structure: a rule is a .mdc file, markdown with YAML frontmatter carrying description, globs and alwaysApply, and it may sit in a folder below the rules directory. The vendor states that a plain .md file there is ignored for want of that frontmatter, so such a file is an instruction that did NOT reach the model, which reads differently from one that did. See crosscutting.instructions_cursor_rules, which holds that reasoning and the paths for the ignored spellings.

    The flat .cursorrules file is not mentioned on the current vendor page at all, not even as deprecated, so it stays unsourced here: it dates an install rather than proving a rule was read, and other agents read it too.

    The commands, plans, skills and subagent definitions that used to sit in this entry now have their own, each resting on the vendor page that documents it: cursor.commands_and_plans, cursor.skills and cursor.subagents.
  parser: instructions
- id: cursor.commands_and_plans
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.cursor/commands/*.md
  - <project>/.cursor/plans/
  format: markdown
