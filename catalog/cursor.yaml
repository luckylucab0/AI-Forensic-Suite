  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb-shm
  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb-wal
  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/workspace.json
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: unverified
  source: |-
    https://raw.githubusercontent.com/VasiHemanth/tokentelemetry/0d691ae343ed31991e504a738bb1b288eea3b2ee/docs/research/harness-survey/harness-cursor-vscode.md
  source_kind: community
  volatility: |-
    ItemTable is last-write-wins per key, so this DB overwrites rather than appends — the legacy aiService.* histories are the most fragile Cursor chat evidence there is.
  notes: |-
    The aiService.prompts / aiService.generations / aichat.chatdata keys are EARLY-VERSION artifacts. On Cursor 3.0+ the workspace DB retains mainly selectedComposerIds and UI state — so finding populated aiService.* keys is itself a dating signal for an older install or an older workspace. workspace.json is the only reliable hash-to-path resolver; VS Code proper does not store folder paths per workspace and needs globalStorage/storage.json openedPathsList instead.

    Record structure: ItemTable only (plus cursorDiskKV in some builds). Keys: aiService.prompts (LEGACY prompt-only history: prompt text + commandType), aiService.generations (LEGACY generation event log: UUID + timestamp + type), workbench.panel.aichat.view.aichat.chatdata (LEGACY chat: tabs[] + bubbles[]), composer.composerData (selected/focused composer ids), cursor/pinnedComposers, history.entries, workbench.backgroundComposer.workspacePersistentData, workbench.panel.composerChatViewPane.*, workbench.panel.aichat.<uuid>.numberOfVisibleViews, newAgentSidebar.*, cursor/agentLayout.*, agentSidebar.section.*.collapsed, interactive.sessions. workspace.json beside it maps the opaque hash to the real folder: a "folder" or "workspace" key with a file:// or vscode-remote://ssh-remote+<host>/ URI.
  parser: vscode_state
