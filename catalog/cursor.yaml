  paths:
  - '%APPDATA%\Cursor\User\workspaceStorage\<workspace-hash>\state.vscdb'
  - '%APPDATA%\Cursor\User\workspaceStorage\<workspace-hash>\state.vscdb-shm'
  - '%APPDATA%\Cursor\User\workspaceStorage\<workspace-hash>\state.vscdb-wal'
  - '%APPDATA%\Cursor\User\workspaceStorage\<workspace-hash>\workspace.json'
  - ~/.config/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb
  - ~/.config/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb-shm
  - ~/.config/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb-wal
  - ~/.config/Cursor/User/workspaceStorage/<workspace-hash>/workspace.json
  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb
  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb-shm
  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/state.vscdb-wal
  - ~/Library/Application Support/Cursor/User/workspaceStorage/<workspace-hash>/workspace.json
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/VasiHemanth/tokentelemetry/0d691ae343ed31991e504a738bb1b288eea3b2ee/docs/research/harness-survey/harness-cursor-vscode.md
  source_kind: community
  volatility: |-
    ItemTable is last-write-wins per key, so this DB overwrites rather than appends — the legacy aiService.* histories are the most fragile Cursor chat evidence there is.
  notes: |-
    The aiService.prompts / aiService.generations / aichat.chatdata keys are EARLY-VERSION artifacts. On Cursor 3.0+ the workspace DB retains mainly selectedComposerIds and UI state — so finding populated aiService.* keys is itself a dating signal for an older install or an older workspace. workspace.json is the only reliable hash-to-path resolver; VS Code proper does not store folder paths per workspace and needs globalStorage/storage.json openedPathsList instead.

    Record structure: ItemTable only (plus cursorDiskKV in some builds). Keys: aiService.prompts (LEGACY prompt-only history: prompt text + commandType), aiService.generations (LEGACY generation event log: UUID + timestamp + type), workbench.panel.aichat.view.aichat.chatdata (LEGACY chat: tabs[] + bubbles[]), composer.composerData (selected/focused composer ids), cursor/pinnedComposers, history.entries, workbench.backgroundComposer.workspacePersistentData, workbench.panel.composerChatViewPane.*, workbench.panel.aichat.<uuid>.numberOfVisibleViews, newAgentSidebar.*, cursor/agentLayout.*, agentSidebar.section.*.collapsed, interactive.sessions. workspace.json beside it maps the opaque hash to the real folder: a "folder" or "workspace" key with a file:// or vscode-remote://ssh-remote+<host>/ URI.

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. The legacy flag came off this entry as a result. The database is written by the current version on both operating systems, with a populated key table per workspace and a second directory under the fixed name for the window with no folder open, so treating the whole artifact as no longer written was wrong. What is legacy is the set of keys named in the paragraph above, not the file.

        Two things about the directory name, both of which cost an analyst time if nobody says them. It is not the hash of the workspace path: ten normalisations of the folder URI were tried against five digest algorithms and none of the fifty combinations reproduced the observed name, so do not try to compute it forwards from a path. And the same folder produced the same name in this product and in the other Electron product in this catalogue, which makes the name a join key across two products for the statement that one folder was open in both.

    The file that maps the directory name back to the folder was catalogued for macOS alone, so on Windows and on Linux it was never collected and the store beside it arrived with nothing that could say which project it belonged to. Both spellings are here now. The consequence of the gap was silent, which is why it is worth recording: the parser reads that file to set the project on every row of this store (ADR 0038), and without it every row of every Windows and Linux collection of this store was unattributed while the collection reported success.
  parser: vscode_state
