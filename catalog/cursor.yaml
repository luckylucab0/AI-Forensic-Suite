        The directory name deserves more weight than it has been given. It is the project's absolute path with the separators replaced, not a hash of it, which the Windows measurement showed plainly: the drive letter, the profile directory, the user name and every path component were readable in the directory name itself. So this directory is a record of which project was worked on, it survives the deletion of that project, and it identifies the person whose profile the path runs through. Treat the listing of this directory as evidence in its own right, before anything inside it is opened, and treat it as personal data when exporting.
