- id: cursor.cli_config
  category: permissions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - $XDG_CONFIG_HOME/cursor/cli-config.json
  - '%USERPROFILE%\.cursor\cli-config.json'
  - '%USERPROFILE%\.cursor\cli-config.json.bad'
  - <project>/.cursor/cli.json
  - ~/.cursor/cli-config.json
  - ~/.cursor/cli-config.json.bad
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://cursor.com/docs/cli/reference/configuration
  source_kind: official
  contains_credentials:
  - auth_credentials
  volatility: |-
    Allowlist entries accumulate as the user approves commands, so this file grows into a de-facto record of every tool class ever permitted. One reported bug wrote project-scoped approvals into the global file instead of <project>/.cursor/cli.json. The vendor states the CLI repairs missing fields by itself and that a corrupted file is backed up as .bad and recreated, so the .bad copy is an earlier configuration the product preserved and the live file may be younger than the behaviour it is being read to explain.
  notes: |-
    THE PERMISSION RECORD FOR THE COMMAND LINE PRODUCT, and the file to read before any transcript from it. The vendor documents the four locations, the precedence CURSOR_CONFIG_DIR, then $XDG_CONFIG_HOME/cursor on Linux and BSD, then ~/.cursor, and states that only permissions can be set per project while every other setting is global.

    Two fields decide how much of a session was ever shown to anybody. approvalMode takes allowlist, auto-review or unrestricted, and the page names the values without defining them, so treat anything other than allowlist as a question for the transcript rather than as a proven bypass. sandbox.mode and sandbox.networkAccess decide whether the agent ran confined and whether it could reach the network at all.

    The permission grammar has four kinds and is exact-string matched: Shell(commandBase) where commandBase is the first token of the command line and where the vendor documents a Shell(curl:*) form for arguments, Read(pathOrGlob), Write(pathOrGlob), and WebFetch(domainOrPattern) where the page states that a fetch prompts unless a domain is allowed and shows WebFetch(*) as the entry that allows every domain. An allow list is therefore also an egress record: the domains in it are the ones the agent could reach without asking.

    This file also holds credential material, which is recorded here rather than as a separate entry, because a separate entry marked secret would stop the collector copying a file that is itself the evidence. Folded in from cursor.auth_credentials: RECORD HASH AND METADATA ONLY, never copy contents. The credential claim rests on third-party research rather than on the vendor page: newer builds are reported to store them in this same file under a top-level authInfo key. Also note CURSOR_API_KEY and CURSOR_AUTH_TOKEN as a non-file credential path.
  parser: json_generic
- id: cursor.project_mcp_definitions
  category: mcp_config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\projects\<escaped-abs-cwd>\mcps\<server-name>\SERVER_METADATA.json'
  - '%USERPROFILE%\.cursor\projects\<escaped-abs-cwd>\mcps\<server-name>\<tool-name>.json'
  - ~/.cursor/projects/<escaped-abs-cwd>/mcps/<server-name>/SERVER_METADATA.json
  - ~/.cursor/projects/<escaped-abs-cwd>/mcps/<server-name>/<tool-name>.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    Written when the project directory is first used and not pruned afterwards, so the set of servers here is cumulative rather than current. A server the user removed from the interface may still have its directory.
  notes: |-
    THE SERVER SURFACE THAT NOBODY CONFIGURED. This is where the measured hosts kept their tool server definitions, one directory per server under the per project agent directory, and it is not the global configuration file the rest of this catalogue expects. Both operating systems had it and neither had the global file.

    What makes it worth collecting before anything else in the project directory is that it was populated in the shipped state. On a fresh installation, with no user action and no server added, the measured hosts carried definitions for screen control, for browser control including the debugging protocol, and for subscriptions to three external services. For a governance question the presence of the editor is not the finding; this directory is.

    Record structure: SERVER_METADATA.json holds the server's own description, and one JSON file per tool holds that tool's name, description and argument schema. The tool file names are therefore an inventory of what the agent could call, readable without opening a single transcript.
  parser: json_generic
- id: cursor.project_mcp_instructions
  category: instructions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\projects\<escaped-abs-cwd>\mcps\<server-name>\INSTRUCTIONS.md'
  - ~/.cursor/projects/<escaped-abs-cwd>/mcps/<server-name>/INSTRUCTIONS.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    Written beside the server definition and not rewritten afterwards, so it is the text as it stood when the server directory was created rather than the text the server serves now.
  notes: |-
    INSTRUCTION TEXT THAT ARRIVES WITH A TOOL SERVER, which is the reason it is catalogued apart from the JSON definitions beside it. A tool server's instructions go into the agent's context the way a project instruction file does, and they come from whoever wrote the server rather than from the user. That makes this file part of the instruction surface the suite reports on, and a place where text the endpoint's owner never wrote can tell the agent what to do.

    Found on both measured hosts in the shipped state, one file per server directory, for servers nobody added.
  parser: instructions
- id: cursor.project_instructions
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/**/AGENTS.md
  - <project>/.cursor/rules/
  - <project>/.cursor/rules/**/*.mdc
  - <project>/.cursor/rules/*.mdc
  - <project>/.cursorrules
  - <project>/AGENTS.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://cursor.com/docs/context/rules
  source_kind: official
  unsourced_paths:
  - <project>/.cursorrules
  volatility: Version-controlled in most repos, so git history gives you the change timeline for free.
    Check `git log` on these paths and check for uncommitted modifications.
  notes: |-
    PRIMARY PROMPT-INJECTION SURFACE. Anyone who can land a rule file in a repository gets standing instructions for every contributor who opens it, and two of the four rule types need no user action at all: alwaysApply puts the file in every session, and a glob-scoped rule puts it in every session that touches a matching file. Collect the full text, not the filenames.

    Record structure: a rule is a .mdc file, markdown with YAML frontmatter carrying description, globs and alwaysApply, and it may sit in a folder below the rules directory. The vendor states that a plain .md file there is ignored for want of that frontmatter, so such a file is an instruction that did NOT reach the model, which reads differently from one that did. See crosscutting.instructions_cursor_rules, which holds that reasoning and the paths for the ignored spellings.

    The flat .cursorrules file is not mentioned on the current vendor page at all, not even as deprecated, so it stays unsourced here: it dates an install rather than proving a rule was read, and other agents read it too.

    The commands, plans, skills and subagent definitions that used to sit in this entry now have their own, each resting on the vendor page that documents it: cursor.commands_and_plans, cursor.skills and cursor.subagents.
  parser: instructions
- id: cursor.commands_and_plans
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.cursor/commands/*.md
  - <project>/.cursor/plans/
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/r3nzsec/irflow-timeline/a0af054723ef5db771098156979c52bb42ae703e/docs/dfir-tips/ai-apps/cursor.md
  source_kind: community
  volatility: A plan is working state until somebody keeps it. The vendor states a plan is saved in the
    user's home directory by default and only moves into the workspace when Save to workspace is clicked,
    so the copy in the project is the one somebody chose to keep and the default copy is elsewhere.
  notes: |-
    Split out of cursor.project_instructions when the vendor documentation became reachable: the rules and the instruction file could be promoted against a vendor page and these two could not. The vendor describes commands as markdown files holding a reusable prompt invoked with / in chat, and describes Plan Mode as writing a reviewable plan before any code is written, but neither page states a path, so the paths here still rest on a third-party DFIR reference.

    Both are evidence of intent rather than of action. A command is a prompt somebody wrote down and can re-run, so it is the closest thing to a script in this product's instruction surface. A plan is what the agent proposed to do, which is worth comparing against what the transcript shows it did.

    OPEN: where a plan goes when it is NOT saved to the workspace. The vendor says the home directory and names no path; the candidates under ~/.cursor are collected by cursor.agent_cli_state, which is where that answer will land when somebody finds it.
  parser: instructions
- id: cursor.skills
  category: instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/**/.agents/skills/
  - <project>/**/.cursor/skills/
  - <project>/.agents/skills/
  - <project>/.cursor/skills/
  - ~/.agents/skills/
  - ~/.cursor/skills/
  format: markdown
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://cursor.com/docs/skills
  source_kind: official
  volatility: Not swept. Publishing a personal skill to a team marketplace packs it into a plugin and the
    skill then loads from that plugin instead of the local folder, so the local copy can disappear while
    the skill stays active. Unpublishing returns it to the machine.
  notes: |-
    The vendor's own table of the four directories a skill is loaded from: .agents/skills/ and .cursor/skills/ at project level, ~/.agents/skills/ and ~/.cursor/skills/ at user level. A skill is a SKILL.md with YAML frontmatter and it enters the model's context when the agent decides it is relevant, so it is an instruction surface that needs no user action, exactly like an always-applied rule.

    DO NOT STOP AT THE PROJECT ROOT. The vendor states that a skills folder anywhere inside the repository is picked up and is automatically scoped to files under that directory, which is how a skill reaches a session without appearing anywhere a reviewer would look.

    ~/.agents/skills is not this vendor's directory. Several other agents load it too, so a skill found there steered whichever agent ran, and attributing it to one product by its path is wrong.

    Data leaving the endpoint: the vendor states that user-level skills in ~/.cursor/skills stay on the machine until they are synced for Cloud Agents or published to a team, and that ~/.agents/skills and unsynced local skills are not copied to Cloud Agents. So a synced or published skill is content that left the device, and the sync bookkeeping under ~/.cursor/skills-cursor, collected by cursor.agent_cli_state, is where to look for which ones.
  parser: instructions
- id: cursor.subagents
  category: instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.claude/agents/
  - <project>/.codex/agents/
  - <project>/.cursor/agents/
  - ~/.claude/agents/
  - ~/.codex/agents/
  - ~/.cursor/agents/
  format: markdown
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://cursor.com/docs/subagents
  source_kind: official
  volatility: Not swept. The vendor recommends checking the project directory into the repository, so git
    history usually carries the authorship and the timing.
  notes: |-
    A subagent is a markdown definition with frontmatter that the main agent delegates work to, so it is an instruction file that decides what a second agent was told to do. The vendor's table lists three project directories and three user directories, and states that the project ones win on a name conflict and that .cursor wins over .claude or .codex.

    TWO OF THE SIX DIRECTORIES BELONG TO OTHER VENDORS, and that is the point of collecting them here: a definition under .claude/agents or .codex/agents ran under THIS product when this product was the one in use. Reading a directory name as the agent that used it is wrong in both directions, and those paths are also claimed by the entries of the agents that own them, which is how the same file reaches an analyst from either side.

    The output of a background subagent is a separate artifact, cursor.subagent_output, and it is the only place that work is written down.
  parser: instructions
- id: cursor.subagent_output
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/subagents/
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://cursor.com/docs/subagents
  source_kind: official
  volatility: Working state between a subagent and its parent, so it is transient and is the kind of
    directory a cleanup empties. Collect it first.
  notes: |-
    The vendor states that background subagents write their output here and that the parent agent reads these files to check progress. That makes this the record of what a delegated agent actually did, and the main transcript may hold nothing but the parent's summary of it, so an analyst who only reads the conversation sees a second agent's work described rather than recorded.

    The file format is not documented, so nothing parses it yet. The files are collected whole and reach the case as read but uninterpreted, which is the state an analyst can act on: it says a record exists and that this tool has not mapped it, rather than saying nothing was there.
  parser: prose_document
- id: cursor.plugins
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/plugins/
  - ~/.cursor/plugins/local/
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://cursor.com/docs/plugins
  source_kind: official
  unsourced_paths:
  - ~/.cursor/plugins/
  notes: |-
    A plugin is a bundle of rules, skills, subagents, commands, MCP servers and hooks installed from a marketplace, so it delivers every extension surface this product has in one step and from a repository the endpoint's user does not control. An instruction or an MCP server that arrived this way is present in the product and absent from the project, which is the case that makes a repository-only search conclude nothing was configured.

    The vendor documents ~/.cursor/plugins/local as the folder a plugin is developed and loaded from, with either a root plugin.json or a .cursor-plugin/plugin.json manifest, and states that local imports can be switched off centrally and are off by default on one plan. Where an INSTALLED marketplace plugin lands is not stated on that page, so the parent directory is kept as an unsourced path rather than as a claim.

    A team marketplace is a repository the team points the product at, and the product re-indexes it on a push, so the content of a plugin can change on the endpoint without anyone on the endpoint doing anything.
  parser: json_generic
- id: cursor.bundled_skills
  category: instructions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\skills-cursor\.sync-manifest.json'
  - '%USERPROFILE%\.cursor\skills-cursor\<skill-name>\SKILL.md'
  - ~/.cursor/skills-cursor/.sync-manifest.json
  - ~/.cursor/skills-cursor/<skill-name>/SKILL.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    Synchronised from the vendor rather than written by the user, so the set here follows the product version and the account's entitlements and changes under the user without any local action. The manifest beside it records that synchronisation.
  notes: |-
    INSTRUCTION TEXT THE PRODUCT BRINGS WITH IT, separated from cursor.skills, which is the directory a user writes their own skills into. Both measured hosts had this one populated in the shipped state and the user's one absent, which is the wrong way round from how an analyst would guess it.

    Why it is worth reading rather than counting. A skill is instruction text that the agent loads and follows, so a shipped skill is an instruction the endpoint's owner did not write and did not see. The two measurements found twenty nine of them on macOS and forty nine files on Windows for the same product version, which also makes the contents of this directory a version and entitlement signal: two endpoints of the same version with different skill sets were entitled differently.

    It was split out of cursor.agent_cli_state, where it sat among paths none of which existed on either measured host.
  parser: instructions
- id: cursor.feature_flag_cache
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\statsig-cache.json'
  - ~/.cursor/statsig-cache.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    Refreshed from the vendor on start and overwritten wholesale, so it describes the account's entitlements at the last launch and holds no history.
  notes: |-
    WHAT THIS ACCOUNT WAS ALLOWED TO DO, which is a different question from what it did and is answerable without opening a transcript. A feature flag cache names the capabilities the vendor had switched on for this installation, and on macOS it was the largest single file in the agent directory at 818 kilobytes.

    Read it against the configuration rather than on its own. A flag that enables a capability the permission file does not allow, or the other way round, is the gap between what the product could do and what the endpoint's owner thought it could do.

    Distinct from the file of the same product name under the editor's global storage, which this catalogue carries as cursor.machine_identity_storage: that one is keyed to the device, this one sits in the agent directory and was found on both operating systems.
  parser: json_generic
- id: cursor.runtime_arguments
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\argv.json'
  - ~/.cursor/argv.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    Written once at installation and then only when somebody edits it, so its modification time is either the install date or the date somebody changed how the product starts.
  notes: |-
    THE FLAGS THE PRODUCT STARTS ITSELF WITH, inherited from the editor this product is derived from and present on both measured hosts at the same size in the shipped state. It is the file that turns on proposed and unreleased behaviour, disables the sandbox of the runtime, or points the crash reporter somewhere else, and none of that is visible anywhere in the interface.

    A file that is the shipped size and shipped content says nobody touched how the product starts. A file that differs from it is a deliberate change to the runtime by somebody with write access to the profile, and worth reading in full before anything else in the directory.
  parser: json_generic
- id: cursor.agent_data_cleanup_marker
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.cursor\projects\.agent-data-cleanup-<yyyy-mm-dd>'
  - ~/.cursor/projects/.agent-data-cleanup-<yyyy-mm-dd>
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    The file is empty and its evidentiary content is its own name, so it survives everything except deletion of the directory and it cannot be aged out by a retention setting that only prunes content.
  notes: |-
    A DATE IN A FILENAME, WRITTEN BY THE PRODUCT'S OWN CLEANUP. Both measured hosts had a zero byte file in the per-project directory whose name ends in a calendar date, left behind by whatever the product does when it tidies agent data.

    This is the one artifact in this entry's category whose content is worth nothing and whose name is worth a timeline entry. It says the product ran a cleanup on that date, which is a bound on what can still be expected in the directories beside it: material older than the date may be gone because the product removed it rather than because anybody tried to hide anything. An analyst who finds a transcript directory thinner than the conversation it describes should look here first.

    Nobody has read the cleanup's rules, so do not infer what it deleted, only that it ran. Collect every one of these files: more than one date means more than one cleanup, and the set of dates is the schedule.
  parser: text_log
- id: cursor.agent_store_sync
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\<session-uuid>\.sync\index.sqlite'
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\<session-uuid>\.sync\index.sqlite-wal'
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\<session-uuid>\files\**'
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\<session-uuid>\mount.json'
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\u<account-id>\.sync\index.sqlite'
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\u<account-id>\.sync\index.sqlite-wal'
  - '%LOCALAPPDATA%\Cursor\AgentStores\cursor_agent_stores\u<account-id>\files\**'
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/<session-uuid>/.sync/index.sqlite
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/<session-uuid>/.sync/index.sqlite-wal
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/<session-uuid>/files/**
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/<session-uuid>/mount.json
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/u<account-id>/.sync/index.sqlite
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/u<account-id>/.sync/index.sqlite-wal
  - ~/Library/Application Support/Cursor/AgentStores/cursor_agent_stores/u<account-id>/files/**
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: observed on Windows 11 26200 and macOS 26.5
  source_kind: observed
  volatility: |-
    The index is in write ahead log mode and the log held more than the database on the measured hosts, so the sidecar has to travel with the file. Rows in the pending delete tables are by definition about to stop existing.
  notes: |-
    A FILE SYNCHRONISATION INDEX PER AGENT SESSION, and the directory name is half the evidence. One directory is named with the same session identifier as the transcript directory of that session, which joins this store to that conversation without opening either. A second directory is named with the vendor's account identifier, prefixed, which puts the account on the endpoint in a path rather than inside a database.

    The tables are the reason this is filed as a file snapshot rather than as a cache. They are a file list, a metadata table, and two tables of pending deletions, one for files and one for directories. That is the record of what the agent had staged into its own store and what it was about to remove from it, and a pending deletion that never completed is the most useful row in a directory like this one.

    Both were empty of files on the measured hosts, which had one trivial conversation each. Do not read that as the normal case. Neither measurement opened these databases beyond counting rows, so the field names are unknown and the meaning of the metadata table is unknown.
  parser: sqlite_generic
- id: cursor.chat_session_prompt_history
  category: prompt_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/chats/<md5-hex-of-abs-workspace-path>/<session-uuid>/prompt_history.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/skillsynchq/txcript/c545075461a45edf609a252b8be932ad3a6c5052/docs/formats/cursor.md
  source_kind: community
  notes: |-
    Per-session prompt log. Survives independently of the blob store, so it can recover user intent even when store.db is corrupt or truncated.

    Re-checked against the vendor's own documentation by a second verification pass, after its site became reachable. The result is stronger than an absent source. The vendor documents around twenty paths under the same agent directory, among them the agent, skill, subagent, command and worktree directories and the configuration, hook and authentication files, and a chats directory is not one of them. Nothing in two hundred and fifty documentation pages, three changelogs, the data-use and security pages or the vendor's code hosting organization mentions this layout: no hit for the database filename, for the prompt history filename, for a chats directory, or for an md5 keyed directory level. Control searches against the same sources returned hundreds of results, so the absence is real rather than a failed search.

    A first hand measurement has since settled it in this layout's favour, for one operating system out of two. On a clean macOS 26.5 host running product version 3.21.16, the directory exists exactly as described: a hash keyed level under a chats directory, a session identifier under that, and inside it the store with a write ahead log holding almost all of its content, the per session input history and the metadata file. On a Windows 11 26200 host measured the same day with the same product version it does not exist at all, and a recursive search for every one of those filenames across the whole user profile found none of them. So this layout is real, it is not universal, and an agent directory on Windows without it is the ordinary case rather than a cleared one.

    There is also a contradicting lead, which is why this stays unverified rather than being dropped. Both the vendor's own cookbook and its software development kit documentation describe a per-workspace state root keyed by a slug, under a projects directory, not by a hash of the workspace path under a chats directory. This catalogue carries both layouts, and both of them were then found on the same macOS host at the same time, side by side under the same agent directory. They are not two guesses at one store: the slug keyed one holds the per project agent transcripts and the hash keyed one holds the command line product's own sessions. Collect the whole agent directory rather than either path list.
  parser: json_generic
- id: cursor.global_prompt_history
  category: prompt_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - $HOME/.cursor/prompt_history.json
  - '%USERPROFILE%\.cursor\prompt_history.json'
  - ~/.cursor/prompt_history.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://raw.githubusercontent.com/tuo-lei/vibe-replay/28d7d853daa121f1c06b17c8d44732aebd891f0b/website/src/content/blog/cursor-local-storage.md
  source_kind: community
  volatility: |-
    Rolling list with a version-dependent entry/size cap — older prompts are silently dropped, so this is a decaying artifact. Collect early.
  notes: |-
    Independently listed as a first-class collection target by two DFIR tools (UAC artifact file for Cursor; a Windows/osquery artifact catalogue that tags it family=history).

    Record structure: Flat JSON array of user prompt strings (workspace-wide, not per-session).

    Measured first hand on a clean Windows 11 26200 host and a clean macOS 26.5 host, both running product version 3.21.16, one installation and one trivial conversation each. There was no global file of this name on either host, and a recursive search for the filename found it nowhere on Windows. On macOS it was found one level per session deeper, inside the command line product's own session directory beside that session's store and metadata file, which this catalogue already carries as its own entry, cursor.chat_session_prompt_history. It is not repeated here, because one path claimed by two entries is collected twice and counted twice.

        Read the difference as a scope correction rather than as a contradiction. Both write-ups that name the global file describe a workspace wide list, and a per session file is a narrower thing that has to be collected per session and then merged. An analyst who globs only the top level of the agent directory gets nothing and concludes the user typed nothing.
  parser: json_generic
- id: cursor.acp_session_store
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.cursor/acp-sessions/<session-uuid>/meta.json
  - ~/.cursor/acp-sessions/<session-uuid>/store.db
  - ~/.cursor/acp-sessions/<session-uuid>/store.db-shm
  - ~/.cursor/acp-sessions/<session-uuid>/store.db-wal
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: unverified
  source: |-
    https://raw.githubusercontent.com/xintaofei/codeg/18046ea4ecc11a68f8f7bac9e54c99b28658dfe6/src-tauri/src/parsers/cursor.rs
  source_kind: community
  volatility: |-
    WAL/SHM present for live and recent stores. One teardown counted 74 session directories but only 71 store.db files — some sessions leave a directory with meta.json and no database.
  notes: |-
    STRUCTURALLY SEPARATE third Cursor CLI store, used when cursor-agent runs in ACP mode (`cursor-agent acp`, IDE/third-party harness integrations). Keyed by ACP session id, not by workspace hash — there is no md5(cwd) directory level. Rich tool-call arguments persist here that are absent from the legacy chats layout. Relocatable via CURSOR_CONFIG_DIR.

