  source: |-
    https://raw.githubusercontent.com/r3nzsec/irflow-timeline/a0af054723ef5db771098156979c52bb42ae703e/docs/dfir-tips/ai-apps/cursor.md
  source_kind: community
  volatility: |-
    Append-only mirror, unbounded, no rotation observed. An ACP-only session never appears here at all (live-tested and confirmed by one source), so absence here is NOT absence of activity.
  notes: |-
    Plaintext canonical transcript, by far the easiest Cursor CLI artifact to read. Paired sidecars: agent-tools/*.txt. Some tooling also reports a per-transcript index .db built by third parties, not by Cursor — do not attribute that to the product.

