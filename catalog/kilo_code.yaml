# Kilo Code artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: kilo_code
title: Kilo Code
vendor: Kilo Code
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/Kilo-Org/
- https://raw.githubusercontent.com/Kilo-Org/
- https://kilocode.ai/
references:
- https://github.com/kenn-io/agentsview/blob/main/docs/configuration.md
- |-
  https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/code-with-ai/agents/session-history.md
- https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-modes.md
env_overrides:
- name: KILO_DB
  effect: |-
    Moves the session database away from the documented default, so a collection keyed on the default path finds nothing on such a host. The vendor's own guidance is to ask the product where its database is rather than to assume the path.
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/code-with-ai/agents/session-history.md
- name: XDG_DATA_HOME
  effect: |-
    Moves the session database, which the vendor documents as living under the XDG data directory on every platform including Windows, where the documented default is the user profile joined with .local\\share.
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/code-with-ai/agents/session-history.md
- name: XDG_CONFIG_HOME
  effect: |-
    Moves the global configuration file and the global agent definitions beside it, which the vendor documents as living under the XDG configuration directory.
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-rules.md
- name: KILO_CONFIG_CONTENT
  effect: |-
    Supplies configuration as the content of an environment variable rather than as a file, and the vendor's precedence list puts it above every file. A host configured this way has the highest-priority configuration in no file at all, so a collection can be complete and still not hold what the agent was actually run with. Look for it in the shell profiles and in whatever started the process.
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-modes.md
artifacts:
- id: kilo_code.config
  title: Kilo Code configuration file
  category: config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - $XDG_CONFIG_HOME/kilo/kilo.jsonc
  - '%USERPROFILE%\.config\kilo\kilo.jsonc'
  - <project>/kilo.jsonc
  - ~/.config/kilo/kilo.jsonc
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-rules.md
  source_kind: official
  unsourced_paths:
  - '%USERPROFILE%\.config\kilo\kilo.jsonc'
  volatility: |-
    User-edited. The project one is normally under version control and the global one is not.
  notes: |-
    The configuration of the current product, which the entries beside this one did not have: they cover the legacy extension's custom_modes.yaml and .kilocodemodes, and this is what replaced them. The vendor's rules page gives the global path as ~/.config/kilo/kilo.jsonc and the modes page gives the project one as kilo.jsonc at the project root, with the precedence built-in, then global, then project, then the .kilo and legacy .kilocode directories, then an environment variable.

    Two things in it are evidence in their own right. The instructions key names the rule files that are loaded, so this file is the index of the instruction surface even where the rule files themselves are elsewhere. The agent key defines agents inline, including their permissions, so a permission decision can live here rather than in any of the directories the entries below collect.

    It is JSON with comments, which is what the extension says and what the file name says. The reader for this format takes the dialect and says on the event when it had to.

    The Windows spelling is unsourced: the vendor documents the Windows database path as the user profile joined with .local\\share, which is the XDG layout spelled literally rather than an application-data path, so the configuration directory is written the same way here and marked as not stated by the source.
  parser: json_generic
- id: kilo_code.agents
  title: Kilo Code agent definitions
  category: instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.config\kilo\agent\**\*.md'
  - <project>/.kilo/agent/**/*.md
  - <project>/.kilo/agents/**/*.md
  - <project>/.kilocode/agents/**/*.md
  - ~/.config/kilo/agent/**/*.md
  format: markdown
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-modes.md
  source_kind: official
  unsourced_paths:
  - '%USERPROFILE%\.config\kilo\agent\**\*.md'
  volatility: |-
    User-authored, and the product writes one itself when somebody asks it to create an agent. Not swept.
  notes: |-
    An agent definition is a Markdown file with YAML frontmatter, and the frontmatter is where this stops being only an instruction: it carries a permission block with edit globs set to allow or deny and a bash key, so a file in a project directory decides what the agent may do. The vendor's own example denies everything but Markdown edits and denies bash; the same shape grants.

    The filename is the agent name and nested directories namespace it. Four directories are read, .kilo/agents and .kilo/agent in the project, the legacy .kilocode/agents beside them, and the global one under the configuration directory, and the vendor also states that asking the product to create an agent writes it into the project.
  parser: instructions
- id: kilo_code.rules
  title: Kilo Code rule files
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.kilo/rules/**/*.md
  - <project>/.kilocode/rules/**/*.md
  format: markdown
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-rules.md
  source_kind: official
  volatility: |-
    Ordinary project files, normally under version control, so a superseded rule is usually recoverable from git.
  notes: |-
    Standing instructions for a project, which is the injected-instruction surface anybody who can commit to the repository can write. The current shape is a .kilo/rules directory named by the instructions key of the configuration file; the legacy .kilocode/rules directory is still read for backward compatibility and the vendor says so.

    Which of them were in force for a given turn is not decidable from the files: the configuration names them and the transcript is the arbiter.
  parser: instructions
- id: kilo_code.home_dir
  category: config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.kilocodemodes
  - ~/.kilocode/cli/global/settings/custom_modes.yaml
  format: yaml
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: verified
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-modes.md
  source_kind: official
  notes: |-
    Official docs state the CLI 'maintains compatibility by reading legacy mode files from ~/.kilocode/cli/global/settings/custom_modes.yaml and project-level .kilocodemodes files, with the last loaded source wins' and that 'Project-level .kilocodemodes and workspace-scoped files are handled by the CLI backend that the extension delegates to'. The wider shape of the ~/.kilocode tree (whether transcripts, credentials or MCP config also live there) was NOT established - treat ~/.kilocode as a directory to enumerate wholesale rather than a set of known files.
  parser: yaml_generic
- id: kilo_code.settings
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Code\User\globalStorage\kilocode.kilo-code\settings\custom_modes.yaml'
  - ~/.config/Code/User/globalStorage/kilocode.kilo-code/settings/custom_modes.yaml
  - ~/Library/Application Support/Code/User/globalStorage/kilocode.kilo-code/settings/custom_modes.yaml
  format: yaml
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: verified
  source: https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/customize/custom-modes.md
  source_kind: official
  volatility: |-
    The doc states: 'After the extension migrates on startup, the legacy file is no longer consulted' - so this file can be a stale snapshot of a pre-migration configuration, which is itself dateable evidence.
  notes: |-
    Official Kilo docs give all three OS paths verbatim and label the file LEGACY. Custom modes encode per-mode tool and file-access restrictions, so this is partly a permissions artifact.
  parser: yaml_generic
- id: kilo_code.cli_db
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.local\share\kilo\kilo.db'
  - '%USERPROFILE%\.local\share\kilo\kilo.db-shm'
  - '%USERPROFILE%\.local\share\kilo\kilo.db-wal'
  - ~/.local/share/kilo/kilo.db
  - ~/.local/share/kilo/kilo.db-shm
  - ~/.local/share/kilo/kilo.db-wal
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/Kilo-Org/kilocode/main/packages/kilo-docs/pages/code-with-ai/agents/session-history.md
  source_kind: official
  unsourced_paths:
  - '%USERPROFILE%\.local\share\kilo\kilo.db-shm'
  - '%USERPROFILE%\.local\share\kilo\kilo.db-wal'
  volatility: |-
    Official doc warns 'resetting the database removes local session history, so back it up before recovery work'. WAL means the newest messages may be only in kilo.db-wal - acquire all three files together.
  notes: |-
    MAJOR ARCHITECTURE CHANGE the brief does not cover: Kilo Code is no longer a pure Roo-style fork. It now runs a shared 'Kilo agent runtime' derived from OpenCode (see packages/opencode/ in the repo) and persists sessions to SQLite. The official path table is unusual: Windows is documented as %USERPROFILE%\.local\share\kilo\kilo.db - i.e. Kilo uses the XDG-style .local/share layout on Windows too, NOT %APPDATA%. For VS Code Remote SSH the doc says the db is 'on the remote machine'. Third-party collectors additionally report the extension's globalStorage task logs being usable 'on Linux & remote/WSL only' on recent builds - worth verifying per endpoint.

    Record structure: Official schema, three tables: session(id, title, directory, time_updated - time_updated is epoch MILLIseconds, the doc uses datetime(time_updated/1000,'unixepoch')); message(session_id, data JSON, time_created); part(message_id, data JSON, id). session.directory gives the workspace path, which is the project-attribution key the globalStorage tree lacks.

    BEFORE ANYBODY WRITES A PARSER FOR THE data COLUMNS: the columns are documented and their contents are not. The runtime this store comes from carries three generations of message shape in one tree, and the tables above are written with the second: packages/opencode/src/session/message.ts defines a v1 message whose parts are inline under metadata, packages/opencode/src/session/message-v2.ts is the row-per-message-and-part model these two tables hold, and the upstream schema at packages/core/src/database/schema.gen.ts has since added a session_message table with a different union again. Kilo's own cloud import in packages/opencode/src/kilocode/session-import/types.ts writes MessageData (a role union of user and assistant) and PartData (text, reasoning, tool) into exactly these columns, which is one writer rather than the definition, and message-v2.ts refers to a compaction part that the import union does not list. So the shape has to be verified per generation against the code that writes it, and until that is done the rows are carried whole. A parser that mapped one generation would read some endpoints correctly and report the rest as an agent that stored nothing.
  parser: sqlite_generic
- id: kilo_code.extension_id_legacy_tree
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Code\User\globalStorage\kilocode.kilo-code\tasks\'
  - ~/.config/Code/User/globalStorage/kilocode.kilo-code/tasks/
  - ~/.vscode-server/data/User/globalStorage/kilocode.kilo-code/tasks/
  - |-
    ~/Library/Application Support/Code/User/globalStorage/kilocode.kilo-code/tasks/<taskId>/api_conversation_history.json
  - ~/Library/Application Support/Code/User/globalStorage/kilocode.kilo-code/tasks/<taskId>/task_metadata.json
  - ~/Library/Application Support/Code/User/globalStorage/kilocode.kilo-code/tasks/<taskId>/ui_messages.json
  format: json
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: unverified
  source: https://github.com/kenn-io/agentsview/blob/main/docs/configuration.md
  source_kind: community
  volatility: |-
    LEGACY STORE. Kilo has migrated to a SQLite store (see kilo_code.cli_db); the extension 'migrates on startup' for modes and the old tree is then no longer consulted. Expect stale-but-present task dirs on upgraded endpoints.
  notes: |-
    The extension folder id 'kilocode.kilo-code' is confirmed by Kilo's OWN documentation (packages/kilo-docs/pages/customize/custom-modes.md gives the full macOS/Linux/Windows triple for .../globalStorage/kilocode.kilo-code/settings/custom_modes.yaml) - that part is high confidence and official. The tasks/<taskId>/ triple is attested by independent third-party parsers rather than by Kilo docs: kenn-io/agentsview describes '<vscode-globalStorage>/kilocode.kilo-code/tasks/<uuid>/ with task_metadata.json (only files_in_context), the Claude-shaped api_conversation_history.json, and the Cline-shaped ui_messages.json', and junhoyeo/tokscale and getagentseal/codeburn hard-code the same path. Marked medium confidence for the file triple, high for the folder id.

    Record structure: Task dirs are identified by the presence of task_metadata.json; the id is a UUID. Same Cline-family JSON shapes.
  parser: cline
