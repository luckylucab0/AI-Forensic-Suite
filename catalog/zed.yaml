# Zed artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: zed
title: Zed
vendor: Zed Industries
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/zed-industries/
- https://raw.githubusercontent.com/zed-industries/
- https://zed.dev/
references:
- https://raw.githubusercontent.com/zed-industries/zed/main/crates/agent/src/db.rs
- https://raw.githubusercontent.com/zed-industries/zed/main/crates/agent_ui/src/thread_metadata_store.rs
- https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
- https://raw.githubusercontent.com/zed-industries/zed/main/docs/src/ai/mcp.md
env_overrides:
- name: FLATPAK_XDG_CONFIG_HOME
  effect: |-
    Replaces the configuration directory outright when the editor runs as a Flatpak, so the settings file and the user-global AGENTS.md are not under the documented path at all. config_dir() in crates/paths/src/paths.rs reads it before falling back to the freedesktop directory.
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
- name: FLATPAK_XDG_DATA_HOME
  effect: |-
    The same for the data directory, which holds the conversation store, the prompt library and the semantic index. This catalogue already carries one Flatpak path for an older store, which is what makes the variable worth declaring: the current tree moves the same way.
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
- name: FLATPAK_XDG_STATE_HOME
  effect: |-
    The same for the state directory.
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
artifacts:
- id: zed.threads_db
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/zed/threads/threads.db
  - $XDG_DATA_HOME/zed/threads/threads.db-shm
  - $XDG_DATA_HOME/zed/threads/threads.db-wal
  - '%LOCALAPPDATA%\Zed\threads\threads.db'
  - '%LOCALAPPDATA%\Zed\threads\threads.db-shm'
  - '%LOCALAPPDATA%\Zed\threads\threads.db-wal'
  - ~/.local/share/zed/threads/threads.db
  - ~/.local/share/zed/threads/threads.db-shm
  - ~/.local/share/zed/threads/threads.db-wal
  - ~/Library/Application Support/Zed/threads/threads.db
  - ~/Library/Application Support/Zed/threads/threads.db-shm
  - ~/Library/Application Support/Zed/threads/threads.db-wal
  format: sqlite
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/agent/src/db.rs
  source_kind: source_code
  unsourced_paths:
  - $XDG_DATA_HOME/zed/threads/threads.db-shm
  - $XDG_DATA_HOME/zed/threads/threads.db-wal
  - '%LOCALAPPDATA%\Zed\threads\threads.db-shm'
  - '%LOCALAPPDATA%\Zed\threads\threads.db-wal'
  - ~/.local/share/zed/threads/threads.db-shm
  - ~/.local/share/zed/threads/threads.db-wal
  - ~/Library/Application Support/Zed/threads/threads.db-shm
  - ~/Library/Application Support/Zed/threads/threads.db-wal
  volatility: |-
    No automatic expiry. If ZED_STATELESS is set, an in-memory database is used and NOTHING is persisted. If the file DB cannot be opened Zed falls back to an in-memory DB, so absence of the file does not prove absence of use.
  notes: |-
    The single biggest collection trap in this family: because thread content is zstd-compressed inside a BLOB, keyword searching or strings-ing threads.db finds NOTHING. A collector must decompress the data column before any indexing or the entire Zed corpus reads as empty. parent_id gives subagent thread hierarchy.

    Record structure: crates/agent/src/db.rs: threads_dir = paths::data_dir().join('threads'); sqlite_path = threads_dir.join('threads.db'). Schema: CREATE TABLE IF NOT EXISTS threads (id TEXT PRIMARY KEY, summary TEXT NOT NULL, updated_at TEXT NOT NULL, data_type TEXT NOT NULL, data BLOB NOT NULL), with migrations adding parent_id TEXT, folder_paths TEXT, folder_paths_order TEXT, created_at TEXT. THE CONVERSATION IS IN THE data BLOB: data_type 'zstd' means zstd-compressed JSON (compressed with zstd::encode_all at level 3), data_type 'json' means uncompressed legacy JSON. The JSON carries a version field. per-OS data_dir from crates/paths/src/paths.rs: macOS home_dir().join('Library/Application Support').join('Zed'); Linux/FreeBSD dirs::data_local_dir().join('zed') with FLATPAK_XDG_DATA_HOME override; Windows dirs::data_local_dir().join('Zed') i.e. %LOCALAPPDATA%\Zed.
  parser: zed
- id: zed.extensions
  category: install_evidence
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/zed/copilot/
  - $XDG_DATA_HOME/zed/debug_adapters/
  - $XDG_DATA_HOME/zed/devcontainer/
  - $XDG_DATA_HOME/zed/extensions/
  - $XDG_DATA_HOME/zed/external_agents/
  - $XDG_DATA_HOME/zed/prompt_overrides/
  - $XDG_DATA_HOME/zed/remote_extensions/
  - $XDG_DATA_HOME/zed/remote_servers/
  - $XDG_DATA_HOME/zed/server_state/
  - '%LOCALAPPDATA%\Zed\copilot\'
  - '%LOCALAPPDATA%\Zed\debug_adapters\'
  - '%LOCALAPPDATA%\Zed\devcontainer\'
  - '%LOCALAPPDATA%\Zed\extensions\'
  - '%LOCALAPPDATA%\Zed\external_agents\'
  - '%LOCALAPPDATA%\Zed\prompt_overrides\'
  - '%LOCALAPPDATA%\Zed\remote_extensions\'
  - '%LOCALAPPDATA%\Zed\remote_servers\'
  - '%LOCALAPPDATA%\Zed\server_state\'
  - ~/Library/Application Support/Zed/copilot/
  - ~/Library/Application Support/Zed/debug_adapters/
  - ~/Library/Application Support/Zed/devcontainer/
  - ~/Library/Application Support/Zed/extensions/
  - ~/Library/Application Support/Zed/remote_extensions/
  - ~/Library/Application Support/Zed/remote_servers/
  - ~/Library/Application Support/Zed/server_state/
  - ~/.config/zed/prompt_overrides/
  - ~/Library/Application Support/Zed/external_agents/
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  volatility: Persistent until removed.
  notes: |-
    external_agents/ is the important one: it records ACP (Agent Client Protocol) agents installed into Zed. Those agents write their OWN transcripts elsewhere - e.g. a Claude-based ACP agent writes to ~/.claude/projects/<normalized-path>/*.jsonl - so this directory tells you which OTHER agent families to go and collect. prompt_overrides/ can silently replace Zed's built-in prompts.

    Path correction from the source verification pass: this entry rooted four of its five paths at a data directory environment variable that the editor does not read. The only override is a function call inside the process, so the variable is unset on every host and all four patterns resolved to nothing, on every platform, without any error. They are written out per platform now, from the defaults the path crate states.

    Five directories added by the pass that read the path crate end to end, all of them data_dir joins from crates/paths/src/paths.rs. copilot_dir is where this product downloads the language server of an AI completion service, which is install evidence for an AI feature rather than for an extension somebody chose. remote_servers_dir and remote_server_state_dir hold the server binaries and the state for this product's remote development, which means the agent's work can have happened on another machine entirely, and this is the local record that it did. devcontainer_dir and remote_extensions_dir are the same shape for a container and for extensions pushed to a remote host.

        The prompts directory used to be the fifth path here, with the macOS spelling only, on the reasoning that prompts_dir sits under the configuration directory. That is true on macOS and false everywhere else: prompts_dir is config_dir/prompts on macOS and data_dir/prompts on Linux and Windows, so the one spelling collected nothing on two platforms. It is zed.prompt_library now, in its own entry, because what is in it is the user's own instruction text rather than evidence that something was installed.

    Checked helper by helper against the path crate at the same time, because that is where the mistake above came from: extensions_dir, debug_adapters_dir and external_agents_dir are all data_dir joins, so the three spellings of each are right. prompt_overrides_dir is not: like prompts_dir it is config_dir/prompt_overrides on macOS and data_dir/prompt_overrides elsewhere, and the macOS spelling here pointed at the data directory, where the editor never writes it. It is ~/.config/zed/prompt_overrides/ now. The directory matters because a file in it silently replaces one of the prompts the product ships.
  parser: null
- id: zed.logs
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/zed/logs/
  - '%LOCALAPPDATA%\Zed\logs\'
  - ~/Library/Logs/Zed/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  volatility: Rotation not established from the source reviewed; treat as volatile.
  notes: |-
    On macOS this is a THIRD top-level location (~/Library/Logs/Zed) separate from both the data and config dirs. Captures MCP/context-server startup and failures, which corroborates the settings.json inventory.

    Record structure: crates/paths/src/paths.rs logs_dir(): macOS home_dir().join('Library/Logs').join('Zed'); all other platforms data_dir().join('logs'). Filenames not enumerated - list the directory.
  parser: text_log
- id: zed.prompt_library
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/zed/prompts/
  - '%LOCALAPPDATA%\Zed\prompts\'
  - ~/.config/zed/prompts/
  - ~/.local/share/zed/prompts/
  format: lmdb
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/prompt_store/src/prompt_store.rs
  source_kind: source_code
  volatility: |-
    Persistent until the user deletes a prompt. Nothing rotates or sweeps this store, and a deleted prompt leaves its bytes in the free pages of the database file until they are reused.
  notes: |-
    The editor's prompt library: the text a user wrote for the agent to obey, with a title and the time each one was last saved. It is the instruction surface of this agent and it is in no transcript: a thread records that a prompt was used, and this is what the prompt said.

    Record structure: crates/prompt_store/src/prompt_store.rs init() builds the path as paths::prompts_dir().join('prompts-library-db.0.mdb'), then PromptStore::new does create_dir_all on it and opens it with heed::EnvOpenOptions (LMDB) without NO_SUBDIR, so the path is a directory holding data.mdb and lock.mdb. Two named sub-databases: 'metadata.v2' maps a JSON PromptId to a JSON PromptMetadata (id, title, default, saved_at as an RFC 3339 UTC time), and 'bodies.v2' maps the same key to the prompt text as a plain UTF-8 string. max_dbs is 4 because v1 of both can still be present. The whole store is one directory, so collect it whole: data.mdb is the database and lock.mdb carries no records.

    per-OS prompts_dir from crates/paths/src/paths.rs: prompts_dir() is config_dir().join('prompts') on macOS and data_dir().join('prompts') everywhere else. config_dir() on macOS falls to the last branch, home_dir().join('.config').join('zed'), so the macOS store is under ~/.config/zed and not under Library. data_dir() is dirs::data_local_dir().join('zed') on Linux, with a FLATPAK_XDG_DATA_HOME override, and dirs::data_local_dir().join('Zed') on Windows. So the Linux and Windows stores are under the data directory and the macOS one is not, which is the split that cost this artifact two platforms while it was a path inside zed.extensions.
  parser: prompt_library
- id: zed.settings
  category: mcp_config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_CONFIG_HOME/zed/settings.json
  - '%APPDATA%\Zed\settings.json'
  - <project>/.zed/settings.json
  - ~/.config/zed/settings.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/docs/src/configuring-zed.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    context_servers is the Zed MCP inventory with full command lines and env, including any inline secrets. The macOS config/data split is a frequent acquisition miss: imaging only ~/Library/Application Support/Zed gets the transcripts but not the MCP configuration.

    Re-sourced by the verification pass: the page cited before says only your settings file and states no path at all. The configuration guide lists all four spellings verbatim.
  parser: json_generic
- id: zed.flatpak_legacy_threads
  category: transcript
  root: user_profile
  os:
  - linux
  paths:
  - ~/.var/app/dev.zed.Zed/data/zed/threads/threads-db.1.mdb/
  format: lmdb
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: recollection
  source_kind: community
  volatility: |-
    Unknown. If it is what it is reported to be, nothing in the current product manages or deletes it, so it outlives the conversations it holds.
  notes: |-
    Unverified and worth globbing for on Linux images anyway: if present it is a pre-SQLite thread corpus that no current Zed code manages or deletes. Note the Flatpak sandbox relocates the whole Zed tree under ~/.var/app/dev.zed.Zed/, which also breaks every other Zed path in this catalogue.

    Record structure: an LMDB store rather than SQLite, reported for the Flatpak build and/or older versions. What can be checked against the vendor's source was checked, and it neither confirms nor refutes this path. Current main keeps threads in SQLite at data_dir()/threads/threads.db (crates/agent/src/db.rs, which is the source of zed.threads_db), and the one crate that still depends on heed, which is the Rust binding for LMDB, is prompt_store: it opens paths::prompts_dir()/prompts-library-db.0.mdb, which is zed.prompt_library. So an .mdb under threads/ is not something current code writes, and the file name pattern is the one heed produces, which is consistent with an older build having written it and with nobody having removed it.

    The original claim comes from a user's report in a zed-industries GitHub discussion, retrieved as a search summary rather than fetched, which is why this stays unverified and community. It is read by the uninterpreted floor for this format: nobody here has a schema for what is in it, so a collection of one produces its records with their keys and values and says on every event that nothing was decided about them.
  parser: lmdb_generic
- id: zed.sidebar_threads
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/zed/db/0-<release_channel>/db.sqlite
  - $XDG_DATA_HOME/zed/db/0-<release_channel>/db.sqlite-shm
  - $XDG_DATA_HOME/zed/db/0-<release_channel>/db.sqlite-wal
  - '%LOCALAPPDATA%\Zed\db\0-<release_channel>\db.sqlite'
  - '%LOCALAPPDATA%\Zed\db\0-<release_channel>\db.sqlite-shm'
  - '%LOCALAPPDATA%\Zed\db\0-<release_channel>\db.sqlite-wal'
  - ~/Library/Application Support/Zed/db/0-stable/db.sqlite
  - ~/Library/Application Support/Zed/db/0-stable/db.sqlite-shm
  - ~/Library/Application Support/Zed/db/0-stable/db.sqlite-wal
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/db/src/db.rs
  source_kind: source_code
  unsourced_paths:
  - $XDG_DATA_HOME/zed/db/0-<release_channel>/db.sqlite-shm
  - $XDG_DATA_HOME/zed/db/0-<release_channel>/db.sqlite-wal
  - '%LOCALAPPDATA%\Zed\db\0-<release_channel>\db.sqlite-shm'
  - '%LOCALAPPDATA%\Zed\db\0-<release_channel>\db.sqlite-wal'
  - ~/Library/Application Support/Zed/db/0-stable/db.sqlite-shm
  - ~/Library/Application Support/Zed/db/0-stable/db.sqlite-wal
  volatility: |-
    Migration-populated. The migration only unarchives the 5 most recent threads per project and archives the rest; draft threads with no project are archived by default; threads with no project are excluded from migration entirely.
  notes: |-
    Newly discovered and NOT in the starting brief: Zed has moved thread metadata into a sidebar_threads store separate from threads.db. It is the only place agent_id, remote_connection and interacted_at live - i.e. WHICH agent (native or an external ACP agent) ran a thread, and whether it ran over a remote connection. It also carries an archived flag, so archived threads are hidden in the UI but fully present on disk. A known bug class is old threads remaining in threads.db but never reaching sidebar_threads, so the two stores must be reconciled rather than either being trusted alone.

    Re-sourced by the verification pass: the store cited before opens the shared database through a macro and names no path. This file holds the database filename and the release-channel directory name, and the path crate supplies the per-platform database directory.
  parser: zed_sidebar
- id: zed.user_agent_instructions
  title: User-global agent instructions (AGENTS.md)
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_CONFIG_HOME/zed/AGENTS.md
  - '%APPDATA%\Zed\AGENTS.md'
  - ~/.config/zed/AGENTS.md
  format: markdown
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  volatility: |-
    A file the user edits, not written by the product on a timer, so it persists until somebody changes it and it outlives every conversation it shaped.
  notes: |-
    THE INSTRUCTION SURFACE OF THIS PRODUCT AT PROFILE SCOPE, and it was in no entry of this catalogue. The vendor's own comment on agents_file() in crates/paths/src/paths.rs says what it is: 'This file holds personal agent instructions that apply to every project the user opens, and is loaded into the native Zed agent's system prompt.'

    So it is the answer to what the agent was told to obey on this machine, for every project, and a conversation that looks inexplicable is often explained by it. A collection that missed it read the transcripts and not the standing orders behind them.

    agents_file() = config_dir().join("AGENTS.md"). config_dir() is %APPDATA%\Zed on Windows, the freedesktop configuration directory joined with 'zed' on Linux and FreeBSD, and ~/.config/zed elsewhere, which includes macOS. The Flatpak variable above replaces it.
  parser: instructions
- id: zed.user_configuration
  title: User configuration beside the settings file
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_CONFIG_HOME/zed/debug.json
  - $XDG_CONFIG_HOME/zed/global_settings.json
  - $XDG_CONFIG_HOME/zed/keymap.json
  - $XDG_CONFIG_HOME/zed/keymap_backup.json
  - $XDG_CONFIG_HOME/zed/settings_backup.json
  - $XDG_CONFIG_HOME/zed/tasks.json
  - '%APPDATA%\Zed\debug.json'
  - '%APPDATA%\Zed\global_settings.json'
  - '%APPDATA%\Zed\keymap.json'
  - '%APPDATA%\Zed\keymap_backup.json'
  - '%APPDATA%\Zed\settings_backup.json'
  - '%APPDATA%\Zed\tasks.json'
  - ~/.config/zed/debug.json
  - ~/.config/zed/global_settings.json
  - ~/.config/zed/keymap.json
  - ~/.config/zed/keymap_backup.json
  - ~/.config/zed/settings_backup.json
  - ~/.config/zed/tasks.json
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  volatility: |-
    The two backup files are the interesting ones: the product writes them when it rewrites the file beside them, so each holds a configuration that was in force before the current one. Nothing prunes them.
  notes: |-
    The settings file has its own entry; these are its siblings, each named by its own resolver in crates/paths/src/paths.rs: global_settings_file, settings_backup_file, keymap_file, keymap_backup_file, tasks_file and debug_scenarios_file, all joined to config_dir().

    Two of them answer questions the settings file cannot. settings_backup.json is what the configuration was before the change that produced the current one, which is the closest thing this product has to a history of its own agent settings. And tasks.json is a list of commands the editor will run on request, user authored, which is executable content in a configuration file: a task added shortly before the period under investigation is worth reading in full.
  parser: json_generic
- id: zed.task_definitions
  title: Project task and debug definitions
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.vscode/launch.json
  - <project>/.vscode/tasks.json
  - <project>/.zed/debug.json
  - <project>/.zed/tasks.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  volatility: |-
    Committed with the repository as a rule, so a clone brings them back and the git history of the working copy says who added one and when. A task file that is present and in no commit was written locally.
  notes: |-
    Commands the editor runs, in a file that travels with the repository. local_tasks_file_relative_path() is '.zed/tasks.json' and debug_task_file_name() is 'debug.json' under the same folder, both from crates/paths/src/paths.rs.

    The two .vscode paths are the same resolver's compatibility half: local_vscode_tasks_file_relative_path() is '.vscode/tasks.json' and local_vscode_launch_file_relative_path() is '.vscode/launch.json', so this product reads the other editor's task files as well. Two consequences, and the second is the one to be careful about. A task defined for one editor is runnable in the other, so the command surface of a checked-out repository is the union of the two. And the presence of a .vscode folder is not evidence that the other editor was used, which is the same trap the cross-cutting instruction files carry for the rule files of other agents.
  parser: instructions
- id: zed.semantic_index
  title: Semantic index of the user's code
  category: cache
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_DATA_HOME/zed/embeddings/
  - '%LOCALAPPDATA%\Zed\embeddings\'
  - ~/Library/Application Support/Zed/embeddings/
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  notes: |-
    embeddings_dir() in crates/paths/src/paths.rs, under the data directory on every platform this catalogue covers. What is in it is a derived index rather than the code itself, and it is here for one question: which files the product had indexed, which is a statement about what was in scope for the agent even after the working copy is gone. The index format is the product's own and is not read here.
  parser: null
- id: zed.state_tree
  title: State directory
  category: cache
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $XDG_STATE_HOME/zed/
  - '%LOCALAPPDATA%\Zed\'
  - ~/.local/state/Zed/
  - ~/.local/state/zed/
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/zed-industries/zed/main/crates/paths/src/paths.rs
  source_kind: source_code
  notes: |-
    state_dir() in crates/paths/src/paths.rs, and the three platforms disagree about where it is: ~/.local/state/Zed on macOS, the freedesktop state directory joined with 'zed' on Linux and FreeBSD, and the local application data directory on Windows, where it is the same directory as the data tree.

    What the product keeps in it is not stated in the module that names it, so this entry collects the tree and describes it as a tree. Both spellings of the macOS and Linux form are listed because the case of the last segment differs between them, which is exactly the kind of detail a hand-written glob gets wrong.
  parser: null
