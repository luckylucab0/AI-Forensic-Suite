  - /etc/claude-desktop/managed-settings.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/configuration
  source_kind: official
  contains_credentials:
  - inferenceGatewayApiKey
  record_types:
  - same configuration keys as the macOS plist and Windows registry, flat at the top level
  volatility: |-
    Replaced by configuration management. The app rejects the whole file if /etc/claude-desktop is a symlink, is not root-owned, or is group- or world-writable, and logs the reason to main.log.
  notes: |-
    Anthropic's Cowork changelog records the addition: 'administrators can provision settings in a root-owned /etc/claude-desktop/managed-settings.json, validated against the same schema as the macOS and Windows sources'. Distinct from Claude Code's /etc/claude-code/managed-settings.json, which is a different file for a different product and is also read by Desktop's sessions. If the file is present but rejected, the device is treated as managed but unreadable and local settings are disabled too, so a rejected file changes behaviour and is worth reporting.
