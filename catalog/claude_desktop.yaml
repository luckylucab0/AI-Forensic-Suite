# Claude Desktop artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: claude_desktop
title: Claude Desktop
vendor: Anthropic
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://claude.com/docs/
- https://code.claude.com/docs/
- https://platform.claude.com/docs/
- https://docs.claude.com/
- https://support.claude.com/
- https://www.anthropic.com/
- https://github.com/anthropics/
description: |-
  Anthropic's desktop application, which is now one application with a chat surface, an agentic surface called Cowork and a surface that runs the Claude Code command line agent, so on an endpoint it is no longer cleanly separable from that command line product: several paths belong to both and the catalogue says which. Four things decide what a collection means here. The vendor's own page documenting the on-disk layout is written for a managed third-party deployment whose directory carries a distinct name, and a sibling page states that a standard install uses the same layout under the ordinary name, which is why the standard spellings in this file are marked unsourced rather than dropped. On Windows the root is genuinely uncertain: the vendor states one location, documents a completed move to another for the managed build, and a packaged install redirects writes to a third under a package container, so probe all three and record which had content. Every Cowork and chat session carries an append-only event log whose entries are chained so that deletions are detectable, which is the closest thing to a tamper-evident record any agent in this catalogue offers, and verifying it needs a key that only a live host can decrypt. And an organization can set a retention period that deletes whole idle sessions with their attached files, so an absent conversation may be policy rather than anything a user did.
env_overrides:
- name: CLAUDE_CONFIG_DIR
  effect: |-
    Moves the whole Claude Code configuration directory away from ~/.claude. Claude Desktop's Code tab runs an embedded Claude Code, so this relocates the Code tab conversation transcripts (projects/), the desktop app's scheduled-task SKILL.md files, plugins and the .credentials.json store. A collection that only walks ~/.claude will find nothing on a machine where this is set, while the desktop app's own store under the Claude application-data directory is unaffected.
  source: https://code.claude.com/docs/en/env-vars
- name: CLAUDE_CODE_PROJECT_DIR_NAME
  effect: |-
    Only honoured together with CLAUDE_CONFIG_DIR. Replaces the working-directory-derived name of the projects/ subdirectory, so the usual path-encoding rule (slashes to dashes) no longer maps a transcript folder back to the project it came from.
  source: https://code.claude.com/docs/en/env-vars
- name: CLAUDE_DESKTOP_ADD_REPO
  effect: |-
    Read from /etc/default/claude-desktop on Linux. Set to false, the .deb does not register Anthropic's apt repository, so /etc/apt/sources.list.d/claude-desktop.list and the keyring file are absent and the usual Linux install evidence is missing even though the app is installed.
  source: https://code.claude.com/docs/en/desktop-linux
- name: CLAUDE_PLUGIN_ROOT
  effect: |-
    Substituted into a plugin's .mcp.json command path and resolves to that plugin's directory. Tells an analyst which on-disk plugin directory an MCP server entry was launched from.
  source: https://claude.com/docs/third-party/claude-desktop/extensions
artifacts:
- id: claude_desktop.mcp_config
  title: User MCP server configuration (claude_desktop_config.json)
  category: mcp_config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\claude_desktop_config.json'
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\claude_desktop_config.json'
  - ~/.config/Claude/claude_desktop_config.json
  - ~/Library/Application Support/Claude/claude_desktop_config.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/anthropics/claude-cookbooks/blob/main/managed_agents/cma-mcp/skill.md
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\claude_desktop_config.json'
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\claude_desktop_config.json'
  - ~/.config/Claude/claude_desktop_config.json
  contains_credentials:
  - mcpServers.<name>.args
  - mcpServers.<name>.env
  - mcpServers.<name>.headers
  record_types:
  - app preference keys
  - globalShortcut
  - mcpServers
  volatility: |-
    Rewritten in place whenever the user edits it or toggles a server in Settings. No rotation, no backup copy. An MSIX profile reset recreates the parent directory and loses it.
  notes: |-
    The vendor names the file itself in first-party docs (code.claude.com/docs/en/desktop: 'The Desktop app loads MCP servers from claude_desktop_config.json into local Code tab sessions, alongside servers from ~/.claude.json and .mcp.json') and the vendor's own cookbook repository states the macOS path. The Windows and Linux spellings are inferred from the vendor's statement that standard installs use %APPDATA%\Claude\ (macOS: ~/Library/Application Support/Claude/) as the application-data directory, plus community reports; they are listed as unsourced. Traps: (1) only local stdio servers live here. Remote MCP servers are claude.ai connectors held server-side, and Anthropic's own plugin documentation says remote servers configured in this file are ignored, so an empty mcpServers block does NOT mean no MCP was used. (2) On Microsoft Store / MSIX installs the file the app actually reads is the virtualized LocalCache\Roaming copy; the in-app 'Edit Config' button opens the non-virtualized %APPDATA%\Claude copy, so both can exist with different contents and the %APPDATA% one may be dead. (3) Credentials are routinely pasted inline into the env block. (4) The standalone Claude Code CLI does not read this file; 'claude mcp add-from-claude-desktop' copies entries into ~/.claude.json, which is how an entry can appear in both products.
  parser: null
- id: claude_desktop.cowork_session_store
  title: Cowork and Chat session store (local-agent-mode-sessions)
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - '%LOCALAPPDATA%\Claude-3p\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - '%LOCALAPPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - ~/.config/Claude-3p/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/
  - ~/.config/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/
  - ~/Library/Application Support/Claude-3p/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>.json
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - '%LOCALAPPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\'
  - ~/.config/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>.json
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/
  record_types:
  - .audit-key
  - .claude/projects/<encoded-dir>/<cliSessionId>.jsonl
  - audit.jsonl
  - cowork_account_settings.json
  - local_<uuid>.json session state file
  - memory/
  - outputs/
  - per-session working directory
  - spaces/<projectId>/memory/
  - subagents/agent-<id>.jsonl
  - uploads/
  volatility: |-
    The vendor states that local Cowork conversation history exists only on the device, is outside Anthropic's standard retention, and that 'deleting it is unrecoverable'. Organization configuration keys chatSessionRetentionDays, coworkSessionRetentionDays and codeSessionRetentionDays (1 to 3650 days, unset means keep forever) delete whole idle sessions from the device with their attached files and outputs; sessionRetentionHold suspends that as a legal hold. Community reports also document total loss of this tree when an app update recreates the Electron profile, with no copy in the Recycle Bin and none in the account data export.
  notes: |-
    This is the single most important Cowork artifact and the answer to 'where are Cowork sessions recorded'. The vendor's own data-storage page documents the layout: one local_<uuid>.json state file plus a working directory per session, scoped by account and organization UUID, with uploads/ holding copies (or hard links) of attached files and outputs/ holding files Claude creates. The same page says Chat conversations use the identical model, so Chat is on disk here too. Anthropic's Cowork changelog independently confirms the naming ('tooling that matches the local_ prefix should also match the new names') and that Cowork 'store[s] Claude Code transcripts under a short fixed folder name'. The transcript itself is a Claude Code JSONL written inside the session working directory under .claude/projects/<encoded-dir>/<cliSessionId>.jsonl, with per-subagent JSONL under subagents/; the three-field join from the manifest (sessionId, cliSessionId, working-directory encoding) is community-documented, not vendor-stated, and one community report found that .claude/projects/ subtree absent on their install while 16 session folders existed inside the VM disk instead. Treat the exact intra-session layout as version-dependent and enumerate the tree rather than assuming a path. The vendor documentation quoted here is written for the third-party (3P) deployment mode, whose directory is Claude-3p; Anthropic separately states that 'standard (non-3P) installs use ~/Library/Application Support/Claude/ with the same subpath' and '%APPDATA%\Claude\ with the same subpath', which is the basis for the standard-mode spellings, all listed as unsourced above. Session names are human-readable three-word slugs. A user-initiated session export writes transcript.jsonl into an archive at a location of the user's choosing.
  parser: null
- id: claude_desktop.cowork_audit_log
  title: Per-session audit log (audit.jsonl and .audit-key)
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\<session-id>\audit.jsonl'
  - '%LOCALAPPDATA%\Claude-3p\local-agent-mode-sessions\<uuid>\<uuid>\<session-id>\audit.jsonl'
  - ~/Library/Application Support/Claude-3p/local-agent-mode-sessions/<uuid>/<uuid>/<session-id>/audit.jsonl
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/<session-id>/audit.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\<session-id>\audit.jsonl'
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/<session-id>/audit.jsonl
  record_types:
  - file operation
  - permission decision
  - tool invocation
  volatility: |-
    Append-only for the life of the session, deleted with the session directory (user delete, or the retention keys above). Each entry is HMAC-chained to the previous one, so a removed or edited line is detectable; the chain is the strongest anti-forensic tripwire this product offers.
  notes: |-
    The vendor describes it as an 'append-only log of session events (tool invocations, permission decisions, file operations)' with each entry HMAC-chained to the previous one, and a companion .audit-key holding the per-session signing key encrypted via the OS keychain. For an analyst this is the record of what the agent did and what the user approved, independent of the transcript, and it can be verified for tampering if the key can be recovered from the keychain on a live host. Community reports describe an audit.jsonl at the session root carrying costs, durations and rate limits as well. Because the key lives in the OS keychain, chain verification is live-only work; collect the key material before imaging if verification matters. The vendor text describing this is the third-party mode page; standard-mode spellings are unsourced.

    Adjusted when this entry was written into the catalogue. It was marked as a credential store, which would have reduced this file to a hash. It is the opposite of that: the record of every tool the agent invoked, every permission decision and every file operation, which is most of what an investigation is trying to establish. The signing key beside it is the credential, and it has its own entry so that one path carries one claim.
  parser: null
- id: claude_desktop.cowork_audit_key
  title: Per-session audit signing key (.audit-key)
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\<session-id>\.audit-key'
  - '%LOCALAPPDATA%\Claude-3p\local-agent-mode-sessions\<uuid>\<uuid>\<session-id>\.audit-key'
  - ~/Library/Application Support/Claude-3p/local-agent-mode-sessions/<uuid>/<uuid>/<session-id>/.audit-key
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/<session-id>/.audit-key
  format: binary
  sensitivity: secret
  collect_priority: live_only
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\<session-id>\.audit-key'
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/<session-id>/.audit-key
  volatility: |-
    Created with the session and removed with it, so it disappears together with the log it signs. The vendor states the file is encrypted through the operating system's secure storage, which means the decrypting material is in the keychain of a live host and not in an image of the disk.
  notes: |-
    Split out of the audit log entry so that one path carries one sensitivity claim. This file is the key that signs the audit chain, so on its own it is credential material and the collector takes its metadata and a hash rather than its content.

    Its forensic value is entirely about the chain. The vendor states each audit entry is HMAC-chained to the previous one so that edits and deletions are detectable, which is the closest thing to a tamper-evident log any agent in this catalogue offers. Verifying that chain needs this key, the key is encrypted through the operating system's secure storage, and that storage is only openable on a live host with the user's session. So chain verification is live-only work: if it matters to the case, get the key material out before the machine is imaged or powered off, because afterwards the log can be read but not proved intact.
  parser: null
- id: claude_desktop.cowork_memory
  title: Cowork memory and global instructions
  category: memory
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\*\*\memory\memory\*.md'
  - '%LOCALAPPDATA%\Claude-3p\local-agent-mode-sessions\*\*\memory\memory\*.md'
  - ~/Library/Application Support/Claude-3p/local-agent-mode-sessions/*/*/memory/memory/*.md
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/memory/CLAUDE.md
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/memory/memory/*.md
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/spaces/<uuid>/memory/*.md
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\*\*\memory\memory\*.md'
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/memory/CLAUDE.md
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/memory/memory/*.md
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/*/*/spaces/<uuid>/memory/*.md
  record_types:
  - global CLAUDE.md instructions
  - memory note
  - per-project memory note
  volatility: |-
    Written and updated by Claude during sessions. Users can delete individual entries or pause memory (existing files kept but not read or updated). The vendor states memory survives the automatic idle-session deletion that removes sessions. Project memory lives under spaces/<projectId>/memory/ and is kept when a project is archived only in the sense that archiving deletes project metadata; check both.
  notes: |-
    High value for the injected-instruction question: the CLAUDE.md here is included in every session, so text planted in it steers every later run, and the memory notes are Markdown Claude wrote about the user's preferences, projects and feedback. A Chat conversation inside a project can read project memory but cannot change it; Cowork sessions inside a project read and update the project memory instead of the global one. Vendor text is the third-party mode page; standard-mode spellings are unsourced.
  parser: null
