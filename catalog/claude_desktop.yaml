  - /Library/Managed Preferences/<user>/com.anthropic.claudefordesktop.plist
  - /Library/Managed Preferences/com.anthropic.claudefordesktop.plist
  - ~/Library/Preferences/com.anthropic.claudefordesktop.plist
  format: plist
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/mdm
  source_kind: official
  unsourced_paths:
  - ~/Library/Preferences/com.anthropic.claudefordesktop.plist
  contains_credentials:
  - inferenceBedrockBearerToken
  - inferenceGatewayApiKey
  record_types:
  - allowedWorkspaceFolders
  - autoUpdaterEnforcementHours
  - chatSessionRetentionDays
  - codeSessionRetentionDays
  - coworkEgressAllowedHosts
  - coworkSessionRetentionDays
  - disableAutoUpdates
  - effortLevel
  - forceLoginOrgUUID
  - isClaudeCodeForDesktopEnabled
  - isDesktopExtensionDirectoryEnabled
  - isDesktopExtensionEnabled
  - isLocalDevMcpEnabled
  - managedMcpServers
  - requireCoworkFullVmSandbox
  - secureVmFeaturesEnabled
  - sessionRetentionHold
  - sshHostAllowlist
  volatility: |-
    Rewritten by MDM. The managed-preferences copy is replaced whenever the profile is redeployed, so the version in force at the time of an event may not be recoverable.
  notes: |-
    This is the permissions and approved-directories artifact. allowedWorkspaceFolders is the allowlist of folders a user may attach to a Cowork session, and the vendor states a folder can carry mode ro, that a leading ~ expands per user, and that a fixed set of %VAR% tokens is expanded. The retention keys here decide whether session records are being deleted on a schedule, which an analyst must read before concluding that absence of sessions means absence of use. secureVmFeaturesEnabled and requireCoworkFullVmSandbox decide whether device-deployed policy reaches Cowork at all. The Managed Preferences paths are stated by the vendor; the unmanaged user-domain plist path is the standard macOS location for the same domain but the vendor does not state it, so it is listed as unsourced. Inference credentials can be delivered through these keys, so treat the file as potentially secret-bearing.
