    Community report states this log survived an Electron profile recreation that destroyed 22 local Cowork session directories, which makes it the most durable record of Cowork activity on Windows. No documented rotation.
  notes: |-
    Community only, and the single best corroborating artifact when the session store has been wiped. The reported line format records, per session, the human-readable session name, the uid, the read/write mode and the mapping from the host path to the in-VM /sessions/<name> mount, so it proves both that a session existed and which host folder the agent was pointed at, even with no transcript left. Under ProgramData on Windows it is outside the user profile, so a user-profile-only collection misses it. A Windows service named CoworkVMService is reported alongside it. The macOS filename is from a separate community report and is weaker.
