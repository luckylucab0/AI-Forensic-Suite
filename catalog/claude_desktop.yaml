- id: claude_desktop.code_session_index
  title: Code tab session records (claude-code-sessions)
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\claude-code-sessions\<uuid>\<uuid>\local_<session-id>.json'
  - '%LOCALAPPDATA%\Claude-3p\claude-code-sessions\'
  - '%LOCALAPPDATA%\Claude\claude-code-sessions\<uuid>\<uuid>\local_<session-id>.json'
  - ~/Library/Application Support/Claude-3p/claude-code-sessions/
  - ~/Library/Application Support/Claude/claude-code-sessions/<uuid>/<uuid>/local_<session-id>.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\claude-code-sessions\<uuid>\<uuid>\local_<session-id>.json'
  - '%LOCALAPPDATA%\Claude\claude-code-sessions\<uuid>\<uuid>\local_<session-id>.json'
  - ~/Library/Application Support/Claude/claude-code-sessions/<uuid>/<uuid>/local_<session-id>.json
  record_types:
  - cliSessionId
  - sessionId
  - settings
  - summary
  - title
  - transcriptUnavailable
  - working folder
  volatility: |-
    The vendor states the conversation transcripts are not here but in Claude Code's own store at ~/.claude/projects/. Community investigation on macOS reports two independent decay processes: the .jsonl transcript under ~/.claude/projects/ disappears roughly 2 to 15 days after session creation, and the cliSessionId pointer in this file is separately nulled with transcriptUnavailable flipped to true after about seven weeks, one-directionally and without recovery. Claude Code's own cleanupPeriodDays (default 30) governs transcript deletion but community reports say transcript mtimes are refreshed in clusters, which defeats mtime-based ageing. Sidebar 'Delete session' is reported to remove only the index entry and leave the .jsonl on disk.
  notes: |-
    This is the index that maps a desktop Code session to its working folder and to the transcript file in the shared Claude Code store. It is the join key an analyst needs, and it is also the artifact most likely to be out of sync with reality in both directions: entries whose transcript is already gone, and transcripts on disk with no entry. Treat the index as a claim, not as evidence of presence or absence, and always enumerate ~/.claude/projects/ independently. The vendor page documenting the layout is the third-party mode page; standard-mode spellings come from community reports plus Anthropic's statement that standard installs use the Claude directory with the same subpaths.
  parser: null
