- id: claude_desktop.oauth_and_signin_tokens
  title: OAuth tokens and stored sign-ins (OS secure storage)
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%LOCALAPPDATA%\Microsoft\Credentials\'
  - ~/Library/Keychains/login.keychain-db
  format: binary
  sensitivity: secret
  collect_priority: live_only
  status: unverified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  record_types:
  - OS keychain or Credential Manager entry
  - encrypted token blob in the application-data directory
  volatility: |-
    Rewritten on refresh. Community report: stored sign-ins were lost when the system keychain was temporarily locked, which Anthropic fixed, so absence can mean a keychain problem rather than no sign-in.
  notes: |-
    The vendor states that OAuth tokens (in-app Google sign-in, MCP servers with oauth: true) are 'stored in the application-data directory, encrypted with the operating system's secure storage (Keychain on macOS, DPAPI on Windows)'. Anthropic's support article on local MCP servers separately states that sensitive extension configuration goes to the Keychain on macOS, the Credential Manager on Windows, and the distro's keychain manager on Linux, so part of this material is not in a file at all and cannot be recovered from a dead image without the user's login secret. Collect on a live host or capture the keychain container and the DPAPI master keys. The exact file name inside the application-data directory is not documented and I could not source it; do not invent one, enumerate the directory. The user identity that ties tokens to an account is separately recorded as lastKnownAccountUuid in a config.json according to a community report.

    Narrowed when this entry was written into the catalogue. The vendor states that these tokens live in the application-data directory encrypted with the operating system's secure storage, and names no file. This entry therefore claimed the application-data directory itself, which would have made the collector withhold the content of everything inside it, the conversation history included. It now claims only the two operating-system credential stores, and its status says what is true: no vendor source names the file.
  parser: null
- id: claude_desktop.transient_session_credentials
  title: Transient per-session credential files
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\ccd-session-secrets\<session-id>\'
  - '%APPDATA%\Claude\host-creds-<hash>.json'
  - ~/Library/Application Support/Claude-3p/ccd-session-secrets/<session-id>/
  - ~/Library/Application Support/Claude-3p/host-creds-<hash>.json
  - ~/Library/Application Support/Claude/ccd-session-secrets/<session-id>/
  - ~/Library/Application Support/Claude/host-creds-<hash>.json
  format: json
  sensitivity: secret
  collect_priority: live_only
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\ccd-session-secrets\<session-id>\'
  - '%APPDATA%\Claude\host-creds-<hash>.json'
  - ~/Library/Application Support/Claude/ccd-session-secrets/<session-id>/
  - ~/Library/Application Support/Claude/host-creds-<hash>.json
  record_types:
  - ccd-session-secrets/<session-id>/
  - host-creds-<random-id>.json
  volatility: |-
    By design short-lived: host-creds is rewritten on each credential refresh and deleted when the app quits, with crash leftovers removed at the next launch; ccd-session-secrets is created at session start, removed at session end, and the whole directory is swept before the next Code session and on provider sign-out. Mode 0600 on macOS, per-user ACLs on Windows. A crash leftover found on disk is therefore evidence of an abnormal termination.
  notes: |-
    Documented by the vendor in detail, including that the random path segment is regenerated on sign-out or credential rotation so a process holding the old path loses access. For Cowork, the same file-based credentials are written into the session working directory that is mounted into the sandbox VM, which means provider credentials were inside the reach of the agent's own sandbox. This is a live-only artifact: on a dead image expect nothing, and a present file is itself a finding. The vendor page is the third-party mode page; standard-mode spellings are unsourced.
  parser: null
- id: claude_desktop.user_plugins
  title: User-installed and org-provisioned plugins (cowork_plugins)
  category: instructions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\cowork_plugins\'
  - '%LOCALAPPDATA%\Claude-3p\cowork_plugins\'
  - ~/.config/Claude/cowork_plugins/
  - ~/Library/Application Support/Claude-3p/cowork_plugins/
  - ~/Library/Application Support/Claude/cowork_plugins/
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\cowork_plugins\'
  - ~/.config/Claude/cowork_plugins/
  - ~/Library/Application Support/Claude/cowork_plugins/
  record_types:
  - .claude-plugin/plugin.json
  - .mcp.json
  - .mcpb desktop extension
  - agents/*.md
  - commands/*.md
  - hooks
  - skills/*/SKILL.md
  - version.json
  volatility: |-
    Created on first plugin install. Re-synced from a marketplace when version.json changes or the directory mtime changes; a plugin removed from a marketplace is unregistered and uninstalled on the next sync, so the on-disk copy can vanish without user action.
  notes: |-
    The vendor states cowork_plugins/ holds 'user-installed and org-provisioned plugins'. This is where the injected-instruction question is answered for the Cowork and Chat surfaces: a plugin carries skills, slash commands, sub-agents, hooks and MCP servers, all of which are instructions or execution the agent obeys. Desktop extensions (.mcpb bundles, zip archives containing a local MCP server and a manifest.json) are installed here too when allowed; Anthropic's extensions page says 'user-added extensions are stored in the user's local data directory'. Note the surface split the vendor documents: Cowork sessions run hooks from marketplace plugins, org-plugins and user plugins, while Code sessions do not load org-plugins hooks or skills. Cowork does NOT read the Claude Code CLI's ~/.claude directory for skills and plugins; those come from the claude.ai account and are synced at session start, which means a skill that only exists server-side may leave no on-disk copy at all.
  parser: instructions
- id: claude_desktop.org_plugins
  title: Administrator-provisioned plugin directory (org-plugins)
  category: instructions
  root: system
  os:
  - macos
  - windows
  paths:
  - /Library/Application Support/Claude/org-plugins/
  - 'C:\Program Files\Claude\org-plugins\'
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/extensions
  source_kind: official
  record_types:
  - .claude-plugin/plugin.json
  - .mcp.json
  - agents/*.md
  - commands/*.md
  - skills/*/SKILL.md
  - version.json
  volatility: |-
    Replaced by software distribution. version.json changing by any string triggers a re-sync into each user's copy.
  notes: |-
    Both paths are stated verbatim by the vendor, and these are standard Claude directory names, not the third-party Claude-3p ones. Each subdirectory is one plugin and the directory name is the plugin's canonical name; a directory without .claude-plugin/plugin.json or a top-level SKILL.md is ignored. The vendor notes Windows uses Program Files rather than ProgramData so only administrators can write it, and that Claude Desktop treats the presence of this directory as an admin-provisioned source. Symlinks inside a plugin are followed only when the target resolves inside the plugin directory, but a symlinked top-level plugin directory is followed, which is a path worth checking for an instruction planted outside the collected tree.
  parser: instructions
