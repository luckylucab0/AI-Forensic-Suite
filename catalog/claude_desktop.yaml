  notes: |-
    Two first-party statements pin this down. code.claude.com/docs/en/admin-setup states the live file is at %APPDATA%\Claude\logs\main.log when Claude Desktop was installed with the .exe installer, and that Help > Troubleshooting > Show Logs in Explorer saves a copy of the log folder to the user's Downloads folder, which is itself a collectable artifact. claude.com/docs/third-party/claude-desktop/data-storage names the files in the folder: main.log, cowork_vm_node.log, claude.ai-web.log, mcp.log and mcp-server-<name>.log, and gives ~/Library/Logs/Claude-3p/ for macOS in third-party mode, from which the standard-mode ~/Library/Logs/Claude/ follows but is not stated. The Linux standard-mode folder ~/.config/Claude/logs/ IS stated directly on claude.com/docs/third-party/claude-desktop/configuration. Analyst value: main.log carries session load warnings naming session ids and transcript byte sizes, the WSL policy gate decisions, managed-settings parse failures, and the Electron profile boot lines that reveal a profile reset; mcp-server-<name>.log is the record of which MCP server started, with what, and what it said on stderr. Windows is genuinely ambiguous between %APPDATA%\Claude\logs and %LOCALAPPDATA%\Claude\Logs: the vendor documents the third-party build moving from Roaming to Local, and community reports from 2026 cite both for the standard build. Collect both, plus the MSIX virtualized copy.
