  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\outputs\'
  - '%APPDATA%\Claude\local-agent-mode-sessions\<uuid>\<uuid>\local_<uuid>\uploads\'
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/outputs/
  - ~/Library/Application Support/Claude/local-agent-mode-sessions/<uuid>/<uuid>/local_<uuid>/uploads/
  record_types:
  - agent-created output file
  - copied or hard-linked attachment
  volatility: |-
    Removed with the session. Deleted by the retention keys together with the session.
  notes: |-
    Answers 'which data was handed to the agent' directly: uploads/ holds copies of every file attached to the conversation. The vendor notes attachments are hard-linked where the filesystem allows, so an uploads/ entry can share an inode with the user's original file and an edit to the original is visible to the conversation; record inode and link count, not just the hash. outputs/ is the agent's scratch and product directory. A community report documents the UI presenting outputs/ content as if it were in the user's chosen project folder while that folder stayed empty on disk, which an analyst will otherwise read as file deletion; the sandbox for advanced file analysis writes only inside outputs/. Vendor text is the third-party mode page; standard-mode spellings are unsourced.
  parser: null
- id: claude_desktop.cowork_vm_bundle
  title: Cowork sandbox VM bundle and session data disk
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\vm_bundles\claudevm.bundle\'
  - '%LOCALAPPDATA%\Claude-3p\vm_bundles\'
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\vm_bundles\claudevm.bundle\sessiondata.vhdx'
  - ~/Library/Application Support/Claude-3p/vm_bundles/
  - ~/Library/Application Support/Claude/vm_bundles/
  format: binary
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/data-storage
  source_kind: official
  unsourced_paths:
  - '%APPDATA%\Claude\vm_bundles\claudevm.bundle\'
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude\vm_bundles\claudevm.bundle\sessiondata.vhdx'
  - ~/Library/Application Support/Claude/vm_bundles/
  record_types:
  - .auto_reinstall_attempted marker
  - rootfs disk image
  - session data disk (ext4)
  volatility: |-
    The app deletes and re-downloads this bundle on its own as a repair step. Community reports document an auto-reinstall path that deleted an 8 GB rootfs disk twice, and a marker file that then blocks further retries. Expect large, frequently rewritten images.
  notes: |-
    The vendor describes vm_bundles/ as a 'cached copy of the VM workspace bundle that Cowork sessions run in, plus the data disk the app creates to hold those sessions' home directories inside the VM'. On-device Cowork runs a Linux VM: macOS and Windows use the platform hypervisor, Linux uses QEMU with virtiofsd. The data disk is where the session home directories live, so shell history, temporary files and anything the agent wrote outside a mounted host folder are inside this image, not on the host filesystem. The filename seen in community reports is sessiondata.vhdx on Windows with a sessiondata.img also appearing in repair logs. One community reporter mounted the VHDX read-only under WSL2, found 16 session folders and ext4, but no conversation transcripts inside, which supports the reading that the transcripts live on the host side under local-agent-mode-sessions and the VM disk holds the working filesystem. Collect it, but expect tens of gigabytes and treat it as a second filesystem to parse rather than a file. Windows deployment guidance warns the folder must be excluded from NTFS compression and EFS or the VM disk will not start.
  parser: null
