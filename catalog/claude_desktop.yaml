- id: claude_desktop.embedded_claude_code
  title: Embedded Claude Code engine and VM workspace
  category: install_evidence
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%APPDATA%\Claude\claude-code\<version>\claude.exe'
  - '%LOCALAPPDATA%\Claude-3p\claude-code\<version>\'
  - ~/Library/Application Support/Claude-3p/claude-code/<version>/claude.app/Contents/MacOS/claude
  - ~/Library/Application Support/Claude/claude-code-vm/
  - ~/Library/Application Support/Claude/claude-code/<version>/claude.app/Contents/MacOS/claude
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/installation
  source_kind: official
  unsourced_paths:
  - ~/Library/Application Support/Claude/claude-code-vm/
  record_types:
  - VM workspace data
  - versioned claude binary
  volatility: |-
    A new version directory appears on each engine update and old ones are pruned, so the set of directories present is a coarse timeline of which engine versions ran on this device.
  notes: |-
    This is the artifact that proves the desktop app shipped and ran its own Claude Code, and it is directly stated by the vendor: claude.com/docs/third-party/claude-desktop/installation gives ~/Library/Application Support/Claude-3p/claude-code/<version>/claude.app/Contents/MacOS/claude and then says in the same section 'Standard (non-3P) installs use ~/Library/Application Support/Claude/ with the same subpath' and 'Standard installs use %APPDATA%\Claude\ with the same subpath'. That sentence is the only first-party statement I found that names the standard-mode application-data directory on both platforms, and it is what makes every standard-mode path in this catalogue entry more than a guess. The same page gives the macOS code-signing team identifier Q6L2SF6YDW for the helper and says the Windows helper is Authenticode-signed with publisher 'Anthropic, PBC', which are good integrity checks. The vendor's data-storage page lists claude-code/ and claude-code-vm/ as 'Claude Code binary and VM workspace data for Code sessions'. An analyst should read the version from the directory name rather than executing the binary.
  parser: null
- id: claude_desktop.scheduled_tasks
  title: Scheduled task definitions
  category: instructions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.claude\scheduled-tasks\<task-name>\SKILL.md'
  - ~/.claude/scheduled-tasks/<task-name>/SKILL.md
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/desktop-scheduled-tasks
  source_kind: official
  unsourced_paths:
  - '%USERPROFILE%\.claude\scheduled-tasks\<task-name>\SKILL.md'
  record_types:
  - YAML frontmatter name and description
  - prompt body
  volatility: |-
    The vendor states deleting a task archives all sessions it created, and an 'Also delete files on disk' checkbox additionally removes the task's SKILL.md and associated data. Schedule, folder, model and enabled state are NOT in this file and are held elsewhere, so the file alone does not tell you whether the task was active.
  notes: |-
    Directly stated: 'To edit a task's prompt on disk, open ~/.claude/scheduled-tasks/<task-name>/SKILL.md (or under CLAUDE_CONFIG_DIR if set)'. Forensically this is a standing, unattended instruction that runs Claude on a schedule with a permission mode and a folder, so it is a prime place for a persistence mechanism or an injected instruction. It sits inside the shared ~/.claude directory even though it is a desktop-app feature, which is exactly the attribution problem this catalogue has to flag: a finding here cannot be attributed to the CLI. Allow rules from ~/.claude/settings.json also apply to scheduled task sessions.
  parser: instructions
- id: claude_desktop.code_launch_config
  title: Preview server configuration written into the project (.claude/launch.json)
  category: config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.claude/launch.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://code.claude.com/docs/en/desktop
  source_kind: official
  record_types:
  - autoVerify
  - dev server command
  volatility: |-
    Written automatically when the desktop app first detects a dev server setup, then edited by the user or Claude. Lives in the user's working copy, so it can be committed to version control and travel off the endpoint.
  notes: |-
    The vendor states Claude 'automatically detects your dev server setup and stores the configuration in .claude/launch.json at the root of the folder you selected when starting the session'. Its presence in a repository is evidence that the Claude Code Desktop app, not the terminal CLI, was used on that working copy, which is one of the few positive discriminators between the two products. It also records a command the app will run, so it is a place an attacker could plant execution. autoVerify false records that automatic post-edit verification was turned off.
  parser: null
- id: claude_desktop.ssh_remote_artifacts
  title: Artifacts Claude Desktop writes on an SSH remote host
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/remote/ccd-cli/<version>
  - ~/.claude/remote/plugins/<hash>/
  - ~/.claude/remote/run/<id>/
  - ~/.claude/remote/srv/<version>/
  format: directory
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://claude.com/docs/third-party/claude-desktop/ssh-remote-sessions
  source_kind: official
  record_types:
  - Claude Code engine binary
  - attached files
  - remote server binary
  - socket, token and log
  - synced plugins
  volatility: |-
    The vendor states the three most recent engine versions are kept and reused, and that ~/.claude/uploads/<session-id>/ is 'not removed when the session ends', which makes the uploads directory a durable record of what the user handed the agent. The run directory is per connection.
  notes: |-
    These paths are on the SSH target, not the analyst's endpoint, and they are written by Claude Desktop into the same ~/.claude tree the Claude Code CLI uses on that host. They are the reason a ~/.claude finding on a server cannot be attributed to a terminal CLI session without checking for remote/ and uploads/. The run directory contains a token, so treat it as secret. The vendor also states the Code session transcripts and attached files for an SSH session are on the remote host, not on the device, so a device-only collection will miss the content of remote sessions entirely. Claude Desktop applies the device's ~/.ssh/config and requires the host key to be in ~/.ssh/known_hosts already, both of which are corroborating artifacts on the endpoint.

    Two adjustments made when this entry was written into the catalogue. It was marked as a credential store, which would have reduced a tree of attached files and agent binaries to hashes; the one directory that holds a token is named in contains_credentials instead. And it claimed the uploads directory on the remote host, which the command line interface's own entry already claims: the two products share that tree, so the path is left with the entry that has the vendor's statement for it, and this note is the record that a hit there can belong to either product.
  parser: null
- id: claude_desktop.install_evidence_macos
  title: macOS install evidence
  category: install_evidence
  root: system
  os:
  - macos
  paths:
  - /Applications/Claude.app
  - ~/Applications/Claude.app
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://support.claude.com/en/articles/12611117-deploy-claude-desktop-for-macos
  source_kind: official
  unsourced_paths:
  - /Applications/Claude.app
  - ~/Applications/Claude.app
  record_types:
  - Info.plist version
  - application bundle
  volatility: |-
    Replaced in place by auto-update unless disableAutoUpdates is set, so the version on disk is the current one and not the one that ran at the time of an event; correlate with main.log and with the claude-code/<version> directories instead.
  notes: |-
    The vendor states the app 'installs to /Applications and updates automatically', and that a user-level install under ~/Applications can self-update without administrator rights, which is a meaningful finding on a managed endpoint. Distributed as .pkg (recommended for enterprise) or .dmg. The vendor names the directories but not the bundle name Claude.app, so the exact bundle paths are listed as unsourced. Read the version from Contents/Info.plist; do not launch the application.
  parser: null
- id: claude_desktop.install_evidence_windows
  title: Windows install evidence
  category: install_evidence
  root: system
  os:
  - windows
  paths:
  - '%LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\'
  - 'C:\Program Files\WindowsApps\Claude_<version>_<arch>__pzs8sxrjxfjjc\'
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://github.com/anthropics/claude-code/issues/26073
  source_kind: community
  record_types:
  - MSIX package directory
  - package LocalCache redirection root
  volatility: |-
    A new package version directory replaces the previous one on update. The LocalCache tree persists across package updates but community reports document it being recreated by an update sequence, destroying the session store.
  notes: |-
    Anthropic officially documents deploying Claude Desktop on Windows as an MSIX package via Add-AppxPackage or Add-AppxProvisionedPackage, and separately offers an .exe installer; the vendor does not publish the package family name or the install directory, so the paths here are community. The package family name appearing in community reports is Claude_pzs8sxrjxfjjc. This distinction drives everything else on Windows: under MSIX, writes to %APPDATA%\Claude are redirected to %LOCALAPPDATA%\Packages\Claude_pzs8sxrjxfjjc\LocalCache\Roaming\Claude, so a collector that reads only %APPDATA%\Claude on an MSIX machine can find an empty or stale directory and conclude the product was unused. Determine the install type first (presence of the Packages directory, or Get-AppxPackage) and then collect the matching root. Also check whether the profile is redirected: one community report describes %APPDATA%\Claude reaching LocalCache through a reparse point onto a second volume, and Anthropic's release notes mention Windows hosts using FSLogix or similar profile containers.
  parser: null
- id: claude_desktop.install_evidence_linux
  title: Linux install evidence
  category: install_evidence
  root: system
  os:
  - linux
  paths:
  - /etc/apt/sources.list.d/claude-desktop.list
  - /etc/default/claude-desktop
  - /usr/share/keyrings/claude-desktop-archive-keyring.asc
  - /var/lib/dpkg/info/claude-desktop.*
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://code.claude.com/docs/en/desktop-linux
  source_kind: official
  unsourced_paths:
  - /var/lib/dpkg/info/claude-desktop.*
  record_types:
  - CLAUDE_DESKTOP_ADD_REPO setting
  - apt repository entry
  - dpkg package metadata
  - repository signing key
  volatility: |-
    Uninstalling the package removes the repository entry and signing key it registered, so absence of these files does not mean the app was never installed. The dpkg metadata and logs outlive the package files.
  notes: |-
    The vendor states the package name is claude-desktop, installed from Anthropic's apt repository at downloads.claude.ai, registering /etc/apt/sources.list.d/claude-desktop.list and /usr/share/keyrings/claude-desktop-archive-keyring.asc, and that creating /etc/default/claude-desktop with CLAUDE_DESKTOP_ADD_REPO="false" suppresses the repository registration. Cowork on Linux needs QEMU, OVMF and virtiofsd plus the vhost_vsock kernel module, so /etc/modules-load.d/vhost_vsock.conf is corroborating evidence that on-device Cowork was set up. Linux is a beta platform. The dpkg path is the standard location and is not stated by the vendor, so it is listed as unsourced; prefer /var/log/apt and the dpkg status file for the install timeline.
  parser: null
