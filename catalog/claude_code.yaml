  notes: |-
    Timeline value: each allow rule is a human decision to widen the agent's authority. Compare against transcripts to date the approval.

    Record structure: Precedence rank 3 (highest of the non-managed files). This is the single best record of user-granted standing tool approvals: choosing "Yes, and don't ask again" on a Bash permission prompt writes an `allow` rule here. Written at the git repository ROOT even when the session started in a subdirectory, and at the main checkout's root when in a worktree. Falls back to sitting beside .claude/settings.json instead when: outside a git repository, when the repo root is the home directory, on Windows, or when the repo root / its .git / .claude entry is not owned by the running user. A few /config options (including "Show tips") also save here.
