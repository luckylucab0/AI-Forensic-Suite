  status: verified
  source: https://code.claude.com/docs/en/worktrees.md
  source_kind: official
  volatility: |-
    Orphaned worktrees are removed automatically once older than cleanupPeriodDays. A subagent worktree is cleaned up automatically if the subagent made no changes.

    Removed when the background session is deleted, but explicitly KEPT when the worktree holds commits Claude Code cannot confirm are saved elsewhere (the delete is refused and names the branch and unpushed commit count), when another running session holds or locks it, or when removal fails. Orphaned worktrees are removed by the same age cutoff as the retention sweep. v2.1.157 and v2.1.246 fixed the sweep both orphaning and wrongly deleting worktrees, so version matters.
  notes: |-
    Secret sensitivity because gitignored credential files get copied into every worktree, multiplying the number of on-disk copies of a secret. Also a recovery source: an uncommitted change made by an agent in a worktree may exist nowhere else, and a removed worktree can leave recoverable data.

    Where autonomous agent code changes physically live. Often contains work that was never pushed and never merged - including changes the user never reviewed. Because the delete path deliberately refuses to discard unpushed commits, this is one of the few places where agent output is preserved AGAINST a user's deletion attempt. Not part of ~/.claude, so it is easy to miss: collect .claude/worktrees from every repository of interest, not just the home directory.

    Record structure: Git worktree checkouts used to isolate parallel sessions (--worktree, agent frontmatter `isolation: worktree`, and background sessions). Each is a full working copy branched by default from the default branch. Files named in .worktreeinclude - typically .env and secrets configs - are copied in. Shaped by the `worktree.baseRef`, `worktree.symlinkDirectories`, `worktree.sparsePaths` and `worktree.bgIsolation` settings.

    Git worktrees Claude creates so background sessions and isolated subagents edit outside the user's checkout. Each is a full checkout with its own branch; `git log`/`git reflog` inside one recovers commits the agent made. Worktrees created outside the repository tree (e.g. `git worktree add ../feature`) are NOT here - enumerate them from the repo's .git/worktrees metadata instead. Isolation can be disabled with `worktree.bgIsolation: "none"`, in which case agent edits land directly in the user's checkout and this directory is absent.
  parser: null
