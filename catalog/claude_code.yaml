# Claude Code artifact catalogue.
#
# Generated once from vendor documentation and then maintained by hand. Every entry states
# where the claim comes from, and status: verified means somebody fetched that URL and the
# page states that path. Anything else is unverified, is still collected by glob, and is
# reported as unverified so an empty result reads as inconclusive rather than as proof the
# agent was never used.
#
# Two fields are easy to misread and both change behavior:
#
#   sensitivity   Operational, not descriptive. 'secret' means the collector stores
#                 metadata and a SHA-256 but does not copy the content unless
#                 --include-secrets is given. Reserved for credential stores. Transcripts
#                 are 'normal' however personal they are, because they are the evidence.
#
#   collect_priority  Collection order on a live endpoint, derived from how fast the
#                 artifact disappears. live_only cannot be recovered from a powered-off
#                 image at all. See docs/COLLECTION.md.
#
# Validated against catalog/schema/catalog.schema.json in CI. docs/ARTIFACTS.md is
# generated from this file and must never be edited by hand.

agent: claude_code
title: Claude Code
vendor: Anthropic
description: |-
  Anthropic's terminal coding agent, also reachable from the desktop app, VS Code, JetBrains IDEs, the Agent SDK and CI. It keeps by far the richest on-disk record of any agent covered here: full transcripts, every prompt typed, pre-edit file snapshots, subagent activity, permission decisions and effective policy.
references:
- https://code.claude.com/docs/en/claude-directory
- https://code.claude.com/docs/en/settings
- https://code.claude.com/docs/en/sessions
- https://code.claude.com/docs/en/iam
env_overrides:
- name: CLAUDE_CONFIG_DIR
  effect: |-
    Moves the whole configuration directory away from ~/.claude, taking settings, transcripts, prompt history and plugins with it. A collection keyed on ~/.claude alone finds nothing on such a host, which is indistinguishable from the agent never having run. Read the variable from the shell profile and from process environment evidence before concluding an agent was absent.
  source: https://code.claude.com/docs/en/claude-directory
- name: CLAUDE_CODE_SKIP_PROMPT_HISTORY
  effect: |-
    Suppresses writing to history.jsonl. Its presence in a shell profile is itself a finding, since prompt history normally outlives the transcripts.
  source: https://code.claude.com/docs/en/settings
artifacts:
- id: claude_code.sessions_dir
  category: log
  os:
  - linux
  - macos
  - windows
  paths:
  - '%USERPROFILE%\.claude\sessions\*'
  - ~/.claude/sessions/
  - ~/.claude/sessions/*
  format: json
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://code.claude.com/docs/en/claude-directory.md
  source_kind: official
  volatility: |-
    NOT part of the age-based sweep. One small file per RUNNING session; Claude Code removes each file when its session exits and clears crash leftovers on the next launch.

    NOT part of the age-based sweep. One small file per RUNNING session; each file is removed when its session exits, and crash leftovers are cleared on the next launch. Live-response only - a file here means either a session running right now or one that died uncleanly (changelog v2.1.246 fixed headless sessions failing to clean up stale entries).
  notes: |-
    Like shell-snapshots, a leftover file here is evidence of a crash or a session that never exited cleanly, and of how many sessions ran concurrently. Live-triage artifact - it self-cleans on the next launch, so acquire before restarting the tool.

    For live acquisition this is the cheapest way to enumerate sessions running at the moment of collection, and a stale entry is direct evidence of an unclean termination (crash, kill, or host shutdown) - worth correlating with a surviving shell-snapshot for the same period.

    Record structure: Used to detect concurrent sessions and crashes.

    Used to detect concurrent sessions and crashes. Per-file schema not documented - needs verification. NOTE: several third-party pages wrongly describe transcripts as living in `~/.claude/projects/<encoded>/sessions/<uuid>.jsonl`; this top-level `~/.claude/sessions/` directory is a different thing and holds no transcript content.
  parser: null
- id: claude_code.shell_snapshots
  category: shell_history
  os:
  - linux
  - macos
  - windows
  paths:
  - '%USERPROFILE%\.claude\shell-snapshots\*'
  - /tmp/claude-shell-snapshot*
  - ~/.claude/shell-snapshots/
  - ~/.claude/shell-snapshots/*
  format: text
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
  volatility: |-
    Removed on CLEAN EXIT - a snapshot surviving on disk generally means that session crashed or was killed. The sweep clears whatever is left after a crash (brought under cleanupPeriodDays in v2.1.117). Explicitly NOT project-scoped and explicitly left alone by `claude project purge`, which even warns about it - so this directory survives the main anti-forensic command.

    HIGHLY VOLATILE: removed on clean exit, so files are normally present only while a session runs or after a CRASH. The retention sweep clears any left after a crash. Explicitly left alone by `claude project purge` (including --all) because it is not project-scoped, and warned about in the purge plan.
  notes: |-
    Effectively a copy of the analyst-relevant parts of the user's shell environment (.bashrc/.zshrc-derived aliases and functions), captured at a known time, including any function that wraps credentials or internal hostnames. IMPORTANT version note: v1.0.48 'Moved shell snapshots from /tmp to ~/.claude' - on evidence from before that, look in the system temp directory instead, and v1.0.51 fixed handling of home directories containing spaces.

    Presence of files here is itself an indicator of an unclean exit or a live session. Content is a snapshot of the user's real shell environment - functions and aliases frequently embed tokens, internal hostnames and credential-fetch helpers, hence secret sensitivity. Capture it in live triage; it will usually be gone from a cleanly shut-down image.

    Record structure: Shell script text: the user's aliases, functions and shell options captured at startup and re-applied by the Bash tool to each command. Changelog v2.1.147 ('shell snapshot dropping user functions whose names start with a single underscore') confirms it serializes user-defined functions. v1.0.54 switched to an in-memory snapshot for some paths, and v2.1.51 lets the Bash tool skip the login shell when a snapshot is available - so presence/absence varies by version.

    Aliases, shell functions and shell options captured from the user's shell at startup and re-applied by the Bash tool to each command.
  parser: null
- id: claude_code.image_cache
  category: cache
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/image-cache/<session-id>/
  - ~/.claude/image-cache/*/*
  - '%USERPROFILE%\.claude\image-cache\*\*'
  format: binary
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
  volatility: |-
    MOST VOLATILE artifact in the tree: on each sweep Claude Code removes the directories of ALL OTHER sessions, whatever their age - i.e. starting any new session can wipe every other session's attached images immediately, not after 30 days. Collect this first, and prefer live acquisition.
  notes: |-
    Screenshots and images the user pasted into prompts - often screenshots of dashboards, tickets, error screens or credentials. Because sibling sessions are purged on every sweep, in practice you usually recover only the most recent session's images from a live system, but unallocated-space carving is worth trying on an image.

    Record structure: Per-session directories of attached/pasted images. Internal naming not documented - needs verification. v2.1.83 added on-disk path referencing for clipboard-pasted images, so transcript tool calls may name these files directly; v2.1.126 downscales images over 2000px on paste, so the cached copy may differ from the original.
  parser: null
- id: claude_code.config_backups
  category: config
  os:
  - linux
  - macos
  - windows
  paths:
  - '%USERPROFILE%\.claude\backups\*'
  - ~/.claude/backups/
  - ~/.claude/backups/*
  - ~/.claude/backups/.claude.json.corrupted.<timestamp>
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
  volatility: |-
    Only the FIVE newest copies are kept, plus a copy of any version Claude Code could not parse - so this rotates by count, not by age, and a busy machine loses history fast. Brought under the cleanupPeriodDays sweep in v2.1.117. Explicitly left alone by `claude project purge`, which warns that 'backups/ may still contain this project entry in old .claude.json snapshots'.

    Claude Code keeps only the FIVE NEWEST versions of ~/.claude.json, plus a copy of any version it could not parse. Explicitly left alone by `claude project purge` because it is not project-scoped.
  notes: |-
    Historical DIFFS of global state: which projects existed, which were trusted, which MCP servers were configured, and per-project history - including projects that have since been purged. Because `claude project purge` does not touch this directory, a purged project's entry often survives here. Directly useful for proving that a project or MCP server existed on a machine after the user tried to remove the evidence.

    Record structure: Each file is an earlier full copy of ~/.claude.json, copied whenever Claude Code rewrites it. Same schema as ~/.claude.json.

    Excellent short-window timeline source: five prior states of the trust list, MCP server set and OAuth session. Rolls over fast on an active endpoint - collect early. The .corrupted.<timestamp> copy can survive longer than the rotation.

    Record structure: Earlier versions of ~/.claude.json, copied each time Claude Code rewrites the file. Same key structure as the live file.
  parser: null
- id: claude_code.policy_limits
  category: config
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/policy-limits.json
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory.md
  source_kind: official
  volatility: DELETED ON LOGOUT. Not swept by age. Refreshed automatically.
  notes: |-
    Presence plus content ties the endpoint to a specific organization/account tier.

    Record structure: Cached feature policy settings for the user's organization. Only present for some account types.
  parser: null
- id: claude_code.credentials
  category: credentials
  os:
  - linux
  - macos
  - windows
  paths:
  - $CLAUDE_CONFIG_DIR/.credentials.json
  - '%USERPROFILE%\.claude\.credentials.json'
  - ~/.claude/.credentials.json
  format: json
  sensitivity: secret
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
  volatility: |-
    Listed among the state files to KEEP - not swept. Present only when credentials are stored in a file rather than the OS keychain; the vendor authentication page is the authority on where credentials live per platform (not fetched in this pass).

    Managed by /login and /logout; /logout removes and revokes all stored credentials including saved MCP server logins and plugin sensitive values. On macOS, once the Keychain becomes writable again Claude Code moves credentials back into the Keychain the next time it writes one.
  notes: |-
    Live authentication material for the agent's account. Handle as a secret: record presence, path, size, and timestamps only. On macOS the credential may be in the login Keychain instead of this file, which would make its absence unremarkable - confirm against the authentication docs before drawing conclusions. MAC timestamps on this file are a good proxy for last successful login/refresh.

    The 0600 mode and the Linux/Windows paths are vendor-documented and verified. The internal JSON key names come from community sources (a gist and Claude Code GitHub issues) and should be treated as medium confidence. The macOS fallback file is a strong indicator of SSH / headless / remote use, since that is what makes the Keychain unwritable.

    Record structure: Vendor describes it only as 'your login credentials' and points to the credential-management section of the authentication docs for platform specifics, which I did not fetch - so the schema and the exact macOS/Windows behaviour (Keychain / DPAPI vs. file) are unverified. Do NOT copy values into any report.

    Primary credential store on Linux (file mode 0600) and Windows (%USERPROFILE%\.claude\.credentials.json, inheriting user-profile ACLs). On macOS it is only the FALLBACK, written with mode 0600 when the Keychain rejects the write - for example when the Keychain is locked in an SSH session or its password is out of sync with the account password. When CLAUDE_CONFIG_DIR is set the file lives under that directory instead, including the macOS fallback copy. Shared store for OAuth tokens, saved MCP server OAuth logins, and plugin sensitive userConfig values, with an approximately 2 KB total limit. Community-reported structure: top-level `claudeAiOauth` object containing `accessToken` (sk-ant-oat01-...), `refreshToken` (sk-ant-ort01-...), `expiresAt` (epoch ms), `refreshTokenExpiresAt`, `scopes` (e.g. user:inference, user:profile), `subscriptionType`, `rateLimitTier`; a top-level `mcpOAuth` object is also reported. The exact key set is NOT stated in Anthropic documentation.
  parser: null
- id: claude_code.macos_keychain_credentials
  category: credentials
  os:
  - macos
  paths:
  - ~/Library/Keychains/login.keychain-db
  format: binary
  sensitivity: secret
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/troubleshoot-install.md
  source_kind: official
  volatility: |-
    Removed and revoked by /logout. Rewritten on each credential refresh (each rewrite re-arms the ACL prompt behaviour described below).
  notes: |-
    The service/account names are NOT in Anthropic documentation - they are corroborated by Claude Code GitHub issue #81707 and an independent community gist, so medium confidence. For acquisition: the keychain file is encrypted at rest and needs the user's login password or an unlocked live system; prefer live triage or compelled credentials over hoping for the plaintext fallback file.

    Record structure: Anthropic documentation verifies that credentials are stored in the encrypted macOS login Keychain at ~/Library/Keychains/login.keychain-db and that Claude Code keys the entry to the configuration directory, so a session with a different CLAUDE_CONFIG_DIR reads a different entry. The specific item identifiers come from community sources: a generic-password item with SERVICE name `Claude Code-credentials` and ACCOUNT name equal to the macOS username, readable with `security find-generic-password -a <user> -w -s "Claude Code-credentials"` and written with `security add-generic-password -U -s "Claude Code-credentials"`. The decrypted value is the same JSON document described for .credentials.json (claudeAiOauth / mcpOAuth). A reported ACL partition list of `teamid:NKUJUXUJ3B` excludes `apple-tool:`, which is why /usr/bin/security prompts.
  parser: null
- id: claude_code.file_history_snapshots
  category: file_snapshot
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/file-history/<session-id>/
  - ~/.claude/file-history/*/*
  - '%USERPROFILE%\.claude\file-history\*\*'
  format: binary
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
  volatility: |-
    Aggressively pruned. Only the 100 most recent checkpoints per session are retained; when an older checkpoint is discarded, the snapshot files no remaining checkpoint references are deleted, EXCEPT each file's first snapshot (kept as the VS Code extension's session-diff baseline). The whole directory is then swept under cleanupPeriodDays, ~30 days after the session last saved a snapshot. v2.1.50 capped snapshots to bound memory; v2.1.208 began pruning superseded file-history backups to bound disk. `claude project purge` deletes the per-session entries.
  notes: |-
    Pre-edit copies of every file Claude changed, taken before each prompt that starts a turn - i.e. the ORIGINAL content of files the agent modified or destroyed, which may not exist anywhere else if the change was never committed. Highest-value artifact for 'what did this agent overwrite'. Because each file's FIRST snapshot is deliberately never deleted, a baseline copy often survives long after the rest of the session's snapshots are pruned. Note the persistence asymmetry an analyst can exploit: checkpoints are saved with the conversation so /rewind survives a resume, but if the snapshots have been swept the restore fails with 'No files were restored'.

    Record structure: Internal layout and file naming are NOT documented publicly - needs verification on a test system. The transcript contains matching `type: "file-history-snapshot"` lines (described in a third-party parser as 'internal file backup metadata'), which is the documented-adjacent route to map a snapshot to a checkpoint and a timestamp.
  parser: null
- id: claude_code.feedback_drafts
  category: log
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/feedback/drafts/
  - ~/.claude/feedback/drafts/*
  - '%USERPROFILE%\.claude\feedback\drafts\*'
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/tools-reference.md
  source_kind: official
  volatility: |-
    Double-bounded: swept after cleanupPeriodDays OR 30 days, whichever is SHORTER, and the queue is capped at 10 drafts - reaching the cap deletes the oldest draft. So this is a rolling window of at most 10 items.
  notes: |-
    Model-written descriptions of problems encountered during sessions, stored locally and never sent unless the user chooses to send. Useful as a narrative summary of what went wrong in a session, in the model's own words.

    Record structure: Queued Claude-drafted feedback awaiting human review in `/feedback`. Per-file schema not documented - needs verification. Requires Claude Code v2.1.238 or later, so absence on older versions is expected.
  parser: null
- id: claude_code.feedback_bundles
  category: transcript
  os:
  - linux
  - macos
  - windows
  paths:
  - '%USERPROFILE%\.claude\feedback-bundles\*'
  - ~/.claude/feedback-bundles/
  - ~/.claude/feedback-bundles/*
  - ~/.claude/feedback/drafts/
  format: binary
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/data-usage.md
  source_kind: official
  volatility: |-
    Swept under cleanupPeriodDays (default 30 days).

    feedback-bundles/ is swept after cleanupPeriodDays. feedback/drafts/ is swept after cleanupPeriodDays OR 30 days, whichever is SHORTER, and at the 10-draft limit the oldest draft is deleted to make room.
  notes: |-
    A self-contained, portable copy of a whole session including subagents, written when `/feedback` runs on a third-party provider (Bedrock, Vertex, Foundry, gateway) or with no first-party credentials configured. It can therefore contain a session whose original transcript has already aged out or been purged. Its existence also tells you the user intended to send a transcript off the machine.

    Redacted transcript archives are still transcript material and may survive as a bundle after the original .jsonl is gone. Note the redaction: content here is deliberately scrubbed, so absence of a secret in a bundle is not evidence it was absent from the session.

    Record structure: Archive files containing a redacted transcript bundle. Vendor states the payload is the conversation transcript, ANY SUBAGENT TRANSCRIPTS, and the raw session log file from disk, with known API key and token patterns redacted but source code and file contents included as-is. Since v2.1.224 the consented share may also include the last request's model settings - the SYSTEM PROMPT, which embeds the user's CLAUDE.md instructions, plus tool definitions. Container format not documented - needs verification.

    feedback-bundles/ holds REDACTED transcript archives written by /feedback on third-party providers or when no Anthropic credentials are configured. feedback/drafts/ holds queued Claude-drafted feedback awaiting review in /feedback; gated by the `feedbackDrafts` setting.
  parser: null
- id: claude_code.subagent_transcripts
  category: transcript
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/projects/<project>/<session-id>/subagents/agent-<agentId>.jsonl
  - ~/.claude/projects/<project>/<session-id>/subagents/agent-<agentId>.meta.json
  - ~/.claude/projects/*/*/subagents/*.jsonl
  - '%USERPROFILE%\.claude\projects\*\*\subagents\*.jsonl'
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/sub-agents.md
  source_kind: official
  volatility: |-
    Removed with the parent session transcript when it ages out under cleanupPeriodDays (default 30 days). Unaffected by main-conversation compaction - they live in separate files, so a subagent transcript can survive content that was compacted out of the trunk.
  notes: |-
    Note the shape change: <session-id> is BOTH a .jsonl file and a sibling DIRECTORY under the same project folder. Hook payloads expose the path as `agent_transcript_path`. The subagent's own work - its prompts, its tool calls, its file reads - is only here, not in the parent transcript, so skipping this directory loses most of the agentic activity in a delegation-heavy session. The `.meta.json` sidecar naming and contents come from a third-party parser's source, not from vendor docs.

    Record structure: Same line format as the trunk transcript, but every line has `isSidechain: true` and carries `agentId` (membership). Trunk lines link to a subagent via `toolUseResult.agentId` or, per a third-party parser, via the `toolUseId` inside the `agent-<id>.meta.json` sidecar; the sidecar also carries `agentType` (e.g. "workflow-subagent") and, for the teammates feature, a `name`. Nested agent->agent spawns are linkable through these. Some subagent files (e.g. prompt-suggestion helpers) are never referenced from the trunk at all - enumerate the directory, do not walk only from trunk references. Teammate traffic appears in trunk user entries as <\teammate-message> blocks (teammates feature, CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1).
  parser: null
- id: claude_code.tool_result_spills
  category: transcript
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/projects/<project>/<session-id>/tool-results/
  - ~/.claude/projects/*/*/tool-results/*
  - '%USERPROFILE%\.claude\projects\*\*\tool-results\*'
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
  volatility: |-
    Swept with the session under cleanupPeriodDays (default 30 days). Changelog v2.1.83 fixed 'tool result files never being cleaned up, ignoring the cleanupPeriodDays setting' - on evidence from before v2.1.83 expect spill files far older than the retention window to survive.
  notes: |-
    Contains the bulk content of big command outputs, fetched web pages and large file reads - i.e. exactly the material an analyst wants when asking 'what did the agent actually see'.

    Record structure: Large tool outputs spilled out of the transcript into separate files; the transcript line references them instead of inlining the content. Exact file naming is NOT documented publicly (an unverified observation in this environment shows files named after the tool-use id with a .txt extension, e.g. toolu_<id>.txt - treat as needing verification on a test system). Ingest must join these back to the referencing transcript entry or tool output will be silently truncated in the reconstructed conversation.
  parser: null
- id: claude_code.transcripts
  category: transcript
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/projects/<project>/<session-id>.jsonl
  - ~/.claude/projects/*/*.jsonl
  - '%USERPROFILE%\.claude\projects\*\*.jsonl'
  - $CLAUDE_CONFIG_DIR/projects/*/*.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/sessions.md
  source_kind: official
  volatility: |-
    Deleted by a startup retention sweep once older than `cleanupPeriodDays` (default 30 days, minimum 1; `0` is rejected with a validation error since v2.1.89). Sweep is skipped entirely in bare mode (`claude -p --bare`) and paused when the retention period cannot be safely determined. Transcripts of sessions started or last continued in the desktop/Cowork app are kept at ANY age unless `desktopSessionCleanupPeriodDays` is set (v2.1.248+). `claude project purge <path>` deletes one project's transcripts on demand.
  notes: |-
    The single richest artifact. Resume/continue works off these files; `claude --resume <transcript-path>` accepts an absolute path to one. A session file is appended to on every resume, so one file can span days. Session IDs are UUIDs (e.g. 00893aaf-19fa-41d2-8238-13269b9b3ca0.jsonl). Path encoding of <project>: the working-directory path with every NON-ALPHANUMERIC character replaced by a single `-`; if the converted name exceeds 200 characters it is truncated to 200 and a hash of the full path appended. So /home/alice/work/my-repo -> -home-alice-work-my-repo; C:\dev\physics_project -> C--dev-physics-project (drive colon and each backslash each become one dash, leading char is a dash on POSIX); dots, spaces and underscores all become dashes; each non-ASCII character becomes one dash (so two different CJK folder names can collide - see corrections). Ingest must NOT hardcode ~/.claude: `CLAUDE_CONFIG_DIR` relocates the whole tree, and `CLAUDE_CODE_PROJECT_DIR_NAME` (v2.1.234+, only honored together with CLAUDE_CONFIG_DIR) replaces the derived <project> name with a literal 1-64 char name. Files are plaintext, never encrypted at rest; OS permissions are the only protection. Writing can be suppressed entirely with CLAUDE_CODE_SKIP_PROMPT_HISTORY=1, `--no-session-persistence` with `-p`, or persistSession:false in the TS SDK.

    Record structure: One JSON object per line. Official docs warn the entry format is internal and changes between releases. Field names observed in a third-party parser's models (community): common fields on message entries are `type`, `uuid`, `parentUuid`, `sessionId`, `timestamp`, `cwd`, `version` (the Claude Code version that wrote the line - use it to date the artifact), `isSidechain`, `userType`, `isMeta`, `agentId`, `gitBranch`, `teamName`, `spawnedAgentId`; user entries add `message`, `toolUseResult`, `imagePasteIds`, `sourceToolUseID`; assistant entries add `requestId`. `type` values seen: "user", "assistant", "system" (with `subtype`, `level`, `hookErrors`, `hookInfos`, `compactMetadata`), "summary" (with `summary` + `leafUuid`, no sessionId), "queue-operation", "ai-title", "progress", plus non-message state lines: "file-history-snapshot" (internal file backup metadata), "last-prompt" (trailing marker written as the last line of the file), "permission-mode" ({permissionMode}), "mode", "custom-title", "agent-name", "agent-color", "frame-link" ({path, frameUrl, timestamp} written alongside a successful Artifact publish - maps a local file to a published claude.ai page). Entries form a DAG via parentUuid, so a single file can contain several conversation branches after /rewind or forking. v2.1.212+ records the reasoning-effort level on each assistant message. Pre-edit file copies are embedded in the transcript (capped since v2.1.97). Analyst value: full prompts and responses, every tool call and tool result, therefore file contents read, shell commands and their output, pasted text, cwd per line, git branch per line, model/token/cost metadata, and any secret a tool touched.
  parser: null
- id: claude_code.transcripts_set_aside
  category: transcript
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/projects/<project>/<session-id>.orphaned-<timestamp>-<suffix>.jsonl
  - ~/.claude/projects/<project>/<session-id>.jsonl.superseded-<timestamp>
  - ~/.claude/projects/*/*.orphaned-*.jsonl
  - ~/.claude/projects/*/*.jsonl.superseded-*
  - '%USERPROFILE%\.claude\projects\*\*.jsonl.superseded-*'
  format: jsonl
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://code.claude.com/docs/en/claude-directory
  source_kind: official
