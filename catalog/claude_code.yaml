- id: claude_code.history_jsonl
  category: prompt_history
  os:
  - linux
  - macos
  - windows
  paths:
  - $CLAUDE_CONFIG_DIR/history.jsonl
  - '%USERPROFILE%\.claude\history.jsonl'
  - ~/.claude/history.jsonl
  format: jsonl
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://code.claude.com/docs/en/claude-directory.md
  source_kind: official
  volatility: |-
    NOT part of the age-based retention sweep - kept until the user deletes it, so it routinely outlives the transcripts. `claude project purge <path>` filters out matching prompt lines; `claude project purge --all` deletes the file outright. Writing is suppressed entirely by CLAUDE_CODE_SKIP_PROMPT_HISTORY.

    NOT swept by the age-based cleanup - kept until deleted. But `claude project purge <path>` filters out the lines typed in that project (the dry-run plan prints e.g. 'filter: /home/alice/.claude/history.jsonl - 12 prompt(s) typed in this project'), and `claude project purge --all` deletes the file outright. Not written at all when CLAUDE_CODE_SKIP_PROMPT_HISTORY=1.
  notes: |-
    Often the single highest-value artifact in this family: an unexpired, timestamped, project-attributed record of user intent that survives transcript deletion. Collect first. Included here because it is the config-directory sibling of the state files, though the transcript family may also claim it.

    Every prompt the human typed, across all projects, in one flat file with an absolute project path per entry - the fastest way to build a timeline of what a user asked an agent to do and in which repositories, even for sessions whose transcripts have already aged out. Backs up-arrow recall, Ctrl+R search and `!` shell-command completion, so it also captures shell commands the user ran through the `!` prefix. v2.1.239 fixed masked inputs (e.g. login codes) being saved to prompt history when cleared with double-Esc - on older versions this file can contain auth material.

    Record structure: One record per prompt the user typed, each with a timestamp and the project path. Backs up-arrow recall, Ctrl+R history search and `!` shell-command completion. Plaintext, not encrypted at rest.

    Official docs state each entry holds the prompt with its timestamp and project path. Exact field names could not be verified from a page I was able to fetch: a third-party reference (reached only via search snippet, page blocked) reports `display` (prompt text), `pastedContents` (object), `timestamp` (epoch ms) and `project` (path) - treat those names as unverified. No `sessionId` field is documented; the starting brief's 'possibly a sessionId' could not be confirmed. Robustness note: changelog v2.1.243 fixed history search breaking on a MALFORMED entry, and v2.1.89 fixed CJK/emoji prompts being silently dropped when they fall on a 4KB boundary - so expect truncated or corrupt lines, and parse line-by-line with error tolerance rather than failing the file.
  parser: null
