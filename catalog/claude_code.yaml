- id: claude_code.user_settings
  category: config
  os:
  - macos
  - windows
  - linux
  paths:
  - ~/.claude/settings.json
  - $CLAUDE_CONFIG_DIR/settings.json
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://code.claude.com/docs/en/settings.md
  source_kind: official
  volatility: |-
    Never swept. Persists until the user deletes it. Claude Code writes it the first time a /config option that belongs to user scope changes (e.g. theme).
  notes: |-
    Marked sensitivity secret because `env` commonly holds plaintext tokens and `apiKeyHelper` reveals the credential pipeline. `$CLAUDE_CONFIG_DIR` relocates the entire configuration directory (default ~/.claude) - check the launching shell profile and settings env blocks for it before assuming ~/.claude.

    Record structure: Precedence rank 5 (lowest of the four files). Forensically load-bearing keys, exact spelling: `permissions` object -> `allow`, `ask`, `deny` (arrays of `Tool` or `Tool(specifier)` rules; evaluation order deny > ask > allow, first match wins), `additionalDirectories`, `blockReadsOutsideWorkingDirectories`, `defaultMode`, `disableBypassPermissionsMode` (value is the string "disable"), `disableAutoMode`. Permission mode names: `default`, `acceptEdits`, `plan`, `auto`, `dontAsk`, `bypassPermissions`, and `manual` (alias for `default`, v2.1.200+). `hooks` object keyed by event name; each value an array of `{matcher, hooks}` groups whose entries have `type` of `command`|`prompt`|`agent`|`http`|`mcp_tool`. `env` object (string->string) can set ANTHROPIC_BASE_URL and any env var. Credential/provider keys: `apiKeyHelper` (shell command line, output sent as BOTH X-Api-Key and Authorization: Bearer), `awsAuthRefresh`, `awsCredentialExport`, `gcpAuthRefresh`, `otelHeadersHelper`, `forceLoginMethod`, `forceLoginGatewayUrl`, `forceLoginOrgUUID`. Executable-reference keys worth flagging: `statusLine`, `subagentStatusLine`, `fileSuggestion`, `processWrapper`, `policyHelper`. Plugin/MCP keys: `enabledPlugins` (map "plugin@marketplace"->bool), `extraKnownMarketplaces`, `pluginConfigs` (non-sensitive plugin userConfig answers, keyed by plugin id), `blockedMarketplaces`, `strictKnownMarketplaces`, `managedMcpServers`, `allowedMcpServers`, `deniedMcpServers`, `enabledMcpjsonServers`, `disabledMcpjsonServers`, `enableAllProjectMcpServers`, `allowAllClaudeAiMcps`, `disableClaudeAiConnectors`. Data-retention keys: `cleanupPeriodDays`, `desktopSessionCleanupPeriodDays`. Sandbox tree `sandbox.*` incl. `sandbox.network.allowedDomains`, `sandbox.credentials.files`, `sandbox.credentials.envVars`. Also `sshConfigs`, `sshHostAllowlist` (host/identity leakage), `autoMemoryDirectory`, `plansDirectory`, `claudeMd`, `claudeMdExcludes`, `agent`, `teammateMode`, `worktree.*`. Full key index is at the settings-reference URL.
  parser: null
