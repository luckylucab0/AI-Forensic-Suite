  - '%LOCALAPPDATA%\hermes\memories\USER.md'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\memories\USER.md'
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persists independently of sessions and of session pruning.
  notes: |-
    USER.md is often the single most personally identifying file in the whole Hermes tree, and it survives prune_sessions(). Where transcripts have been pruned, this is your best remaining summary of what the agent knew about the operator.

    Record structure: MEMORY.md holds general facts; USER.md holds user-specific information.
  parser: memory
- id: hermes.sessions_dir
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/sessions/
  - $HERMES_HOME/profiles/<name>/sessions/
  - ~/.hermes/sessions/
  - ~/.hermes/profiles/<name>/sessions/
  - '%LOCALAPPDATA%\hermes\sessions\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\sessions\'
  format: jsonl
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Legacy per-session JSONL files predating state.db are expected to remain on disk.
  notes: |-
    Collect the whole directory. As with Goose and OpenCode, the pre-SQLite files are the copy that in-app deletion and pruning do not reach.

    Record structure: Documented as 'Gateway session data and conversation transcripts'. The session-storage doc says the SQLite database 'replaces the earlier per-session JSONL file approach' but does not detail the legacy layout - enumerate the directory rather than assuming a filename pattern.
  parser: jsonl_generic
- id: hermes.state_db
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/state.db
  - $HERMES_HOME/profiles/<name>/state.db
  - $HERMES_HOME/state.db-shm
  - $HERMES_HOME/profiles/<name>/state.db-shm
  - $HERMES_HOME/state.db-wal
  - $HERMES_HOME/profiles/<name>/state.db-wal
  - ~/.hermes/state.db
  - ~/.hermes/profiles/<name>/state.db
  - '%LOCALAPPDATA%\hermes\state.db'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state.db'
  - ~/.hermes/state.db-shm
  - ~/.hermes/profiles/<name>/state.db-shm
  - '%LOCALAPPDATA%\hermes\state.db-shm'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state.db-shm'
  - ~/.hermes/state.db-wal
  - ~/.hermes/profiles/<name>/state.db-wal
  - '%LOCALAPPDATA%\hermes\state.db-wal'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state.db-wal'
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/developer-guide/session-storage.md
  source_kind: official
  unsourced_paths:
  - $HERMES_HOME/state.db-shm
  - $HERMES_HOME/profiles/<name>/state.db-shm
  - $HERMES_HOME/state.db-wal
  - $HERMES_HOME/profiles/<name>/state.db-wal
  volatility: |-
    Journal mode is configurable (WAL or delete) - capture -wal and -shm. Compaction ARCHIVES old rows by setting active=0 rather than deleting them, so compacted history is still fully present. Real deletion only happens via explicit prune_sessions(older_than_days=N) (the docs example uses 90) or clear_messages().
  notes: |-
    Confirms the brief and adds a lot. Two standout fields: sessions.system_prompt preserves the exact instructions in force for each session, and messages.reasoning/reasoning_content can preserve chain-of-thought. sessions.source distinguishes CLI work from Telegram/Discord-driven work - i.e. remote operation of the agent. Always query WHERE active=0 too, or you will silently skip compacted history. The FTS tables are themselves a searchable shadow copy of message text and may retain content after a messages row is altered.

    Record structure: Schema version 23. sessions: id, source (CLI/Telegram/Discord), user_id, model, model_config, system_prompt, parent_session_id, started_at, ended_at, end_reason, message_count, tool_call_count, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens, billing_provider, billing_base_url, billing_mode, estimated_cost_usd, actual_cost_usd, cost_status, cost_source, pricing_version, plus gateway/workspace metadata. messages: id, session_id, role, content, tool_call_id, tool_calls (JSON), tool_name, timestamp, token_count, finish_reason, reasoning, reasoning_content, reasoning_details, codex_reasoning_items, codex_message_items, platform_message_id, observed, active, compacted, api_content. FTS5 virtual tables: messages_fts, messages_fts_trigram, messages_fts_cjk. Supporting: session_model_usage, state_meta, gateway_routing, compression_locks, async_delegations, delivery_obligations, schema_version.
  parser: hermes
