    A saved conversation is written on request and not pruned. The routing mirror is rewritten as sessions come and go and can be turned off in the configuration, in which case it is simply absent.
  notes: |-
    Two files the directory-wide entry for the session directory would have read as line-delimited records, which they are not.

    A saved conversation is an export somebody asked for, in the session directory rather than the export directory, and like every export it survives the pruning of the conversation it came from.

    The routing mirror is a different thing and the vendor warns about it directly: it is not the session list. It maps messaging keys to active session ids and holds gateway and messaging entries only, so an analyst reading it as the list of conversations would conclude the command line was never used. Its value is the keys, which name the platform, the chat and the direction each session came in on.

    Record structure: a saved conversation is one JSON document per file. The mirror is the routing index, keyed by strings of the form agent:main:<platform>:....
