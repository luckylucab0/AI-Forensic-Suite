    Treat it as an evidence container rather than a file. It holds copies of artifacts this catalogue lists individually, so what an analyst is holding after expanding one is a second complete case from an earlier date, and the credential files inside it are live credentials the endpoint may no longer use.

    Record structure: backups/pre-update-<date>-<time>.zip before an update, backups/pre-migration-<date>-<time>.zip before a schema migration, and whatever name a user chose for one they made themselves. Earlier backups and the snapshot directory are not nested inside a new one.
