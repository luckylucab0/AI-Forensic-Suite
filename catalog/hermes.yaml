  source_kind: source_code
  volatility: |-
    An entry is removed when its paste is deleted, which a sweep does about six hours after the upload. So this file names recent uploads only, and an empty file does not mean none were made.
  notes: |-
    A list of addresses on a public paste service where this endpoint's data now is.

    The product's own troubleshooting command uploads system information and the tails of the agent's logs to a public paste service, with a second service as a fallback, and records the resulting address here so it can delete it again later. Each entry is a URL and the time it expires.

    For an analyst this is a data egress record with the destination written down, which almost nothing else on an endpoint gives. Two things follow. The upload is public while it lasts, so anybody with the address had it. And the redaction the command applies is partial by the product's own notice, so what went out is not limited to what the redaction covers.

    The fallback service's pastes have no deletable identifier and are kept for a month rather than six hours, so an address for it is a longer exposure than an address for the primary one.

    Record structure: a JSON array of objects, each with url and expire_at. An entry missing either field is discarded by the product when it reads the file, so a malformed entry is still evidence and is only here.
