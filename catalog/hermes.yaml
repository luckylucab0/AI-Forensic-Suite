  - ~/.hermes/auth.json
  - ~/.hermes/profiles/<name>/auth.json
  - '%LOCALAPPDATA%\hermes\auth.json'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\auth.json'
  format: json
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
