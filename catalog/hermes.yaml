  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    Record metadata and hash only. Key names are still worth recording - they enumerate the providers and gateways the agent could authenticate to.

    Record structure: API keys, tokens and passwords; takes precedence over config.yaml. 'hermes config set' automatically routes sensitive values here.
