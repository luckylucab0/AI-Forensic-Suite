# Hermes artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: hermes
title: Hermes
vendor: Hermes
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/NousResearch/
- https://raw.githubusercontent.com/NousResearch/
- https://nousresearch.com/
description: |-
  A self-hosted agent that runs as a long-lived process rather than as a command a person types, which is why its evidence is shaped the way it is: one home directory holds everything, and the same home is reachable from a chat platform as well as from the terminal.

  Where that home is decides whether a collection finds anything at all, and it is not the same on every platform. The agent resolves it as an in-process override, then the HERMES_HOME variable, then a platform default, and the platform default is ~/.hermes on macOS and Linux but %LOCALAPPDATA%\hermes on Windows. The user guide says ~/.hermes throughout and never mentions the Windows location, so a catalogue built from the documentation alone points every Windows path at a directory the product never creates and reports a clean endpoint. Both spellings are listed on every entry for that reason. Installed inside WSL2 the agent is a Linux install and lives at ~/.hermes inside the distribution's filesystem, which a collection of the Windows volume does not reach.

  The home can also exist several times over. A named profile is a complete second home at <home>/profiles/<name>/, with its own configuration, credentials, memories, skills, sessions and logs, and the agent serves every live one of them at once. A collection that takes only the default home takes one agent out of however many were running, and the others look like they were never there.
references:
- |-
  https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/developer-guide/session-storage.md
- https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
- https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_constants.py
- https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/multi-profile-gateways.md
- https://raw.githubusercontent.com/NousResearch/hermes-agent/main/README.md
env_overrides:
- name: HERMES_HOME
  effect: |-
    Relocates the agent's entire directory: configuration, credentials, memories, skills, scheduled jobs, session transcripts and logs all hang off it. Every path in this file has a spelling rooted at this variable for that reason.
  source: |-
    https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
artifacts:
- id: hermes.config
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/config.yaml
  - $HERMES_HOME/profiles/<name>/config.yaml
  - ~/.hermes/config.yaml
  - ~/.hermes/profiles/<name>/config.yaml
  - '%LOCALAPPDATA%\hermes\config.yaml'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\config.yaml'
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    The terminal backend setting (Docker, Singularity, host) tells you how much of the agent's command execution happened inside a container versus directly on the endpoint - which decides where else to look for side effects.

    Record structure: Model selection, terminal backend, compression settings, memory limits, context length, active MCP servers, and a skills.config namespace for skill-declared settings. Doubles as the MCP config.
  parser: yaml_generic
- id: hermes.cron
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/cron/
  - $HERMES_HOME/profiles/<name>/cron/
  - ~/.hermes/cron/
  - ~/.hermes/profiles/<name>/cron/
  - '%LOCALAPPDATA%\hermes\cron\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\cron\'
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until removed.
  notes: |-
    Critical for attribution: a scheduled job means agent activity that occurred with NO human at the keyboard. Any timeline that assumes interactive use will be wrong if this directory is populated.

    Record structure: Scheduled jobs and automation tasks. File format not documented - enumerate.
  parser: yaml_generic
- id: hermes.profiles
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/profiles/<name>/profile.yaml
  - ~/.hermes/profiles/<name>/profile.yaml
  - '%LOCALAPPDATA%\hermes\profiles\<name>\profile.yaml'
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/bot-mode.md
  source_kind: official
  volatility: Persistent for as long as the profile exists. Removed with the profile directory.
  notes: |-
    This file is how you enumerate the agents on the endpoint. A named profile is a second complete home under profiles/<name>/, with its own configuration, credentials, memories, skills, sessions, scheduled jobs, logs and transcript database, and the agent serves every live one of them at the same time. Every other entry in this file therefore carries a profiles/<name>/ spelling beside its default-home one, because an analyst who collects only the default home collects one agent out of however many ran.

    The vendor's own test for whether a directory under profiles/ is a profile rather than a leftover is the presence of one of six marker files: config.yaml, .env, SOUL.md, profile.yaml, auth.json or state.db. Read that the other way round for a collection: a directory under profiles/ that carries none of them is a shell the product itself will not list, and it is worth looking at for exactly that reason.

    Record structure: The chat-facing product calls a profile a bot, and profile.yaml is its marker file; the vendor's example is an empty block, so expect the file to carry little or nothing and treat its existence rather than its content as the evidence.
  parser: yaml_generic
- id: hermes.profile_tombstones
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/profiles/.deleted/
  - ~/.hermes/profiles/.deleted/
  - '%LOCALAPPDATA%\hermes\profiles\.deleted\'
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: |-
    https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_constants.py
  source_kind: source_code
  volatility: |-
    Outlives the profile it names. Deleting the profile removes its directory and writes this marker; only re-creating a profile of the same name removes the marker again.
  notes: |-
    The highest-value small file this agent has. Deleting a profile removes the whole profile directory, which takes its transcripts, its credentials, its memories and its scheduled jobs with it, and leaves behind one file here named after the profile. That file is the only remaining statement on the endpoint that the profile ever existed, and its own mtime dates the deletion.

    A tombstone is also written when a profile is renamed while a gateway is serving it, under the old name. So a name here means the profile was deleted or renamed, not deleted alone, and a name here that also exists as a live directory under profiles/ is a re-created profile rather than a contradiction.

    Collect this before anything else in the tree. It is a few bytes, it survives the removal of everything it refers to, and a collection that finds a name here and no matching directory has found evidence of destruction rather than an empty result.

    Record structure: One file per deleted profile, named after the profile and holding the single word deleted. The directory is created on the first deletion, so its absence means no profile was ever deleted under this home.
  parser: text_config
- id: hermes.auth
  category: credentials
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/auth.json
  - $HERMES_HOME/profiles/<name>/auth.json
  - ~/.hermes/auth.json
  - ~/.hermes/profiles/<name>/auth.json
  - '%LOCALAPPDATA%\hermes\auth.json'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\auth.json'
  format: json
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until the grant is revoked.
  notes: |-
    Record metadata and hash only.

    Record structure: OAuth provider credentials for integrations such as Nous Portal.
  parser: null
- id: hermes.env
  category: credentials
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/.env
  - $HERMES_HOME/profiles/<name>/.env
  - ~/.hermes/.env
  - ~/.hermes/profiles/<name>/.env
  - '%LOCALAPPDATA%\hermes\.env'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\.env'
  format: text
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    Record metadata and hash only. Key names are still worth recording - they enumerate the providers and gateways the agent could authenticate to.

    Record structure: API keys, tokens and passwords; takes precedence over config.yaml. 'hermes config set' automatically routes sensitive values here.
  parser: null
- id: hermes.sandboxes
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/sandboxes/
  - $HERMES_HOME/profiles/<name>/sandboxes/
  - ~/.hermes/sandboxes/
  - ~/.hermes/profiles/<name>/sandboxes/
  - '%LOCALAPPDATA%\hermes\sandboxes\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\sandboxes\'
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Documented as temporary execution environments and cached data - expect churn and reuse.
  notes: |-
    May contain files the agent created or downloaded during tool use that exist nowhere else, including in-flight exfiltration staging. Worth a full content sweep despite being nominally temporary.

    Record structure: Per-backend (Docker, Singularity, etc.) execution environments and caches.
  parser: null
- id: hermes.skills
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/skills/
  - $HERMES_HOME/profiles/<name>/skills/
  - ~/.hermes/skills/
  - ~/.hermes/profiles/<name>/skills/
  - '%LOCALAPPDATA%\hermes\skills\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\skills\'
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until removed.
  notes: |-
    These are AGENT-AUTHORED, not user-authored. A skill the agent wrote for itself is direct evidence of self-directed capability acquisition, with an mtime that dates it.

    Record structure: Agent-created skills, managed via the skill_manage tool. Skills may declare config under the skills.config namespace in config.yaml.
  parser: instructions
- id: hermes.soul
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/SOUL.md
  - $HERMES_HOME/profiles/<name>/SOUL.md
  - ~/.hermes/SOUL.md
  - ~/.hermes/profiles/<name>/SOUL.md
  - '%LOCALAPPDATA%\hermes\SOUL.md'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\SOUL.md'
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    This is the top-priority system-prompt slot: whatever is here shaped every single session. Compare it against sessions.system_prompt in state.db to detect whether it was edited mid-history.

    Record structure: Documented as 'Primary agent identity (slot #1 in system prompt)'.
  parser: instructions
- id: hermes.logs
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/logs/
  - $HERMES_HOME/profiles/<name>/logs/
  - ~/.hermes/logs/errors.log
  - ~/.hermes/profiles/<name>/logs/errors.log
  - '%LOCALAPPDATA%\hermes\logs\errors.log'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\logs\errors.log'
  - ~/.hermes/logs/gateway.log
  - ~/.hermes/profiles/<name>/logs/gateway.log
  - '%LOCALAPPDATA%\hermes\logs\gateway.log'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\logs\gateway.log'
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Rotation not documented.
  notes: |-
    gateway.log records remote-channel activity (Telegram/Discord), corroborating sessions.source. The documented redaction means these are comparatively safe to review, but it also means absence of a token here is not evidence one was not used.

    Record structure: Documented as having 'secrets auto-redacted'.
  parser: text_log
- id: hermes.memories
  category: memory
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/memories/
  - $HERMES_HOME/profiles/<name>/memories/
  - ~/.hermes/memories/MEMORY.md
  - ~/.hermes/profiles/<name>/memories/MEMORY.md
  - '%LOCALAPPDATA%\hermes\memories\MEMORY.md'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\memories\MEMORY.md'
  - ~/.hermes/memories/USER.md
  - ~/.hermes/profiles/<name>/memories/USER.md
  - '%LOCALAPPDATA%\hermes\memories\USER.md'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\memories\USER.md'
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persists independently of sessions and of session pruning.
  notes: |-
    USER.md is often the single most personally identifying file in the whole Hermes tree, and it survives prune_sessions(). Where transcripts have been pruned, this is your best remaining summary of what the agent knew about the operator.

    Record structure: MEMORY.md holds general facts; USER.md holds user-specific information.
  parser: memory
- id: hermes.sessions_dir
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/sessions/
  - $HERMES_HOME/profiles/<name>/sessions/
  - ~/.hermes/sessions/
  - ~/.hermes/profiles/<name>/sessions/
  - '%LOCALAPPDATA%\hermes\sessions\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\sessions\'
  format: jsonl
  sensitivity: normal
  collect_priority: normal
  legacy: true
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Legacy per-session JSONL files predating state.db are expected to remain on disk.
  notes: |-
    Collect the whole directory. As with Goose and OpenCode, the pre-SQLite files are the copy that in-app deletion and pruning do not reach.

    Record structure: Documented as 'Gateway session data and conversation transcripts'. The session-storage doc says the SQLite database 'replaces the earlier per-session JSONL file approach' but does not detail the legacy layout - enumerate the directory rather than assuming a filename pattern.
  parser: jsonl_generic
- id: hermes.state_db
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/state.db
  - $HERMES_HOME/profiles/<name>/state.db
  - $HERMES_HOME/state.db-shm
  - $HERMES_HOME/profiles/<name>/state.db-shm
  - $HERMES_HOME/state.db-wal
  - $HERMES_HOME/profiles/<name>/state.db-wal
  - ~/.hermes/state.db
  - ~/.hermes/profiles/<name>/state.db
  - '%LOCALAPPDATA%\hermes\state.db'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state.db'
  - ~/.hermes/state.db-shm
  - ~/.hermes/profiles/<name>/state.db-shm
  - '%LOCALAPPDATA%\hermes\state.db-shm'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state.db-shm'
  - ~/.hermes/state.db-wal
  - ~/.hermes/profiles/<name>/state.db-wal
  - '%LOCALAPPDATA%\hermes\state.db-wal'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state.db-wal'
  format: sqlite
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/developer-guide/session-storage.md
  source_kind: official
  unsourced_paths:
  - $HERMES_HOME/state.db-shm
  - $HERMES_HOME/profiles/<name>/state.db-shm
  - $HERMES_HOME/state.db-wal
  - $HERMES_HOME/profiles/<name>/state.db-wal
  volatility: |-
    Journal mode is configurable (WAL or delete) - capture -wal and -shm. Compaction ARCHIVES old rows by setting active=0 rather than deleting them, so compacted history is still fully present. Real deletion only happens via explicit prune_sessions(older_than_days=N) (the docs example uses 90) or clear_messages().
  notes: |-
    Confirms the brief and adds a lot. Two standout fields: sessions.system_prompt preserves the exact instructions in force for each session, and messages.reasoning/reasoning_content can preserve chain-of-thought. sessions.source distinguishes CLI work from Telegram/Discord-driven work - i.e. remote operation of the agent. Always query WHERE active=0 too, or you will silently skip compacted history. The FTS tables are themselves a searchable shadow copy of message text and may retain content after a messages row is altered.

    Record structure: Schema version 23. sessions: id, source (CLI/Telegram/Discord), user_id, model, model_config, system_prompt, parent_session_id, started_at, ended_at, end_reason, message_count, tool_call_count, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens, billing_provider, billing_base_url, billing_mode, estimated_cost_usd, actual_cost_usd, cost_status, cost_source, pricing_version, plus gateway/workspace metadata. messages: id, session_id, role, content, tool_call_id, tool_calls (JSON), tool_name, timestamp, token_count, finish_reason, reasoning, reasoning_content, reasoning_details, codex_reasoning_items, codex_message_items, platform_message_id, observed, active, compacted, api_content. FTS5 virtual tables: messages_fts, messages_fts_trigram, messages_fts_cjk. Supporting: session_model_usage, state_meta, gateway_routing, compression_locks, async_delegations, delivery_obligations, schema_version.
  parser: hermes
