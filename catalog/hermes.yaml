    Persistent until the grant is revoked or the integration is removed. A pending authorization file is written while an authorization is in flight and removed when it completes, so one left behind is an authorization that was started and not finished.
  notes: |-
    Record metadata and a hash only. The names are the evidence.

    The single credential file this catalogue had for this agent was the one its configuration guide documents. The product's own security page lists the rest, and each is a different account this agent could act as: a model provider's device authorization, a workspace suite, a chat platform, and a cached copy of a password manager's secrets. A file here is a standing ability to act as somebody, and it is on this endpoint rather than in that service's own store.

    The per-user files are the ones to read the names of first. One integration keeps a refresh token per person who authorized it, in a file named after their address, so the directory listing alone enumerates the people on whose behalf this agent could act. That is a scoping answer, and it comes from the file names without opening anything.

    Record structure: not read. The collector records the path, the size, the timestamps and a SHA-256, which is enough to say a grant existed and when it was last written.
  parser: null
