    Written when the product finds a write-ahead log whose database generation is gone, and left in place afterwards. Nothing prunes it, so a capture from months ago is still there.
  notes: |-
    A transaction this agent committed and then could not put back. When a write-ahead log is orphaned, because the database generation that wrote it was replaced or unlinked while a process still held it open, the product copies the log out before letting go of it, together with the database image it belonged to, and leaves the pair in a directory beside the live store.

    The frames in that log were committed. Whether they belong on top of the database now at the path is a judgement, which is exactly why the product does not decide it and leaves the pair on disk. For an analyst it means messages that are in no live store and in no snapshot can be here, and they are readable the ordinary way because the copy is a database with its log beside it.

    Read it as a store in its own right and compare it against the live one rather than merging it. The manifest in the same directory says when it was captured, what triggered it, and which generation was at the path at that moment, and it has an entry of its own.

    Record structure: the same schema as the live transcript store. Where the database was larger than 512 MB only its first hundred bytes were copied, as a file ending in .header, and then the log is here without the store it belongs to: the manifest says which of the two happened.
