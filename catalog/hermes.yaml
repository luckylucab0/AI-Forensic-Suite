  - $HERMES_HOME/profiles/<name>/state-snapshots/**
  - ~/.hermes/state-snapshots/**
  - ~/.hermes/profiles/<name>/state-snapshots/**
  - '%LOCALAPPDATA%\hermes\state-snapshots\**'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state-snapshots\**'
  format: directory
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_cli/backup.py
  source_kind: source_code
  volatility: |-
    Written before every update, for every profile on the install, and kept twenty deep by default. A snapshot whose database copy failed or was skipped for size suppresses the prune, so an older and more complete one survives rather than being rotated out.
  notes: |-
    A stack of point-in-time copies of everything this agent's state is kept in, taken by the product itself and left on the endpoint.

    That matters because the live stores can be emptied. The transcript database archives compacted history rather than deleting it, but an explicit prune really removes sessions, and a deleted profile takes its whole home. A snapshot taken before any of that still holds what was there. The one that matters most is the transcript database, which has an entry of its own beside this one so it is read rather than merely collected; the rest of the snapshot is here.

    Record structure: state-snapshots/<timestamp>[-label]/ per snapshot, with a manifest.json naming every file captured and its size, plus the failed and oversized files the snapshot could not take, and beside it the captured files at their original relative paths. The captured set is the product's own list of critical state: the transcript database, the configuration, the environment file, the credential file, the scheduled jobs and their execution database, the gateway state and channel directory, the project, response, memory, verification and board databases, and the platform pairing stores. A directory beginning with a dot and ending in .partial is a snapshot that was interrupted while being written.
  parser: null
