  - ~/.hermes/sandboxes/
  - ~/.hermes/profiles/<name>/sandboxes/
  - '%LOCALAPPDATA%\hermes\sandboxes\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\sandboxes\'
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Documented as temporary execution environments and cached data - expect churn and reuse.
  notes: |-
    May contain files the agent created or downloaded during tool use that exist nowhere else, including in-flight exfiltration staging. Worth a full content sweep despite being nominally temporary.

    Record structure: Per-backend (Docker, Singularity, etc.) execution environments and caches.
  parser: null
- id: hermes.skills
  category: instructions
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/skills/
  - $HERMES_HOME/profiles/<name>/skills/
  - ~/.hermes/skills/
  - ~/.hermes/profiles/<name>/skills/
  - '%LOCALAPPDATA%\hermes\skills\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\skills\'
  format: markdown
