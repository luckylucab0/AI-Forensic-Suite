# Hermes artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: hermes
title: Hermes
vendor: Hermes
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/NousResearch/
- https://raw.githubusercontent.com/NousResearch/
- https://nousresearch.com/
description: |-
  A self-hosted agent that runs as a long-lived process rather than as a command a person types, which is why its evidence is shaped the way it is: one home directory holds everything, and the same home is reachable from a chat platform as well as from the terminal.

  Where that home is decides whether a collection finds anything at all, and it is not the same on every platform. The agent resolves it as an in-process override, then the HERMES_HOME variable, then a platform default, and the platform default is ~/.hermes on macOS and Linux but %LOCALAPPDATA%\hermes on Windows. The user guide says ~/.hermes throughout and never mentions the Windows location, so a catalogue built from the documentation alone points every Windows path at a directory the product never creates and reports a clean endpoint. Both spellings are listed on every entry for that reason. Installed inside WSL2 the agent is a Linux install and lives at ~/.hermes inside the distribution's filesystem, which a collection of the Windows volume does not reach.

  The home can also exist several times over. A named profile is a complete second home at <home>/profiles/<name>/, with its own configuration, credentials, memories, skills, sessions and logs, and the agent serves every live one of them at once. A collection that takes only the default home takes one agent out of however many were running, and the others look like they were never there.
references:
- |-
  https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/developer-guide/session-storage.md
- https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
- https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_constants.py
- https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/multi-profile-gateways.md
- https://raw.githubusercontent.com/NousResearch/hermes-agent/main/README.md
env_overrides:
- name: HERMES_HOME
  effect: |-
    Relocates the agent's entire directory: configuration, credentials, memories, skills, scheduled jobs, session transcripts and logs all hang off it. Every path in this file has a spelling rooted at this variable for that reason.
  source: |-
    https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
artifacts:
- id: hermes.checkpoints
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/checkpoints/store/**
  - $HERMES_HOME/profiles/<name>/checkpoints/store/**
  - ~/.hermes/checkpoints/store/**
  - ~/.hermes/profiles/<name>/checkpoints/store/**
  - '%LOCALAPPDATA%\hermes\checkpoints\store\**'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\checkpoints\store\**'
  - $HERMES_HOME/checkpoints/legacy-*/**
  - $HERMES_HOME/profiles/<name>/checkpoints/legacy-*/**
  - ~/.hermes/checkpoints/legacy-*/**
  - ~/.hermes/profiles/<name>/checkpoints/legacy-*/**
  - '%LOCALAPPDATA%\hermes\checkpoints\legacy-*\**'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\checkpoints\legacy-*\**'
  format: binary
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/checkpoints-and-rollback.md
  source_kind: official
  record_types:
  - 'bare git repository: HEAD, objects, refs/hermes/<hash>, indexes/<hash>, info/exclude'
  volatility: |-
    Swept by the agent itself. A periodic prune drops projects whose last_touch is older than retention_days, seven by default, and projects whose working directory no longer exists. A total size cap, 500 MB by default, drops the oldest commit of each project that still has more than one, never below one. After refs are rewritten the store is marked and the next prune runs a git collection with immediate pruning, so a dropped commit really goes. The whole base can be removed in one command, and the legacy archives in another.
  notes: |-
    The richest artifact this agent has, and it is not a transcript. Before a tool call that changes files, once per directory per turn, the agent commits the working directory into a bare git repository of its own under its home. So the content of files the agent created, changed or deleted is recoverable from the object store after the working copy has moved on, after the branch is gone and after the project directory itself has been deleted, and the commit sequence is an ordered timeline dated by the endpoint's own clock.

    One store is shared by every project, so the object database deduplicates across projects and across turns, and one reference per project points at its tip. The project is named by a hash of the absolute path of its working directory rather than by the path, which is what the entry beside this one is for: the store's own project file carries the path in clear, so the hash never has to be reversed.

    Two things follow that are findings in their own right. Source code left the project directory and now sits in a second place under the user's home, which is a data-at-rest and scoping answer. And the default exclusions are wide: dependency and build output, virtualenvs, compiled binaries, media, and .env and .env.* by name. A secret the agent wrote into an environment file is the one thing this store will not hold, so an absence here is not an absence on the endpoint.

    Copy the store before running git against it. The collector takes it whole and never runs a binary on the target.

    Record structure: store/ is a bare repository: HEAD, objects/ loose and packed, refs/hermes/<hash> per project, indexes/<hash>, info/exclude. legacy-<timestamp>/ holds the per-project repositories of the layout that preceded the shared store, each a complete repository of its own, and they are still readable with git.
  parser: git_checkpoints
- id: hermes.checkpoint_projects
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/checkpoints/store/projects/*.json
  - $HERMES_HOME/profiles/<name>/checkpoints/store/projects/*.json
  - ~/.hermes/checkpoints/store/projects/*.json
  - ~/.hermes/profiles/<name>/checkpoints/store/projects/*.json
  - '%LOCALAPPDATA%\hermes\checkpoints\store\projects\*.json'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\checkpoints\store\projects\*.json'
  - $HERMES_HOME/checkpoints/store/ledgers/*.json
  - $HERMES_HOME/profiles/<name>/checkpoints/store/ledgers/*.json
  - ~/.hermes/checkpoints/store/ledgers/*.json
  - ~/.hermes/profiles/<name>/checkpoints/store/ledgers/*.json
  - '%LOCALAPPDATA%\hermes\checkpoints\store\ledgers\*.json'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\checkpoints\store\ledgers\*.json'
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/tools/checkpoint_manager.py
  source_kind: source_code
  volatility: |-
    Written beside the snapshot store and removed with the project it describes when the prune drops that project. The ledger keeps only the newest 2000 entries per project.
  notes: |-
    The index that makes the snapshot store readable, and an answer no transcript gives.

    A project file names the absolute working directory behind a project hash, with the time the agent first worked there and the time it last did. The hash is the first sixteen hex characters of the sha256 of that absolute path, so a project file also lets an analyst confirm a directory from the hash alone when the file itself is gone. Either way the directory is named here after it has been deleted from the endpoint.

    A ledger file is the store's own record of which writes were the agent's. It is a mapping from the absolute path of each file the agent wrote to the sha256 of what it wrote and the time it wrote it. That is attribution: a changed file on disk is not by itself an agent edit, and this says which ones were. The hashes are also how a copy found somewhere else, in a staging directory or a backup, is matched back to a write the agent made.

    Record structure: projects/<hash>.json carries the working directory and the created and last-touched timestamps. ledgers/<hash>.json is an object keyed by absolute path, each value holding sha256 and ts, capped at the 2000 newest writes.
  parser: json_generic
- id: hermes.state_snapshots
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/state-snapshots/**
  - $HERMES_HOME/profiles/<name>/state-snapshots/**
  - ~/.hermes/state-snapshots/**
  - ~/.hermes/profiles/<name>/state-snapshots/**
  - '%LOCALAPPDATA%\hermes\state-snapshots\**'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state-snapshots\**'
  format: directory
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_cli/backup.py
  source_kind: source_code
  volatility: |-
    Written before every update, for every profile on the install, and kept twenty deep by default. A snapshot whose database copy failed or was skipped for size suppresses the prune, so an older and more complete one survives rather than being rotated out.
  notes: |-
    A stack of point-in-time copies of everything this agent's state is kept in, taken by the product itself and left on the endpoint.

    That matters because the live stores can be emptied. The transcript database archives compacted history rather than deleting it, but an explicit prune really removes sessions, and a deleted profile takes its whole home. A snapshot taken before any of that still holds what was there. The one that matters most is the transcript database, which has an entry of its own beside this one so it is read rather than merely collected; the rest of the snapshot is here.

    Record structure: state-snapshots/<timestamp>[-label]/ per snapshot, with a manifest.json naming every file captured and its size, plus the failed and oversized files the snapshot could not take, and beside it the captured files at their original relative paths. The captured set is the product's own list of critical state: the transcript database, the configuration, the environment file, the credential file, the scheduled jobs and their execution database, the gateway state and channel directory, the project, response, memory, verification and board databases, and the platform pairing stores. A directory beginning with a dot and ending in .partial is a snapshot that was interrupted while being written.
  parser: null
- id: hermes.state_snapshot_transcripts
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/state-snapshots/*/state.db
  - $HERMES_HOME/profiles/<name>/state-snapshots/*/state.db
  - ~/.hermes/state-snapshots/*/state.db
  - ~/.hermes/profiles/<name>/state-snapshots/*/state.db
  - '%LOCALAPPDATA%\hermes\state-snapshots\*\state.db'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\state-snapshots\*\state.db'
  format: sqlite
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_cli/backup.py
  source_kind: source_code
  volatility: |-
    One copy per snapshot, up to twenty. Each is a copy of the transcript database as it stood before an update, so a session pruned or a profile deleted after that point is still whole here.
  notes: |-
    The same schema as the live transcript database and therefore read the same way, which is the entire point of giving it an entry of its own: collected under the snapshot entry alone it would have reached a case as a file nobody opened.

    This is where a conversation that was deleted is still to be found. Deletion in this product is real where it is explicit: prune_sessions removes rows and deleting a profile removes its home. Neither reaches a copy taken earlier and left in this directory.

    Compare the sessions in each copy against the live database. A session present here and absent there is a deletion, and the copy dates it to somewhere between two snapshots.

    Record structure: identical to the live store, so see the entry for it. The copy is made page by page rather than by renaming a file, and it carries no write-ahead log of its own.
  parser: hermes
- id: hermes.backups
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/backups/*.zip
  - $HERMES_HOME/profiles/<name>/backups/*.zip
  - ~/.hermes/backups/*.zip
  - ~/.hermes/profiles/<name>/backups/*.zip
  - '%LOCALAPPDATA%\hermes\backups\*.zip'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\backups\*.zip'
  format: binary
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_cli/backup.py
  source_kind: source_code
  volatility: |-
    Written before an update when the full mode is configured, and before a schema migration, each pruned to the five newest of its kind. A backup the user made by hand is not pruned at all.
  notes: |-
    A zip of the whole home, taken by the product before it changed itself. Where the snapshot beside it captures a list of critical files, this is everything: the transcripts, the memories, the skills, the scheduled jobs, the configuration and the credential files as they stood at that moment.

    Treat it as an evidence container rather than a file. It holds copies of artifacts this catalogue lists individually, so what an analyst is holding after expanding one is a second complete case from an earlier date, and the credential files inside it are live credentials the endpoint may no longer use.

    Record structure: backups/pre-update-<date>-<time>.zip before an update, backups/pre-migration-<date>-<time>.zip before a schema migration, and whatever name a user chose for one they made themselves. Earlier backups and the snapshot directory are not nested inside a new one.
  parser: null
- id: hermes.config
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/config.yaml
  - $HERMES_HOME/profiles/<name>/config.yaml
  - ~/.hermes/config.yaml
  - ~/.hermes/profiles/<name>/config.yaml
  - '%LOCALAPPDATA%\hermes\config.yaml'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\config.yaml'
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    The terminal backend setting (Docker, Singularity, host) tells you how much of the agent's command execution happened inside a container versus directly on the endpoint - which decides where else to look for side effects.

    Record structure: Model selection, terminal backend, compression settings, memory limits, context length, active MCP servers, and a skills.config namespace for skill-declared settings. Doubles as the MCP config.
  parser: yaml_generic
- id: hermes.cron
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/cron/
  - $HERMES_HOME/profiles/<name>/cron/
  - ~/.hermes/cron/
  - ~/.hermes/profiles/<name>/cron/
  - '%LOCALAPPDATA%\hermes\cron\'
  - '%LOCALAPPDATA%\hermes\profiles\<name>\cron\'
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/configuration.md
  source_kind: official
  volatility: Persistent until removed.
  notes: |-
    Critical for attribution: a scheduled job means agent activity that occurred with NO human at the keyboard. Any timeline that assumes interactive use will be wrong if this directory is populated.

    Record structure: Scheduled jobs and automation tasks. File format not documented - enumerate.
  parser: yaml_generic
- id: hermes.profiles
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/profiles/<name>/profile.yaml
  - ~/.hermes/profiles/<name>/profile.yaml
  - '%LOCALAPPDATA%\hermes\profiles\<name>\profile.yaml'
  format: yaml
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/NousResearch/hermes-agent/main/website/docs/user-guide/bot-mode.md
  source_kind: official
  volatility: Persistent for as long as the profile exists. Removed with the profile directory.
  notes: |-
    This file is how you enumerate the agents on the endpoint. A named profile is a second complete home under profiles/<name>/, with its own configuration, credentials, memories, skills, sessions, scheduled jobs, logs and transcript database, and the agent serves every live one of them at the same time. Every other entry in this file therefore carries a profiles/<name>/ spelling beside its default-home one, because an analyst who collects only the default home collects one agent out of however many ran.

    The vendor's own test for whether a directory under profiles/ is a profile rather than a leftover is the presence of one of six marker files: config.yaml, .env, SOUL.md, profile.yaml, auth.json or state.db. Read that the other way round for a collection: a directory under profiles/ that carries none of them is a shell the product itself will not list, and it is worth looking at for exactly that reason.

    Record structure: The chat-facing product calls a profile a bot, and profile.yaml is its marker file; the vendor's example is an empty block, so expect the file to carry little or nothing and treat its existence rather than its content as the evidence.
  parser: yaml_generic
- id: hermes.profile_tombstones
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - $HERMES_HOME/profiles/.deleted/
  - ~/.hermes/profiles/.deleted/
  - '%LOCALAPPDATA%\hermes\profiles\.deleted\'
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: |-
    https://github.com/NousResearch/hermes-agent/blob/639823919ced15640924e905bacab3858c5afd19/hermes_constants.py
  source_kind: source_code
  volatility: |-
    Outlives the profile it names. Deleting the profile removes its directory and writes this marker; only re-creating a profile of the same name removes the marker again.
  notes: |-
    The highest-value small file this agent has. Deleting a profile removes the whole profile directory, which takes its transcripts, its credentials, its memories and its scheduled jobs with it, and leaves behind one file here named after the profile. That file is the only remaining statement on the endpoint that the profile ever existed, and its own mtime dates the deletion.

    A tombstone is also written when a profile is renamed while a gateway is serving it, under the old name. So a name here means the profile was deleted or renamed, not deleted alone, and a name here that also exists as a live directory under profiles/ is a re-created profile rather than a contradiction.

    Collect this before anything else in the tree. It is a few bytes, it survives the removal of everything it refers to, and a collection that finds a name here and no matching directory has found evidence of destruction rather than an empty result.

    Record structure: One file per deleted profile, named after the profile and holding the single word deleted. The directory is created on the first deletion, so its absence means no profile was ever deleted under this home.
  parser: text_config
