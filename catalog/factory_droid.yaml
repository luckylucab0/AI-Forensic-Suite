# Factory Droid artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: factory_droid
title: Factory Droid
vendor: Factory
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/Factory-AI/
- https://raw.githubusercontent.com/Factory-AI/
- https://docs.factory.ai/
- https://factory.ai/
references:
- |-
  https://github.com/code-yeongyu/oh-my-openagent/blob/main/packages/shared-skills/skills/coding-agent-sessions/references/all-platforms.md
- |-
  https://github.com/nguyenphutrong/quotio/blob/main/Packages/QuotioCore/Sources/QuotioInfrastructure/Agents/AgentDetectionAdapter.swift
artifacts:
- id: factory_droid.output_styles
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.factory/output-styles/*.md
  - '%USERPROFILE%\.factory\output-styles\*.md'
  - <project>/.factory/output-styles/*.md
  format: markdown
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://docs.factory.ai/docs/droid-cli/output-styles
  source_kind: official
  volatility: Persistent until removed.
  notes: |-
    Text that changes how the agent answers, kept in its own directory at three scopes.

    An output style is a markdown file the product loads into the model's instructions, so it is instruction surface in the same sense a rules file is, and the same question applies to it: one that arrives with a repository was written by whoever wrote the repository.

    The third scope is the one to remember. Besides the user's directory and the repository root, the product reads the same directory from a folder inside the repository, so a style can sit next to the part of a tree it applies to and be missed by a collection that looked at the root alone.
  parser: instructions
- id: factory_droid.specs
  category: transcript
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.factory/specs/**
  - '%USERPROFILE%\.factory\specs\**'
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.factory.ai/cli/configuration/settings
  source_kind: official
  volatility: |-
    Written when a specification is saved and kept. The directory is a setting, so a host that changed it keeps these somewhere else entirely.
  notes: |-
    What the agent was asked to build, written down before it built it.

    A specification here is the plan for a piece of work, saved out of a session and outliving it. Where the conversation that produced it is gone, this is the surviving statement of intent, and comparing it against what is in the repository is how an analyst sees the difference between what was asked for and what was done.

    Read the setting that names this directory before concluding there are none: it accepts any path and expands a leading tilde.
  parser: prose_document
- id: factory_droid.worktrees
  category: file_snapshot
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.factory/worktrees/**
  - '%USERPROFILE%\.factory\worktrees\**'
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.factory.ai/docs/droid-cli/cli-reference
  source_kind: official
  volatility: |-
    Created when the agent works in a worktree and left behind afterwards unless somebody removes it. The directory is a setting, so a host that changed it keeps them elsewhere.
  notes: |-
    Working copies the agent made for itself, outside the repository they came from.

    When the product works in a git worktree it creates it under the user's home rather than beside the checkout. That puts a second copy of the repository's files in a place nobody looks, with the agent's own changes in it, and it survives the branch being deleted and the original checkout being cleaned.

    Two things follow. Source code left the project directory, which is a data-at-rest answer. And where the agent's work was discarded upstream, the worktree can still hold it.
  parser: null
- id: factory_droid.auth
  category: config
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.factory/
  format: json
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: recollection
  source_kind: recollection
  contains_credentials:
  - config.json BYOK keys
  - settings.json customModels keys
  volatility: Unknown.
  notes: |-
    recollection, needs verification - filename deliberately not asserted. Known related facts: BYOK keys go in ~/.factory/config.json and customModels keys in ~/.factory/settings.json, and both are documented as staying local, so credentials may simply live in those config files rather than a separate auth file.

    Filed as a container rather than as credential material: the file is evidence and is collected, and contains_credentials names what an exporter redacts. Withholding it to protect the credentials inside would throw away the conversations an investigation exists to read.

    Half of the question is now answered and the half that is answered is the surprising one. The vendor states that the OAuth tokens for the MCP servers this agent connects to are kept in the operating system's own keyring, globally rather than per project, with a fallback file it does not name. So for those credentials the endpoint's filesystem is the wrong place to look: the keychain or credential store is, and an absence in this directory says nothing.

    Record structure: the filename of the product's own sign-in token store is still not established from any source that could be fetched. Do NOT guess at auth.json or cli-config.json here. Enumerate ~/.factory/ on a live image and identify it empirically, and read the keyring for the server tokens.
  parser: json_generic
- id: factory_droid.config
  category: config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - '%USERPROFILE%\.factory\settings.json'
  - <project>/.factory/settings.json
  - <project>/.factory/settings.local.json
  - ~/.factory/config.json
  - ~/.factory/settings.json
  - ~/.factory/settings.local.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.factory.ai/cli/configuration/settings
  source_kind: official
  unsourced_paths:
  - ~/.factory/config.json
  volatility: Persistent until edited. settings.json is created with defaults on first run of droid.
  notes: |-
    The allow/deny lists in settings.json are the permission record for Droid - collect both the global and every project-level copy, and diff them, since a project-local settings.local.json can quietly widen what the agent may do. Note that customModels entries can contain plaintext API keys even though this is catalogued as config.

    Record structure: config.json holds model configuration and BYOK settings; settings.json is the personal CLI configuration including allow/deny lists; a settings.local.json may sit alongside settings.json in any .factory/ folder for local overrides. Custom API keys are added to settings.json via a customModels array with provider types such as anthropic or openai, and are documented as staying local. Path strings retrieved via GitHub code search content fragments.
  parser: json_generic
- id: factory_droid.skills_and_droids
  category: instructions
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.claude/agents/*.md
  - <project>/AGENTS.md
  - ~/.claude/agents/*.md
  - ~/.factory/commands/
  - ~/.factory/droids/
  - ~/.factory/skills/
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.factory.ai/cli/configuration/custom-droids
  source_kind: official
  unsourced_paths:
  - <project>/AGENTS.md
  - ~/.factory/commands/
  - ~/.factory/skills/
  volatility: Persistent until removed.
  notes: |-
    Partially unverified: skills/ is corroborated, droids/ and commands/ are recollection, needs verification. Custom droid definitions are user-authored agent personas with their own tool grants and are a common vector for privilege widening.

    Record structure: ~/.factory/skills was observed in a code-search content fragment. droids/ and commands/ come only from a WebSearch summary of the Factory docs, which I could not fetch (docs.factory.ai is blocked from this environment) - treat those two as unconfirmed. Custom droid definitions carry their own instructions and tool sets.
  parser: instructions
- id: factory_droid.logs
  category: log
  root: user_profile
  os:
  - macos
  - linux
  - windows
  paths:
  - ~/.factory/bug-reports/
  - ~/.factory/logs/
  format: text
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: recollection
  source_kind: community
  volatility: Unknown.
  notes: |-
    recollection, needs verification. bug-reports/ is worth chasing if it exists: user-generated support bundles typically snapshot configuration and recent session state at a moment in time, which makes them an independent point-in-time copy of evidence.

    Record structure: Both directories come only from a WebSearch summary of the Factory docs directory listing; docs.factory.ai was unreachable and I found no code-search corroboration. Enumerate ~/.factory/ directly rather than globbing these names.
  parser: text_log
- id: factory_droid.mcp_and_hooks
  category: mcp_config
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.factory/mcp.json
  - <project>/<folder>/.factory/mcp.json
  - ~/.factory/hooks.json
  - ~/.factory/mcp.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.factory.ai/cli/configuration/mcp
  source_kind: official
  unsourced_paths:
  - ~/.factory/hooks.json
  volatility: Persistent until edited.
  notes: |-
    hooks.json is the standout: hooks are shell commands the harness runs automatically around agent events, so this file can contain arbitrary code execution that is attributable to configuration rather than to any prompt in a transcript. Always review it, and compare its mtime against session times.

    Record structure: ~/.factory/mcp.json and ~/.factory/hooks.json path strings retrieved via GitHub code search content fragments. A project-level .factory/mcp.json was also observed.
  parser: json_generic
- id: factory_droid.sessions
  category: transcript
  root: project
  os:
  - macos
  - linux
  - windows
  paths:
  - <project>/.factory/sessions/
  - ~/.factory/sessions/**/settings.json
  - ~/.factory/sessions/*/*.jsonl
  - ~/.factory/sessions/<uuid>.json
  format: jsonl
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: |-
    https://github.com/code-yeongyu/oh-my-openagent/blob/main/packages/shared-skills/skills/coding-agent-sessions/references/all-platforms.md
  source_kind: community
  volatility: No documented expiry.
  notes: |-
    CORRECTION/addition to the starting brief, which lists only ~/.factory/: sessions became DIRECTORY-SCOPED at CLI 0.26.7, so project-specific sessions live in <project-root>/.factory/sessions/ and only cross-project sessions live under ~/.factory/sessions/. Collecting only the home directory will miss most work on a developer machine. The per-session settings snapshot is unusually valuable - it records the AUTONOMY LEVEL and enabled tools in force for that specific session, which most agents do not persist per-session.

    Record structure: Path pattern ~/.factory/sessions/*/*.jsonl observed in a community cross-agent reference; ~/.factory/sessions/**/settings.json observed in a separate project. Sessions are UUID-identified and come as a file pair: a .jsonl transcript plus a .settings.json (or <uuid>.json) carrying authoritative per-session metadata - configuration snapshot, model selection, autonomy level, enabled tools, creation time and token usage. Session metadata includes a transcript_path field pointing at the .jsonl. Path strings retrieved via GitHub code search content fragments, not a full page fetch; docs.factory.ai was unreachable from this environment.
  parser: jsonl_generic
