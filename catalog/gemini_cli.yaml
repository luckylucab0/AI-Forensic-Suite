# Google Gemini CLI artifact catalogue.
#
# Generated from vendor documentation and then maintained by hand. status: verified
# means somebody fetched that URL and the page states that path; anything else is
# unverified, is still collected by glob, and is reported as unverified so an empty
# result reads as inconclusive rather than as proof the agent was never used.
#
# sensitivity is operational: 'secret' means metadata and a hash only, no content,
# and is reserved for credential stores. collect_priority is collection order on a
# live endpoint. See catalog/schema/catalog.schema.json and docs/COLLECTION.md.

agent: gemini_cli
title: Gemini CLI
vendor: Google
# URL prefixes that count as first party for this agent. status: verified requires the
# source to start with one of them, because a third party who reverse-engineered a path
# writes it down just as confidently as the vendor does and an analyst cannot tell the
# two apart from the path alone. Third-party research stays in the catalogue as
# source_kind: community with status: unverified.
vendor_sources:
- https://github.com/google-gemini/
- https://raw.githubusercontent.com/google-gemini/
- https://github.com/google/
- https://raw.githubusercontent.com/google/
- https://github.com/googleapis/
- https://raw.githubusercontent.com/googleapis/
- https://cloud.google.com/
- https://developers.google.com/
description: |-
  Google's command line agent. The one agent in this catalogue that documents an automatic
  deletion policy for its own conversations, which changes what a collection means: the
  default is to delete chats older than thirty days, so an absent conversation is the
  expected state rather than a sign that anybody removed it.
references:
- https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
- https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/utils/paths.ts
env_overrides:
- name: GEMINI_CLI_HOME
  effect: |-
    Relocates the whole .gemini directory. homedir() in packages/core/src/utils/paths.ts returns this value when it is set and the user's home directory otherwise, so a collection keyed on ~/.gemini finds nothing on such a host and cannot tell that apart from Gemini CLI never having run.
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/utils/paths.ts
- name: GEMINI_CLI_SYSTEM_SETTINGS_PATH
  effect: |-
    Moves the machine-wide settings file, which is where an administrator would enforce policy. Reading only the documented location can therefore report no policy on a host that has one.
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
- name: GEMINI_CLI_SYSTEM_DEFAULTS_PATH
  effect: |-
    Moves the machine-wide defaults file, the lowest layer of the four-layer settings stack.
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
- name: GEMINI_CLI_TRUSTED_FOLDERS_PATH
  effect: |-
    Moves trustedFolders.json, the record of which directories the user allowed the agent to work in. That record is the answer to what the agent was permitted to touch.
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
- name: GEMINI_SYSTEM_MD
  effect: |-
    Replaces the built-in system prompt with a file of the operator's choosing, anywhere on disk. Prompt-injection surface that lives outside every directory this catalogue names: follow the value.
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
artifacts:
- id: gemini_cli.chats
  category: transcript
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\sessions\'
  - '%USERPROFILE%\.gemini\tmp\*\chats\'
  - ~/.cache/.gemini/tmp/*/chats/
  - ~/.gemini/sessions/
  - ~/.gemini/tmp/*/chats/
  format: json
  sensitivity: normal
  collect_priority: first
  status: verified
  source: |-
    https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  unsourced_paths:
  - '%USERPROFILE%\.gemini\sessions\'
  - ~/.gemini/sessions/
  volatility: |-
    Deleted on a timer by default, which is unusual and is the most important fact about this agent. general.sessionRetention has enabled default true, maxAge default "30d" described as "Automatically delete chats older than this time period", an optional maxCount as the "Maximum number of sessions to keep", and minRetention default "1d" as a "Minimum retention period (safety limit)".
  notes: |-
    The primary evidence, and the entry whose status matters most. Google documents the retention policy for chats precisely and does not say where the chats are written, so the path here is a plausible reading of the setting's name and nothing more. It is marked unverified for that reason and collected anyway.

    Path correction and promotion from the source verification pass, which was asked to find a source for this entry and found the constructing code instead. Saved chats go into a chats directory under the per-project temporary directory, which is the global runtime directory joined with tmp and then with a per-project identifier. This entry previously claimed a chats directory directly under the agent's home directory, where nothing is written. The vendor's command reference corroborates the parent, stating the per-project temporary directory for the chat save command in both spellings, without naming the chats directory inside it. The cache-rooted spelling is the same directory under the macOS Seatbelt sandbox, where the runtime directory diverts into ~/.cache. A sessions directory is named in no source the pass could find, so it stays marked unsourced.
  parser: gemini
- id: gemini_cli.home_tree
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\'
  - ~/.gemini/
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: |-
    https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: |-
    Mixed. Some of what is in here is deleted on a timer, see gemini_cli.chats, and the rest persists until edited.
  notes: |-
    GEMINI_DIR = '.gemini' in packages/core/src/utils/paths.ts. Claimed as a whole tree on purpose: the vendor documents the directory and several files in it, and not everything that lands here is documented anywhere. A glob over the tree means an undocumented file is still collected and still appears in the manifest, rather than being absent because nobody had written it down.

    Re-sourced by the verification pass: the file cited before declares the directory name as a constant and never joins it to a home directory. The storage module does. Forensically important and newly established by the pass: the runtime directory diverts to ~/.cache/.gemini when the sandbox variable is set to the macOS Seatbelt backend, so under that sandbox the account file, the trusted folder list, the temporary directory and the saved chats live there instead. The settings file and the cached credentials do not move.
  parser: null
- id: gemini_cli.shell_history
  category: shell_history
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\tmp\<project-hash>\shell_history'
  - ~/.gemini/tmp/<project-hash>/shell_history
  format: text
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
  source_kind: official
  volatility: |-
    Under tmp, so treat it as something the agent may clear at any time. No retention policy for it was found in the sources read.
  notes: |-
    Documented as ~/.gemini/tmp/<project_hash>/shell_history, where the hash derives from the project path. Every shell command the agent ran, per working copy.

    Two things this gives an analyst that a transcript does not. The set of hash directories enumerates the projects the agent was used in, even where the conversations have been deleted by the retention policy. And the commands themselves are what actually happened, as opposed to what the model said it would do.

    The hash is one-way, so the directory name identifies a project only by comparison: hash the candidate paths from the other agents' state and match.

    Record structure, read out of the product's own reader and writer (packages/cli/src/ui/hooks/useShellHistory.ts): plain text, one command per line, OLDEST FIRST on disk while the interface shows it newest first, and no timestamp anywhere. A command continued over several lines ends in an odd number of backslashes and the product rejoins the parts with a SPACE, not a line break. Two properties matter more than the format. The file is a ring of a hundred entries, and a command that is run again is REMOVED from its old position before being added at the end, so the file holds one line per distinct command: the number of times something ran cannot be read from it, and an older command's absence is the ring or the deduplication rather than evidence that it never ran. The whole file is rewritten on every command, so its mtime dates the last command and nothing else in it can be dated at all.
  parser: shell_history
- id: gemini_cli.user_settings
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\settings.json'
  - ~/.gemini/settings.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
  source_kind: official
  volatility: Persistent until edited.
  notes: |-
    The user layer of a four-layer settings stack: system defaults, then user, then project, then system settings, with the project layer overriding the user one. Read all four or report a configuration that was not the effective one.

    Read it first in any case involving a missing conversation. general.sessionRetention here decides whether chats are being deleted on a timer, and general.checkpointing.enabled, off by default, decides whether recoverable session checkpoints exist at all. The telemetry section can point at a local outfile, which is another on-disk record of the same activity.

    Also here: the MCP server definitions and context.fileName, which renames the instruction file the agent reads from GEMINI.md to something else.
  parser: json_generic
- id: gemini_cli.system_settings
  category: permissions
  root: system
  os:
  - macos
  - windows
  - linux
  paths:
  - '%PROGRAMDATA%\gemini-cli\settings.json'
  - '%PROGRAMDATA%\gemini-cli\system-defaults.json'
  - /Library/Application Support/GeminiCli/settings.json
  - /Library/Application Support/GeminiCli/system-defaults.json
  - /etc/gemini-cli/settings.json
  - /etc/gemini-cli/system-defaults.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
  source_kind: official
  volatility: Persistent until an administrator edits it.
  notes: |-
    Machine-wide policy, in two layers with the user's settings between them: system-defaults.json is the floor that user and project settings override, and settings.json is the ceiling that overrides them. Which file a restriction is written in therefore decides whether it was in force, and reporting a control from the wrong layer describes a machine that does not exist.

    Both are relocatable, by GEMINI_CLI_SYSTEM_SETTINGS_PATH and GEMINI_CLI_SYSTEM_DEFAULTS_PATH, so an absent file is not evidence that no policy was applied.
  parser: json_generic
- id: gemini_cli.google_accounts
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\google_accounts.json'
  - ~/.gemini/google_accounts.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: Rewritten on sign-in.
  notes: |-
    GOOGLE_ACCOUNTS_FILENAME = 'google_accounts.json'. Which account the agent ran as, which is the attribution question: a transcript says what was asked, this says whose credentials answered it, and on a shared or handed-over machine those are different people.

    Re-sourced by the verification pass, same cause as the home tree entry. This file is under the runtime directory, so it is one of the files that moves to ~/.cache/.gemini under the macOS Seatbelt sandbox.
  parser: json_generic
- id: gemini_cli.trusted_folders
  category: permissions
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\trustedFolders.json'
  - ~/.gemini/trustedFolders.json
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: Appended to as the user trusts directories; nothing observed that expires an entry.
  notes: |-
    TRUSTED_FOLDERS_FILENAME = 'trustedFolders.json'. The directories the user allowed the agent to operate in, which is both the permission record and a list of working copies to collect project-anchored artifacts from.

    Re-sourced by the verification pass, same cause as the home tree entry. Also under the runtime directory, so it moves under the macOS Seatbelt sandbox.
  parser: json_generic
- id: gemini_cli.commands
  category: instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\commands\**\*.toml'
  - <project>/.gemini/commands/**/*.toml
  - ~/.gemini/commands/**/*.toml
  format: toml
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  record_types:
  - 'one TOML document per command, with the prompt the command expands to'
  volatility: |-
    User-authored and not swept. A project one is normally under version control, so a superseded version is recoverable from git; a user one is not.
  notes: |-
    A custom slash command is a stored prompt with a name. Typing the name runs the prompt, so this is an instruction the user wrote, kept outside every transcript, and it is where a command that looks innocuous from its name can say something else entirely.

    Record structure: storage.ts puts the user's at getGlobalGeminiDir()/commands and the project's at <project>/.gemini/commands, and the loader globs '**/*.toml' under each, so subdirectories count and a command can be nested. The loader also reads a commands directory inside every active extension, which this entry does not reach: an extension's own directory is wherever it was installed.

    Both directories are inside a tree this catalogue already collects whole, which is exactly why this entry exists: swept up as part of a home directory they arrive filed as configuration, and what they are is the instruction surface.
  parser: instructions
- id: gemini_cli.agent_definitions
  category: instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.agents\skills\**'
  - '%USERPROFILE%\.gemini\agents\**'
  - '%USERPROFILE%\.gemini\skills\**'
  - <project>/.agents/skills/**
  - <project>/.gemini/skills/**
  - ~/.agents/skills/**
  - ~/.gemini/agents/**
  - ~/.gemini/skills/**
  format: markdown
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: |-
    User-authored and not swept.
  notes: |-
    The definitions of the subagents this product can run and the skills it can load, which are instructions in the strongest sense: a subagent definition is a standing prompt plus the tools that prompt may use.

    Record structure: storage.ts gives four directories, getUserAgentsDir() = ~/.gemini/agents, getUserSkillsDir() = ~/.gemini/skills, getUserAgentSkillsDir() = ~/.agents/skills and the project equivalents under <project>/.gemini and <project>/.agents. The last pair is the cross-product convention other agents in this catalogue also read, so a skills directory found there is not necessarily this product's.

    There is an acknowledgments file beside them, ~/.gemini/acknowledgments/agents.json, which records that somebody was shown what an agent may do and accepted it. It is collected by the entry for the whole home tree; it is named here because it dates the acceptance rather than the definition.
  parser: instructions
- id: gemini_cli.policies
  category: permissions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - '%PROGRAMDATA%\gemini-cli\policies\**'
  - '%USERPROFILE%\.gemini\policies\**'
  - /Library/Application Support/GeminiCli/policies/**
  - /etc/gemini-cli/policies/**
  - <project>/.gemini/policies/**
  - ~/.gemini/policies/**
  format: toml
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  record_types:
  - 'one TOML document per policy set, including the one the product saves by itself'
  volatility: |-
    The administrator-scope directories change when somebody with rights over the machine changes them, which makes a recent write there an administrative action worth dating. The user-scope one is rewritten by the product itself whenever a decision is saved.
  notes: |-
    What this agent was allowed to do, and by whom. storage.ts has three scopes: getSystemPoliciesDir() under the platform's system configuration directory, getUserPoliciesDir() = ~/.gemini/policies, and getWorkspacePoliciesDir() = <project>/.gemini/policies. The system one is the administrator's and sits outside the user profile, so no home-directory collection reaches it, which is why it is named here.

    AUTO_SAVED_POLICY_FILENAME = 'auto-saved.toml' is the file the product writes itself when a decision is remembered, in the user scope and in the workspace scope. That file is the record of a permission the user granted in passing, which is a different kind of evidence from a policy somebody sat down and wrote.

    Note also ~/.gemini/policy_integrity.json, which the code keeps beside the runtime directory and which exists to notice a policy file having been changed behind the product's back. It is collected with the home tree; a mismatch between it and the policies here is worth a look.
  parser: toml_generic
- id: gemini_cli.mcp_oauth_tokens
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\a2a-oauth-tokens.json'
  - '%USERPROFILE%\.gemini\mcp-oauth-tokens.json'
  - ~/.gemini/a2a-oauth-tokens.json
  - ~/.gemini/mcp-oauth-tokens.json
  format: json
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: |-
    Rewritten whenever a token is refreshed, so the file dates the last authentication rather than the first.
  notes: |-
    Bearer tokens for the MCP servers and agent-to-agent endpoints this product talks to. storage.ts builds both paths from the runtime directory: getMcpOAuthTokensPath() and getA2aOAuthTokensPath().

    This entry exists because of what happens without it. Both files sit inside the home tree this catalogue already collects whole, and that entry is ordinary configuration, so a collection carried live tokens into a bundle as configuration rather than withholding them. A path claimed by a secret entry is withheld whatever else claims it, which is the rule that makes this the correct fix rather than a second copy of the same file.

    What is still worth recording is that they were there and when they were last written: an MCP server this product held a token for is a destination data could have left by, whether or not the token is in the bundle.
  parser: null
- id: gemini_cli.credentials
  category: credentials
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.gemini\oauth_creds.json'
  - ~/.gemini/oauth_creds.json
  format: json
  sensitivity: secret
  collect_priority: normal
  status: verified
  source: |-
    https://raw.githubusercontent.com/google-gemini/gemini-cli/main/packages/core/src/config/storage.ts
  source_kind: source_code
  volatility: Rewritten on sign-in and on token refresh.
  notes: |-
    Metadata and a hash only. The configuration reference describes OAuth as an authentication method and the paths module names the directory, but no page read here names the credential file itself, so the filename is unverified.

    Promoted by the source verification pass, which was asked to find a source for this path: the storage module declares the filename and joins it onto the global agent directory. No prose documentation states it. This file uses the agent directory directly rather than the runtime directory, so unlike the account file and the saved chats it does not move under the macOS Seatbelt sandbox.
  parser: null
- id: gemini_cli.project_config
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.gemini/
  - <project>/.gemini/.env
  - <project>/.gemini/sandbox.Dockerfile
  - <project>/.gemini/settings.json
  - <project>/GEMINI.md
  format: json
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://raw.githubusercontent.com/google-gemini/gemini-cli/main/docs/reference/configuration.md
  source_kind: official
  volatility: Lives and dies with the working copy, and is usually under version control.
  notes: |-
    The project layer, which overrides the user's own settings, and the instruction file the agent reads before every turn.

    This is the prompt-injection surface, and it travels with a checkout: cloning a repository can change the agent's configuration, add MCP servers, point it at a different model endpoint and give it standing instructions, all without the user seeing a prompt. GEMINI.md is the default name and context.fileName renames it, so read the settings before concluding a repository carried no instructions.

    sandbox.Dockerfile defines the container the agent's commands run in, so it decides what the sandbox could reach.
  parser: instructions
