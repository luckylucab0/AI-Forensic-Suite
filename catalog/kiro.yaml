    Only exists while the environment variable is set. Path and lifetime are entirely operator-chosen.
  notes: |-
    The vendor documents KIRO_ACP_RECORD_PATH as the path to a JSONL file for recording TUI ACP wire traffic. There is no default location, so it is invisible to any path-based collection: it has to be discovered from the live environment, from shell profiles, from wrapper scripts or from shell history. When present it is a complete protocol-level transcript of a session, including tool calls, which is frequently richer than the saved session store. Worth an explicit check in every Kiro engagement precisely because nobody expects it.
