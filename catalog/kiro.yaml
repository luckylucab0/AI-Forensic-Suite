- id: kiro.kiroignore
  title: Kiroignore files
  category: project_instructions
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/**/.kiroignore
  - <project>/.kiroignore
  format: text
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://kiro.dev/docs/kiroignore.md
  source_kind: official
  record_types:
  - gitignore-syntax patterns
  volatility: |-
    Writes to .kiroignore are vendor-stated always-ask and the file is also a vendor-stated protected path in the IDE, so any modification implies an explicit approval.
  notes: |-
    Gitignore-syntax patterns that stop Kiro reading matching files, placeable in the project root or any subdirectory with subdirectory patterns taking precedence. Two forensic uses. It tells you what the agent could not see, which bounds what it could have exfiltrated. And it is an anti-forensic and evasion indicator: patterns added shortly before or during an engagement, or patterns covering exactly the material under investigation, are worth flagging. Note the coverage is uneven by surface, which the vendor states plainly: the IDE enforces it across supported agent tools, CLI V3 enforces it only when filtering content-search and filename-search results, and Web does not enforce it at all. So a .kiroignore is not proof a file was unreadable, and in Web it is no protection whatsoever. The IDE also reads the ignore filename list from the kiroAgent.agentIgnoreFiles setting, so other ignore file names may be in force.
  parser: instructions
- id: kiro.cli_log
  title: Kiro CLI chat log
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - $KIRO_CHAT_LOG_FILE
  - $TMPDIR/kiro-log/kiro-chat.log
  - $XDG_RUNTIME_DIR/kiro-log/kiro-chat.log
  - '%TEMP%\kiro-log\logs\kiro-chat.log'
  - /tmp/kiro-log/*.log
  format: text
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://kiro.dev/docs/cli/setup.md
  source_kind: official
  volatility: |-
    Lives in the platform temp or runtime directory. On Linux $XDG_RUNTIME_DIR is normally a tmpfs under /run/user/<uid> destroyed at logout; on macOS $TMPDIR is a per-user /var/folders path subject to periodic cleanup; on Windows %TEMP% is cleaned by disk maintenance. Default verbosity is error, so the file is usually near-empty unless KIRO_LOG_LEVEL was raised.
  notes: |-
    Must be collected live: on a dead disk the resolved directory may not exist and on Linux a tmpfs leaves nothing at all. The vendor explicitly warns the log 'may contain sensitive information including file paths, code snippets, and command outputs', which is why it is marked secret and why it is worth having despite the default error level. Note the three per-platform spellings differ in shape, not just in prefix: the Windows path has an extra logs segment (%TEMP%\kiro-log\logs\kiro-chat.log). Always resolve $KIRO_CHAT_LOG_FILE from the live environment first; if it is set, the documented paths are empty and mean nothing.
  parser: null
