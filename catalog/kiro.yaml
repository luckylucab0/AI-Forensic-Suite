    Skills are reusable instruction packages loaded as SKILL.md; powers are packaged MCP servers plus documentation that activate on demand and are global-scope only (no project powers). Both are merged across scopes. Because powers are installed from a marketplace or straight from a GitHub repository, they are a third-party code and instruction supply chain: enumerate what is installed and where it came from. A skill or power directory can also carry executable payloads beyond the SKILL.md, so collect the whole subtree, not just the markdown.
