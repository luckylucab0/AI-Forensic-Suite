- id: kiro.legacy_amazonq_config
  title: Amazon Q Developer configuration still read by Kiro
  category: config
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.amazonq/**
  - ~/.aws/amazonq/**
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://kiro.dev/docs/upgrade-guides/migrating-from-q.md
  source_kind: official
  contains_credentials:
  - mcp.json env
  - mcp.json headers
  volatility: |-
    The vendor states Kiro CLI will NOT modify existing .amazonq folders, so this tree is unusually stable and can preserve configuration that predates Kiro by months.
  notes: |-
    Collect this even in a Kiro-only engagement. The vendor states that Kiro CLI continues to read the project .amazonq folder so existing rules, agents and MCP settings keep working, and that the default agent is named kiro_default and 'includes paths for both Amazon Q and Kiro'. So an MCP server or a rules file that only exists under .amazonq was still live under Kiro. Two traps follow. First, if a project has both .kiro and .amazonq, configuration loads from .kiro, so the presence of a .amazonq file does not prove it was in effect at project scope. Second, the one-time install migration copied prompts and agents from ~/.aws/amazonq into ~/.kiro, mcp.json into ~/.kiro/settings/mcp.json and the rules folder into ~/.kiro/steering, skipping conflicting MCP servers: duplicate content across the two trees is a migration artifact, and an MCP server present only in the old tree is one the migration deliberately skipped. See the amazon_q agent entries for the full layout of these paths.
  parser: null
- id: kiro.cli_install
  title: Kiro CLI install evidence
  category: install_evidence
  root: user_profile
  os:
  - linux
  - macos
  paths:
  - ~/.local/bin/kiro-cli
  - ~/.local/bin/kirocli
  - ~/.local/bin/q
  format: binary
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://kiro.dev/docs/getting-started/installation.md
  source_kind: official
  volatility: |-
    Replaced in place by kiro-cli update, which the vendor documents with a staged-rollout option. The mtime therefore reflects the last update, not the install.
  notes: |-
    The vendor states only 'Files install to ~/.local/bin by default' for the Linux zip install, without naming the binaries, which is why the individual file paths are flagged unsourced: collect the directory listing rather than testing for a name. Install is a one-line curl to https://cli.kiro.dev/install (bash) or https://cli.kiro.dev/install.ps1 (PowerShell), and release artifacts come from a desktop-release host under amazonaws.com, so shell history and package-manager or download logs are often better install evidence than the filesystem. Do not read version information by executing the binary; on a target that would be an evidence-modifying act and is forbidden. macOS and Windows install locations are not documented.
  parser: null
