- id: amazonq.legacy_profiles_and_context
  title: Amazon Q Developer CLI legacy profiles and global context
  category: config
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.aws\amazonq\global_context.json'
  - '%USERPROFILE%\.aws\amazonq\profiles\**'
  - ~/.aws/amazonq/global_context.json
  - ~/.aws/amazonq/profiles/**
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/aws/amazon-q-developer-cli/blob/main/docs/legacy-profile-to-agent-migration.md
  source_kind: official
  volatility: |-
    Left in place, not deleted, when superseded. The vendor states global profiles support automatic migration into ~/.aws/amazonq/cli-agents on initial startup, and that global context under ~/.aws/amazonq/global_context.json 'is no longer supported'.
  notes: |-
    Dead-but-present configuration, which is often the most informative kind. Because the migration copies rather than removes, these files can preserve the user's context and profile configuration from before the agents model, giving an analyst a view of an earlier period that the current configuration has erased. global_context.json specifically held the user's global context file list. The source declares both paths as constants PROFILES_DIR = ".aws/amazonq/profiles" and GLOBAL_CONTEXT = ".aws/amazonq/global_context.json" and joins them to the home directory in GlobalPaths::profiles_dir() and GlobalPaths::global_context(). Do not read the presence of global_context.json as evidence it was in effect at the time of the incident.
  parser: json_generic
- id: amazonq.ide_chat_export
  title: Amazon Q Developer IDE exported conversations
  category: transcript
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/q-dev-chat-*.html
  - <project>/q-dev-chat-*.md
  format: markdown
  sensitivity: normal
  collect_priority: normal
  status: verified
  source: https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/ide-chat-conversation.html
  source_kind: official
  volatility: |-
    Static once written. A user-initiated export, so it survives deletion of the conversation from the history database and is a common way a transcript escapes to a shared drive, a ticket or a chat message.
  notes: |-
    The vendor states that on export 'By default, Amazon Q names the file q-dev-chat-{{yyyy}}-{{mm}}-{{dd}}.{{md|html}} and saves it in the root of your project.' Two reasons to look for these. They are frequently the only surviving copy of a conversation the user later deleted from the IDE history. And because the default location is the project root, they get committed to repositories by accident, so the same file may also exist in git history and on any remote. The date in the file name is the export date, not the conversation date, so do not use it as a conversation timestamp. The user can choose another location, so also search outside the project.
  parser: prose_document
- id: amazonq.ide_extension_install
  title: Amazon Q Developer IDE extension install evidence
  category: install_evidence
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.vscode\extensions\amazonwebservices.amazon-q-vscode-*\**'
  - ~/.vscode/extensions/amazonwebservices.amazon-q-vscode-*/**
  - ~/.vscode/extensions/amazonwebservices.aws-toolkit-vscode-*/**
  - ~/.vscode/extensions/extensions.json
  format: directory
  sensitivity: normal
  collect_priority: normal
  status: unverified
  source: https://github.com/aws/aws-toolkit-vscode/blob/master/packages/core/src/shared/extensionIds.ts
  source_kind: source_code
  volatility: |-
    Replaced on extension update; the previous version directory is normally removed, so only the current version is present.
  notes: |-
    What is actually verified here is the extension identifiers, declared in the vendor's source as awstoolkit: 'amazonwebservices.aws-toolkit-vscode' and amazonq: 'amazonwebservices.amazon-q-vscode'. The extension directory layout (~/.vscode/extensions/<publisher>.<name>-<version>/ and the extensions.json index) is standard VS Code behaviour that the vendor does not state, which is why every path is flagged unsourced and the entry is unverified. Match on the identifier prefix, not on a full path, and expect variants for VS Code Insiders, Cursor, code-server and other VS Code derivatives, each with its own extensions root. The JetBrains plugin is a separate install whose location is not covered here, but note from the shared history schema that it writes conversations into the same ~/.aws/amazonq/history store with clientType IDE_JetBrains, so IDE chat history can exist with no VS Code extension installed at all.
  parser: null
