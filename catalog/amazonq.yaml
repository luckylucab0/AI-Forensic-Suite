    User-edited. Content was copied (not moved) into ~/.kiro/steering by the Kiro CLI install migration, so both copies commonly exist.
  notes: |-
    The user-scope equivalent of project rules, which the product's own documentation barely mentions. Sourced from the vendor's Kiro migration page, whose configuration table maps 'Rules / Steering, User' to ~/.aws/amazonq/rules on the Q Developer CLI side and ~/.kiro/steering on the Kiro side, and whose migration steps state 'Files from rules folder in ~/.aws/amazonq folder are copied to ~/.kiro/steering folder with the same names'. These are per-user standing instructions that apply across every project, which makes them a higher-impact injection target than any single project's rules and an easy thing to miss because the main Amazon Q user guide documents only the project-level .amazonq/rules folder.
  parser: instructions
