    Updated in place as tasks complete, so intermediate states are lost. Persist in the project directory and can be resumed across sessions.
  notes: |-
    The vendor documentation states these are stored in .amazonq/cli-todo-lists/ in the current working directory, one JSON file per list, and explicitly lists 'Modified file paths' among the recorded fields. That makes them a compact, independent record of which files an agent task touched, tied to a timestamp-based id, which is valuable when the conversation for that directory has since been overwritten in the database. Also confirmed by the built-in tools reference.
  parser: instructions
- id: amazonq.cli_subagent_executions
  title: Amazon Q Developer CLI sub-agent execution records
  category: log
  root: project
  os:
  - macos
  - windows
  - linux
  paths:
  - <project>/.amazonq/.subagents/**
  format: directory
  sensitivity: normal
  collect_priority: first
  status: verified
  source: https://github.com/aws/amazon-q-developer-cli/blob/main/docs/experiments.md
  source_kind: official
  volatility: |-
    The vendor states plainly: 'Files persist until the same agent runs a new task.' So each run of a given sub-agent destroys the previous run's record. This is the shortest-lived durable artifact in the product and the first thing to collect.
  notes: |-
    Task execution details for delegated sub-agent work, stored in .amazonq/.subagents/ in the current working directory, and constructed in the source as current_dir()?.join(SUBAGENTS_DIR) with SUBAGENTS_DIR = ".amazonq/.subagents". Forensically important out of proportion to its size: work a sub-agent did may not appear in the parent conversation at all, so without this directory an analyst can under-report what the agent executed. Because it is overwritten on the next run of the same sub-agent, treat it as collect-first even though it lives on disk. Note it is a hidden directory inside a hidden directory, so hidden-file globbing is required.
  parser: null
- id: amazonq.knowledge_bases
  title: Amazon Q Developer CLI knowledge bases
  category: cache
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - '%USERPROFILE%\.aws\amazonq\knowledge_bases\**'
  - ~/.aws/amazonq/knowledge_bases/*/*/bm25_data.json
  - ~/.aws/amazonq/knowledge_bases/*/*/data.json
  - ~/.aws/amazonq/knowledge_bases/*/contexts.json
  format: json
  sensitivity: normal
  collect_priority: durable
  status: verified
  source: https://github.com/aws/amazon-q-developer-cli/blob/main/docs/knowledge-management.md
  source_kind: official
  record_types:
  - bm25_data.json BM25 index
  - contexts.json context metadata
  - data.json semantic search data
  volatility: |-
    Persist until the user removes a context. Indexed content is a snapshot of the source material at index time and does not follow later changes to the source.
  notes: |-
    The vendor documents the layout verbatim as ~/.aws/amazonq/knowledge_bases/<agent-name>[_<alphanumeric-code>]/ containing contexts.json plus one directory per context holding data.json and, for the fast index, bm25_data.json; the source builds it as knowledge_bases_dir()?.join(unique_id). This is a durable copy of indexed content outside its original location, so it can preserve text from files or directories that have since been deleted, and contexts.json records what was indexed and when. Per-agent isolation means the directory name tells you which agent had access to which corpus. Experimental feature, so it is absent on most endpoints; when present it is high value for a data-movement question.
  parser: json_generic
- id: amazonq.cli_logs
  title: Amazon Q Developer CLI logs
  category: log
  root: user_profile
  os:
  - macos
  - windows
  - linux
  paths:
  - $TMPDIR/qlog/chat.log
  - $TMPDIR/qlog/mcp.log
  - $TMPDIR/qlog/qchat.log
  - $TMPDIR/qlog/translate.log
  - $XDG_RUNTIME_DIR/qlog/*.log
  - '%TEMP%\amazon-q\logs\*.log'
  - '%TEMP%\qlog\*.log'
  - /tmp/qlog/*.log
  format: text
  sensitivity: normal
  collect_priority: live_only
  status: verified
  source: https://docs.aws.amazon.com/amazonq/latest/qdeveloper-ug/troubleshooting-q-logs.html
  source_kind: official
  volatility: |-
    Two independent destructive behaviours. The code deletes the log file outright when it exceeds MAX_FILE_SIZE = 10 MiB (std::fs::remove_file, not a rename or a rotation, so there is no .1 predecessor), and the same applies to mcp.log. And the containing directory is the platform temp or XDG runtime directory, which is cleaned at logout or reboot. Assume the log covers only recent activity and that a long engagement has already lost its early part.
  notes: |-
    The vendor documentation gives the locations as $TMPDIR/qlog/ on macOS (typically a /var/folders/.../qlog path), $XDG_RUNTIME_DIR/qlog/ or $TMPDIR/qlog/ or /tmp/qlog/ on Linux and WSL, and %TEMP%\qlog\ on Windows, with four files: chat.log (CLI wrapper, AWS SDK calls, authentication flows, HTTP and TLS connections, endpoint resolution, telemetry and socket operations), qchat.log (chat application, MCP server lifecycle and connection errors, state processing, user interruptions), mcp.log (MCP server logs) and translate.log (natural-language-to-shell translation). It also states logs are always written regardless of verbosity flags. DISCREPANCY worth carrying: the source's logs_dir() returns runtime_dir()?.join("qlog") on Unix but std::env::temp_dir().join("amazon-q").join("logs") on Windows, which does not match the documented %TEMP%\qlog\; both Windows paths are therefore listed. chat.log is the closest thing to a network-destination record in this product, since it logs endpoint resolution and connections, and mcp.log is the record of MCP server process lifecycle. The vendor warns logs may contain conversation content, file paths, code snippets, command outputs, account ids and resource names, hence the secret marking.
  parser: text_log
