# Hooks that run before a commit can exist. Install both hook types, not just the default:
#
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# The commit-msg hook matters as much as the pre-commit one here, because a commit message
# enters history just as permanently as a file does, and it is the easier place to leak an
# internal name by accident.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # Evidence does not belong in the repository. This is a backstop for the .gitignore
        # rules, not a substitute for them.
        args: ["--maxkb=512"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
        # The catalogue and the rule files are plain YAML; nothing here uses multi-document
        # streams or custom tags.
        args: ["--allow-multiple-documents"]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: detect-private-key
        # The secrets rule pack is about private keys, so its rule files legitimately
        # carry the PEM header this hook matches on, as the sample its regex is tested
        # against. The hook matches the header alone, which is the right heuristic
        # everywhere else and a guaranteed false positive here.
        #
        # The exclusion is narrow and it is not a hole: what would actually matter in a
        # rule file is key material, and a test in tests/unit/test_rules.py refuses a rule
        # whose sample carries a PEM body rather than just the header. A header with
        # nothing after it is not a key.
        exclude: '^rules/secrets/.*\.yaml$'

  # Pinned to the ruff version in uv.lock, which is what CI runs. The two formatters
  # disagreeing is not a cosmetic problem: the hook rewrites a file, CI rejects what the
  # hook wrote, and whichever ran last decides what is committed.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # ruff-check, not the ruff alias: the alias still works but is deprecated, and a
      # hook that warns today is a hook that fails on a later bump.
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # The OpSec guard runs twice, over different things: the staged content, and the
      # commit message. See docs/adr/0008-opsec-guard-and-fresh-history.md.
      - id: opsec-check-staged
        name: opsec check (staged content)
        entry: python3 scripts/opsec_check.py --mode both
        language: system
        pass_filenames: false
        always_run: true

      - id: opsec-check-commit-msg
        name: opsec check (commit message)
        entry: python3 scripts/opsec_check.py --mode tracked --commit-msg
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true

      - id: check-translations
        name: German docs current with their English source
        entry: python3 scripts/check_translations.py --check
        language: system
        pass_filenames: false
        files: '\.md$'

      - id: generated-artifact-docs
        name: docs/ARTIFACTS.md current with the catalogue
        entry: uv run python scripts/gen_artifact_docs.py --check
        language: system
        pass_filenames: false
        files: '^(catalog/|docs/locales/|scripts/gen_artifact_docs\.py)'

      - id: generated-support-docs
        name: docs/SUPPORT.md current with the catalogue and the readers
        entry: uv run python scripts/gen_support_docs.py --check
        language: system
        pass_filenames: false
        files: '^(catalog/|src/agentforensics/parsers/|scripts/gen_support_docs\.py|docs/SUPPORT)'

      - id: embedded-catalogue
        name: embedded catalogue current in both collectors
        entry: uv run python scripts/build_collectors.py --check
        language: system
        pass_filenames: false
        files: '^(catalog/|collector/|scripts/build_collectors\.py)'

      - id: collection-rules
        name: generated collection rules current with the catalogue
        entry: uv run python scripts/gen_collection_rules.py --check
        language: system
        pass_filenames: false
        files: '^(catalog/|exporters/|src/agentforensics/exporters/|scripts/gen_collection_rules\.py)'

      - id: relocation-rule
        name: the relocation rule current with the catalogue
        entry: uv run python scripts/gen_relocation_rule.py --check
        language: system
        pass_filenames: false
        files: '^(catalog/|rules/collection_integrity/|scripts/gen_relocation_rule\.py)'

      - id: rule-self-test
        name: every rule agrees with its own samples
        entry: uv run agentforensics scan --self-test
        language: system
        pass_filenames: false
        files: '^(rules/|src/agentforensics/rules/)'

      - id: rule-docs
        name: docs/RULES.md current with the rule files
        entry: uv run python scripts/gen_rule_docs.py --check
        language: system
        pass_filenames: false
        files: '^(rules/|src/agentforensics/rules/|docs/locales/|scripts/gen_rule_docs\.py|docs/RULES)'

      - id: catalogue-schema
        name: catalogue validates against its schema
        entry: uv run python -c "from pathlib import Path; from agentforensics.catalog import load_catalogue; print(len(load_catalogue(Path('catalog')).artifacts), 'artifacts validated')"
        language: system
        pass_filenames: false
        files: '^catalog/'

      - id: viewer-syntax
        name: viewer JavaScript parses
        entry: python3 scripts/check_viewer.py
        language: system
        pass_filenames: false
        files: '^viewer/'
