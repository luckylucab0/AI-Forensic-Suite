[project]
name = "agentforensics"
version = "0.1.0"
description = "Offline forensic suite for the on-disk history of AI coding agents on endpoints"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# No author names on purpose. See docs/adr/0008-opsec-guard-and-fresh-history.md: package
# metadata is published to an index and is one of the places an identity leaks without
# anyone noticing.
maintainers = [{ name = "The AI Agent Forensic Suite contributors" }]
keywords = ["dfir", "forensics", "incident-response", "ai-agents", "timeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]

# Two runtime dependencies, both pure Python with no transitive dependencies of their own,
# because an analyst workstation may be air-gapped and every wheel has to be vendored.
# See docs/adr/0012-runtime-dependencies.md for why not jsonschema or pydantic.
dependencies = [
  "PyYAML>=6.0",
  "fastjsonschema>=2.19",
]

[project.urls]
Repository = "https://github.com/luckylucab0/AI-Forensic-Suite"
Issues = "https://github.com/luckylucab0/AI-Forensic-Suite/issues"

[project.scripts]
agentforensics = "agentforensics.cli:main"
# Short alias, because the full name is a lot to type during an investigation.
afx = "agentforensics.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  # CONTRIBUTING tells a contributor to run "uv run pre-commit install", and the OpSec
  # guard that keeps operator-identifying strings out of a public repository is wired as
  # a hook. Without this entry that command fails and the guard is never installed.
  "pre-commit>=3.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforensics"]

# The viewer is one standalone HTML file an analyst can also open on its own (ADR 0001), so
# it lives at viewer/index.html in the repository rather than inside the package. `afx
# serve` needs it at runtime, and a wheel install has no repository, so a copy travels
# inside the package. The server looks in both places, the package copy first.
[tool.hatch.build.targets.wheel.force-include]
"viewer/index.html" = "agentforensics/webui/viewer/index.html"

[tool.hatch.build.targets.sdist]
# The catalogue and the collectors are the product, not build inputs, so they ship.
include = [
  "src/",
  "catalog/",
  "collector/",
  "viewer/",
  "rules/",
  "docs/",
  "tests/",
  "README.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The collectors have their own ruff config pinning Python 3.8, because they must run on
# whatever interpreter a corporate endpoint happens to have. See collector/.ruff.toml.
extend-exclude = [".venv", "viewer"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import sorting
  "UP",          # pyupgrade
  "B",           # bugbear
  "C4",          # comprehensions
  "SIM",         # simplify
  "PTH",         # prefer pathlib over os.path
  "RUF",
  "S",           # bandit: this is security tooling, so its own code is held to it
  "T20",         # no stray print(); the CLI writes through an explicit output helper
]
ignore = [
  # Long lines inside a regex or a documented path are clearer unbroken. Formatter handles
  # the rest.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixtures, and deliberately construct hostile input.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "T20", "PTH"]
# Development scripts are command line tools: printing is their interface, and they shell
# out to git on purpose.
"scripts/**" = ["T20", "S603", "S607"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_unreachable = true
# A missing stub for an optional dependency should not block a type check of our own code.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["fastjsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: takes more than a second, excluded by 'pytest -m \"not slow\"'",
  "collector: runs one of the single-file collectors as a subprocess",
  "viewer: exercises the viewer's JavaScript through node, skipped when node is absent",
]

[tool.coverage.run]
source = ["src/agentforensics"]
branch = true
