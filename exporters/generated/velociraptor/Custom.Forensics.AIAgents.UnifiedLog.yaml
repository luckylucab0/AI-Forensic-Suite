# Generated from the artifact catalogue. Do not edit by hand:
# run `afx export-collection` and commit the result.
# Catalogue digest: 6671aaccb0c5
#
# An empty result from this rule means the paths it searched held nothing. It does
# not mean the host is clean. Unverified catalogue entries, relocated data trees and
# the paths listed as not covered below are all reasons a used agent leaves no hit
# here. Where this matters, run the suite's own collector instead: it reads the
# relocation variables and the agents' own state files, which no static rule can.
#
# Scope: the 106 artifacts the catalogue files under transcript and prompt_history.
# The other 525 are configuration, credentials, caches, logs and install
# traces. They are not left out by accident and they are not skipped for want of a
# glob: this artifact returns a conversation, and for a settings file or a
# credential store what an analyst wants is the file, which is what the Collect
# artifact in this same directory is for.
#
# This artifact returns rows, not files. Each row is one record of the unified
# agent log format; validate them against
# src/agentforensics/unified/agentlog.v1.schema.json.
#
# Normalizers with a verified mapping: claude_history, claude_transcript, codex_history, codex_rollout, copilot_events.
# Every other line-delimited log is returned uninterpreted, and every other format
# is returned as one row per file. Both are visible in the output, never omitted.
#
# Read by the suite's own parsers and NOT interpreted here, in whole or for the
# paths each entry names, so for those a fleet hunt returns the file and not the
# conversation. Collect these and ingest them:
#   - aider.chat_history: a markdown log whose turns are blocks of lines rather than records, so a line of it is a fragment of one
#   - aider.input_history: a line editor's history file whose entries span several lines, which this query reads one line at a time
#   - amazonq.cli_prompt_history: a line editor's history file whose entries are escaped, so a line of it is not the text that was typed
#   - chatgpt_desktop.macos_codex_home: a profile directory this artifact will not narrow to an extension
#   - chatgpt_desktop.windows_msix_localcache: an application-data tree whose conversations are in a browser engine's key-value store, which is a set of binary table files and a write-ahead log rather than records this query can read a line at a time. The analyzer opens one key by key, so collect the tree and ingest it
#   - claude_code.tool_result_spills: the bulk output of one tool call in one file, which is prose rather than records: a line of it is a fragment of what the agent saw
#   - cline.cli_sessions: a session directory of whole JSON documents. The hook log that dates this agent's prompts is a separate artifact and does come back record by record
#   - cline.data_tasks: a task directory of whole JSON documents
#   - cline.vscode_task_transcripts: a task directory of whole JSON documents
#   - codex.rollouts_compressed: a transcript compressed in place after seven days, which this query cannot expand on the endpoint. Everything older than a week is in these files, so collect them and ingest them: the analyzer reads them line by line exactly as it reads an uncompressed one
#   - codex.sqlite_write_ahead_logs: a database's write-ahead log and shared-memory index, which hold changed pages rather than records, so nothing comes out of one a line at a time. The analyzer names them for what they are and reads what is in the log through the database beside it, so collect all three files and ingest them together
#   - copilot.session_store_sidecars: the same two files for another product's store, for the same reason
#   - cursor.subagent_output: what a background subagent wrote for its parent, in a format the vendor documents nothing about, so a line of it is a fragment of a report
#   - factory_droid.specs: a saved specification, which is the plan for a piece of work in prose: a line of it is a fragment of what somebody asked for, and the analyzer carries the file whole as one plan
#   - gemini_cli.chats: a chats directory this artifact will not narrow to an extension
#   - goose.command_history: a line editor's history file, which is a line each until the writer chooses its escaped format, and the analyzer reads whichever of the two the file is in
#   - hermes.pastes: the text behind a placeholder in a prompt, which is whatever the user pasted: a line of it is a fragment of what they handed the agent, and the analyzer carries the file whole as one prompt
#   - hermes.session_exports: conversations exported to readable files, which are prose rather than records, in a directory this artifact will not narrow to an extension
#   - hermes.sessions_dir: a sessions directory this artifact will not narrow to an extension
#   - hermes.spillover: the bulk output of one tool call in one file, which is prose rather than records, for the same reason as the entry of another agent above
#   - jetbrains_ai.aia_task_history: a session file of prose rather than records, so a line of it is a fragment of a conversation
#   - junie.cli_sessions: read in part: its own event log comes back record by record and the subagent transcripts beside it sit in a subtree this artifact will not narrow to an extension
#   - junie.matterhorn_project_logs: read in part: the event and issue files come back record by record and the tree around them, which is where this product's Windows paths lead, is returned as files
#   - kilo_code.extension_id_legacy_tree: a task directory of whole JSON documents
#   - ollama.cli_prompt_history: a line editor's history file, which is a line each and carries no timestamp, agent or session for a record to be built from
#   - qwen_code.prompt_history_log: one JSON document rewritten whole on every append
#   - qwen_code.subagent_transcripts: a directory with no stated file format
#   - roo_code.tasks: a task directory of whole JSON documents
#   - windsurf.cascade_trajectories: an encrypted container around a protocol buffer. The analyzer opens one when the examiner supplies the product's key; this query does not carry a key and does not try, so it returns the files to be collected and read
#   - windsurf.implicit_trajectories: the same encrypted container as the entry above, for the background work of the same agent
#   - zed.flatpak_legacy_threads: a memory-mapped B-tree database, which this query does not open: it reads a file line at a time and this one is a tree of pages. The suite analyzer reads every record of one, and the pages it no longer points at as well, so collect the directory whole and ingest it
#   - every artifact the catalogue records as json: a whole document, which this query does not read: it reads a file line by line and a document is one value. The suite analyzer splits one by its structure, so collect the file and ingest it
#   - every artifact the catalogue records as sqlite: a database, which this query does not open. The suite analyzer reads every table of one, so collect the file and ingest it
#
# It deliberately avoids parse_jsonl, which skips a line it cannot decode. A
# skipped line reads as a line that was never there, and that is the one failure
# this tooling must not have.
#
# Not covered by this rule:
#   anchored at a working copy, whose location only the agent's own state file gives: run the suite's collector, which reads it
#     aider.chat_history
#     aider.input_history
#     aider.llm_history
#     amazonq.ide_chat_export
#   no path for this operating system that this target can express
#     amp.continuations
#     opencode.legacy_json_storage
#   reachable only through a relocation variable, which a static glob cannot resolve: read the variable off the endpoint
#     kiro.acp_wire_record
#   some of its paths are anchored at a working copy, whose location only the agent's own state file gives, so those are not in this rule. Its profile and system wide paths are. Run the suite's collector for the rest, which reads that state file
#     factory_droid.sessions
#     windsurf.plans
name: Custom.Forensics.AIAgents.UnifiedLog
description: |
  Read the on-disk history of AI coding agents on this host and return it as a
  vendor-neutral agent log: one row per record, in the format documented at
  docs/UNIFIED_FORMAT.md, whichever agent wrote it.

  Uploads nothing. The records come back in the result set, which is the point: a
  fleet hunt gets the conversations without pulling gigabytes of transcripts off
  every endpoint.

  What it does not do, stated here because a collection tool that quietly does less
  than it appears to is worse than one that fails:

    - It normalizes one row per record, never per content block. An assistant turn
      that called three tools is one row. The complete record is in `raw`, so
      nothing is lost; re-reading this log with the suite's own analyzer splits it
      further. What is coarse is the interpretation, not the evidence.

    - It interprets the formats that have been verified against their vendor: the
      Claude Code transcript and prompt history, the Codex rollout and prompt
      history, and the Copilot CLI event log. Any other line-delimited agent log is
      returned record by record with kind `unparsed.record`, because guessing the
      semantics of an unverified format produces output that looks like an answer.

    - It does not read SQLite stores, JSON documents or binary session files. Those
      come back as one `artifact.fs` row each, naming the path, the hash and the
      timestamps, so that a store nobody has read is visible as a store nobody has
      read rather than as an agent that left nothing behind.

    - Some of what the suite's own analyzer reads is not read here, or is read
      only in part: 31 artifacts, named in the notes below. Where
      one of them is not read, a row says the file was there, with its hash and its
      timestamps, and nothing about the conversation in it. Collect those files
      with the Collect artifact and ingest them.

    - Records carry no `event_id`. It is derived from provenance and the kind, and a
      reader recomputes it, so emitting one here would only create something to
      disagree with.
type: CLIENT
parameters:
- name: CollectionName
  description: An identifier for this collection, written into every record's
    provenance. Leave empty to derive one from the hostname and the current time.
    Set it when several collections from one host have to be told apart.
  default: ''
- name: MaxFileSize
  description: Do not read a file larger than this, in bytes. The file is still
    reported as one row saying it was too large, because a transcript that was
    skipped is not a transcript that was absent.
  type: int64
  default: '268435456'
- name: MaxLineSize
  description: The line buffer, in bytes. A transcript line carrying a large tool
    output is routinely megabytes, and a line longer than this buffer stops the
    scan, so the default is generous. The query reports a file whose bytes do not
    add up rather than returning a partial read as if it were whole.
  type: int64
  default: '16777216'
- name: HashFiles
  description: Hash every file that is read, so a record can be shown to have come
    from the file that was there. Turning this off makes a collection faster and
    its records less defensible.
  type: bool
  default: 'Y'
