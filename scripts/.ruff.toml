# These scripts run as pre-commit hooks with `language: system`, which means they execute
# on whatever `python3` the contributor happens to have, not on the project's pinned 3.14
# interpreter. A hook that crashes with a SyntaxError is a hook people disable, so the
# target here is the same generous floor as the collectors use.
#
# The cost is that pyupgrade cannot suggest modern typing syntax in this directory. That is
# the intended trade: `list[str]` as a runtime type alias fails on Python 3.8, and these
# files are the ones most likely to be run outside the project's own environment.
#
# The generators in this directory (build_collectors.py, gen_artifact_docs.py) import the
# analyzer package and therefore need Python 3.14 to RUN. Their own syntax is still kept
# inside this target, because one ruff target per directory is simpler than splitting the
# directory, and because a contributor should not have to remember which script in here can
# use which syntax.
#
# See docs/adr/0004-two-single-file-collectors.md for the same reasoning applied there.

extend = "../pyproject.toml"
target-version = "py38"

[lint]
ignore = ["UP", "E501"]

[lint.per-file-ignores]
# A development script is a command line tool: printing is its interface, and shelling out
# to git is the job.
"*.py" = ["T20", "S603", "S607"]
