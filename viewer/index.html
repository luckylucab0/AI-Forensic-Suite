<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Sessions · Forensic Viewer</title>
<script>
  // Apply the saved theme before first paint to avoid a flash of the wrong colors.
  // No stored choice → no data-theme attribute → the prefers-color-scheme media query decides.
  (function(){try{var t=localStorage.getItem('cc-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<!--
  Agent Sessions, the forensic transcript viewer of the AI Agent Forensic Suite.

  One file, no backend, no dependencies, read-only. It renders the session logs of
  AI coding agents so an analyst can read exactly what a user asked and what the
  agent did. It is a component of the suite but stays usable entirely on its own,
  which is why it has no build step: an analyst can carry it on a USB stick and
  open it on a machine where nothing may be installed.

  Three ways to point it at logs:

    A. Serve an agent directory and open this file from there:
           cd ~/.claude        # or ~/.codex, ~/.copilot, or a parent of them
           python3 -m http.server 8000
           # open http://localhost:8000/index.html

    B. Host this file, then use the folder picker in the sidebar footer. Needs a
       Chromium-based browser in a secure context (the File System Access API).

    C. Point it at a case database served by `agentforensics serve`, which lets it
       show any agent the suite can parse, not just the three layouts it can
       discover on its own.

  Design constraint: this file never writes to the evidence it reads and never calls
  out to the network. See docs/ARCHITECTURE.md in the repository.
-->
<style>
/* Evidence Desk.
 *
 * A light, papery surface with hairline rules and one dark ink, because a forensic reader
 * is reading text and metadata for hours and a saturated interface competes with the
 * evidence for their attention. Every colour that is not ink carries one meaning and only
 * one: amber is "read but not understood", red is "a rule fired or a parser failed",
 * green is "checked and intact", blue is the one interactive accent.
 *
 * The variables keep the shape the script expects, because a few of them are written into
 * inline styles for the per-agent dots.
 *
 * The dark theme below is the same grid in the same meanings, not a second design. An
 * analyst who switches themes mid-case must not have to relearn which colour says a
 * record could not be read.
 */
:root{
  --paper:#f6f5f2;          /* the desk itself */
  --surface:#ffffff;        /* cards, tables, panels */
  --surface-2:#fbfaf8;      /* sidebar, prose notes, inset code */
  --surface-3:#f2f0ec;      /* quiet chips, inline code */
  --rule:#e0dcd4;           /* the hairline between regions */
  --rule-soft:#ebe8e2;      /* the hairline between rows */
  --rule-strong:#cfcac1;    /* a window's own edge */
  --control:#dad5cc;        /* the border of something clickable */
  --ink:#1b1a18;            /* headings, the active chip's fill */
  --ink-2:#26241f;          /* body text in a table cell */
  --body:#4a463f;           /* body text in prose */
  --dim:#6b665e;            /* labels, units, counts */
  --faint:#7a756c;          /* placeholders, gutter times */
  --faintest:#9b958b;       /* text inside an empty input */
  --accent:#2f4fd8;         /* the one interactive colour */
  --accent-soft:#c9d2f4;
  --red:#a53a1f;            /* a rule fired, a parser failed */
  --red-ink:#8a3a20;        /* a whole row that a rule fired on */
  --red-bg:#f9efec;
  --red-line:#ecd3c9;
  --amber:#8a6a1f;          /* read, not understood; position unknown */
  --amber-bg:#fdf8ee;
  --amber-line:#e8dcc2;
  --green:#2e6b45;          /* checked and intact */
  --green-bg:#ecf3ee;
  --green-line:#cde0d4;
  --mark:#fbe6c8;           /* a search hit, a matched secret */
  --mark-line:#d9a95f;
  --shadow:0 14px 34px rgba(27,26,24,.18);
  color-scheme:light;
  /* IBM Plex where the workstation has it, and a system stack otherwise. Named rather
     than fetched: the viewer must open on a machine with no network (ADR 0001), so it
     never loads a font. */
  --mono:"IBM Plex Mono","SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"], html[data-theme="dark"]{
  --paper:#171614;--surface:#1e1d1a;--surface-2:#1a1917;--surface-3:#272521;
  --rule:#312e29;--rule-soft:#272521;--rule-strong:#3c3833;--control:#413c35;
  --ink:#f4f2ee;--ink-2:#e7e3dc;--body:#c6c0b5;--dim:#9c958a;--faint:#847d73;
  --faintest:#6c665d;
  --accent:#93a8ff;--accent-soft:#39406b;
  --red:#e08a6e;--red-ink:#e8a288;--red-bg:#2c1d18;--red-line:#4d3125;
  --amber:#d8b26c;--amber-bg:#282016;--amber-line:#4a3c22;
  --green:#79c199;--green-bg:#152520;--green-line:#26493a;
  --mark:#4c3a1b;--mark-line:#8a6a2f;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171614;--surface:#1e1d1a;--surface-2:#1a1917;--surface-3:#272521;
    --rule:#312e29;--rule-soft:#272521;--rule-strong:#3c3833;--control:#413c35;
    --ink:#f4f2ee;--ink-2:#e7e3dc;--body:#c6c0b5;--dim:#9c958a;--faint:#847d73;
    --faintest:#6c665d;
    --accent:#93a8ff;--accent-soft:#39406b;
    --red:#e08a6e;--red-ink:#e8a288;--red-bg:#2c1d18;--red-line:#4d3125;
    --amber:#d8b26c;--amber-bg:#282016;--amber-line:#4a3c22;
    --green:#79c199;--green-bg:#152520;--green-line:#26493a;
    --mark:#4c3a1b;--mark-line:#8a6a2f;
    --shadow:0 14px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ---- the case bar: who this case is, and under what terms it is open ---- */
/* Always on screen, in every view. An analyst reading a row has to be able to say which
   case and which collection it came out of without going back to a tab. */
#topbar{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--rule);}
.brand{display:flex;align-items:center;gap:8px;flex:none;}
.brand-mark{width:8px;height:8px;background:var(--ink);transform:rotate(45deg);flex:none;}
.brand-name{font-weight:600;font-size:13.5px;}
.bar-sep{width:1px;height:20px;background:var(--rule);flex:none;}
.case-name{font-size:13px;font-weight:500;flex:none;white-space:nowrap;}
.case-meta{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.bar-gap{flex:1;min-width:8px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;padding:4px 9px;border:1px solid var(--rule);background:var(--surface-3);color:var(--dim);flex:none;white-space:nowrap;}
.badge.ok{color:var(--green);background:var(--green-bg);border-color:var(--green-line);}
.badge.warn{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line);}
.badge.bad{color:var(--red);background:var(--red-bg);border-color:var(--red-line);}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}

/* ---- the icon rail: every view, one keystroke wide ---- */
/* A rail rather than a row of tabs, because the case views outgrew a tab bar in a fixed
   sidebar twice. A rail has room for the tenth view without anything moving. */
#body{flex:1;display:flex;min-height:0;}
#rail{width:58px;flex:none;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:8px 6px;gap:2px;overflow-y:auto;}
.rail-gap{flex:1;min-height:6px;}
.tab{padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);cursor:pointer;border:none;background:none;font-family:var(--sans);width:100%;}
.tab:hover{color:var(--ink);background:var(--surface-3);}
.tab.active{background:var(--ink);color:var(--paper);}
.tab.active:hover{background:var(--ink);color:var(--paper);}
.tab .key{font-family:var(--mono);font-size:13px;font-weight:600;line-height:1;}
.tab .lbl{font-size:8px;letter-spacing:.04em;text-transform:uppercase;line-height:1;}
.tab.flagged{color:var(--red);}
.tab.flagged.active{color:var(--paper);}
.tab .tab-badge{font-family:var(--mono);font-size:9px;color:var(--red);line-height:1;}
.tab.active .tab-badge{color:var(--paper);}
/* The rail is the tab bar now. Kept as a flex column that wraps nothing and scrolls
   instead, so a tenth view cannot be rendered off the end where it is unclickable. */
.tabs{display:flex;flex-direction:column;flex-wrap:wrap;gap:2px;}
.tabs.hidden{display:none;}

/* ---- sidebar: the session list, only where there are sessions ---- */
#sidebar{width:298px;flex:none;background:var(--surface-2);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;}
#sidebar.hidden{display:none;}
.sidebar-header{padding:10px 12px;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:9px;flex:none;}
#search{width:100%;background:var(--surface);border:1px solid var(--control);color:var(--ink);padding:6px 9px;font-size:12.5px;font-family:var(--sans);}
#search:focus{outline:none;border-color:var(--accent);}
#search::placeholder{color:var(--faintest);}
.agent-chips{display:flex;gap:5px;flex-wrap:wrap;}
.agent-chips.hidden{display:none;}
.agent-chip{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);cursor:pointer;}
.agent-chip:hover{border-color:var(--accent);}
.agent-chip.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.agent-chip .n{font-family:var(--mono);color:var(--dim);}
.agent-chip.active .n{color:var(--paper);}
.src-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;}
.project-list{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px;}
.project-name{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:9px 12px 4px;border-top:1px solid var(--rule-soft);margin-top:4px;overflow-wrap:anywhere;}
.project:first-child .project-name{border-top:none;margin-top:0;}
.project-name .count{flex:none;color:var(--faint);letter-spacing:0;}
.session{padding:8px 12px 8px 10px;border-left:2px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:3px;}
.session:hover{background:var(--surface-3);}
.session.active{background:var(--surface);border-left-color:var(--ink);}
.session-title{display:flex;align-items:center;gap:6px;}
.session-title .stxt{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.session.active .session-title .stxt{font-weight:600;color:var(--ink);}
.session-meta{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);padding-left:13px;}
.session-meta .dot::before{content:"·";margin-right:6px;}
.session-meta .smark{padding:0 4px;}
.session-meta .smark.find{color:var(--red);border:1px solid var(--red-line);background:var(--red-bg);}
.session-meta .smark.bad{color:var(--red);}
.session-meta .smark.soft{color:var(--amber);}
.sidebar-footer{border-top:1px solid var(--rule-soft);padding:9px 12px;flex:none;display:flex;flex-direction:column;gap:6px;}
.footer-row{display:flex;gap:6px;}
#root-label{font-family:var(--mono);font-size:10px;color:var(--faint);overflow-wrap:anywhere;}

/* ---- main: one grid for every view ---- */
/* head, chip row, the red line that says what a filter is hiding, the prose note, then
   the table and the evidence column. Every view is built from these, so moving between
   two of them costs no re-orientation. */
#main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);}
.view-head{flex:none;padding:11px 16px 9px;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:flex-end;gap:14px;}
.view-head.hidden{display:none;}
.view-title{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.view-sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.head-gap{flex:1;min-width:6px;}
.head-right{display:flex;align-items:center;gap:8px;flex:none;}
.chip-bar{flex:none;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.chip-bar.hidden{display:none;}
.chip-gap{width:10px;flex:none;}
.chip-push{flex:1;min-width:6px;}
.tfilter{font-size:11px;padding:5px 10px;border:1px solid var(--control);background:var(--surface);color:var(--body);cursor:pointer;white-space:nowrap;}
.tfilter:hover{border-color:var(--accent);color:var(--ink);}
.tfilter.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.tfilter .c{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:5px;}
.tfilter.active .c{color:var(--paper);}
.filter-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-right:2px;}
.filter-input{background:var(--surface);border:1px solid var(--control);color:var(--ink);padding:4px 9px;font-size:11.5px;font-family:var(--sans);min-width:170px;}
.filter-input:focus{outline:none;border-color:var(--accent);}
.filter-input::placeholder{color:var(--faintest);}
/* ADR 0009 on one line. A filter may take rows off the screen because somebody asked it
   to; what it may never do is leave them looking absent. This bar is on screen for as
   long as anything is hidden, and it is red because it is a statement about missing
   evidence rather than a status. */
.hide-note{flex:none;background:var(--red-bg);border-bottom:1px solid var(--red-line);padding:6px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.hide-note.hidden{display:none;}
.hide-note .n{font-family:var(--mono);font-size:10.5px;color:var(--red);}
.hide-note .why{font-size:11px;color:var(--body);}
.view-note{flex:none;padding:9px 16px;background:var(--surface-2);border-bottom:1px solid var(--rule-soft);font-size:11.5px;line-height:1.5;color:var(--body);}
.view-note.hidden{display:none;}
.view-note b{color:var(--ink);}
.view-note code{font-family:var(--mono);font-size:11px;background:var(--surface-3);padding:1px 4px;}
.view-body{flex:1;min-height:0;display:flex;}
.view-panel{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
.view-panel.hidden{display:none;}
.rows{flex:1;min-height:0;overflow-y:auto;background:var(--surface);}
.pad{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;}

/* ---- the dense table ---- */
/* Fixed-width flex columns rather than a real table, because every column here has a
   width that is a decision: a timestamp is 150px because that is one timestamp, and a
   column that reflows is a column an eye has to find again on every row. */
.thead{flex:none;display:flex;align-items:center;height:28px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);position:sticky;top:0;z-index:1;}
.trow{display:flex;align-items:baseline;padding:8px 16px;border-bottom:1px solid var(--rule-soft);font-size:12px;cursor:pointer;}
.trow.flat{cursor:default;}
.trow:hover{background:var(--surface-3);}
.trow.on{background:var(--surface-3);box-shadow:inset 2px 0 0 var(--ink);}
.trow.alert{background:var(--red-bg);}
.trow.alert:hover{background:var(--red-bg);filter:brightness(.985);}
.trow.soft{background:var(--amber-bg);}
.trow.soft:hover{background:var(--amber-bg);filter:brightness(.985);}
.trow.done{opacity:.55;}
/* A gutter on the right of every cell but the last, so a cell whose content fills its
   width still ends before the next column starts. Without it two columns of real
   evidence run into each other and read as one value. */
.tcell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
.tcell:last-child{padding-right:0;}
.tcell.grow{flex:1;min-width:0;}
.tcell.right{text-align:right;}
.m{font-family:var(--mono);font-size:11px;color:var(--ink-2);}
.m.q{font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.m.warn{color:var(--amber);}
.m.bad{color:var(--red);}
.m.ok{color:var(--green);}
.trow.alert .m,.trow.alert .tcell{color:var(--red-ink);}
.pill{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border:1px solid var(--control);background:var(--surface-3);color:var(--body);white-space:nowrap;}
.pill.bad{color:var(--red);background:var(--red-bg);border-color:var(--red-line);}
.pill.warn{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line);}
.pill.ok{color:var(--green);background:var(--green-bg);border-color:var(--green-line);}
.tfoot{flex:none;padding:8px 16px;background:var(--surface);border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px;}
.tfoot.hidden{display:none;}
.tfoot .n{font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.agg-empty{color:var(--dim);padding:34px 16px;text-align:center;font-size:12.5px;}

/* ---- the evidence column ---- */
/* Fixed, never a popover, and never behind a click. The source file, the place in it and
   the hash are what turns a row on a screen into something a report can cite, and a
   reader who has to open a dialogue for them stops asking for them. */
.evidence{width:320px;flex:none;background:var(--surface);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
.evidence.hidden{display:none;}
.ev-head{padding:9px 13px;border-bottom:1px solid var(--rule-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--surface);}
.ev-head .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ev-sec{padding:11px 13px;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:7px;}
.ev-sec:last-child{border-bottom:none;}
.ev-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);}
.ev-kv{display:flex;justify-content:space-between;gap:10px;font-size:11px;}
.ev-kv .k{color:var(--dim);flex:none;}
.ev-kv .v{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;word-break:break-all;}
.ev-stack{display:flex;flex-direction:column;gap:2px;}
.ev-stack .k{font-size:10.5px;color:var(--dim);}
.ev-stack .v{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);word-break:break-all;}
.ev-prose{font-size:11.5px;line-height:1.5;color:var(--body);}
.ev-prose b{color:var(--ink-2);}
.ev-quote{border-left:2px solid var(--red);padding-left:9px;display:flex;flex-direction:column;gap:3px;}
.ev-quote.soft{border-left-color:var(--amber);}
.ev-quote.calm{border-left-color:var(--control);}
.ev-quote .h{font-size:12px;font-weight:600;color:var(--ink-2);}
.ev-code{font-family:var(--mono);font-size:10.5px;line-height:1.65;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--rule-soft);padding:8px 9px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;}
.ev-row{display:flex;align-items:center;gap:7px;}
.ev-row .p{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ---- buttons and links ---- */
/* Each class sets a background of its own. A <button> with no background renders as the
   platform's button face, which on this surface is a grey slab where a label should be. */
.btn{background:var(--surface);border:1px solid var(--control);color:var(--body);padding:5px 10px;font-size:11px;font-family:var(--sans);cursor:pointer;white-space:nowrap;}
.btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--accent);}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.btn-go{background:var(--ink);border:1px solid var(--ink);color:var(--paper);padding:5px 11px;font-size:11.5px;font-family:var(--sans);cursor:pointer;}
.btn-go:hover{background:var(--body);border-color:var(--body);}
.linkish{background:none;border:none;color:var(--accent);font-size:11px;font-family:var(--sans);cursor:pointer;padding:0;text-align:left;}
.linkish:hover{text-decoration:underline;}
.sbtn{background:var(--surface);border:1px solid var(--control);color:var(--body);width:24px;height:24px;font-size:11px;line-height:1;cursor:pointer;}
.sbtn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--accent);}
.folder-btn{background:var(--surface);border:1px solid var(--control);color:var(--body);padding:6px 10px;font-size:11.5px;font-family:var(--sans);cursor:pointer;flex:1;text-align:center;}
.folder-btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--accent);}
.folder-btn.hidden{display:none;}
.theme-toggle{background:var(--surface);border:1px solid var(--rule);color:var(--dim);font-size:12px;line-height:1;padding:4px 7px;cursor:pointer;flex:none;}
.theme-toggle:hover{background:var(--surface-3);color:var(--ink);}
.tool-toggle{background:var(--surface);border:1px solid var(--control);font-family:var(--mono);color:var(--dim);font-size:10px;padding:1px 6px;cursor:pointer;margin-left:auto;flex:none;}
.tool-toggle:hover{color:var(--ink);border-color:var(--accent);}
.tool-toggle .chev{display:inline-block;transition:transform .12s;}
.tool-toggle.open .chev{transform:rotate(90deg);}
.modal-close{position:absolute;top:7px;right:10px;background:var(--surface);border:1px solid var(--control);color:var(--dim);font-size:12px;cursor:pointer;padding:2px 7px;}
.modal-close:hover{color:var(--ink);}

/* ---- the time window ---- */
/* Its own panel rather than two inputs in a chip row. An investigation has a window, and
   the presets are the windows an investigation actually asks for; the switches under them
   are the three decisions that change what a window means to a forensic reader. */
.win{position:relative;flex:none;}
.win-trigger{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink);border:1px solid var(--control);background:var(--surface);padding:4px 9px;cursor:pointer;}
.win-trigger:hover{border-color:var(--accent);}
.win-trigger.set{border-color:var(--ink);}
.win-trigger .k{color:var(--dim);}
.win-trigger .v{font-weight:600;}
.win-trigger .hid{color:var(--red);}
.win-panel{position:absolute;top:28px;right:0;width:356px;background:var(--surface);border:1px solid var(--rule-strong);box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;}
.win-panel.hidden{display:none;}
.win-sec{padding:9px 12px;border-bottom:1px solid var(--rule-soft);display:flex;flex-direction:column;gap:6px;}
.win-sec:last-child{border-bottom:none;}
.win-row{display:flex;gap:4px;}
.preset{flex:1;text-align:center;font-size:11px;padding:5px 2px;border:1px solid var(--control);background:var(--surface);color:var(--body);cursor:pointer;font-family:var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preset:hover{border-color:var(--accent);color:var(--ink);}
.preset.active{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.preset:disabled{color:var(--faintest);cursor:not-allowed;background:var(--surface-2);}
.preset:disabled:hover{border-color:var(--control);color:var(--faintest);}
.win-field{display:flex;align-items:center;gap:8px;}
.win-field .k{width:30px;flex:none;font-size:11px;color:var(--dim);}
.win-field input{font-family:var(--mono);font-size:11.5px;color:var(--ink);border:1px solid var(--control);background:var(--surface-2);padding:5px 8px;min-width:0;}
.win-field input:focus{outline:none;border-color:var(--accent);}
.win-field input.bad{border-color:var(--red);color:var(--red);}
.win-field .date{flex:1;}
.win-field .time{width:70px;flex:none;}
.win-hint{font-size:10.5px;line-height:1.45;color:var(--dim);}
.zone{display:flex;align-items:center;gap:6px;}
.switch{display:flex;align-items:flex-start;gap:8px;background:none;border:none;padding:0;text-align:left;cursor:pointer;font-family:var(--sans);}
.switch .box{width:13px;height:13px;flex:none;margin-top:2px;border:1px solid var(--control);background:var(--surface);font-size:9px;line-height:11px;text-align:center;color:transparent;}
.switch.on .box{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.switch .txt{font-size:11.5px;line-height:1.4;color:var(--ink-2);}
.switch .n{font-family:var(--mono);color:var(--dim);}
.win-foot{padding:9px 12px;display:flex;align-items:center;gap:9px;background:var(--surface-2);border-top:1px solid var(--rule-soft);}
.win-foot .n{font-family:var(--mono);font-size:10px;color:var(--dim);flex:1;}

/* ---- the transcript ---- */
/* A time gutter and a card per turn. The gutter is what lets an eye run down the clock
   without reading the turns, which is how a transcript is read when the question is when
   rather than what. */
#transcript{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 90px;display:flex;flex-direction:column;gap:10px;background:var(--paper);}
#transcript.hidden{display:none;}
.turn{display:flex;gap:10px;}
.turn .gutter{width:56px;flex:none;font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:10px;text-align:right;}
.card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--control);padding:10px 13px;display:flex;flex-direction:column;gap:8px;}
.card.user{border-left-color:var(--accent);}
.card.assistant{border-left-color:var(--faint);}
.card.problem{background:var(--amber-bg);border-color:var(--amber-line);border-left-color:var(--amber);}
.card.system{background:var(--surface-2);border-left-color:var(--control);padding:7px 13px;}
.card.on{box-shadow:0 0 0 1px var(--ink);}
.card-head{display:flex;align-items:center;gap:8px;}
.card-kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;}
.card.user .card-kind{color:var(--accent);}
.card.assistant .card-kind{color:var(--dim);}
.card.problem .card-kind{color:var(--amber);}
.card-id{font-family:var(--mono);font-size:9.5px;color:var(--faint);}
.card-ts{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);flex:none;}
.user-body{white-space:pre-wrap;word-break:break-word;color:var(--ink-2);font-size:13px;line-height:1.55;}
.meta-pill{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--control);background:var(--surface-3);padding:0 5px;cursor:pointer;margin-right:4px;}
.meta-pill:hover{color:var(--ink);border-color:var(--accent);}
.thinking{display:flex;flex-direction:column;gap:5px;}
.thinking-head{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);background:var(--surface-2);border:1px solid var(--rule-soft);padding:5px 9px;cursor:pointer;}
.thinking-head:hover{color:var(--ink);}
.thinking-head .spark{font-family:var(--mono);font-size:10px;}
.thinking-body{white-space:pre-wrap;word-break:break-word;color:var(--body);font-size:12.5px;border-left:1px solid var(--rule);padding:4px 0 4px 12px;}
.thinking-body.collapsed{display:none;}
.collapsed{display:none;}

/* ---- tool calls inside a turn ---- */
.tools-container{display:flex;flex-direction:column;gap:6px;}
.tool{display:flex;flex-direction:column;border:1px solid var(--rule-soft);}
.tool.err{border-color:var(--red-line);}
.tool-call{display:flex;align-items:center;gap:9px;padding:6px 9px;background:var(--surface-2);cursor:pointer;}
.tool.err .tool-call{background:var(--red-bg);}
.tool-name{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);flex:none;}
.tool.err .tool-name{color:var(--red);}
.tool-summary{font-family:var(--mono);font-size:11px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tool.err .tool-summary{color:var(--red-ink);}
.tool-mark{font-family:var(--mono);font-size:10px;flex:none;}
.tool-result-line{display:flex;gap:7px;padding:6px 9px;background:var(--surface);font-family:var(--mono);font-size:10.5px;color:var(--dim);border-top:1px solid var(--rule-soft);}
.tool-result-line .connector{flex:none;}
.tool-result-line .result-preview{color:var(--body);white-space:pre-wrap;word-break:break-word;flex:1;min-width:0;}
.result-preview .more{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;}
/* Written after `.collapsed` and with the compound selector, because equal specificity
   means the later rule wins: a `tool-detail collapsed` whose own rule set display would
   be a closed detail that is on screen. */
.tool-detail{border-top:1px solid var(--rule-soft);padding:8px 9px;display:flex;flex-direction:column;gap:4px;background:var(--surface);}
.tool-detail.collapsed{display:none;}
.tool-io-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);}
.tool-io{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--rule-soft);padding:8px 9px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;font-size:11px;color:var(--body);}
.tool-io.error{border-color:var(--red-line);color:var(--red);}

/* ---- the turn filter strip ---- */
.turn-tabs{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;}
.ttab{font-size:11.5px;padding:6px 11px;border:1px solid transparent;color:var(--dim);background:none;cursor:pointer;font-family:var(--sans);margin-bottom:-1px;white-space:nowrap;}
.ttab:hover{color:var(--ink);}
.ttab.active{border-color:var(--rule-strong);border-bottom-color:var(--surface);background:var(--surface);color:var(--ink);font-weight:600;}
.ttab .c{font-family:var(--mono);color:var(--faint);margin-left:5px;}
.ttab.warn{color:var(--amber);}
#search-bar{display:flex;align-items:center;gap:8px;flex:none;}
#search-bar.hidden{display:none;}
.snav{display:flex;align-items:center;gap:4px;flex:none;}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface-3);border:1px solid var(--control);padding:4px 9px;width:250px;flex:none;}
.searchbox:focus-within{border-color:var(--accent);}
.searchbox .ic{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;}
.searchbox input{flex:1;min-width:0;background:none;border:none;color:var(--ink);font-size:12px;font-family:var(--sans);}
.searchbox input:focus{outline:none;}
.searchbox input::placeholder{color:var(--faintest);}
.search-count{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none;}
.seg{display:flex;border:1px solid var(--control);flex:none;}
.segbtn{font-size:11px;padding:5px 9px;background:var(--surface);color:var(--dim);border:none;cursor:pointer;font-family:var(--sans);}
.segbtn.active{background:var(--ink);color:var(--paper);}

/* ---- case view cards ---- */
.card-row{display:flex;gap:10px;flex-wrap:wrap;}
.stat{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--rule);padding:11px 13px;display:flex;flex-direction:column;gap:3px;}
.stat .n{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.02em;}
.stat .l{font-size:11.5px;color:var(--ink-2);}
.stat .h{font-size:10.5px;color:var(--dim);line-height:1.35;}
.stat.warn .n{color:var(--amber);}
.stat.bad .n{color:var(--red);}
.stat.zero .n{color:var(--dim);}
.block-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;align-items:baseline;gap:9px;}
.block-label .side{font-family:var(--sans);font-size:11px;letter-spacing:0;text-transform:none;color:var(--dim);}
.strip{display:flex;align-items:center;gap:9px;background:var(--amber-bg);border:1px solid var(--amber-line);padding:8px 11px;flex-wrap:wrap;}
.strip .n{font-family:var(--mono);font-size:10.5px;color:var(--amber);}
.strip .t{font-size:11.5px;color:var(--body);}
.strip.bad{background:var(--red-bg);border-color:var(--red-line);}
.strip.bad .n{color:var(--red);}
.boxed{border:1px solid var(--rule);background:var(--surface);display:flex;flex-direction:column;min-height:0;}
.notice{border-left:2px solid var(--amber);background:var(--amber-bg);padding:9px 12px;font-size:12px;color:var(--body);}
.notice.hidden{display:none;}
.notice b{color:var(--ink);}
.notice code{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);padding:1px 4px;}

/* ---- markdown ---- */
.md{word-break:break-word;color:var(--ink-2);font-size:13px;line-height:1.55;}
.md p{margin:0 0 9px;}
.md p:last-child{margin-bottom:0;}
.md h1,.md h2,.md h3{margin:14px 0 6px;font-weight:600;letter-spacing:-.01em;color:var(--ink);}
.md h1{font-size:16px;}.md h2{font-size:14.5px;}.md h3{font-size:13px;}
.md ul,.md ol{margin:6px 0;padding-left:20px;}
.md li{margin:2px 0;}
.md a{color:var(--accent);text-decoration:none;}
.md a:hover{text-decoration:underline;}
.md code{font-family:var(--mono);background:var(--surface-3);padding:1px 4px;font-size:12px;}
.md pre{background:var(--surface-2);border:1px solid var(--rule-soft);padding:10px 12px;overflow-x:auto;margin:8px 0;}
.md pre code{background:none;padding:0;color:var(--body);font-size:11.5px;}
.md blockquote{border-left:2px solid var(--rule);margin:8px 0;padding:0 0 0 12px;color:var(--body);}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px;}
.md th,.md td{border:1px solid var(--rule-soft);padding:4px 9px;text-align:left;}
.md th{background:var(--surface-3);font-weight:600;}
.md hr{border:none;border-top:1px solid var(--rule-soft);margin:12px 0;}

/* ---- search highlight, invisible characters, masked secrets ---- */
mark.hl{background:var(--mark);border-bottom:1px solid var(--mark-line);color:inherit;padding:0 1px;}
mark.hl.hl-current{background:var(--ink);color:var(--paper);border-bottom-color:var(--ink);}
.hidden-char{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);padding:0 2px;font-family:var(--mono);font-size:10px;}
.masked{color:var(--dim);}

/* ---- empty state, modal ---- */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:9px;color:var(--dim);text-align:center;font-size:13px;padding:30px;}
.empty-mark{width:8px;height:8px;background:var(--control);transform:rotate(45deg);}
.empty-state code{font-family:var(--mono);font-size:11.5px;background:var(--surface-3);padding:1px 4px;color:var(--body);}
.empty-state p{max-width:460px;margin:0;}
.modal{position:fixed;inset:0;z-index:50;}
.modal.hidden{display:none;}
.modal-backdrop{position:absolute;inset:0;background:rgba(27,26,24,.5);}
.modal-body{position:relative;max-width:900px;max-height:80vh;margin:7vh auto;background:var(--surface);border:1px solid var(--rule-strong);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
.modal-content{margin:0;padding:20px;overflow:auto;font-family:var(--mono);font-size:11.5px;color:var(--body);white-space:pre-wrap;word-break:break-word;}

.hidden{display:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--control);}
::-webkit-scrollbar-thumb:hover{background:var(--rule-strong);}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">
  <!-- The case bar. On screen in every view, because a row an analyst is reading means
       nothing until they can say which case and which collection it came out of, and a
       screenshot of a view with no case identity on it is a screenshot of nothing. -->
  <header id="topbar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">afx</span></div>
    <div class="bar-sep"></div>
    <span class="case-name" id="case-name">Agent Sessions</span>
    <span class="case-meta" id="case-meta">forensic transcript viewer</span>
    <div class="bar-gap"></div>
    <div class="badge" id="integrity-badge" title="Whether the hashes the collection recorded have been checked">no collection</div>
    <div class="badge" id="mode-badge" title="How this page is reading the evidence">read-only</div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle colour theme">◐</button>
  </header>
  <div id="body">
    <!-- The views, as a rail. A rail rather than a tab bar: the case views outgrew a row
         inside a fixed-width sidebar twice, and the second time a tab was rendered under
         the main panel where it was visible and not clickable. -->
    <nav id="rail">
      <!-- Which tab is active is set at boot from `state.view` rather than written here,
           so there is one place that decides it. -->
      <button class="tab" type="button" data-view="sessions" title="One conversation, read in full"><span class="key">S</span><span class="lbl">Session</span></button>
      <!-- The case views. Hidden unless `afx serve` is behind this page, which is the only
           situation in which there is a case to ask these questions of. The standalone
           modes keep exactly the three views they always had. -->
      <div class="tabs hidden" id="case-tabs">
        <button class="tab" type="button" data-view="case" title="What the case holds and what it is missing"><span class="key">C</span><span class="lbl">Case</span></button>
        <button class="tab" type="button" data-view="timeline" title="Every event, every agent, one sequence"><span class="key">T</span><span class="lbl">Time</span></button>
        <button class="tab" type="button" data-view="findings" title="What the rule packs found"><span class="key">F</span><span class="lbl">Find</span><span id="find-badge" class="tab-badge hidden">0</span></button>
        <button class="tab" type="button" data-view="instructions" title="What the agents were told to obey"><span class="key">I</span><span class="lbl">Instr</span></button>
        <button class="tab" type="button" data-view="corroboration" title="Which store knows which conversation"><span class="key">K</span><span class="lbl">Conv</span></button>
        <button class="tab" type="button" data-view="artifacts" title="Every file collected, read or not"><span class="key">A</span><span class="lbl">Artef</span></button>
      </div>
      <button class="tab" type="button" data-view="tools" title="Every tool call across every session"><span class="key">X</span><span class="lbl">Tools</span></button>
      <button class="tab" type="button" data-view="security" title="Credentials that reached a transcript"><span class="key">Y</span><span class="lbl">Secur</span><span id="sec-badge" class="tab-badge hidden">0</span></button>
      <div class="rail-gap"></div>
      <button class="tab" type="button" id="help-button" title="What this viewer reads and what it will not do"><span class="key">?</span><span class="lbl">Help</span></button>
    </nav>

    <aside id="sidebar">
      <div class="sidebar-header">
        <input id="search" type="text" placeholder="Filter sessions…" autocomplete="off" />
        <div class="agent-chips" id="agent-chips"></div>
        <!-- Shown only when a case is being served: a directory of transcripts knows
             nothing about findings, and a chip that was always there and always empty
             would be worse than no chip. -->
        <div class="agent-chips hidden" id="session-filters"></div>
      </div>
      <div id="project-list" class="project-list"></div>
      <div class="sidebar-footer">
        <div class="footer-row">
          <button id="open-folder" class="folder-btn hidden" type="button" title="Load sessions from a local folder">Open folder…</button>
          <button id="open-unified" class="folder-btn" type="button" title="Load a unified agent log (one JSON record per line)" onclick="openUnifiedLog()">Unified log…</button>
        </div>
        <input id="unified-file" type="file" accept=".jsonl,.json,.log,.txt" class="hidden" onchange="onUnifiedFileChosen(event)" />
        <span id="root-label">scanning…</span>
      </div>
    </aside>

    <main id="main">
      <!-- The same four rows above every view: what this is, what is filtering it, what
           that filter is hiding, and what the view itself cannot tell you. -->
      <div id="view-head" class="view-head hidden"></div>
      <div id="chip-bar" class="chip-bar hidden"></div>
      <div id="hide-note" class="hide-note hidden"></div>
      <div id="view-note" class="view-note hidden"></div>

      <div class="view-body">
        <div id="sessions-panel" class="view-panel">
          <div id="transcript">
            <div class="empty-state"><div class="empty-mark"></div><p>Select a session to inspect.</p></div>
          </div>
        </div>
        <div id="tools-panel" class="view-panel hidden">
          <div id="tools-list" class="rows"></div>
          <div id="tools-foot" class="tfoot hidden"></div>
        </div>
        <div id="security-panel" class="view-panel hidden">
          <div id="sec-list" class="rows"></div>
        </div>
        <div id="case-panel" class="view-panel hidden">
          <div id="case-body" class="pad"></div>
        </div>
        <div id="timeline-panel" class="view-panel hidden">
          <div id="timeline-list" class="rows"></div>
          <div id="timeline-foot" class="tfoot hidden"></div>
        </div>
        <div id="findings-panel" class="view-panel hidden">
          <div id="findings-body" class="rows"></div>
        </div>
        <div id="instructions-panel" class="view-panel hidden">
          <div id="instructions-body" class="rows"></div>
        </div>
        <div id="corroboration-panel" class="view-panel hidden">
          <div id="corroboration-body" class="rows"></div>
        </div>
        <div id="artifacts-panel" class="view-panel hidden">
          <div id="artifacts-body" class="rows"></div>
        </div>
        <!-- The evidence column. Fixed, never a popover: the file, the place in it and the
             hash are what turn a row on a screen into something a report can cite, and a
             reader who has to open a dialogue for them stops asking for them. -->
        <aside id="evidence" class="evidence hidden"></aside>
      </div>
    </main>
  </div>
</div>

<!-- The in-session search, kept in the document rather than rebuilt with the header, so
     its listeners are bound once at boot and survive every re-render. The header moves
     this node into itself when a session is open. -->
<div id="search-bar" class="hidden">
  <div class="searchbox">
    <span class="ic">⌕</span>
    <input id="search-messages" type="text" placeholder="Search prompts &amp; answers…" autocomplete="off" />
    <input id="search-all" type="text" class="hidden" placeholder="Search everything — tool input, results, reasoning…" autocomplete="off" />
    <span id="search-count" class="search-count"></span>
  </div>
  <div class="seg">
    <button id="scope-text" class="segbtn" type="button" title="Search what a person typed and what the agent said">Text</button>
    <button id="scope-all" class="segbtn" type="button" title="Search tool calls, tool results and reasoning as well">All</button>
  </div>
  <div class="snav">
    <button id="search-prev" class="sbtn" type="button" title="Previous match (Shift+Enter)">↑</button>
    <button id="search-next" class="sbtn" type="button" title="Next match (Enter)">↓</button>
    <button id="search-clear" class="sbtn" type="button" title="Clear">✕</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-body"><button class="modal-close" type="button" title="Close">✕</button><pre class="modal-content"></pre></div>
</div>

<script>
'use strict';

const state = { projects: [], current: null, cache: {}, normCache: {}, view: 'sessions', allTools: [], findings: [], toolFilter: 'all',
  // Set only when this page is served by `afx serve` and there is a case behind it.
  // Null in the two standalone modes, which is what the case tabs key off.
  caseApi: null, caseFindings: null, caseArtifacts: null, caseInstructions: null,
  timeline: null, timelineAgent: 'all', timelineNoFs: false, artifactFilter: 'all',
  insScope: 'all',
  // The time window, as typed. Kept as text rather than as parsed bounds so that an
  // input the viewer could not read stays on screen next to its complaint instead of
  // being replaced by a silent empty window.
  since: '', until: '', sessionFilter: 'all',
  // Whether the two cross-session views show the whole log or only the open session.
  // One setting for both, so switching tabs does not change what is being looked at.
  scope: 'all',
  toolQuery: '', toolErrOnly: false, secSev: 'all', secRule: 'all', turnFilter: 'all',

  // ---- what the redesign added ----

  // Which agent the sidebar is narrowed to, and which row each view has selected. The
  // selection is what the evidence column on the right is describing, so it is per view:
  // switching tabs and coming back must not silently change what that column is about.
  agentFilter: 'all', picked: {},
  // The time window's own controls. `winPreset` is only a label for what was clicked —
  // the bounds in `since`/`until` are the truth, so typing over a preset simply stops it
  // being the active one rather than putting the two out of step.
  winOpen: false, winPreset: 'all',
  // UTC, or the endpoint's own zone as the collection recorded it. A case stores UTC; an
  // analyst asking "what happened that evening" means the wall clock the user saw, and
  // the two are a different set of rows.
  winZone: 'utc',
  // The three decisions that change what a window means. Keeping undated events is the
  // default because their position is unknown rather than outside: see inWindow().
  winKeepUndated: true, winWithFs: false, winEverywhere: true, winOfficeHours: false,
  // The case-wide tool view, paged from the server. Null until the tab is first opened.
  tools: null, toolAgent: 'all',
  // The chips the redesigned views own: which severities and packs the findings view
  // is narrowed to, whether the timeline is showing only the rows a rule fired on, and
  // whether the agent chips are expanded past the handful that fit.
  findSev: 'all', findPack: 'all', timelineFindingsOnly: false, showAllAgents: false,
  // Whether the secret scan shows a match or masks its middle. Masked by default: this
  // view gets screenshotted into reports, and a live credential in a report is a second
  // incident. Triage marks live here and nowhere else — the case is opened read-only and
  // nothing in this viewer writes to it.
  secReveal: false, secTriage: {} };

// ---------- DOM helpers ----------
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// ============================================================================
// Data layer — pluggable source behind a stable path scheme:
//   'projects/'  'projects/<dir>/'  'projects/<dir>/<file>.jsonl'
// Two sources implement it:
//   * httpSource   scrapes python http.server directory listings (run locally)
//   * folderSource reads a folder the user picks via the File System Access API
//                  (lets this file be hosted on the web instead of served locally)
// Everything downstream only ever touches these opaque path strings, so the
// session list, cache, and aggregation work identically for either source.
//
// A third input takes no source at all: a unified agent log is one file, so its
// records are parsed once and put straight into the fetch cache under a synthetic
// path. See loadUnifiedLog(). That is what lets a single file behave like a
// directory of sessions without a second code path downstream.
// ============================================================================

// Scrape the HTML index python's http.server emits for a directory.
const httpSource = {
  kind: 'http',
  async listDir(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error('cannot list ' + path + ' (' + res.status + ')');
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const out = [];
    for (const a of doc.querySelectorAll('a[href]')) {
      let href = a.getAttribute('href');
      if (!href || href.startsWith('?') || href.startsWith('/') || href.startsWith('..')) continue;
      const isDir = href.endsWith('/');
      let name = decodeURIComponent(href.replace(/\/$/, ''));
      if (!name || name === '.') continue;
      out.push({ name, isDir });
    }
    return out;
  },
  async readText(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error('cannot fetch ' + path);
    return res.text();
  },
};

// Read from a user-picked directory handle. `projectsHandle` is the folder that
// directly contains the per-project subdirectories (i.e. the `projects/` dir).
function makeFolderSource(rootHandle) {
  const fileHandles = new Map(); // path -> FileSystemFileHandle, filled in as we list
  // Resolve a path (e.g. 'projects/<dir>/' or 'sessions/…') to a directory
  // handle, walking every segment from the picked root folder.
  async function resolveDir(path) {
    const parts = path.replace(/\/$/, '').split('/').filter(Boolean).map(decodeURIComponent);
    let h = rootHandle;
    for (let i = 0; i < parts.length; i++) h = await h.getDirectoryHandle(parts[i]);
    return h;
  }
  return {
    kind: 'folder',
    async listDir(path) {
      const dir = await resolveDir(path);
      const base = path.endsWith('/') ? path : path + '/';
      const out = [];
      for await (const entry of dir.values()) {
        const isDir = entry.kind === 'directory';
        if (!isDir) fileHandles.set(base + encodeURIComponent(entry.name), entry);
        out.push({ name: entry.name, isDir });
      }
      return out;
    },
    async readText(path) {
      let handle = fileHandles.get(path);
      if (!handle) {
        const parts = path.split('/');
        const fname = decodeURIComponent(parts.pop());
        const dir = await resolveDir(parts.join('/') + '/');
        handle = await dir.getFileHandle(fname);
      }
      const file = await handle.getFile();
      return file.text();
    },
  };
}

// ============================================================================
// The case API: the third source, for a page served by `afx serve`.
//
// It fetches a case's events in the unified format, so everything downstream is the code
// path a unified log file already takes: fetchEvents() splits the lines, normalizeUnified()
// maps them, and the renderer never learns that this session came out of SQLite. A second
// event shape for the case would be a third thing that could disagree with the other two.
//
// Paged, because ADR 0006 chose the standard library for the server and a session
// projection is assembled in memory there. The next offset arrives in a header rather than
// in an envelope around the records, which is what keeps the body a unified log an analyst
// can save straight to a file.
// ============================================================================
const CASE_API_VERSION = 1;
// A ceiling on pages followed for one session, so that a server answering with an offset
// that never ends cannot spin here forever.
const CASE_PAGE_GUARD = 5000;

const apiSource = {
  kind: 'api',
  async listDir(path) {
    // There is no directory to list: the session list comes from api/projects. A throw
    // rather than an empty array, because an empty listing reads as "nothing was there",
    // which is the one thing this tool must never say by accident.
    throw new Error('the case API has no directory listing (' + path + ')');
  },
  async readText(path) {
    let offset = 0, out = '';
    for (let page = 0; page < CASE_PAGE_GUARD; page++) {
      const url = path + (path.indexOf('?') >= 0 ? '&' : '?') + 'offset=' + offset;
      const res = await fetch(url, { headers: { Accept: 'application/x-ndjson' } });
      if (!res.ok) throw new Error('cannot read ' + path + ' (' + res.status + ')');
      let body = await res.text();
      // Two pages must never share a line: a record split across the seam would come back
      // as an unparseable line, which is a record the analyst would have to explain.
      if (body && !body.endsWith('\n')) body += '\n';
      out += body;
      const next = res.headers.get('X-Afx-Next-Offset');
      if (!next) return out;
      const parsed = Number(next);
      // An offset that does not advance would re-fetch the same page forever. Stopping and
      // keeping what arrived is the lesser evil, and the count in the header says how much.
      if (!Number.isFinite(parsed) || parsed <= offset) return out;
      offset = parsed;
    }
    return out;
  },
};

// The active source. Defaults to the http.server scraper.
let dataSource = httpSource;

async function listDir(path) { return dataSource.listDir(path); }

// Parse a .jsonl log into raw records.
//
// A line we cannot parse is evidence, not noise: a truncated write, a partially
// overwritten record or a deliberately corrupted line all surface here. So the line is
// kept in full, never shortened, together with its 1-based number, and the renderer
// shows it as its own row. Truncating or dropping it would let a tampered transcript
// look clean, which is the one failure mode this tool must not have.
async function fetchEvents(path) {
  if (state.cache[path]) return state.cache[path];
  const text = await dataSource.readText(path);
  const events = [];
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    try {
      const rec = JSON.parse(t);
      // A well-formed line that is not an object (a bare number or string) is itself an
      // anomaly, so it gets its own visible kind rather than being coerced into one.
      if (rec && typeof rec === 'object' && !Array.isArray(rec)) {
        rec.__line = i + 1;
        events.push(rec);
      } else {
        events.push({ type: 'unstructured-record', raw: t, __line: i + 1 });
      }
    } catch (e) {
      events.push({ type: 'parse-error', raw: t, __line: i + 1, error: String((e && e.message) || e) });
    }
  }
  state.cache[path] = events;
  return events;
}

// Decode a Claude Code project directory name back into a working directory.
//
// Lossy on purpose-of-the-format, not by choice: the encoding replaces '/' with '-' and
// does not escape hyphens that were already there, so '~/src/my-project' comes back as
// '/Users/alice/src/my/project'. Treat the result as a label only. The authoritative
// working directory is the `cwd` field inside the records, which loadProjects() prefers
// as soon as a session has been read.
function decodeProjectName(dir){return dir.replace(/^-/,'/').replace(/-/g,'/');}

function stripEnvNoise(s){
  return String(s)
    .replace(/<environment>[\s\S]*?<\/environment>/g,'')
    .replace(/<system-reminder>[\s\S]*?<\/system-reminder>/g,'')
    .replace(/<command-message>[\s\S]*?<\/command-message>/g,'')
    .replace(/<command-name>[\s\S]*?<\/command-name>/g,'');
}
function deriveTitle(s){
  const lines = stripEnvNoise(s).split('\n')
    .map(l=>l.replace(/<\/?[a-zA-Z][\w-]*>/g,'').trim())
    .filter(l=>l.length>0);
  return (lines[0]||'').trim();
}

// Map a Claude Code `entrypoint` value to a client label and a colour.
//
// The colours are muted on purpose and there are only four of them. What they have to do
// is let two clients be told apart at a glance in a list; a saturated brand colour per
// vendor turns a transcript into a chart nobody asked for, and a forensic reader should be
// looking at the text.
//
// Chosen to hold their meaning on the light desk and on the dark one. They are written
// into inline styles for the dots, so they cannot be theme variables; earth tones at this
// saturation are legible on both without becoming decoration on either.
function clientInfo(entrypoint, promptSource){
  const map={
    'cli':            {label:'Claude Code · CLI',        color:'#c1622d'},
    'claude-desktop': {label:'Claude Code · Desktop',    color:'#c1622d'},
    'claude-web':     {label:'Claude Code · Web',        color:'#c1622d'},
    'vscode':         {label:'VS Code extension',        color:'#4a5fa8'},
    'cursor':         {label:'Cursor',                   color:'#4a5fa8'},
    'intellij':       {label:'JetBrains IDE',            color:'#7a5e93'},
    'jetbrains':      {label:'JetBrains IDE',            color:'#7a5e93'},
    'sdk-ts':         {label:'Agent SDK · TypeScript',   color:'#8a6a1f'},
    'sdk-py':         {label:'Agent SDK · Python',       color:'#8a6a1f'},
    'sdk-cli':        {label:'Agent SDK · CLI',          color:'#8a6a1f'},
    'github-actions': {label:'GitHub Actions',           color:'#3c7a63'},
    'github-copilot': {label:'GitHub Copilot',           color:'#3c7a63'},
    'codex-cli':      {label:'Codex CLI',                color:'#3c7a63'},
    'copilot-cli':    {label:'Copilot CLI',              color:'#4a5fa8'},
  };
  let info=entrypoint?map[entrypoint]:null;
  if(!info&&entrypoint) info={label:entrypoint,color:'#8d8880'};
  if(!info) info={label:'unknown',color:'#8d8880'};
  return info;
}

function summarize(events){
  let cwd=null,gitBranch=null,version=null,firstTs=null,lastTs=null;
  let userMsgs=0,toolCalls=0,promptSource=null,unparsed=0;
  // The real session title is stored as title events; fall back to the first
  // human prompt only when no title was ever set.
  let customTitle=null,aiTitle=null,promptTitle=null;
  const entryCounts={};
  for(const ev of events){
    // Counted and reported in the session header: an analyst has to be able to see that
    // a transcript did not read cleanly, before drawing any conclusion from it.
    if(ev.type==='parse-error'||ev.type==='unstructured-record'){unparsed++;continue;}
    if(ev.timestamp){if(!firstTs)firstTs=ev.timestamp;lastTs=ev.timestamp;}
    if(ev.entrypoint)entryCounts[ev.entrypoint]=(entryCounts[ev.entrypoint]||0)+1;
    if(ev.promptSource&&!promptSource)promptSource=ev.promptSource;
    if(ev.cwd&&!cwd)cwd=ev.cwd;
    if(ev.gitBranch&&!gitBranch)gitBranch=ev.gitBranch;
    if(ev.version&&!version)version=ev.version;
    if(ev.type==='custom-title'&&ev.customTitle&&!customTitle)customTitle=ev.customTitle;
    if(ev.type==='ai-title'&&(ev.aiTitle||ev.content)&&!aiTitle)aiTitle=ev.aiTitle||ev.content;
    if(ev.type==='user'&&ev.message){
      const c=ev.message.content;
      if(typeof c==='string'){userMsgs++;if(!promptTitle){const t=deriveTitle(c);if(t)promptTitle=t.slice(0,120);}}
      else if(Array.isArray(c)&&c.some(b=>b.type==='text'))userMsgs++;
    }
    if(ev.type==='assistant'&&ev.message&&Array.isArray(ev.message.content)){
      for(const b of ev.message.content)if(b.type==='tool_use')toolCalls++;
    }
  }
  const entrypoint=Object.keys(entryCounts).sort((a,b)=>entryCounts[b]-entryCounts[a])[0]||null;
  const title=customTitle||aiTitle||promptTitle||'(untitled session)';
  return {title,cwd,gitBranch,version,firstTs,lastTs,userMsgs,toolCalls,entrypoint,promptSource,unparsed};
}

// concurrency-limited background enrichment of sidebar titles/counts
async function pool(items, limit, worker){
  let i=0;
  const runners=Array.from({length:Math.min(limit,items.length)},async()=>{
    while(i<items.length){const idx=i++;await worker(items[idx]);}
  });
  await Promise.all(runners);
}

// ============================================================================
// Multi-agent normalization — convert Codex & Copilot logs into the same
// Claude-shaped event model so the renderer, tool aggregation and secret scan
// all work unchanged. A synthetic {type:'meta',...} event carries session
// metadata (entrypoint/cwd/gitBranch/version) that summarize() reads.
// ============================================================================
function normalizeEvents(raw, format){
  if(format==='codex') return normalizeCodex(raw);
  if(format==='copilot') return normalizeCopilot(raw);
  if(format==='unified') return normalizeUnified(raw);
  return raw; // claude, already in the target shape
}
function blocksToText(content){
  if(content==null) return '';
  if(typeof content==='string') return content;
  if(Array.isArray(content)) return content.map(c=>{
    if(typeof c==='string') return c;
    if(c && typeof c.text==='string') return c.text;
    return '';
  }).join('');
  return '';
}
function codexOutputText(output){
  if(output==null) return '';
  if(typeof output==='string') return output;
  if(typeof output.content==='string') return output.content;
  if(Array.isArray(output.content)) return blocksToText(output.content);
  return JSON.stringify(output,null,2);
}
// Codex CLI rollout: one {timestamp,type,payload} per line.
function normalizeCodex(raw){
  const out=[];
  const eventMsgCounts={};
  const meta={type:'meta',entrypoint:'codex-cli'};
  let turn=0, turnId='codex-turn-0', model=null;
  const newTurn=()=>{turn++;turnId='codex-turn-'+turn;};
  for(const line of raw){
    const type=line&&line.type; const p=(line&&line.payload)||{}; const ts=line&&line.timestamp;
    if(!meta.timestamp&&ts) meta.timestamp=ts;
    if(type==='session_meta'){
      if(p.cwd&&!meta.cwd) meta.cwd=p.cwd;
      if(p.cli_version&&!meta.version) meta.version=p.cli_version;
      if(p.git&&p.git.branch&&!meta.gitBranch) meta.gitBranch=p.git.branch;
      if(p.model_provider&&!model) model=p.model_provider;
      continue;
    }
    if(type==='turn_context'){
      if(p.cwd&&!meta.cwd) meta.cwd=p.cwd;
      if(p.model) model=p.model;
      continue;
    }
    if(type==='compacted'){
      // Context compaction rewrites the conversation and is the usual explanation for an
      // apparent gap in a transcript, so it must be visible rather than skipped.
      out.push({type:'system',timestamp:ts,content:'context compacted'+(p&&p.message?(': '+p.message):'')});
      continue;
    }
    if(type==='event_msg'){
      // event_msg mirrors response_item, so rendering both would duplicate every turn.
      // They are tallied by subtype and reported in one row at the end of the session, so
      // records that exist in the file are never silently absent from the view.
      const st=(p&&p.type)||'(no type)';
      eventMsgCounts[st]=(eventMsgCounts[st]||0)+1;
      continue;
    }
    if(type!=='response_item'){
      // An unrecognized record type is preserved as a row rather than dropped: the format
      // changes between releases, and a new type is exactly what an analyst needs to see.
      out.push({type:'unknown-record',timestamp:ts,recordType:type,raw:line});
      continue;
    }
    const it=p, itype=it.type;
    if(itype==='message'){
      const text=blocksToText(it.content);
      if(it.role==='user'){ newTurn(); out.push({type:'user',timestamp:ts,message:{content:text}}); }
      else out.push({type:'assistant',timestamp:ts,message:{id:turnId,role:'assistant',model,content:[{type:'text',text}]}});
    }else if(itype==='reasoning'){
      let text='';
      if(Array.isArray(it.summary)) text=it.summary.map(s=>s.text||'').join('\n');
      if(!text&&Array.isArray(it.content)) text=it.content.map(s=>s.text||'').join('\n');
      out.push({type:'assistant',timestamp:ts,message:{id:turnId,role:'assistant',model,content:[{type:'thinking',thinking:text}]}});
    }else if(itype==='function_call'||itype==='custom_tool_call'||itype==='local_shell_call'){
      let input;
      if(itype==='function_call'){ try{input=JSON.parse(it.arguments||'{}');}catch(e){input={arguments:it.arguments};} }
      else if(itype==='custom_tool_call'){ input=typeof it.input==='string'?{input:it.input}:(it.input||{}); }
      else { input=it.action||{command:it.command}||{}; }
      out.push({type:'assistant',timestamp:ts,message:{id:turnId,role:'assistant',model,content:[{type:'tool_use',id:it.call_id||it.id,name:it.name||itype,input}]}});
    }else if(itype==='function_call_output'||itype==='custom_tool_call_output'){
      const isErr=it.output&&typeof it.output==='object'&&it.output.success===false;
      out.push({type:'user',timestamp:ts,message:{content:[{type:'tool_result',tool_use_id:it.call_id,content:codexOutputText(it.output),is_error:!!isErr}]}});
    }else{
      out.push({type:'unknown-record',timestamp:ts,recordType:'response_item/'+String(itype),raw:line});
    }
  }
  const emKeys=Object.keys(eventMsgCounts).sort();
  if(emKeys.length){
    const emTotal=emKeys.reduce((n,k)=>n+eventMsgCounts[k],0);
    out.push({type:'system',content:emTotal+' event_msg record'+(emTotal===1?'':'s')+' not rendered (mirror response_item): '+emKeys.map(k=>k+' x'+eventMsgCounts[k]).join(', ')});
  }
  out.unshift(meta);
  return out;
}
function copilotResultText(result){
  if(result==null) return '';
  if(typeof result==='string') return result;
  if(typeof result.content==='string') return result.content;
  if(Array.isArray(result.content)) return result.content.map(c=>typeof c==='string'?c:(c&&c.text)||'').join('\n');
  if(typeof result.output==='string') return result.output;
  return JSON.stringify(result,null,2);
}
// GitHub Copilot CLI events.jsonl: {type,id,timestamp,data} envelope.
function normalizeCopilot(raw){
  const out=[];
  const meta={type:'meta',entrypoint:'copilot-cli'};
  let turn=0, turnId='copilot-turn-0', model=null;
  for(const ev of raw){
    const type=ev&&ev.type; const d=(ev&&ev.data)||{}; const ts=ev&&ev.timestamp;
    if(!meta.timestamp&&ts) meta.timestamp=ts;
    switch(type){
      case 'session.start': if(d.copilotVersion&&!meta.version) meta.version=d.copilotVersion; break;
      case 'session.model_change': if(d.newModel) model=d.newModel; break;
      case 'user.message': turn++; turnId='copilot-turn-'+turn; out.push({type:'user',timestamp:ts,message:{content:d.content||''}}); break;
      case 'assistant.message': if(d.model) model=d.model; out.push({type:'assistant',timestamp:ts,message:{id:turnId,role:'assistant',model,content:[{type:'text',text:d.content||''}]}}); break;
      case 'reasoning': out.push({type:'assistant',timestamp:ts,message:{id:turnId,role:'assistant',model,content:[{type:'thinking',thinking:d.content||''}]}}); break;
      case 'tool.execution_start':{
        let input=(d.arguments&&typeof d.arguments==='object')?d.arguments:(d.command?{command:d.command}:(d.arguments!=null?{arguments:d.arguments}:{}));
        let name=d.toolName||'tool';
        if(d.mcpServerName) name='mcp__'+d.mcpServerName+'__'+(d.mcpToolName||d.toolName||'');
        out.push({type:'assistant',timestamp:ts,message:{id:turnId,role:'assistant',model,content:[{type:'tool_use',id:d.toolCallId||('tc-'+out.length),name,input}]}});
        break;
      }
      case 'tool.execution_complete':
        if(d.model) model=d.model;
        out.push({type:'user',timestamp:ts,message:{content:[{type:'tool_result',tool_use_id:d.toolCallId,content:copilotResultText(d.result),is_error:d.success===false}]}});
        break;
      case 'subagent.started': out.push({type:'system',timestamp:ts,content:'subagent started: '+(d.agentDisplayName||d.agentName||'')}); break;
      case 'subagent.completed': out.push({type:'system',timestamp:ts,content:'subagent completed: '+(d.agentName||'')}); break;
      case 'subagent.failed': out.push({type:'system',timestamp:ts,content:'subagent failed: '+(d.agentName||'')+(d.error?(' — '+d.error):'')}); break;
      case 'session.task_complete': out.push({type:'system',timestamp:ts,content:'task complete'+(d.summary?(': '+d.summary):'')}); break;
      // Same reasoning as in normalizeCodex: an event type this parser does not know is
      // kept as a visible row instead of being swallowed by the default branch.
      default: out.push({type:'unknown-record',timestamp:ts,recordType:String(type),raw:ev}); break;
    }
  }
  out.unshift(meta);
  return out;
}

// ============================================================================
// The unified agent log — one vendor-neutral record per line, produced either by
// `afx normalize` or by the Velociraptor artifact that parses on the endpoint.
// See docs/UNIFIED_FORMAT.md.
//
// This is the one source that does not correspond to a directory on disk: it is a
// single file that can hold many agents, many users and many hosts at once, which is
// what a fleet collection comes back as. So the records are grouped into synthetic
// projects and sessions here, and everything downstream (the renderer, the tool
// aggregation, the secret scan) sees the same shape it sees for a folder.
// ============================================================================

// Records that are a second view of a record already shown. The analyzer emits a tool
// call and, for a tool that touched something, a second event carrying the effect, both
// from the same line. Rendering both would show every file read twice. They are matched
// by locator rather than by content, because the locator is what says they came from one
// record; an effect from a producer that did not also emit the call is kept.
function unifiedDerived(records){
  const calls=new Set();
  for(const r of records){
    const k=unifiedKind(r);
    if(k==='tool.call'||k==='mcp.call') calls.add(unifiedBaseLocator(r));
  }
  return calls;
}
function unifiedKind(r){ return r&&typeof r.kind==='string'?r.kind:''; }
function unifiedBaseLocator(r){
  const p=(r&&r.provenance)||{};
  return String(p.original_path||'')+'|'+String(p.locator||'').split('#')[0];
}
function unifiedText(r){
  const pl=(r&&r.payload)||{};
  if(typeof pl.text==='string') return pl.text;
  if(pl.text!=null) return JSON.stringify(pl.text);
  return '';
}
// Turn one unified record into the viewer's own event shape, or null to leave it out.
// Nothing is left out because it was uninteresting: only a record that is a duplicate
// view of another, and the synthetic meta row.
function unifiedEvent(r, derived, model){
  const ts=r.ts_utc||undefined;
  const pl=r.payload||{};
  const kind=unifiedKind(r);
  const sys=(text)=>({type:'system',timestamp:ts,content:text});
  switch(kind){
    case 'user.prompt':
      return {type:'user',timestamp:ts,message:{content:unifiedText(r)}};
    case 'prompt.history':
      // From a history file rather than a transcript. Marked as such, because a prompt
      // with no matching session is one of the more interesting things a collection can
      // hold and must not read as an ordinary turn.
      return sys('prompt history: '+unifiedText(r));
    case 'assistant.text':
      return {type:'assistant',timestamp:ts,
              message:{id:pl.message_id||undefined,role:'assistant',model,
                       content:[{type:'text',text:unifiedText(r)}]}};
    case 'assistant.thinking':
      return {type:'assistant',timestamp:ts,
              message:{role:'assistant',model,content:[{type:'thinking',thinking:unifiedText(r)}]}};
    case 'tool.call':
    case 'mcp.call':
      return {type:'assistant',timestamp:ts,
              message:{role:'assistant',model,content:[{type:'tool_use',
                id:pl.tool_use_id||unifiedBaseLocator(r),
                name:pl.tool||(kind==='mcp.call'?'mcp':'tool'),
                input:pl.input!=null?pl.input:{}}]}};
    case 'tool.result':
      return {type:'user',timestamp:ts,message:{content:[{type:'tool_result',
                tool_use_id:pl.tool_use_id||unifiedBaseLocator(r),
                content:pl.output!=null?pl.output:unifiedText(r),
                is_error:pl.is_error===true}]}};
    case 'safety.refusal':
      // Its own visible row. The question "was anything refused" has to be answerable
      // from the transcript without reading every assistant turn.
      return {type:'system',timestamp:ts,
              content:'⛔ the model refused'+(pl.refusal&&pl.refusal!=='refusal'?' ('+pl.refusal+')':'')
                      +(unifiedText(r)?': '+unifiedText(r):'')};
    case 'permission.change':{
      const p=(pl.permissions||[])[0]||{};
      return sys('permission mode changed'+(p.previous?' from '+p.previous:'')
                 +(p.mode?' to '+p.mode:'')+(p.scope?' ('+p.scope+')':''));
    }
    case 'permission.decision':{
      const p=(pl.permissions||[])[0]||{};
      return sys('permission '+(p.decision||'decision')+(p.subject?' for '+p.subject:'')
                 +(p.mode?' in mode '+p.mode:''));
    }
    case 'command.exec':{
      if(derived.has(unifiedBaseLocator(r))) return null;
      const c=(pl.commands||[])[0]||{};
      return sys('command: '+(c.command||''));
    }
    case 'file.read': case 'file.write': case 'file.snapshot':{
      if(derived.has(unifiedBaseLocator(r))) return null;
      const f=(pl.files||[])[0]||{};
      return sys(kind.replace('file.','file ')+': '+(f.path||''));
    }
    case 'network.request':{
      if(derived.has(unifiedBaseLocator(r))) return null;
      const n=(pl.network||[])[0]||{};
      return sys('network: '+(n.method?n.method+' ':'')+(n.url||n.host||''));
    }
    case 'memory.write': case 'plan.write':
      return sys(kind.replace('.',' ')+(unifiedText(r)?': '+unifiedText(r):''));
    case 'session.start':
      return sys('session start'+(r.client?' · '+r.client:''));
    case 'session.end':
      return sys(pl.compaction?'session compacted':'session end'
                 +(unifiedText(r)?': '+unifiedText(r):''));
    case 'config.snapshot':
      return sys('config: '+(unifiedText(r)||JSON.stringify(pl)));
    case 'instruction.source':{
      // What the agent was told to obey, as it stood on disk. Its own row rather than
      // folded into config: a poisoned instruction file and a changed setting are
      // different findings, and only one of them is read by the model as an order.
      const i=(pl.instructions||[])[0]||{};
      return sys('instruction'+(i.scope?' ('+i.scope+')':'')+': '+(i.path||unifiedText(r)));
    }
    case 'artifact.fs':
      // A file, not a turn. Grouped into its own project rather than dropped, because the
      // difference between an agent that left nothing and a store nobody has read is the
      // difference between two opposite conclusions.
      return sys('file on disk: '+((pl.files||[])[0]||{}).path+(pl.mtime_utc?' (modified '+pl.mtime_utc+')':''));
    case 'unparsed.record':
      // The whole point of the format's honesty rule, carried into the view: a record
      // nothing could read is a visible row with its original text one click away.
      return {type:'unknown-record',timestamp:ts,
              recordType:(r.parse_problem||'unreadable'),raw:r.raw!=null?r.raw:r};
    default:
      // A kind from a newer producer. Kept visible for the same reason.
      return {type:'unknown-record',timestamp:ts,recordType:'kind '+kind,raw:r};
  }
}
// One session's records, in the viewer's event shape, with a meta row in front.
function normalizeUnified(records){
  const derived=unifiedDerived(records);
  const meta={type:'meta'};
  const agents={};
  let model=null;
  const out=[];
  for(const r of records){
    if(!meta.timestamp&&r.ts_utc) meta.timestamp=r.ts_utc;
    if(r.agent) agents[r.agent]=(agents[r.agent]||0)+1;
    if(r.client&&!meta.entrypoint) meta.entrypoint=r.client;
    if(r.project_path&&!meta.cwd) meta.cwd=r.project_path;
    if(r.git_branch&&!meta.gitBranch) meta.gitBranch=r.git_branch;
    const pl=r.payload||{};
    if(pl.version&&!meta.version) meta.version=String(pl.version);
    // The model is announced once and applies to what follows, so it is carried forward
    // rather than looked up per turn.
    const m=(pl.models||[])[0];
    if(m&&m.model) model=m.model;
    const ev=unifiedEvent(r,derived,model);
    if(ev){
      // The record this row was made from, carried alongside it. Not merged into the row:
      // the renderer works on the viewer's own event shape, and this is the unified
      // record's identity and provenance, which is what the evidence column on the right
      // prints and what a report cites. Without it a row on screen cannot be traced back
      // to a file, a place in that file and a hash, which is the difference between an
      // observation and evidence.
      ev.__ev={
        event_id:r.event_id||null,
        kind:unifiedKind(r),
        ts_utc:r.ts_utc||null,
        agent:r.agent||null,
        session_id:r.session_id||null,
        project_path:r.project_path||null,
        parse_problem:r.parse_problem||null,
        provenance:r.provenance||null,
      };
      out.push(ev);
    }
  }
  // Which agent wrote this session, by weight. A unified log can hold several, and the
  // header has to name the one whose records these are rather than "Assistant".
  meta.unifiedAgent=Object.keys(agents).sort((a,b)=>agents[b]-agents[a])[0]||null;
  out.unshift(meta);
  return out;
}

// Fetch + normalize a session (cached by path).
async function loadSession(session){
  if(state.normCache[session.path]) return state.normCache[session.path];
  const raw=await fetchEvents(session.path);
  const events=normalizeEvents(raw, session.format);
  state.normCache[session.path]=events;
  return events;
}
const AGENT_LABELS={claude:'Claude',claude_code:'Claude',codex:'Codex',copilot:'Copilot'};
const AGENT_COLORS={claude:'#c1622d',claude_code:'#c1622d',codex:'#3c7a63',copilot:'#4a5fa8'};
// A unified log can hold several agents, so the name comes from the records where
// there are records to read it from, and from the format otherwise. An agent nobody
// has a colour for keeps its own name rather than becoming 'Assistant', because the
// name is the only thing on screen that says which tool left this behind.
function assistantNameFor(format,agent){
  if(agent) return AGENT_LABELS[agent]||agent;
  return AGENT_LABELS[format]||'Assistant';
}
function agentColorFor(format,agent){
  return AGENT_COLORS[agent]||AGENT_COLORS[format]||'#8d8880';
}

// The File System Access API only exists in a secure context served over
// http(s) (or localhost) — never from a file:// page. We use that as the
// "is this hosted?" gate for offering the folder picker.
const canPickFolder = typeof window.showDirectoryPicker === 'function';

// Wipe everything tied to the previous source before loading a new one.
function resetData(){
  state.projects=[]; state.cache={}; state.normCache={}; state.allTools=[]; state.findings=[]; state.current=null;
  // The case-backed state as well, and the tabs that read it. Switching from a served case
  // to a file the user picked would otherwise leave four tabs pointing at a case that is no
  // longer the one on screen.
  state.caseApi=null; state.caseFindings=null; state.caseArtifacts=null;
  state.caseInstructions=null; state.caseCorroboration=null; state.timeline=null;
  state.tools=null; state.corrScope=undefined;
  const caseTabs=document.getElementById('case-tabs');
  if(caseTabs) caseTabs.classList.add('hidden');
  document.getElementById('transcript').innerHTML=
