    '<div class="empty-state"><div class="empty-mark"></div><p>Select a session to inspect.</p></div>';
  // Every filter goes back to showing everything. A filter carried over from the previous
  // source would be hiding rows of evidence nobody has looked at yet, and a time window
  // left over from another case is the worst of them: it hides by a rule nobody set here.
  state.scope='all'; state.toolFilter='all'; state.toolQuery=''; state.toolErrOnly=false;
  state.secSev='all'; state.secRule='all'; state.turnFilter='all';
  state.agentFilter='all'; state.sessionFilter='all'; state.artifactFilter='all';
  state.insScope='all'; state.toolAgent='all'; state.timelineAgent='all';
  state.since=''; state.until=''; state.winPreset='all'; state.winOpen=false;
  state.winZone='utc'; state.winKeepUndated=true; state.winWithFs=false;
  state.winEverywhere=true; state.winOfficeHours=false;
  state.picked={}; state.secTriage={}; state.secReveal=false;
  state.findSev='all'; state.findPack='all'; state.timelineFindingsOnly=false;
  state.showAllAgents=false;
  setCaseBar(null);
  renderSidebar();
  if(typeof updateSecBadge==='function') updateSecBadge();
  if(typeof updateFindBadge==='function') updateFindBadge();
  if(['case','timeline','findings','instructions','corroboration','artifacts'].indexOf(state.view)>=0) switchView('sessions');
  else if(state.view==='tools') renderToolsPanel();
  else if(state.view==='security') renderSecurityPanel();
}

// Let the user pick a local folder and load sessions from it.
async function openLocalFolder(){
  if(!canPickFolder) return;
  let handle;
  try{ handle=await window.showDirectoryPicker({mode:'read'}); }
  catch(e){ return; } // user dismissed the picker
  // Use the picked folder as the root. Discovery then probes it for Claude
  // (projects/), Codex (sessions/) and Copilot (session-state/) layouts,
  // including under .claude/.codex/.copilot subfolders.
  dataSource=makeFolderSource(handle);
  state.sourceLabel=handle.name;
  resetData();
  document.getElementById('root-label').textContent='reading '+handle.name+'…';
  await loadProjects();
}


// ============================================================================
// Loading a unified agent log. One file, no server, and it works from a file://
// page, which matters: an analyst who has a log from a fleet collection can open
// this page and that log with nothing installed.
// ============================================================================

// Group a log's records into the projects and sessions the sidebar shows.
//
// Grouped by agent, working directory and session, in that order, because a unified log
// can hold several agents, several users and several hosts at once, which is what comes
// back from a fleet hunt. Records with no session of their own are not dropped: they go
// into a group of their own so that a prompt from a history file, or a file nobody parsed,
// is visible rather than absent.
function groupUnified(records){
  const groups={};
  for(const r of records){
    const agent=r.agent||'unknown agent';
    const host=r.host?' · '+r.host:'';
    const user=r.user?' · '+r.user:'';
    let projectKey, projectName, sessionId;
    if(unifiedKind(r)==='artifact.fs'){
      // Files rather than turns. Their own group, named for what it is, so nobody reads
      // "no sessions" as "no evidence".
      projectKey='files:'+agent+host+user;
      projectName=agent+': files on disk'+host+user;
      sessionId='files';
    } else {
      const cwd=r.project_path||'(no working directory recorded)';
      projectKey='u:'+agent+'|'+cwd+host+user;
      projectName=agent+' · '+cwd+host+user;
      sessionId=r.session_id||'(no session id)';
    }
    const g=groups[projectKey]||(groups[projectKey]={name:projectName,sessions:{}});
    (g.sessions[sessionId]||(g.sessions[sessionId]=[])).push(r);
  }
  return groups;
}

// Read a unified log and make it the active data. The records are put straight into the
// fetch cache under a synthetic path, so nothing downstream needs to know this source is
// a single file: loadSession() finds them there and never asks the data source.
function loadUnifiedLog(text, label){
  const records=[]; const broken=[];
  const lines=String(text).split('\n');
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line) continue;
    try{
      const rec=JSON.parse(line);
      if(rec&&typeof rec==='object'&&!Array.isArray(rec)) records.push(rec);
      // A well-formed line that is not an object is itself an anomaly, and a line that
      // does not parse at all could be a truncated write or a tampered log. Both are kept
      // and shown, never counted and discarded.
      else broken.push({type:'unstructured-record',raw:line,__line:i+1});
    }catch(e){
      broken.push({type:'parse-error',raw:line,__line:i+1,error:String((e&&e.message)||e)});
    }
  }

  resetData();
  state.sourceLabel=label;
  const groups=groupUnified(records);
  const projects=[];
  let index=0;
  for(const key of Object.keys(groups).sort()){
    const group=groups[key];
    const pid='unified:'+(index++);
    const sessions=[];
    for(const sid of Object.keys(group.sessions).sort()){
      const path='unified/'+encodeURIComponent(pid)+'/'+encodeURIComponent(sid)+'.jsonl';
      // Straight into the cache fetchEvents() reads, which is what lets a single file
      // behave like a directory of sessions without a second code path.
      state.cache[path]=group.sessions[sid];
      sessions.push(mkSession(sid,path,'unified'));
    }
    projects.push({id:pid,name:group.name,source:'unified',sessions});
  }

  if(broken.length){
    // Lines of the log itself that could not be read. Their own session, because a log
    // that is partly unreadable is a different piece of evidence from one that is not,
    // and a reader must not have to take our word for which it was.
    const path='unified/unreadable/lines.jsonl';
    state.cache[path]=broken;
    projects.push({id:'unified:unreadable',name:'lines of this log that did not parse',
                   source:'unified',
                   sessions:[mkSession('unreadable-lines',path,'claude')]});
  }

  state.projects=projects;
  const total=projects.reduce((n,p)=>n+p.sessions.length,0);
  document.getElementById('root-label').textContent=
    label+' · '+records.length+' record'+(records.length===1?'':'s')
    +(broken.length?' · '+broken.length+' unreadable line'+(broken.length===1?'':'s'):'')
    +' · '+projects.length+' groups · '+total+' sessions';
  renderSidebar();

  if(!projects.length){
    document.getElementById('transcript').innerHTML=
      '<div class="empty-state"><div class="empty-mark"></div>'
      +'<p>That file held no unified records.</p>'
      +'<p style="max-width:440px;text-align:center">A unified log has one JSON object per '
      +'line, each with <code>v</code>, <code>agent</code> and <code>kind</code>. '
      +'Produce one with <code>afx normalize &lt;source&gt;</code> or with the '
      +'<code>Custom.Forensics.AIAgents.UnifiedLog</code> Velociraptor artifact.</p></div>';
  }
  // Fill in the sidebar titles and counts the same way the directory sources do.
  enrichSessions();
}

// Let the user pick a unified log. A plain file input rather than the File System Access

function openUnifiedLog(){

async function onUnifiedFileChosen(event){
  const file=event.target.files&&event.target.files[0];

// ============================================================================
// Opening a case served by `afx serve`.
//
// The three case views (timeline, findings, artifacts) exist only here, because they are
// questions about a case rather than about a transcript: what happened on this device in
// order, what the rule packs found, and what was collected and never read. The viewer's
// standalone modes are untouched.
// ============================================================================

// Ask this page's own origin whether there is a case behind it.
//
// A probe rather than a marker injected into this file, because the copy `afx serve` sends
// has to stay byte for byte the copy an analyst opens from disk: its hash is printed on the
// console so they can state which viewer they read the case with. From a file:// page there
// is no origin to ask, so nothing is attempted at all.
async function probeCaseApi(){
  if(location.protocol!=='http:'&&location.protocol!=='https:') return null;
  let data;
  try{
    const res=await fetch('api/case',{headers:{Accept:'application/json'}});
    if(!res.ok) return null;
    data=await res.json();
  }catch(e){ return null; }
  // A 200 with the wrong JSON is not a case. The marker field is what tells an `afx serve`
  // apart from any other thing that happens to answer on this port.
  if(!data||typeof data.afx_api!=='number') return null;
  return data;
}

function tailPath(p){ const parts=String(p||'').split(/[\\/]/); return parts[parts.length-1]||String(p||''); }

async function loadCase(summary){
  dataSource=apiSource;
  resetData();
  state.caseApi=summary;
  document.getElementById('case-tabs').classList.remove('hidden');
  const rootLabel=document.getElementById('root-label');
  const transcript=document.getElementById('transcript');

  if(summary.afx_api!==CASE_API_VERSION){
    // A server newer or older than this file. Said out loud rather than worked around:
    // rendering whichever fields happen to be recognised would put a partly read case in
    // front of an analyst, and that is indistinguishable from a case holding less than it
    // does.
    rootLabel.textContent='case API version '+summary.afx_api;
    transcript.innerHTML='<div class="empty-state"><div class="empty-mark"></div>'
      +'<p>This case is served by a different version of the API.</p>'
      +'<p style="max-width:460px;text-align:center">The server speaks version '
      +esc(String(summary.afx_api))+' and this viewer reads version '+CASE_API_VERSION
      +'. Nothing is shown rather than a part of the case, because a case that renders '
      +'incompletely cannot be told apart from a case that holds less. Use the viewer '
      +'shipped with the same build as <code>afx serve</code>.</p></div>';
    renderCasePanel();
    return;
  }

  let projects=[];
  try{
    const res=await fetch('api/projects',{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    projects=(await res.json()).projects||[];
  }catch(e){
    rootLabel.textContent='case unreachable';
    transcript.innerHTML='<div class="empty-state"><div class="empty-mark"></div>'
      +'<p>The case API stopped answering.</p><p style="max-width:440px;text-align:center">'
      +esc(String((e&&e.message)||e))+'. The session list could not be read, so nothing is '
      +'shown. Check whether <code>afx serve</code> is still running.</p></div>';
    return;
  }

  state.projects=projects.map(p=>({
    id:p.id, name:p.name, source:'case',
    sessions:(p.sessions||[]).map(s=>{
      const label=s.files?'files on disk':(s.session_id||'(no session id)');
      const session=mkSession(label,s.path,'unified');
      // The group this session was derived from, kept so that a finding or a timeline row
      // can be traced back to the session it belongs in.
      session.caseSession=s;
      return session;
    }),
  }));

  const counts=summary.counts||{};
  const total=state.projects.reduce((n,p)=>n+p.sessions.length,0);
  rootLabel.textContent=tailPath((summary.case||{}).path)+' · '+(counts.events||0)
    +' events · '+state.projects.length+' groups · '+total+' sessions';
  setCaseBar(summary);
  renderSidebar();
  renderCasePanel();

  if(!total){
    // An empty case is a real answer, and the difference between "no events" and "nothing
    // was collected" is the difference between two opposite conclusions. So it points at
    // the view that can tell them apart rather than showing an empty screen.
    transcript.innerHTML='<div class="empty-state"><div class="empty-mark"></div>'
      +'<p>This case holds no events.</p><p style="max-width:460px;text-align:center">'
      +(counts.artifacts||0)+' file(s) are recorded in it and '+(counts.artifacts_unparsed||0)
      +' collected file(s) had no parser. Open the <b>Artifacts</b> tab: a case with no '
      +'events because nothing was collected and a case with no events because the agent '
      +'was never used are opposite findings.</p></div>';
  }

  // Fetched now rather than when the tab is first opened, so the badge is honest from the
  // start: an analyst should not have to visit a tab to learn that there is something in it.
  loadCaseFindings();
  // The instruction surface, for the same reason and one more. The evidence column beside a
  // transcript names the instruction files that were on the endpoint for that agent and
  // working copy, and a column that only filled in after somebody happened to open another
  // tab would be a column that reads as "no instructions" on a case that has them.
  loadCaseInstructions();
  await enrichSessions();
}

async function loadCaseFindings(){
  try{
    const res=await fetch('api/findings',{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.caseFindings=await res.json();
  }catch(e){
    state.caseFindings={error:String((e&&e.message)||e),findings:[],scan_runs:[],scanned:false};
  }
  updateFindBadge();
  // The sidebar again, because its findings chip cannot be counted until this arrived. The
  // first render happens before the fetch so the session list is not held up by it.
  renderSidebar();
  if(state.view==='findings') renderFindingsPanel();
}

async function loadCaseInstructions(){
  if(state.caseInstructions) return state.caseInstructions;
  try{
    const res=await fetch('api/instructions',{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    state.caseInstructions=await res.json();
  }catch(e){
    state.caseInstructions={error:String((e&&e.message)||e),instructions:[],counts:{},note:''};
  }
  // The open transcript again, because its evidence column could not name an instruction
  // file until this arrived.
  if(state.view==='sessions'&&state.current) renderSessionsView();
  if(state.view==='instructions') drawInstructions();
  return state.caseInstructions;
}

function updateFindBadge(){
  const data=state.caseFindings;
  const n=data&&data.findings?data.findings.length:0;
  const node=document.getElementById('find-badge');
  if(!node) return;
  node.textContent=String(n);
  node.classList.toggle('hidden',!n);
}

// Open the session one event belongs to.
//
// The event's own group is asked for rather than guessed: the case says which agent, host,
// user, working directory and session id it came from, and the session list was derived
// from the same six values. An event whose group is not in the list is shown as itself
// rather than dropped, because a record an analyst clicked on and got nothing for is a
// record they will assume was not there.
async function openCaseEvent(eventId){
  let record;
  try{
    const res=await fetch('api/events/'+encodeURIComponent(eventId),{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    record=await res.json();
  }catch(e){
    showModal('This event could not be read from the case: '+String((e&&e.message)||e));
    return;
  }
  const found=findCaseSession(record);
  if(!found){
    showModal(JSON.stringify(record,null,2));
    return;
  }
  switchView('sessions');
  await openSession(found.p,found.s);
}

function findCaseSession(record){
  const files=record.kind==='artifact.fs';
  const same=(a,b)=>(a==null?null:a)===(b==null?null:b);
  for(const p of state.projects) for(const s of p.sessions){
    const group=s.caseSession;
    if(!group||!!group.files!==files) continue;
    if(!same(group.agent,record.agent)) continue;
    if(!same(group.host,record.host)) continue;
    if(!same(group.user,record.user)) continue;
    if(files) return {p,s};
    if(!same(group.project_path,record.project_path)) continue;
    if(!same(group.session_id,record.session_id)) continue;
    return {p,s};
  }
  return null;
}

// ============================================================================
// The chrome every view is built from.
//
// One head, one chip row, one line saying what a filter is hiding, one note saying what
// the view itself cannot tell you, one dense table, one evidence column. Every view in
// here is assembled from exactly those pieces, which is the whole point: an analyst moving
// between nine views should be reading the evidence, not relearning where the counts are.
//
// The evidence column is the part that is not decoration. A row on a screen is an
// observation; a row with the file it came from, the place inside that file and the hash
// of those bytes is evidence. Putting that behind a click means it stops being asked for,
// so it is a fixed column that is always filled for whatever row is selected.
// ============================================================================

// A count, grouped so an eye can size it without counting digits. Thin spaces rather than
// commas or dots, because this tool is read in several locales and both separators mean
// the other thing to half of them.
function fmtInt(n){
  if(n===null||n===undefined||n==='') return '—';
  const num=Number(n);
  if(!Number.isFinite(num)) return String(n);
  return String(Math.trunc(num)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u2009');
}
function fmtBytes(n){
  if(n===null||n===undefined||n==='') return '—';
  const num=Number(n);
  if(!Number.isFinite(num)) return String(n);
  if(num<1000) return num+' B';
  if(num<1000000) return (num/1000).toFixed(num<10000?1:0)+' kB';
  if(num<1000000000) return (num/1000000).toFixed(num<10000000?1:0)+' MB';
  return (num/1000000000).toFixed(1)+' GB';
}
// A timestamp as the case spells it, without the microseconds and the Z. The case stores
// UTC, the column header says UTC, and repeating it on every row is six characters of
// noise on a screen that is short of them.
function fmtStamp(ts){
  if(!ts) return null;
  return String(ts).replace('T',' ').replace(/\.\d+Z?$/,'').replace(/Z$/,'');
}
function fmtShort(ts){
  const full=fmtStamp(ts);
  return full?full.slice(5,16):null;
}
function shortId(id,n){
  if(!id) return null;
  const s=String(id);
  return s.length>(n||8)?s.slice(0,n||8):s;
}

function mono(text,cls){
  return el('span',{class:'m'+(cls?' '+cls:''),text:(text===null||text===undefined||text==='')?'—':String(text)});
}
function quiet(text){
  return el('span',{class:'m q',text:(text===null||text===undefined||text==='')?'—':String(text)});
}
function pill(text,cls){
  return el('span',{class:'pill'+(cls?' '+cls:''),text:String(text)});
}

// ---------- the case bar ----------
//
// Filled from the case summary, and blanked when there is no case. It answers, in every
// view and in every screenshot of one, which case this is, which collection it came out
// of and under what terms this page is reading it.
function setCaseBar(summary){
  const name=document.getElementById('case-name');
  const meta=document.getElementById('case-meta');
  const integrity=document.getElementById('integrity-badge');
  const mode=document.getElementById('mode-badge');
  if(!summary){
    name.textContent='Agent Sessions';
    meta.textContent=state.sourceLabel?('reading '+state.sourceLabel):'forensic transcript viewer';
    integrity.className='badge';
    integrity.textContent='no collection';
    integrity.title='Nothing here came out of a collection bundle, so there are no recorded hashes to check against.';
    mode.className='badge';
    mode.textContent='read-only';
    mode.title='This file never writes to the evidence it reads and never calls out to the network.';
    return;
  }
  const bundles=summary.bundles||[];
  const counts=summary.counts||{};
  name.textContent=tailPath((summary.case||{}).path)||'case';
  const hosts=[...new Set(bundles.map(b=>b.collected_host).filter(Boolean))];
  meta.textContent=[
    hosts.length?hosts.join(', '):'no endpoint recorded',
    bundles.length===1?shortId(bundles[0].bundle_uuid,8):(bundles.length+' collections'),
    (summary.agents||[]).length+' agents',
    fmtInt(counts.events||0)+' events',
  ].join(' · ');
  // What "verified" may and may not claim. The manifest hash travelled with the bundle and
  // ingest checked the files against it, so an intact chain is a real statement about these
  // bytes. A bundle with no manifest hash is not a failed check, it is an unchecked one,
  // and those are different findings.
  const hashed=bundles.filter(b=>b.manifest_sha256).length;
  if(!bundles.length){
    integrity.className='badge';
    integrity.textContent='no collection';
    integrity.title='This case holds no collection bundle, so there is no manifest to check against.';
  }else if(hashed===bundles.length){
    integrity.className='badge ok';
    integrity.innerHTML='';
    integrity.appendChild(el('span',{class:'dot'}));
    integrity.appendChild(document.createTextNode('manifest hashed'));
    integrity.title='Every collection in this case carries a manifest hash, and ingest read the files through it. It says these bytes are the bytes that were collected; it says nothing about whether the endpoint was already tampered with.';
  }else{
    integrity.className='badge warn';
    integrity.textContent=(bundles.length-hashed)+' of '+bundles.length+' unhashed';
    integrity.title='A collection with no manifest hash is an unchecked collection, not a failed check. Its files cannot be compared against what the collector said it took.';
  }
  mode.className='badge';
  mode.textContent='read-only · 127.0.0.1';
  mode.title='The case is opened through a mode=ro connection, the socket binds loopback only, and every URL lives under a token generated for this run.';
}

// ---------- the four rows above every view ----------

// The head: what this view is, what it is counting, and whatever it offers to do with it.
function setHead(title,sub,right){
  const head=document.getElementById('view-head');
  // The search controls are a node the document owns and a head only borrows, so they go
  // back before this one is emptied. `innerHTML = ''` discards its children, and with them
  // the listeners bound to the search box once at boot.
  const search=document.getElementById('search-bar');
  if(search&&head.contains(search)) document.body.appendChild(search);
  head.innerHTML='';
  head.classList.remove('hidden');
  const left=el('div',{style:'display:flex;flex-direction:column;gap:2px;min-width:0'});
  left.appendChild(el('span',{class:'view-title',text:title}));
  if(sub) left.appendChild(typeof sub==='string'?el('span',{class:'view-sub',text:sub}):sub);
  head.appendChild(left);
  head.appendChild(el('div',{class:'head-gap'}));
  if(right&&right.length) head.appendChild(el('div',{class:'head-right'},right.filter(Boolean)));
  return head;
}

function setChips(nodes){
  const bar=document.getElementById('chip-bar');
  bar.innerHTML='';
  const items=(nodes||[]).filter(Boolean);
  bar.classList.toggle('hidden',!items.length);
  for(const node of items) bar.appendChild(node);
  return bar;
}

// ADR 0009, as one line of chrome. A filter is allowed to take rows off the screen; it is
// never allowed to leave them looking absent. So every view that filters calls this with
// the number it took out, and the line stays until the filter is cleared.
function setHideNote(hidden,why,onReset){
  const bar=document.getElementById('hide-note');
  bar.innerHTML='';
  if(!hidden){bar.classList.add('hidden');return;}
  bar.classList.remove('hidden');
  bar.appendChild(el('span',{class:'n',text:fmtInt(hidden)+' row'+(hidden===1?'':'s')+' hidden by filters'}));
  if(why) bar.appendChild(el('span',{class:'why',text:why}));
  if(onReset) bar.appendChild(el('button',{class:'linkish',type:'button',text:'show everything',onclick:onReset}));
}

// What the view cannot tell you, above the rows rather than under them. Every one of these
// sentences is a limit on how the table below may be read, and a limit nobody reads is a
// limit that is not there.
function setViewNote(html){
  const note=document.getElementById('view-note');
  if(!html){note.classList.add('hidden');note.innerHTML='';return;}
  note.classList.remove('hidden');
  note.innerHTML=html;
}

// ---------- the dense table ----------
//
// Fixed-width flex columns rather than a real table, because every width here is a
// decision. A timestamp column is as wide as one timestamp; a column that reflows with its
// content is a column the eye has to find again on every row.
function col(key,label,width,align){return {key,label,width:width||null,align:align||null};}

function cellClass(c){
  return 'tcell'+(c.width?'':' grow')+(c.align==='right'?' right':'');
}
function headRow(cols){
  const node=el('div',{class:'thead'});
  for(const c of cols){
    node.appendChild(el('span',{class:cellClass(c),
      style:c.width?('width:'+c.width+'px;flex:none'):null,text:c.label}));
  }
  return node;
}
function dataRow(cols,cells,opts){
  const o=opts||{};
  const node=el('div',{class:'trow'+(o.cls?' '+o.cls:''),title:o.title||null});
  if(o.onclick) node.addEventListener('click',o.onclick);
  else node.classList.add('flat');
  for(const c of cols){
    const span=el('span',{class:cellClass(c),style:c.width?('width:'+c.width+'px;flex:none'):null});
    const value=cells[c.key];
    // A cell that is null is a value the case does not have, and says so with a dash. A
    // null *inside* a list of parts is a part that does not apply — a pill for a mark this
    // row does not carry — and adding a dash for it would put "—" after every value.
    if(value===null||value===undefined){
      span.appendChild(quiet('—'));
    }else{
      for(const part of [].concat(value)){
        if(part===null||part===undefined) continue;
        else if(typeof part==='string') span.appendChild(document.createTextNode(part));
        else span.appendChild(part);
      }
    }
    node.appendChild(span);
  }
  return node;
}

// The table's own footer: how much of the view is on screen, and what it took to get here.
function setFoot(id,text,extra){
  const foot=document.getElementById(id);
  if(!foot) return;
  foot.innerHTML='';
  if(!text&&!(extra&&extra.length)){foot.classList.add('hidden');return;}
  foot.classList.remove('hidden');
  if(text) foot.appendChild(el('span',{class:'n',text:text}));
  foot.appendChild(el('div',{class:'head-gap'}));
  for(const node of (extra||[]).filter(Boolean)) foot.appendChild(node);
}

function emptyRows(node,text){
  node.appendChild(el('div',{class:'agg-empty',text:text}));
}

// Which row the evidence column is describing, per view. Per view rather than global,
// because leaving a tab and coming back must not silently change what that column is about.
function pick(view,id,draw){
  state.picked[view]=id;
  if(draw) draw();
}
function picked(view){return state.picked[view];}

// ---------- the evidence column ----------

function evLabel(text){return el('div',{class:'ev-label',text:text});}
function evSec(children){return el('div',{class:'ev-sec'},(children||[]).filter(Boolean));}
function evKV(k,v,title){
  return el('div',{class:'ev-kv',title:title||null},[
    el('span',{class:'k',text:k}),
    el('span',{class:'v',text:(v===null||v===undefined||v==='')?'—':String(v)}),
  ]);
}
function evStack(k,v,title){
  return el('div',{class:'ev-stack',title:title||null},[
    el('span',{class:'k',text:k}),
    el('span',{class:'v',text:(v===null||v===undefined||v==='')?'—':String(v)}),
  ]);
}
function evProse(html){return el('div',{class:'ev-prose',html:html});}
function evCode(text){return el('div',{class:'ev-code',text:text});}
function evQuote(cls,children){return el('div',{class:'ev-quote'+(cls?' '+cls:'')},(children||[]).filter(Boolean));}

// Draw the evidence column, or empty it. `action` is the one thing this row offers to do.
function setEvidence(title,sections,action){
  const panel=document.getElementById('evidence');
  panel.innerHTML='';
  if(!title){panel.classList.add('hidden');return;}
  panel.classList.remove('hidden');
  const head=el('div',{class:'ev-head'},[el('span',{class:'t',text:title,title:title})]);
  if(action) head.appendChild(action);
  panel.appendChild(head);
  for(const section of (sections||[]).filter(Boolean)) panel.appendChild(section);
}

function setEvidenceEmpty(title,text){
  setEvidence(title,[evSec([el('div',{class:'ev-prose',text:text})])]);
}

// A locator, as the labelled parts it is made of.
//
// The case stores it as text ("line:1486", "log:0 record:12", "table:threads key:9") on
// purpose, because those are three different things and an integer column would lose which
// one it was. Splitting it back out here is presentation: the panel can say "Line 1 486"
// instead of printing a field name at an analyst.
const LOCATOR_LABELS={line:'Line',byte:'Byte offset',record:'Record',log:'Log frame',
  table:'Table',key:'Key',rowid:'Row id',page:'Page',offset:'Offset',frame:'Frame'};
// The whole-file locators, which say where a record came from by saying it came from all
// of it. Spelled out rather than printed raw, because "file" in a column called Place is
// a word an analyst has to guess at.
const LOCATOR_WHOLE={
  fs:'the file system record of the file itself, not anything inside it',
  file:'the file as a whole, which is what this parser reads at a time',
};
function locatorParts(locator){
  const text=String(locator||'').trim();
  if(!text) return [];
  if(LOCATOR_WHOLE[text]) return [{k:'Read from',v:LOCATOR_WHOLE[text],whole:text}];
  const out=[];
  for(const token of text.split(/\s+/)){
    // A locator can name a part inside its line: one transcript line carries a turn and
    // the effect derived from it, and they are two records out of the same bytes.
    const [head,part]=token.split('#');
    const at=head.indexOf(':');
    if(at<0){
      out.push({k:'Path in the file',v:head});
    }else{
      const name=head.slice(0,at);
      const value=head.slice(at+1);
      out.push({k:LOCATOR_LABELS[name]||name,v:/^\d+$/.test(value)?fmtInt(value):value,raw:name});
    }
    if(part) out.push({k:'Part of that line',v:part});
  }
  return out;
}

// The block every evidence column starts with: which file, where in it, and the hash of
// those bytes. Kept in one place so the panel beside a transcript and the panel beside a
// finding cannot describe the same event differently.
function provenanceSection(prov,extra){
  const p=prov||{};
  const parts=locatorParts(p.locator);
  const children=[evStack('Source file',p.original_path)];
  for(const part of parts) children.push(evKV(part.k,part.v));
  // Said rather than left as a blank field. No collector in this suite records a byte
  // offset, so a line number is the finest place a line-delimited store can honestly give,
  // and an empty box labelled "byte offset" reads as zero. Left out entirely where the
  // record is the whole file, because an offset into all of it means nothing.
  if(parts.length&&!parts.some(part=>part.whole||part.raw==='byte'||part.raw==='offset')){
    children.push(evKV('Byte offset','not recorded',
      'No collector in this suite records a byte offset. The locator above is the finest place the store could give.'));
  }
  if(p.sha256) children.push(evStack('SHA-256 of the file',p.sha256));
  if(p.artifact_id) children.push(evKV('Artifact',p.artifact_id));
  if(p.bundle_uuid) children.push(evKV('Collection',shortId(p.bundle_uuid,8)));
  for(const node of (extra||[]).filter(Boolean)) children.push(node);
  return evSec(children);
}

// ---------- what a rule said about one event ----------

let _findingIndex=null;
let _findingIndexFor=null;
function findingsByEvent(){
  const data=state.caseFindings;
  if(_findingIndexFor===data&&_findingIndex) return _findingIndex;
  const map=new Map();
  for(const finding of ((data&&data.findings)||[])){
    for(const id of (finding.event_ids||[])){
      if(!map.has(id)) map.set(id,[]);
      map.get(id).push(finding);
    }
  }
  _findingIndex=map; _findingIndexFor=data;
  return map;
}
const SEV_CLASS={critical:'bad',high:'bad',medium:'warn',med:'warn',low:'',info:''};
function sevClass(sev){return SEV_CLASS[String(sev||'').toLowerCase()]||'';}

// The instruction files that were on the endpoint for this agent and this working copy.
//
// Candidates, and the panel says so. Which file actually won a turn is the agent's own
// runtime behaviour and is not a fact on disk, so this lists what was in force and refuses
// to order it — the same refusal the API makes in its own note.
function instructionsInForce(cwd,agent){
  const rows=((state.caseInstructions||{}).instructions)||[];
  return rows.filter(row=>{
    if(agent&&row.agent&&row.agent!==agent) return false;
    if(!row.project_path) return true;          // a profile or a policy file: everywhere
    if(!cwd) return false;
    return row.project_path===cwd;
  });
}

// ---------- export ----------
//
// Only where a case is being served, because an export is a request to the server that
// holds the case. A button that could not work would be a button an analyst clicks once.
function exportButton(name,label){
  if(!state.caseApi) return null;
  return el('a',{class:'btn',href:'api/export/'+name+'.csv',download:'afx-'+name+'.csv',
    style:'text-decoration:none;display:inline-block',
    title:'The whole view as CSV, not the page on screen and not what a filter left.',
    text:label||'Export CSV'});
}

// ---------- the Case view ----------
//
// The numbers an analyst reads first, and immediately under them the numbers that qualify
// them. The second block is shown every time rather than only when it looks bad: a summary
// of what was understood, with nothing said about the rest, reads as completeness, and
// that is the one thing this suite must never say by accident.
function statCard(n,label,hint,cls){
  const value=(n===null||n===undefined)?'—':fmtInt(n);
  const zero=(!n&&cls)?' zero':'';
  return el('div',{class:'stat'+(cls?' '+cls:'')+zero},[
    el('span',{class:'n',text:value}),
    el('span',{class:'l',text:label}),
    hint?el('span',{class:'h',text:hint}):null,
  ].filter(Boolean));
}
const CASE_ARTIFACT_COLS=[
  col('artifact','Artifact'),
  col('agent','Agent',110),
  col('files','Files',70,'right'),
  col('unreadable','Records unreadable',150,'right'),
  col('uninterpreted','Not yet mapped',130,'right'),
];

function renderCasePanel(){
  const body=document.getElementById('case-body');
  const summary=state.caseApi;
  setHead('Case',summary?((summary.case||{}).path||''):'nothing is being served to this page',
    [exportButton('artifacts','Export artifacts')]);
  setChips([]);
  setHideNote(0);
  body.innerHTML='';
  if(!summary){
    setViewNote('');
    setEvidence(null);
    emptyRows(body,'No case is being served to this page. The Case view exists only behind <code>afx serve</code>.');
    return;
  }
  setViewNote('<b>What this case does not know is on this page too.</b> Every count below the '
    +'first row qualifies the ones above it: a file that was collected and never read, a '
    +'record nothing could decode, a record read out of a format nobody has mapped, and a '
    +'hole the collection itself reported are four different gaps with four different '
    +'remedies.');

  const counts=summary.counts||{};
  body.appendChild(el('div',{class:'card-row'},[
    statCard(counts.events||0,'Events',
      (summary.agents||[]).length+' agents · '+(summary.bundles||[]).length+' collections'),
    statCard(counts.artifacts_collected||0,'Files collected',
      fmtInt(counts.artifacts||0)+' recorded in the case'),
    statCard(((state.caseFindings||{}).findings||[]).length,'Rule findings',
      summary.scanned?((summary.scan_runs||[]).length+' scan runs'):'nobody has scanned this case',
      summary.scanned?'bad':'warn'),
    statCard((summary.kinds||[]).reduce((n,k)=>n+(k.kind==='instruction.source'?k.events:0),0),
      'Instruction files','what the agents were told to obey'),
  ]));

  body.appendChild(el('div',{class:'block-label',text:'What the case does not know'}));
  body.appendChild(el('div',{class:'card-row'},[
    statCard(counts.artifacts_unparsed||0,'Collected, never read','no parser was responsible','warn'),
    statCard(counts.events_unreadable||0,'Records unreadable','damaged evidence, look first','bad'),
    statCard(counts.events_uninterpreted||0,'Records not yet mapped','intact, no reading of it','warn'),
    statCard(counts.events_without_timestamp||0,'Events with no time','position unknown, not early','warn'),
  ]));

  for(const gap of (summary.collection_gaps||[])){
    body.appendChild(el('div',{class:'strip'},[
      el('span',{class:'n',text:gap.kind}),
      el('span',{class:'t',text:gap.detail+(gap.reason?' — '+gap.reason:'')}),
    ]));
  }
  if(!summary.scanned){
    body.appendChild(el('div',{class:'notice',html:'<b>Nobody has run the rules over this case.</b> '
      +'An empty findings list means nothing until a scan has run: <code>afx scan --case &lt;db&gt;</code>.'}));
  }

  // The same two numbers per artifact. A total cannot be acted on: one debug log and every
  // transcript on the machine give the same number and call for opposite next steps.
  const unread=(summary.unread&&summary.unread.artifacts)||[];
  if(unread.length){
    const listed=summary.unread.listed||unread.length;
    const total=summary.unread.total||listed;
    body.appendChild(el('div',{class:'block-label'},[
      document.createTextNode('Where those records are'),
      el('span',{class:'side',text:listed===total
        ? (listed+' artifacts')
        : (listed+' of '+total+' artifacts listed, largest first')}),
    ]));
    const box=el('div',{class:'boxed'});
    box.appendChild(headRow(CASE_ARTIFACT_COLS));
    for(const row of unread){
      box.appendChild(dataRow(CASE_ARTIFACT_COLS,{
        artifact:row.artifact_id||'unattributed',
        agent:quiet(row.agent||'unclaimed'),
        files:mono(fmtInt(row.files)),
        unreadable:mono(fmtInt(row.unreadable||0),row.unreadable?'bad':'q'),
        uninterpreted:mono(fmtInt(row.uninterpreted||0),row.uninterpreted?'warn':'q'),
      },{cls:row.unreadable?'alert':(row.uninterpreted?'soft':'')}));
    }
    body.appendChild(box);
  }

  // The evidence column of the case view is the case's own provenance: which collections
  // it was built from and which bytes this very page is.
  const sections=[];
  for(const bundle of (summary.bundles||[])){
    sections.push(evSec([
      evLabel('Collection'),
      el('div',{class:'ev-quote calm'},[
        el('span',{class:'h',text:bundle.collected_host||'unknown endpoint'}),
        el('span',{class:'ev-prose',text:(bundle.collected_os||'operating system not recorded')}),
      ]),
      evKV('Collection',shortId(bundle.bundle_uuid,12)),
      evKV('Collector',(bundle.tool_name||'?')+' '+(bundle.tool_version||'')),
      evKV('Collected by',(bundle.collector_user||'unknown user')+(bundle.elevated?' · elevated':'')),
      evKV('Started',fmtStamp(bundle.started_utc)),
      evKV('Finished',fmtStamp(bundle.finished_utc)),
      // Recorded once for the whole collection, and it is what turns a UTC timestamp in
      // this case back into the wall clock the person at the keyboard saw.
      evKV('Endpoint clock',(bundle.local_timezone_name||'not recorded')+' '+(bundle.local_timezone||'')),
      evStack('Manifest SHA-256',bundle.manifest_sha256||'not recorded'),
      el('div',{},[bundle.manifest_sha256
        ? pill('hashed manifest','ok')
        : pill('no manifest hash','warn')]),
      evKV('Ingested',fmtStamp(bundle.ingested_utc)),
    ]));
  }
  sections.push(evSec([
    evLabel('Provenance of this page'),
    evStack('Viewer SHA-256',summary.viewer_sha256),
    evKV('Case file',tailPath((summary.case||{}).path)),
    evKV('Case schema',(summary.case||{}).schema_version),
    evKV('Served by',(summary.tool||'?')+' '+(summary.tool_version||'')),
    evKV('Unified format',(summary.unified_format||{}).name+' v'+(summary.unified_format||{}).version),
    evKV('API version',summary.afx_api),
    ((summary.scan_runs||[])[0]
      ? evKV('Last scan',fmtStamp(summary.scan_runs[0].started_utc)+' · '
          +summary.scan_runs[0].rules_run+' rules')
      : evKV('Last scan','never')),
    evProse('The viewer hash is the hash of the HTML these bytes were served as, so a '
      +'screenshot of this page can be attributed to a build. It is the same reason every '
      +'event carries the hash of the file it came from.'),
  ]));
  setEvidence('Case provenance',sections);
}

// ---------- the Timeline view ----------
const TIMELINE_PAGE=300;
const TIMELINE_COLS=[
  col('ts','Time (UTC)',150),
  col('agent','Agent',96),
  col('kind','Kind',116),
  col('session','Session',110),
  col('summary','Event'),
  col('source','Source',150),
  col('locator','Place',66,'right'),
];

async function renderTimelinePanel(){
  const list=document.getElementById('timeline-list');
  if(!state.caseApi){
    setHead('Timeline','nothing is being served to this page');
    setChips([]); setHideNote(0); setViewNote(''); setEvidence(null);
    setFoot('timeline-foot','');
    list.innerHTML='';
    emptyRows(list,'No case is being served to this page.');
    return;
  }
  drawTimelineChrome();
  const win=sharedWindow();
  const key=(state.timelineAgent||'all')+'|'+(state.timelineNoFs?'1':'0')
    +'|'+(win.since||'')+'|'+(win.until||'');
  if(!state.timeline||state.timeline.key!==key){
    state.timeline={key,rows:[],next:0,error:null};
    list.innerHTML='';
    emptyRows(list,'Loading…');
    await timelineMore();
    // The tab may have been left while the page was in flight.
    if(state.view!=='timeline') return;
  }
  drawTimeline();
}

async function timelineMore(){
  const t=state.timeline;
  if(!t||t.next===null) return;
  const params=['limit='+TIMELINE_PAGE,'offset='+t.next];
  if(state.timelineAgent&&state.timelineAgent!=='all') params.push('agent='+encodeURIComponent(state.timelineAgent));
  if(state.timelineNoFs) params.push('no_fs=1');
  const win=sharedWindow();
  if(win.since) params.push('since='+encodeURIComponent(win.since));
  if(win.until) params.push('until='+encodeURIComponent(win.until));
  try{
    const res=await fetch('api/timeline?'+params.join('&'),{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    t.rows=t.rows.concat(data.rows||[]);
    t.next=(data.next_offset===null||data.next_offset===undefined)?null:data.next_offset;
  }catch(e){
    t.error=String((e&&e.message)||e);
    t.next=null;
  }
}

function drawTimelineChrome(){
  const t=state.timeline||{rows:[]};
  const redraw=()=>{renderTimelinePanel();};
  const chips=[];
  const agents=(state.caseApi.agents||[]);
  chips.push(chip('all agents',state.timelineAgent==='all',
    ()=>{state.timelineAgent='all';state.timeline=null;renderTimelinePanel();}));
  // Capped for the same reason the sidebar's are, and the chip that hides the rest says
  // how many it is hiding.
  const shownAgents=state.showAllAgents?agents:agents.slice(0,AGENT_CHIP_LIMIT);
  for(const entry of shownAgents){
    chips.push(chip(entry.agent,state.timelineAgent===entry.agent,
      ()=>{state.timelineAgent=entry.agent;state.timeline=null;renderTimelinePanel();},
      entry.events));
  }
  if(agents.length>shownAgents.length){
    chips.push(el('button',{class:'linkish',type:'button',
      text:'+'+(agents.length-shownAgents.length)+' more agents',
      onclick:()=>{state.showAllAgents=true;renderTimelinePanel();}}));
  }
  chips.push(el('div',{class:'chip-gap'}));
  chips.push(chip('hide file events',state.timelineNoFs,
    ()=>{state.timelineNoFs=!state.timelineNoFs;state.winWithFs=!state.timelineNoFs;
         state.timeline=null;renderTimelinePanel();},null,
    'One event per collected file. On a large collection they outnumber the conversation, '
    +'and for a file with no internal timestamps they are the only temporal evidence there is.'));
  chips.push(chip('findings only',state.timelineFindingsOnly,
    ()=>{state.timelineFindingsOnly=!state.timelineFindingsOnly;drawTimeline();},
    findingsByEvent().size||null,
    'Rows a rule fired on. Applied to the rows already loaded, not to the query, so it '
    +'narrows this page rather than the case.'));
  chips.push(el('div',{class:'chip-push'}));
  // No count on the trigger here: this window is applied by the case before the rows are
  // paged, so the viewer never sees what it removed and cannot honestly put a number on it.
  chips.push(windowControls(redraw,0));
  setChips(chips);
  setHead('Timeline',fmtInt(t.rows.length)+' rows loaded'+(t.next===null?'':' of more'),
    [exportButton('timeline')]);
  setViewNote('<b>Events with no timestamp come first rather than being left out.</b> '
    +'Their position is unknown, not early, and they stay inside every window for the same '
    +'reason. A row here opens in the session it belongs to.');
}

function visibleTimelineRows(){
  const t=state.timeline||{rows:[]};
  if(!state.timelineFindingsOnly) return t.rows;
  const index=findingsByEvent();
  return t.rows.filter(row=>index.has(row.event_id));
}

function drawTimeline(){
  const list=document.getElementById('timeline-list');
  const t=state.timeline||{rows:[],next:null};
  // Drawn again now that a page has arrived: the chips and the count above them are drawn
  // before the first fetch so the view is not blank while it loads, and a head still
  // saying "0 rows" after they landed would be a count that is simply wrong.
  drawTimelineChrome();
  const win=sharedWindow();
  const rows=visibleTimelineRows();
  const index=findingsByEvent();
  const undated=rows.filter(r=>!r.ts_utc).length;
  list.innerHTML='';
  if(t.error) list.appendChild(el('div',{class:'notice',text:'The timeline could not be read in full: '+t.error}));
  setHideNote(t.rows.length-rows.length,'the findings-only chip is set',
    ()=>{state.timelineFindingsOnly=false;drawTimeline();});
  if(!rows.length){
    emptyRows(list,t.rows.length
      ? 'No loaded row matches this chip. '+fmtInt(t.rows.length)+' are out of view.'
      : 'No event in this case matches these filters.');
    setFoot('timeline-foot','');
    setEvidence(null);
    return;
  }
  list.appendChild(headRow(TIMELINE_COLS));
  const chosen=picked('timeline');
  let chosenRow=null;
  for(const row of rows){
    const flags=index.get(row.event_id)||[];
    const cls=[row.parse_problem?'alert':'',flags.length?'alert':'',
               row.ts_utc?'':'soft',row.event_id===chosen?'on':''].filter(Boolean).join(' ');
    if(row.event_id===chosen) chosenRow=row;
    list.appendChild(dataRow(TIMELINE_COLS,{
      // An undated event says so rather than being given a time. Its position is unknown,
      // not early, which is also why the server puts these first.
      ts:row.ts_utc?mono(fmtStamp(row.ts_utc)):mono('no timestamp','warn'),
      agent:row.agent,
      kind:row.parse_problem?mono(row.kind,'bad'):quiet(row.kind),
      session:quiet(shortId(row.session_id)),
      summary:[document.createTextNode(row.summary||''),
               ...flags.slice(0,2).map(f=>pill(f.rule_id,sevClass(f.severity)))],
      source:quiet(tailPath(row.original_path)),
      locator:quiet(locatorValue(row.locator)),
    },{cls,title:(row.original_path||'')+(row.locator?' · '+row.locator:''),
       onclick:()=>{pick('timeline',row.event_id);drawTimeline();}}));
  }
  const parts=[fmtInt(rows.length)+' of '+fmtInt(t.rows.length)+' loaded rows'];
  if(t.next!==null) parts.push('more on the server');
  if(win.set) parts.push(fmtInt(undated)+' undated and therefore kept');
  if(state.timelineNoFs) parts.push('filesystem events left out');
  setFoot('timeline-foot',parts.join(' · '),[
    t.next!==null?el('button',{class:'btn',type:'button',
      text:'Load the next '+TIMELINE_PAGE+' rows',
      onclick:async()=>{await timelineMore();drawTimeline();}}):null,
  ]);
  drawTimelineEvidence(chosenRow);
}

// The shortest honest rendering of a locator for a narrow column: the number where there
// is one, and the locator as the store spells it where it is something else. The evidence
// column beside the table is where the same value is spelled out in full.
function locatorValue(locator){
  const text=String(locator||'').trim();
  if(!text) return null;
  if(LOCATOR_WHOLE[text]) return text;
  const first=text.split(/\s+/)[0].split('#')[0];
  const at=first.indexOf(':');
  return at<0?first:first.slice(at+1);
}

function drawTimelineEvidence(row){
  if(!row){
    setEvidenceEmpty('Evidence','Pick a row. This column then names the file it was read out of, the place inside that file and the hash of those bytes — which is what a report cites.');
    return;
  }
  const flags=findingsByEvent().get(row.event_id)||[];
  const sections=[provenanceSection({
    original_path:row.original_path,locator:row.locator,
    sha256:row.file_sha256,artifact_id:row.artifact_id,
  },[
    evKV('Event',shortId(row.event_id,12)),
    evKV('Kind',row.kind),
    evKV('Agent',row.agent),
    evKV('Recorded at',row.ts_utc?fmtStamp(row.ts_utc)+' UTC':'no timestamp'),
    row.ts_source?evKV('Time from',row.ts_source):null,
    row.parse_problem?el('div',{},[pill('unreadable record','bad')]):null,
  ])];
  sections.push(evSec([
    evLabel('What the row says'),
    evProse(esc(row.summary||'(no summary)')),
  ]));
  if(flags.length){
    const children=[evLabel('Rules that fired on this event')];
    for(const finding of flags){
      children.push(evQuote(sevClass(finding.severity)===''?'calm':(sevClass(finding.severity)==='warn'?'soft':''),[
        el('span',{class:'h',text:finding.rule_id+' · '+finding.title}),
        el('span',{class:'ev-prose',text:finding.summary||''}),
        el('span',{class:'ev-label',text:finding.pack+' · '+finding.severity}),
      ]));
    }
    sections.push(evSec(children));
  }
  setEvidence('Evidence · '+shortId(row.event_id,8),sections,
    el('button',{class:'linkish',type:'button',text:'open in its session',
      onclick:()=>openCaseEvent(row.event_id)}));
}

// ---------- the Findings view ----------
const FINDING_COLS=[
  col('sev','Sev',80),
  col('rule','Rule',170),
  col('pack','Pack',130),
  col('title','Title'),
  col('matched','What matched',240),
  col('events','Events',60,'right'),
  col('session','Session',96),
];

function renderFindingsPanel(){
  const body=document.getElementById('findings-body');
  body.innerHTML='';
  if(!state.caseApi){
    setHead('Findings','nothing is being served to this page');
    setChips([]); setHideNote(0); setViewNote(''); setEvidence(null);
    emptyRows(body,'No case is being served to this page.');
    return;
  }
  const data=state.caseFindings;
  if(!data){
    setHead('Findings','loading…'); setChips([]); setHideNote(0); setEvidence(null);
    emptyRows(body,'Loading…');
    loadCaseFindings();
    return;
  }
  const run=(data.scan_runs||[])[0];
  setHead('Findings',run
    ? ('scanned '+fmtStamp(run.started_utc)+' · '+fmtInt(run.rules_run)+' rules over '+fmtInt(run.events_read)+' events')
    : 'no scan has been run',
    [exportButton('findings')]);

  if(!data.scanned){
    // The distinction the whole view rests on. Without it an unscanned case and a clean one
    // look identical, and those are opposite conclusions.
    setChips([]); setHideNote(0); setEvidence(null);
    setViewNote('<b>No scan has been run on this case.</b> Any list below is empty because '
      +'nobody has looked, not because there was nothing to find. Run '
      +'<code>afx scan --case &lt;db&gt;</code> and reload.');
    if(data.error) body.appendChild(el('div',{class:'notice',text:'The findings could not be read: '+data.error}));
    emptyRows(body,'Nothing has been scanned, so there is nothing to show.');
    return;
  }
  setViewNote('Each finding names its rule, the pack the rule came from, what matched and '
    +'the events it rests on. A finding an analyst cannot open the evidence for is an '
    +'opinion, so every row here links to its events.');

  const all=data.findings||[];
  const bySev={};
  const byPack={};
  for(const f of all){
    bySev[f.severity]=(bySev[f.severity]||0)+1;
    byPack[f.pack]=(byPack[f.pack]||0)+1;
  }
  const chips=[chip('all',state.findSev==='all'||!state.findSev,
    ()=>{state.findSev='all';state.findPack='all';renderFindingsPanel();},all.length)];
  for(const sev of ['critical','high','medium','low','info']){
    if(!bySev[sev]) continue;
    chips.push(chip(sev,state.findSev===sev,
      ()=>{state.findSev=sev;renderFindingsPanel();},bySev[sev]));
  }
  chips.push(el('div',{class:'chip-gap'}));
  for(const pack of Object.keys(byPack).sort()){
    chips.push(chip(pack,state.findPack===pack,
      ()=>{state.findPack=state.findPack===pack?'all':pack;renderFindingsPanel();},byPack[pack]));
  }
  setChips(chips);

  const rows=all.filter(f=>(!state.findSev||state.findSev==='all'||f.severity===state.findSev)
    &&(!state.findPack||state.findPack==='all'||f.pack===state.findPack));
  setHideNote(all.length-rows.length,'a severity or pack chip is set',
    ()=>{state.findSev='all';state.findPack='all';renderFindingsPanel();});

  if(data.error) body.appendChild(el('div',{class:'notice',text:'The findings could not be read: '+data.error}));
  if(!all.length){
    setEvidence(null);
    emptyRows(body,'Every rule ran and none of them matched. That is a result, not an absence of one.');
    return;
  }
  if(!rows.length){
    setEvidence(null);
    emptyRows(body,'No finding matches these chips. '+fmtInt(all.length)+' are out of view.');
    return;
  }

  body.appendChild(headRow(FINDING_COLS));
  const chosen=picked('findings');
  let chosenRow=rows.find(f=>f.finding_id===chosen)||rows[0];
  for(const finding of rows){
    const cls=sevClass(finding.severity);
    body.appendChild(dataRow(FINDING_COLS,{
      sev:pill(finding.severity,cls),
      rule:mono(finding.rule_id),
      pack:quiet(finding.pack),
      title:cls==='bad'?el('b',{text:finding.title}):finding.title,
      matched:matchedText(finding.matched),
      events:mono(fmtInt(finding.event_count)),
      session:quiet(shortId(finding.session_id)||'—'),
    },{cls:(cls==='bad'?'alert ':'')+(finding.finding_id===chosenRow.finding_id?'on':''),
       onclick:()=>{pick('findings',finding.finding_id);renderFindingsPanel();}}));
  }
  drawFindingEvidence(chosenRow);
}

// What a rule matched, as one line. The stored value is whatever the rule recorded, so it
// can be a string, a list or an object; all three are rendered rather than one of them
// being the only shape this view can show.
function matchedText(matched){
  if(matched===null||matched===undefined) return null;
  if(typeof matched==='string') return matched;
  if(Array.isArray(matched)) return matched.map(m=>typeof m==='string'?m:JSON.stringify(m)).join(', ');
  return JSON.stringify(matched);
}

function drawFindingEvidence(finding){
  if(!finding){setEvidence(null);return;}
  const sections=[evSec([
    el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},[
      pill(finding.severity,sevClass(finding.severity)),
      pill('pack '+finding.pack),
    ]),
    evProse(esc(finding.summary||'This rule recorded no summary.')),
  ])];
  sections.push(evSec([
    evLabel('What matched'),
    evCode(matchedText(finding.matched)||'(the rule recorded no match text)'),
  ]));
  sections.push(evSec([
    evLabel('The rule itself'),
    evKV('Rule',finding.rule_id),
    evKV('Pack',finding.pack),
    evKV('Agent',finding.agent||'not recorded'),
    evKV('Session',shortId(finding.session_id,12)||'none'),
    evKV('Event time',finding.ts_utc?fmtStamp(finding.ts_utc):'no timestamp'),
    evStack('Rule SHA-256',finding.rule_sha256),
    evProse('The rule hash is what lets somebody else run the same rule and say whether '
      +'they got the same finding.'),
  ]));
  const events=finding.event_ids||[];
  const list=[evLabel('Rests on '+fmtInt(events.length)+' event'+(events.length===1?'':'s'))];
  for(const id of events.slice(0,12)){
    list.push(el('button',{class:'linkish',type:'button',text:'open '+shortId(id,12),
      title:'open the event this finding rests on',
      onclick:()=>openCaseEvent(id)}));
  }
  if(events.length>12) list.push(el('div',{class:'ev-prose',text:'and '+(events.length-12)+' more.'}));
  sections.push(evSec(list));
  setEvidence(finding.rule_id+' · '+finding.title,sections);
}

// ---------- the Instruction surface view ----------
// The answer to "what was this agent told to do", off the disk rather than out of a
// transcript. Deliberately not called a system prompt anywhere in here: the vendor's base
// prompt is built at runtime and never touches the endpoint, so the note from the API is
// rendered above the list rather than left for a reader to know already.
const INSTRUCTION_COLS=[
  col('scope','Scope',86),
  col('path','Path (found at)'),
  col('names','Names file',190),
  col('tools','Tools it grants',160),
  col('exec','Executed',80),
  col('hidden','Invisible',82,'right'),
];

async function renderInstructionsPanel(){
  const body=document.getElementById('instructions-body');
  if(!state.caseApi){
    setHead('Instructions','nothing is being served to this page');
    setChips([]); setHideNote(0); setViewNote(''); setEvidence(null);
    body.innerHTML=''; emptyRows(body,'No case is being served to this page.');
    return;
  }
  if(!state.caseInstructions){
    setHead('Instructions','loading…'); setChips([]); setHideNote(0);
    body.innerHTML=''; emptyRows(body,'Loading…');
    await loadCaseInstructions();
    if(state.view!=='instructions') return;
  }
  drawInstructions();
}

// The one-word marks a row carries. Each is a question an analyst would otherwise have to
// open every file to ask: did this document grant itself tools, does it contain characters
// a reviewer cannot see, is it executed rather than read.
function instructionMarks(row){
  const marks=[];
  if((row.declared_tools||[]).length) marks.push('grants '+row.declared_tools.join(', '));
  if((row.hidden_characters||[]).length){
    marks.push('invisible: '+row.hidden_characters.map(h=>h.count+'x '+h.codepoint).join(', '));
  }
  if(row.executable) marks.push('executed, not read');
  if(row.prompt_field) marks.push('prompt in '+row.prompt_field);
  return marks;
}
function hiddenCount(row){
  return (row.hidden_characters||[]).reduce((n,h)=>n+(h.count||0),0);
}

function drawInstructions(){
  const body=document.getElementById('instructions-body');
  const data=state.caseInstructions||{instructions:[]};
  const all=data.instructions||[];
  const flagged=all.filter(r=>instructionMarks(r).length);

  setHead('Instructions',fmtInt(all.length)+' files · '+fmtInt(flagged.length)+' worth a look',
    [exportButton('instructions')]);
  // The sentence the panel will not let a reader miss, from the API rather than written
  // here, so the screen and the API cannot disagree about what this view is.
  // The sentence is the panel's own headline, so it is taken out of the body text rather
  // than printed twice. The rest of the note comes from the API, so the screen and the API
  // cannot drift apart about what this view is.
  setViewNote('<b>This is not a system prompt.</b> '+esc(data.note||'')
    .replace('This is the instruction surface that was','The surface below is what was')
    .replace('It is not a system prompt. ',''));

  const counts={};
  for(const row of all) counts[row.scope]=(counts[row.scope]||0)+1;
  const order=(data.scope_order||[]).filter(s=>counts[s]);
  const chips=[chip('all',state.insScope==='all',
    ()=>{state.insScope='all';drawInstructions();},all.length)];
  if(flagged.length){
    chips.push(chip('worth a look',state.insScope==='flagged',
      ()=>{state.insScope='flagged';drawInstructions();},flagged.length,
      'Files that grant themselves tools, hold characters a reviewer cannot see, or are executed rather than read.'));
  }
  chips.push(el('div',{class:'chip-gap'}));
  for(const name of order){
    chips.push(chip(name,state.insScope===name,
      ()=>{state.insScope=name;drawInstructions();},counts[name],SCOPE_HINTS[name]||''));
  }
  setChips(chips);

  const rows=all.filter(r=>state.insScope==='all'
    ||(state.insScope==='flagged'?instructionMarks(r).length:r.scope===state.insScope));
  setHideNote(all.length-rows.length,'a scope chip is set',
    ()=>{state.insScope='all';drawInstructions();});

  body.innerHTML='';
  if(data.error) body.appendChild(el('div',{class:'notice',text:'The instruction surface could not be read: '+data.error}));
  if(!rows.length){
    setEvidence(null);
    emptyRows(body,all.length
      ? 'No instruction file matches this chip. '+fmtInt(all.length)+' are out of view.'
      : 'This case holds no instruction files at all. That is a finding: check the Artifacts view for whether any were collected.');
    return;
  }

  body.appendChild(headRow(INSTRUCTION_COLS));
  const chosen=picked('instructions');
  let chosenRow=rows.find(r=>r.event_id===chosen)||rows[0];
  for(const row of rows){
    const hidden=hiddenCount(row);
    const tools=(row.declared_tools||[]).join(', ');
    body.appendChild(dataRow(INSTRUCTION_COLS,{
      scope:pill(row.scope,row.scope==='project'?'bad':(row.scope==='unknown'?'warn':'')),
      path:mono(row.original_path),
      names:row.instruction_is_elsewhere?mono((row.instruction_paths||[]).join(', ')):quiet('—'),
      tools:tools?mono(tools,'warn'):quiet('—'),
      exec:row.executable?mono('yes','bad'):quiet('no'),
      hidden:hidden?mono(fmtInt(hidden),'bad'):quiet('0'),
    },{cls:(hidden||row.executable?'alert ':'')+(row.event_id===chosenRow.event_id?'on':''),
       onclick:()=>{pick('instructions',row.event_id);drawInstructions();}}));
  }
  if(counts.unknown){
    body.appendChild(el('div',{class:'notice',html:'<b>unknown</b> means the collection '
      +'recorded no working copies, so a project file cannot be told from a profile one. '
      +'Those are opposite findings about who instructed the agent, so nothing is guessed here.'}));
  }
  drawInstructionEvidence(chosenRow);
}

const SCOPE_HINTS={
  managed:'An administrator’s file. It applies to every user on the endpoint.',
  project:'Arrived with a checkout, which means anyone who can open a pull request could have put it there.',
  local:'The documented personal override inside a working copy.',
  user:'The profile’s own file.',
  session:'Recorded as part of one conversation rather than as a file on disk.',
  unknown:'The collection recorded no working copies, so a project file cannot be told from a profile one.',
};

function drawInstructionEvidence(row){
  if(!row){setEvidence(null);return;}
  const hidden=hiddenCount(row);
  const sections=[evSec([
    el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},[
      pill(row.scope,row.scope==='project'?'bad':(row.scope==='unknown'?'warn':'')),
      row.executable?pill('executed, not read','bad'):null,
      hidden?pill(fmtInt(hidden)+' invisible characters','bad'):null,
    ].filter(Boolean)),
    evProse(esc(SCOPE_HINTS[row.scope]||'')),
    evStack('Found at',row.original_path),
    row.instruction_is_elsewhere
      ? evStack('Names the file',(row.instruction_paths||[]).join(', '))
      : null,
    evKV('Agent',row.agent||'unclaimed'),
    evKV('Applies in',row.project_path||'no working copy recorded'),
    evKV('Characters',fmtInt(row.chars)),
    evKV('Modified',fmtStamp(row.mtime_utc)),
    evStack('SHA-256',row.file_sha256),
  ].filter(Boolean))];
  if((row.declared_tools||[]).length){
    sections.push(evSec([
      evLabel('Tools this document granted itself'),
      evCode(row.declared_tools.join('\n')),
      evProse('A document that names its own tools has widened what the agent may do, in '
        +'prose rather than in a settings file.'),
    ]));
  }
  for(const [label,value] of [['Scope not settled',row.scope_problem],
                              ['Not in the library',row.recovery_note],
                              ['Not fully read',row.parse_problem]]){
    if(value) sections.push(evSec([evLabel(label),evProse(esc(value))]));
  }
  const textBox=el('div',{class:'ev-code',text:row.preview||''});
  const section=evSec([
    evLabel(hidden?'Text, with the invisible characters marked':'Text'),
    textBox,
    row.preview_is_whole_file?null:el('button',{class:'linkish',type:'button',
      text:'load the rest of this file',
      onclick:()=>loadInstructionText(row,textBox)}),
    hidden?evProse('A human approved one text and the model read another. That is the whole '
      +'reason this is shown with each invisible character marked.'):null,
  ].filter(Boolean));
  sections.push(section);
  if(hidden) textBox.textContent=markHidden(row.preview||'');
  setEvidence(tailPath(row.original_path),sections,
    el('button',{class:'linkish',type:'button',text:'raw record',
      onclick:()=>openCaseEvent(row.event_id)}));
}

// The text of one instruction file, fetched whole rather than shown from the preview when
// the preview is not the whole thing. A half-shown instruction is the same defect as a
// dropped record: the half nobody sees is where the planted sentence would be.
async function loadInstructionText(row,box){
  box.textContent=(row.preview||'')+'\n\nLoading the rest…';
  let text;
  try{
    const res=await fetch('api/events/'+encodeURIComponent(row.event_id),{headers:{Accept:'application/json'}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const record=await res.json();
    text=(record.payload&&record.payload.text)||row.preview||'';
  }catch(e){
    text=(row.preview||'')+'\n\n[the rest of this file could not be loaded: '
      +String((e&&e.message)||e)+'. It is in the bundle at the path above.]';
  }
  box.textContent=hiddenCount(row)?markHidden(text):text;
}

// ---------- the Conversations view ----------
//
// Which of an agent's stores name each conversation. The one view in here that is about
// something not being there: a parser sees one record and a rule sees one event, so a
// conversation missing from the second of an agent's two stores is invisible to both of
// them and visible here.
const PAIR_COLS=[

function drawCorroboration(){
  const body=document.getElementById('corroboration-body');
  const data=state.caseCorroboration||{agents:[],sessions:[]};
  const all=data.sessions||[];
  const alone=all.filter(r=>(r.silent||[]).length);
  const pairs=[];
  for(const agent of (data.agents||[])){
    for(const pair of (agent.pairs||[])) pairs.push(Object.assign({agent:agent.agent},pair));
  }

  setHead('Conversations',
    (data.agents||[]).length+' agents · '+pairs.length+' store pairs compared',
    [exportButton('conversations')]);
  setViewNote('<b>The one view about something that is not there.</b> '
    +'Silence is a lead and not a finding: a store may never have held a conversation, '
    +'because it indexes only what was opened or because the two stores were written by '
    +'different generations of one product. The comparison is by session id as each store '
    +'spells it, so a pair with nothing in common is far more likely to use two id spaces '
    +'than to have lost every conversation. And only stores that are in this case are '
    +'compared: a store nobody collected is absent, not silent — that is a question for '
    +'the Artifacts view.');

  setChips([
    chip('store pairs',state.corrScope==='pairs',
      ()=>{state.corrScope='pairs';drawCorroboration();},pairs.length),
    chip('in one store only',state.corrScope==='alone',
      ()=>{state.corrScope='alone';drawCorroboration();},alone.length,
      'The conversations this case holds that exactly one of an agent’s stores names.'),
    chip('every conversation',state.corrScope==='all',
      ()=>{state.corrScope='all';drawCorroboration();},all.length),
  ]);
  setHideNote(state.corrScope==='alone'?(all.length-alone.length):0,
    'only the conversations that exactly one store names are listed',
    ()=>{state.corrScope='all';drawCorroboration();});

  body.innerHTML='';
  if(data.error) body.appendChild(el('div',{class:'notice',text:'The stores could not be compared: '+data.error}));

  if(state.corrScope==='pairs'){
    if(!pairs.length){
      setEvidence(null);
      emptyRows(body,'No agent in this case has two stores that both name conversations, so there is nothing to compare. That is not the same as agreement.');
      return;
    }
    body.appendChild(headRow(PAIR_COLS));
    const chosen=picked('corroboration');
    let chosenPair=pairs.find(p=>pairKey(p)===chosen)||pairs[0];
    for(const pair of pairs){
      const reading=pairReading(pair);
      body.appendChild(dataRow(PAIR_COLS,{
        agent:pair.agent,
        left:mono(pair.left),
        right:mono(pair.right),
        both:mono(fmtInt(pair.both),pair.both?'':'bad'),
        lonly:mono(fmtInt(pair.left_only),pair.left_only?'warn':'q'),
        ronly:mono(fmtInt(pair.right_only),pair.right_only?'warn':'q'),
        reading:pill(reading.text,reading.cls),
      },{cls:(reading.cls==='bad'?'alert ':(reading.cls==='warn'?'soft ':''))
           +(pairKey(pair)===pairKey(chosenPair)?'on':''),
         onclick:()=>{pick('corroboration',pairKey(pair));drawCorroboration();}}));
    }
    drawPairEvidence(chosenPair,alone);
    return;
  }

  const rows=state.corrScope==='alone'?alone:all;
  if(!rows.length){
    setEvidence(null);
    emptyRows(body,state.corrScope==='alone'
      ? 'Every conversation in this case is named by every store of its agent that names conversations at all.'
      : 'No conversation in this case carries a session id.');
    return;
  }
  body.appendChild(headRow(ALONE_COLS));
  const chosen=picked('corroboration');
  let chosenRow=rows.find(r=>r.session_id===chosen)||rows[0];
  for(const row of rows){
    const silent=(row.silent||[]).map(e=>e.artifact_id+' (names '+fmtInt(e.names_sessions)+')');
    body.appendChild(dataRow(ALONE_COLS,{
      agent:row.agent||'unclaimed',
      session:mono(row.session_id),
      named:quiet((row.named_by||[]).map(e=>e.artifact_id).join(', ')),
      silent:silent.length?mono(silent.join(', '),'warn'):quiet('nothing is silent'),
      events:mono(fmtInt(row.events)),
    },{cls:(silent.length?'soft ':'')+(row.session_id===chosenRow.session_id?'on':''),
       onclick:()=>{pick('corroboration',row.session_id);drawCorroboration();}}));
  }
  drawAloneEvidence(chosenRow);
}

function pairKey(pair){return pair.agent+'|'+pair.left+'|'+pair.right;}
function pairReading(pair){
  if(pair.overlap==='none'){
    return {text:'two id spaces, not a loss',cls:'warn'};
  }
  if(pair.overlap==='complete') return {text:'the two agree completely',cls:'ok'};
  const onlyOne=(pair.left_only||0)+(pair.right_only||0);
  return {text:fmtInt(onlyOne)+' in one store only',cls:'bad'};
}

function drawPairEvidence(pair,alone){
  if(!pair){setEvidence(null);return;}
  const reading=pairReading(pair);
  const theirs=alone.filter(r=>r.agent===pair.agent
    &&(r.silent||[]).some(s=>s.artifact_id===pair.left||s.artifact_id===pair.right));
  const sections=[evSec([
    el('div',{},[pill(reading.text,reading.cls)]),
    evKV('Agent',pair.agent),
    evStack('Store A',pair.left),
    evStack('Store B',pair.right),
    evKV('In both',fmtInt(pair.both)),
    evKV('Only in A',fmtInt(pair.left_only)),
    evKV('Only in B',fmtInt(pair.right_only)),
  ])];
  sections.push(evSec([
    evLabel('How to read this'),
    evProse(pair.overlap==='none'
      ? 'These two stores share no conversation at all. That is far more likely to mean '
        +'they spell session ids differently than that every conversation was lost from '
        +'one of them. Compare a few ids by eye before reading anything into it.'
      : (pair.overlap==='complete'
        ? 'Every conversation one of these stores names, the other names too. Nothing is '
          +'missing between them — which says nothing about a conversation neither ever held.'
        : 'Some conversations are in one of these stores and not the other. That is either '
          +'ordinary — one of them indexes only what was opened — or the trace of something '
          +'removed. The rows below are where to look.')),
  ]));
  if(theirs.length){
    const children=[evLabel('Conversations only one of them names')];
    for(const row of theirs.slice(0,8)){
      children.push(evQuote('soft',[
        el('span',{class:'h',text:shortId(row.session_id,16)}),
        el('span',{class:'ev-prose',
          text:'in '+(row.named_by||[]).map(e=>e.artifact_id).join(', ')
            +' · '+fmtInt(row.events)+' events'}),
      ]));
    }
    if(theirs.length>8) children.push(evProse('and '+(theirs.length-8)+' more.'));
    sections.push(evSec(children));
  }
  setEvidence(pair.agent+' · '+pair.left+' vs '+pair.right,sections);
}

function drawAloneEvidence(row){
  if(!row){setEvidence(null);return;}
  const sections=[evSec([
    evKV('Agent',row.agent||'unclaimed'),
    evStack('Conversation',row.session_id),
    evKV('Events',fmtInt(row.events)),

// What a file's state is called in one word. Derived here rather than stored, because the
// case records two separate facts (was it collected, did a parser read it) and a reader
// needs the combination: a file that was never collected and a file that was collected and
// never read are different gaps with different remedies.
function artifactState(entry){
  if(!entry.collected) return 'not collected';
  if(!entry.parse_status) return 'no parser';
  return entry.parse_status;
}
const ARTIFACT_STATE_CLASS={parsed:'ok','no parser':'warn',unsupported:'warn',
  skipped:'warn',failed:'bad','not collected':'bad'};

function drawArtifacts(){
  const body=document.getElementById('artifacts-body');
  const data=state.caseArtifacts||{artifacts:[]};
  const all=data.artifacts||[];
  const counts={};
  for(const entry of all){const s=artifactState(entry);counts[s]=(counts[s]||0)+1;}
  const names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const duplicates=all.filter(e=>(e.identical_to||[]).length).length;

  setHead('Artifacts',fmtInt(all.length)+' files · '
    +fmtInt(counts['no parser']||0)+' collected and never read',[exportButton('artifacts')]);
  setViewNote('<b>This view qualifies every other one.</b> A file nobody collected and a '
    +'file that was collected and never read are different gaps with different remedies, '
    +'and a case whose events are thin for one of those reasons says nothing about how the '
    +'agent was used until it is clear which.');

  const chips=[chip('all',state.artifactFilter==='all',
    ()=>{state.artifactFilter='all';drawArtifacts();},all.length)];
  for(const name of names){
    chips.push(chip(name,state.artifactFilter===name,
      ()=>{state.artifactFilter=name;drawArtifacts();},counts[name]));
  }
  if(duplicates){
    chips.push(el('div',{class:'chip-gap'}));
    chips.push(chip('same bytes as another',state.artifactFilter==='duplicates',
      ()=>{state.artifactFilter='duplicates';drawArtifacts();},duplicates,
      'An agent that sets a transcript aside rather than deleting it leaves the conversation under a name its own session picker does not show.'));
  }
  setChips(chips);

  const rows=all.filter(e=>state.artifactFilter==='all'
    ||(state.artifactFilter==='duplicates'
      ? (e.identical_to||[]).length
      : artifactState(e)===state.artifactFilter));
  setHideNote(all.length-rows.length,'a status chip is set',
    ()=>{state.artifactFilter='all';drawArtifacts();});

  body.innerHTML='';
  if(data.error) body.appendChild(el('div',{class:'notice',text:'The artifact list could not be read: '+data.error}));
  if(!rows.length){
    setEvidence(null);
    emptyRows(body,'No file matches this chip. '+fmtInt(all.length)+' are out of view.');
    return;
  }

  body.appendChild(headRow(ARTIFACT_COLS));
  const chosen=picked('artifacts');
  let chosenRow=rows.find(e=>artifactKey(e)===chosen)||rows[0];
  for(const entry of rows){
    const stateName=artifactState(entry);
    const cls=ARTIFACT_STATE_CLASS[stateName]||'warn';
    const dup=(entry.identical_to||[]).length;
    body.appendChild(dataRow(ARTIFACT_COLS,{
      path:mono(entry.original_path),
      artifact:quiet(entry.artifact_id||entry.category||'unclaimed'),
      size:quiet(fmtBytes(entry.size)),
      records:entry.events_parsed?mono(fmtInt(entry.events_parsed)):quiet('—'),
      status:[pill(stateName,cls),
              entry.records_unparsed?pill(fmtInt(entry.records_unparsed)+' bad','bad'):null],
      dup:dup?mono(tailPath(entry.identical_to[0])+(dup>1?' +'+(dup-1):''),'bad'):quiet('—'),
    },{cls:(cls==='bad'?'alert ':(cls==='warn'?'soft ':''))
         +(artifactKey(entry)===artifactKey(chosenRow)?'on':''),
       title:entry.reason||entry.parse_detail||'',
       onclick:()=>{pick('artifacts',artifactKey(entry));drawArtifacts();}}));
  }
  // The holes the collection itself reported, as rows of their own. A file that was never
  // looked for is not in the table above at all, and a list of only what was collected is
  // exactly the reading this view exists to prevent.
  for(const gap of (data.collection_gaps||[])){
    body.appendChild(dataRow(ARTIFACT_COLS,{
      // The reason goes with the path rather than into the duplicate column: a cell under
      // "same bytes as" that holds a sentence is a cell a reader can misread as a filename.
      path:[mono(gap.detail,'bad'),
            gap.reason?el('span',{class:'m q',text:' — '+gap.reason}):null],
      artifact:quiet('not collected'),
      size:quiet('—'),records:quiet('—'),
      status:pill('collection gap: '+gap.kind,'bad'),
      dup:quiet('—'),
    },{cls:'alert',title:gap.reason||''}));
  }
  drawArtifactEvidence(chosenRow);
}

function artifactKey(entry){return (entry.bundle_uuid||'')+'|'+entry.original_path;}

function drawArtifactEvidence(entry){
  if(!entry){setEvidence(null);return;}
  const stateName=artifactState(entry);
  const sections=[evSec([
    el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},[

      entry.symlink?pill('symlink','warn'):null,
    ].filter(Boolean)),
    evStack('Path on the endpoint',entry.original_path),
    evKV('Size',entry.size===null||entry.size===undefined?'not recorded':(fmtInt(entry.size)+' B')),
    evKV('Modified',fmtStamp(entry.mtime_utc)),
    evKV('Created',fmtStamp(entry.birthtime_utc)),
    evKV('Parser',entry.parser||'none was responsible'),
    evKV('Records read',entry.events_parsed===null?'—':fmtInt(entry.events_parsed)),
    evKV('Records unreadable',entry.records_unparsed?fmtInt(entry.records_unparsed):'0'),
    evStack('SHA-256',entry.sha256||'not recorded'),
  ])];
  if(entry.reason||entry.parse_detail){
    sections.push(evSec([
      evLabel('Why it reads this way'),
      evProse(esc(entry.reason||entry.parse_detail)),
    ]));
  }
  if((entry.identical_to||[]).length){
    const children=[evLabel('Byte for byte the same file as')];
    for(const path of entry.identical_to.slice(0,6)){
      children.push(evQuote('',[el('span',{class:'ev-prose',text:path})]));
    }
    children.push(evProse('The hashes came with the collection, so this is equality rather '
      +'than a reading. An agent that sets a transcript aside instead of deleting it leaves '
      +'the conversation under a name its own session picker does not show.'));
    sections.push(evSec(children));
  }
  if(stateName==='no parser'||stateName==='unsupported'){

        +'<code>afx normalize</code> and ingest the result, or say in the report that the '
        +'case holds the bytes and no reading of them — those are different claims.'),
    ]));

  setEvidence(tailPath(entry.original_path),sections);
}
