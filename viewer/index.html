    ]));
  }else{
    sections.push(evSec([
      evLabel('Output'),
      evProse('No result was recorded for this call. That is a gap in the store, not a call '
        +'that succeeded — the two are different findings and this view will not merge them.'),
    ]));
  }
  setEvidence(row.tool+' · '+shortId(row.event_id),sections,
    el('button',{class:'linkish',type:'button',text:'open in its session',
      onclick:()=>openCaseEvent(row.event_id)}));
}

// ---- from a folder or a log ----
//
// The same view over what the viewer itself read. It says so in its own header, because a
// count taken from what happened to load is a different claim from a count taken from the
// case.
function renderLocalTools(){
  const list=document.getElementById('tools-list');
  const path=scopePath();
  const inScope=filterToolRows(state.allTools,{path});
  const counts={};for(const t of inScope)counts[t.name]=(counts[t.name]||0)+1;
  const names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);

  if(state.current){
    chips.push(chip('this session',state.scope==='session',
      ()=>{state.scope='session';redraw();},

      (state.current.summary&&state.current.summary.title)||''));
  }
  chips.push(el('div',{class:'chip-gap'}));
  chips.push(chip('every tool',state.toolFilter==='all',
    ()=>{state.toolFilter='all';redraw();},inScope.length));
  for(const n of names.slice(0,10)){
    chips.push(chip(shortName(n),state.toolFilter===n,()=>{state.toolFilter=n;redraw();},counts[n],n));
  }
  chips.push(el('div',{class:'chip-gap'}));
  chips.push(chip('failed only',state.toolErrOnly,

  chips.push(el('div',{class:'chip-push'}));
  const box=el('div',{class:'searchbox',style:'width:200px'},[el('span',{class:'ic',text:'⌕'})]);
  const input=el('input',{type:'text',placeholder:'contains…',value:state.toolQuery,
    title:'Match the tool name, its summary or its session'});

  box.appendChild(input);
  chips.push(box);

  setHead('Tool usage',fmtInt(state.allTools.length)+' calls read so far',[]);
  setViewNote('<b>Counted from the transcripts this page has read</b>, because there is no '
    +'case behind it to ask. Sessions are still loading in the background, so these numbers '
    +'grow; serve a case with <code>afx serve</code> for a count taken from the evidence '
    +'rather than from what has arrived.');

}

function drawLocalToolRows(){
  const list=document.getElementById('tools-list');
  const path=scopePath();
  const rows=filterToolRows(state.allTools,{path,name:state.toolFilter,
    errOnly:state.toolErrOnly,query:state.toolQuery}).slice().reverse();

    state.toolFilter='all';state.toolErrOnly=false;state.toolQuery='';renderToolsPanel();
  });

  setFoot('tools-foot',fmtInt(rows.length)+' of '+fmtInt(total)+' calls');
  if(!rows.length){

      ? 'No tool call matches these filters. '+fmtInt(total)+' are out of view.'

    return;

  list.appendChild(headRow(TOOL_COLS));

    list.appendChild(dataRow(TOOL_COLS,{

// ---------- the Security view ----------
//
// The built-in credential scan. A heuristic over transcript text, and the panel says so
// before it says anything else: a regular expression over prose produces false positives
// and misses things, and a match that goes into a report unverified is the analyst's
// mistake that this tool made easy.
const SECRET_COLS=[
  col('sev','Sev',80),
  col('rule','Rule',160),
  col('where','Where it was found',220),
  col('match','Match'),
  col('context','Context',190),
  col('session','Session',110),
];

// A match with its middle removed. Masked by default, because this view is screenshotted
// into reports and a live credential in a report is a second incident. The whole value is
// one click away for the analyst who needs to check it.
function maskSecret(text){
  const value=String(text||'');
  if(state.secReveal) return value;
  if(value.length<=8) return value.slice(0,2)+'•'.repeat(Math.max(1,value.length-2));
  return value.slice(0,Math.min(10,value.length-4))+'•'.repeat(8);
}

function findingKey(hit){
  return [hit.path,hit.rule,hit.where,hit.match].join('|');
}

function renderSecurityPanel(){
  const list=document.getElementById('sec-list');
  const path=scopePath();
  const inScope=filterFindingRows(state.findings,{path});
  const rules={};for(const h of inScope)rules[h.rule]=(rules[h.rule]||0)+1;
  const bySev={};for(const h of inScope)bySev[h.sev]=(bySev[h.sev]||0)+1;

  const redraw=()=>renderSecurityPanel();
  const chips=[el('span',{class:'filter-label',text:'scope'}),
    chip('all sessions',state.scope!=='session',()=>{state.scope='all';redraw();},state.findings.length)];
  if(state.current){
    chips.push(chip('this session',state.scope==='session',
      ()=>{state.scope='session';redraw();},
      filterFindingRows(state.findings,{path:state.current.path}).length));
  }
  chips.push(el('div',{class:'chip-gap'}));
  chips.push(chip('any severity',state.secSev==='all',()=>{state.secSev='all';redraw();},inScope.length));
  for(const sev of ['high','med']){
    if(bySev[sev]) chips.push(chip(sev==='med'?'medium':sev,state.secSev===sev,
      ()=>{state.secSev=sev;redraw();},bySev[sev]));
  }
  chips.push(el('div',{class:'chip-gap'}));
  for(const rule of Object.keys(rules).sort()){
    chips.push(chip(rule,state.secRule===rule,
      ()=>{state.secRule=state.secRule===rule?'all':rule;redraw();},rules[rule]));
  }
  chips.push(el('div',{class:'chip-push'}));
  chips.push(chip(state.secReveal?'hide the values':'show the values',state.secReveal,
    ()=>{state.secReveal=!state.secReveal;redraw();},null,
    'Matches are masked by default. This view ends up in reports, and a live credential in a report is a second incident.'));
  setChips(chips);

  const sorted=filterFindingRows(state.findings,{path,sev:state.secSev,rule:state.secRule})
    .slice().sort((a,b)=>(a.sev==='high'?0:1)-(b.sev==='high'?0:1));
  setHead('Security scan',
    fmtInt(state.findings.length)+' potential credentials in transcript text',[]);
  setViewNote('<b>A heuristic, not a scanner.</b> Regular expressions over tool input, tool '
    +'output and assistant text. False positives and false negatives are both expected, so '
    +'every match belongs verified before it goes into a report. Marking one below records '
    +'it in this browser session only — the case is open read-only and nothing here writes '
    +'to it.');
  setHideNote(inScope.length-sorted.length,'a severity or rule chip is set',
    ()=>{state.secSev='all';state.secRule='all';redraw();});
  updateSecBadge();

  list.innerHTML='';
  if(!sorted.length){
    setEvidence(null);
    emptyRows(list,inScope.length
      ? 'No match here fits these chips. '+fmtInt(inScope.length)+' are out of view.'
      : (path?'No potential credential in this session.'
             :'No potential credential in any transcript this page has read. That is the scan having run and found nothing, not the scan not having run.'));
    return;
  }
  list.appendChild(headRow(SECRET_COLS));
  const chosen=picked('security');
  let chosenRow=sorted.find(h=>findingKey(h)===chosen)||sorted[0];
  for(const hit of sorted){
    const key=findingKey(hit);
    const verdict=state.secTriage[key];
    list.appendChild(dataRow(SECRET_COLS,{
      sev:pill(hit.sev==='high'?'high':'medium',hit.sev==='high'?'bad':'warn'),
      rule:mono(hit.rule),
      where:mono(hit.where),
      match:mono(maskSecret(hit.match)),
      context:[quiet(hit.context||'transcript text'),
               verdict?pill(verdict,verdict==='false positive'?'':'bad'):null],
      session:quiet(shortId(hit.sessionId)),
    },{cls:(hit.sev==='high'?'alert ':'')
         +(verdict==='false positive'?'done ':'')
         +(key===findingKey(chosenRow)?'on':''),
       onclick:()=>{pick('security',key);renderSecurityPanel();}}));
  }
  drawSecretEvidence(chosenRow);
}

function drawSecretEvidence(hit){
  if(!hit){setEvidence(null);return;}
  const key=findingKey(hit);
  const rule=SECRET_RULES.find(r=>r.rule===hit.rule);
  const sections=[evSec([
    el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},[
      pill(hit.sev==='high'?'high':'medium',hit.sev==='high'?'bad':'warn'),
      pill('heuristic'),
    ]),
    evKV('Rule',hit.rule),
    rule?evStack('Pattern',String(rule.re).replace(/^\/|\/g?i?$/g,'')):null,
    evKV('Found in',hit.context||'transcript text'),
    evStack('Which call',hit.where),
    evKV('Session',shortId(hit.sessionId,12)),
    evKV('At',hit.ts?fmtStamp(hit.ts)+' UTC':'no timestamp'),
    evStack('Transcript',hit.path),
  ].filter(Boolean))];
  if(hit.ev&&hit.ev.provenance){
    sections.push(provenanceSection(hit.ev.provenance,[evKV('Event',shortId(hit.ev.event_id,12))]));
  }
  const surroundings=el('div',{class:'ev-code'});
  surroundings.innerHTML=esc(hit.snippet||'')
    .replace(new RegExp(escRe(esc(hit.match)),'g'),
      '<mark class="hl">'+esc(maskSecret(hit.match))+'</mark>');
  sections.push(evSec([
    el('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:8px'},[
      evLabel('Around the match'),
      el('button',{class:'linkish',type:'button',
        text:state.secReveal?'mask again':'show in full',
        onclick:()=>{state.secReveal=!state.secReveal;renderSecurityPanel();}}),
    ]),
    surroundings,
  ]));
  const marks=el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'});
  for(const verdict of ['real','false positive','unclear']){
    marks.appendChild(el('button',{
      class:'btn'+(state.secTriage[key]===verdict?' on':''),type:'button',text:verdict,
      onclick:()=>{
        state.secTriage[key]=state.secTriage[key]===verdict?undefined:verdict;
        renderSecurityPanel();
      }}));
  }
  sections.push(evSec([
    evLabel('Follow-up'),
    marks,
    evProse('The mark stays in this browser session and never reaches the case: it is open '
      +'read-only, and a forensic viewer that wrote to its own evidence would be a viewer '
      +'nobody could use.'),
  ]));
  setEvidence(hit.rule,sections,
    el('button',{class:'linkish',type:'button',text:'open in its transcript',
      onclick:()=>openByPath(hit.path)}));
}

function updateSecBadge(){
  const badge=document.getElementById('sec-badge');
  if(!badge) return;
  badge.textContent=String(state.findings.length);
  badge.classList.toggle('hidden',!state.findings.length);
}

// ---------- modal ----------
function showModal(text){const m=document.getElementById('modal');m.querySelector('.modal-content').textContent=text;m.classList.remove('hidden');}
function hideModal(){document.getElementById('modal').classList.add('hidden');}

// ============================================================================
// In-session search + highlight
// ============================================================================
let searchMatches=[],searchIdx=-1,searchTimer=null;

function clearHighlights(){
  document.querySelectorAll('#transcript mark.hl').forEach(m=>{
    const p=m.parentNode;
    p.replaceChild(document.createTextNode(m.textContent),m);
    p.normalize();
  });
}

// Wrap every case-insensitive occurrence of `term` (within `root`) in <mark>.
function highlightIn(root,term){
  const lc=term.toLowerCase();
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{
    acceptNode(node){
      if(!node.nodeValue||!node.nodeValue.toLowerCase().includes(lc))return NodeFilter.FILTER_REJECT;
      const p=node.parentNode;
      if(p&&(p.tagName==='MARK'||p.tagName==='SCRIPT'||p.tagName==='STYLE'))return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets=[];
  while(walker.nextNode())targets.push(walker.currentNode);
  for(const node of targets){
    const text=node.nodeValue,lower=text.toLowerCase();
    const frag=document.createDocumentFragment();
    let idx=0,pos;
    while((pos=lower.indexOf(lc,idx))!==-1){
      if(pos>idx)frag.appendChild(document.createTextNode(text.slice(idx,pos)));
      const mk=document.createElement('mark');mk.className='hl';mk.textContent=text.slice(pos,pos+term.length);
      frag.appendChild(mk);
      idx=pos+term.length;
    }
    if(idx<text.length)frag.appendChild(document.createTextNode(text.slice(idx)));
    node.parentNode.replaceChild(frag,node);
  }
}

function runSearch(){
  clearHighlights();
  searchMatches=[];searchIdx=-1;
  const msg=document.getElementById('search-messages').value.trim();
  const all=document.getElementById('search-all').value.trim();
  let term='',roots=[],expand=false;
  if(all){term=all;roots=[document.getElementById('transcript')];expand=true;}
  else if(msg){term=msg;roots=[...document.querySelectorAll('#transcript .user-body, #transcript .assistant-turn > .md')];}
  if(term){
    for(const r of roots)highlightIn(r,term);
    searchMatches=[...document.querySelectorAll('#transcript mark.hl')];
    // "Everything" search reveals collapsed tool details / thinking that match.
    if(expand){
      for(const m of searchMatches){
        let n=m.parentElement;
        while(n&&n.id!=='transcript'){if(n.classList&&n.classList.contains('collapsed'))n.classList.remove('collapsed');n=n.parentElement;}
      }
    }
  }
  if(searchMatches.length){searchIdx=0;focusMatch(false);}
  updateSearchCount(term);
}

function updateSearchCount(term){
  const c=document.getElementById('search-count');
  if(!term){c.textContent='';return;}
  c.textContent=searchMatches.length?`${searchIdx+1} / ${searchMatches.length}`:'No matches';
}

function focusMatch(scroll=true){
  document.querySelectorAll('#transcript mark.hl.hl-current').forEach(m=>m.classList.remove('hl-current'));
  const m=searchMatches[searchIdx];
  if(!m)return;
  m.classList.add('hl-current');
  if(scroll)m.scrollIntoView({block:'center',behavior:'smooth'});
}

function stepSearch(dir){
  if(!searchMatches.length)return;
  searchIdx=(searchIdx+dir+searchMatches.length)%searchMatches.length;
  focusMatch();
  updateSearchCount('x');
}

function resetSearch(){
  document.getElementById('search-messages').value='';
  document.getElementById('search-all').value='';
  clearHighlights();
  searchMatches=[];searchIdx=-1;
  document.getElementById('search-count').textContent='';
}

function debouncedSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,140);}

// ---------- boot ----------
document.getElementById('search').addEventListener('input',renderSidebar);
// Only a rail button that names a view switches to one. The help button is a rail button
// with no view of its own, and a tab with no panel is what the structure check forbids.
document.querySelectorAll('.tab').forEach(t=>{
  if(t.dataset.view) t.addEventListener('click',()=>switchView(t.dataset.view));
});
document.querySelector('.modal-close').addEventListener('click',hideModal);
document.querySelector('.modal-backdrop').addEventListener('click',hideModal);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal();});
document.getElementById('help-button').addEventListener('click',()=>showModal(HELP_TEXT));

// Which rail button is lit, from the one place that decides it.
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===state.view));
setCaseBar(null);

// in-session search wiring — the two fields are mutually exclusive scopes, and the
// segmented control above them is which of the two is on screen. One box rather than two
// side by side, because an analyst searching a transcript is choosing a scope, not filling
// in a form.
const fMsg=document.getElementById('search-messages');
const fAll=document.getElementById('search-all');
fMsg.addEventListener('input',()=>{fAll.value='';debouncedSearch();});
fAll.addEventListener('input',()=>{fMsg.value='';debouncedSearch();});
for(const f of [fMsg,fAll]){
  f.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();stepSearch(e.shiftKey?-1:1);}
  });
}
function setSearchScope(all){
  const textBtn=document.getElementById('scope-text');
  const allBtn=document.getElementById('scope-all');
  textBtn.classList.toggle('active',!all);
  allBtn.classList.toggle('active',all);
  fMsg.classList.toggle('hidden',all);
  fAll.classList.toggle('hidden',!all);
  // The term carries across, so switching scope widens the same search instead of losing it.
  const term=(all?fMsg.value:fAll.value).trim();
  if(all){fAll.value=term;fMsg.value='';}else{fMsg.value=term;fAll.value='';}
  (all?fAll:fMsg).focus();
  debouncedSearch();
}
document.getElementById('scope-text').addEventListener('click',()=>setSearchScope(false));
document.getElementById('scope-all').addEventListener('click',()=>setSearchScope(true));
setSearchScope(false);
document.getElementById('search-next').addEventListener('click',()=>stepSearch(1));
document.getElementById('search-prev').addEventListener('click',()=>stepSearch(-1));
document.getElementById('search-clear').addEventListener('click',resetSearch);

// ---- theme toggle: Auto (follow system) → Light → Dark → Auto ----
const THEME_ORDER=['auto','light','dark'];
const THEME_ICON={auto:'◐',light:'○',dark:'●'};
const THEME_LABEL={auto:'Auto (matches system)',light:'Light',dark:'Dark'};
function storedTheme(){try{return localStorage.getItem('cc-theme')||'auto';}catch(e){return 'auto';}}
function applyTheme(t){
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  const btn=document.getElementById('theme-toggle');
  if(btn){btn.textContent=THEME_ICON[t];btn.title='Theme: '+THEME_LABEL[t]+' — click to change';}
}
applyTheme(storedTheme());
document.getElementById('theme-toggle').addEventListener('click',()=>{
  const next=THEME_ORDER[(THEME_ORDER.indexOf(storedTheme())+1)%THEME_ORDER.length];
  try{next==='auto'?localStorage.removeItem('cc-theme'):localStorage.setItem('cc-theme',next);}catch(e){}
  applyTheme(next);
});

// Offer the local-folder picker only when hosted (the API is absent on file://).
const openFolderBtn=document.getElementById('open-folder');
if(canPickFolder){
  openFolderBtn.classList.remove('hidden');
  openFolderBtn.addEventListener('click',openLocalFolder);
}

// Boot. A case served by `afx serve` wins over directory discovery, because a page that is
// being served one is a page that has one: scraping a directory listing there would find
// nothing and report "no logs found", which reads as no evidence.
async function boot(){
  const served=await probeCaseApi();
  if(served){ await loadCase(served); return; }
  await loadProjects();
}
boot();
</script>
