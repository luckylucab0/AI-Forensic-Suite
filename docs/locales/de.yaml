# Strukturbezeichnungen für die generierten Dokumente. Freitext (die Notizen eines
# Artefakts, die Beschreibung einer Regel) steht nicht hier, sondern in den Katalog- und
# Regeldateien, wo er ein einfacher String oder eine Zuordnung {en: ..., de: ...} sein
# kann.
language_name: Deutsch
other_language_name: English

artifacts:
  title: Artefaktkatalog
  generated_note: >-
    Erzeugt aus catalog/ durch scripts/gen_artifact_docs.py. Nicht von Hand bearbeiten:
    die CI erzeugt diese Datei neu und schlägt fehl, wenn sie abweicht.
  toc: Agenten
  col_id: Kennung
  col_category: Kategorie
  col_os: Betriebssysteme
  col_paths: Pfade
  col_format: Format
  col_sensitivity: Sensitivität
  col_volatility: Aufbewahrung
  col_status: Status
  col_source: Quelle
  col_notes: Anmerkungen
  status_verified: bestätigt
  status_unverified: unbestätigt
  unverified_warning: >-
    Als unbestätigt markierte Einträge werden trotzdem gesammelt, aber keine
    Herstellerquelle bestätigt den Pfad. Das Fehlen eines solchen Artefakts ist daher
    kein Beweis dafür, dass der Agent nicht genutzt wurde, sondern unklar.
  verified_meaning: >-
    Was bestätigt hier bedeutet: der Eintrag wurde anhand der in seiner Zeile verlinkten
    Quelle geschrieben, und das Schema erlaubt für diese Markierung nur die Dokumentation
    oder den Quellcode des Herstellers. Es bedeutet nicht, dass eine zweite Person die
    Seite geöffnet und bestätigt hat, dass dort genau dieser Pfad steht; diesen Durchgang
    hat der Katalog noch nicht hinter sich. Eine bestätigte Zeile ist also belegt, aber
    nicht unabhängig geprüft. Folgen Sie dem Link, wenn eine Schlussfolgerung am Pfad
    hängt.
  unsourced_marker: "[unbelegt]"
  unsourced_warning: >-
    Ein mit [unbelegt] markierter Pfad gehört zu einem bestätigten Eintrag, dessen Quelle genau
    diesen Pfad nicht nennt. Er wird wie jeder andere Pfad gesammelt, und ein Fehlschlag unter
    ihm ist genauso unklar wie bei einem unbestätigten Eintrag.
  untranslated_marker: "[EN]"

rules:
  title: Erkennungsregeln
  generated_note: >-
    Erzeugt aus rules/ durch scripts/gen_rule_docs.py. Nicht von Hand bearbeiten.
  col_id: Kennung
  col_title: Titel
  col_severity: Schweregrad
  col_agents: Agenten
  col_kinds: Ereignisarten
  col_tags: Schlagworte
  section_rationale: Warum das für die Analyse zählt
  section_false_positives: Bekannte Fehlalarme
  section_references: Quellen
  heuristic_warning: >-
    Jede Regel ist eine Heuristik. Ein Fund ist ein Hinweis, der von einer Analystin oder
    einem Analysten geprüft werden muss, niemals ein Urteil.
  col_pack: Paket
  col_fields: Gelesene Felder
  section_condition: Worauf sie trifft
  section_scope: Geltungsbereich
  section_tests: Stichproben in der Regeldatei
  toc: Pakete
  intro: >-
    Eine Datei pro Regel unter rules/, gruppiert in Pakete. Eine Regel ist Daten und kein
    Code: ein Baum von Bedingungen über benannte Ereignisfelder, ohne auszuwertenden
    Ausdruck und ohne etwas Aufrufbares in einer Regeldatei. Siehe
    docs/adr/0019-rules-are-data-with-their-own-tests.md.
  tests_note: >-
    Jede Regel trägt ihre eigenen positiven und negativen Stichproben, und pytest führt
    jede einzelne als eigenen Fall aus. Eine Regel mit ausschließlich positiven Stichproben
    weist der Lader ab, denn der Fehler, auf den es ankommt, ist nicht eine Regel, die
    etwas übersieht: es ist eine Regel, die auf alles feuert, und die besteht jede positive
    Stichprobe, die sie hat.
  findings_note: >-
    Funde werden in die Falldatenbank geschrieben, neben die Ereignisse, auf denen sie
    ruhen, und jeder Scan wird festgehalten, ob etwas gefeuert hat oder nicht. Sonst sähen
    ein Fall ohne Funde und ein Fall, den niemand gescannt hat, gleich aus, und das sind
    entgegengesetzte Schlüsse.
  redact_note: >-
    Diese Regel zitiert nicht, worauf sie getroffen hat. Der getroffene Wert ist ein
    Zugangsdatum, und ein Fund wird exportiert und in Berichte kopiert, deshalb bleibt der
    Wert in dem Ereignis, aus dem er kommt.
  aggregate_note: >-
    Feuert auf eine Anzahl statt auf ein einzelnes Ereignis, gruppiert nach
  severity_order_note: >-
    Regeln sind nach Paket aufgeführt, innerhalb eines Pakets nach Id.
  untranslated_marker: "[EN]"
  translation_note: >-
    Regeldateien sind englisch, wie der Code und die
    Architekturentscheidungen, deshalb sind die meisten Absätze unten mit [EN]
    markiert. Eine Regel kann eine Übersetzung mitbringen, und die, die es tun,
    sind nicht markiert.
