# Structural labels for the generated documents. Free text (an artifact's notes, a
# rule's description) is not here: it lives in the catalogue and rule files, where it can
# be a plain string or an {en: ..., de: ...} mapping.
language_name: English
other_language_name: Deutsch

artifacts:
  title: Artifact catalogue
  generated_note: >-
    Generated from catalog/ by scripts/gen_artifact_docs.py. Do not edit by hand:
    CI regenerates this file and fails if it differs.
  toc: Agents
  col_id: Id
  col_category: Category
  col_os: Operating systems
  col_paths: Paths
  col_format: Format
  col_sensitivity: Sensitivity
  col_volatility: Retention
  col_status: Status
  col_source: Source
  col_notes: Notes
  status_verified: verified
  status_unverified: unverified
  unverified_warning: >-
    Entries marked unverified are collected anyway, but no vendor source confirms the
    path. Treat the absence of such an artifact as inconclusive rather than as evidence
    that the agent was not used.
  verified_meaning: >-
    What verified means here: the entry was written from the source linked in its row, and
    the schema accepts only the vendor's own documentation or source code for that mark. It
    does not mean a second reader has opened that page and confirmed it states the path,
    which is a pass this catalogue has not been through yet. Read a verified row as
    sourced rather than as independently confirmed, and follow the link when a conclusion
    depends on the path.
  unsourced_marker: "[unsourced]"
  unsourced_warning: >-
    A path marked [unsourced] belongs to a verified entry whose source does not state that
    particular path. It is collected like every other path, and a miss under it is inconclusive
    in the same way an unverified entry is.
  untranslated_marker: "[EN]"

rules:
  title: Detection rules
  generated_note: >-
    Generated from rules/ by scripts/gen_rule_docs.py. Do not edit by hand.
  col_id: Id
  col_title: Title
  col_severity: Severity
  col_agents: Agents
  col_kinds: Event kinds
  col_tags: Tags
  section_rationale: Why an analyst cares
  section_false_positives: Known false positives
  section_references: References
  heuristic_warning: >-
    Every rule is a heuristic. A finding is a lead that needs analyst review, never a
    verdict.
  col_pack: Pack
  col_fields: Fields read
  section_condition: What it matches
  section_scope: Scope
  section_tests: Samples in the rule file
  toc: Packs
  intro: >-
    One file per rule under rules/, grouped into packs. A rule is data rather than code: a
    tree of conditions over named event fields, with no expression to evaluate and nothing
    callable in a rule file. See docs/adr/0019-rules-are-data-with-their-own-tests.md.
  tests_note: >-
    Every rule carries its own positive and negative samples, and pytest runs each one as
    its own case. A rule with only positive samples is refused by the loader, because the
    failure that matters is not a rule that misses: it is a rule that fires on everything,
    and such a rule passes every positive sample it has.
  findings_note: >-
    Findings are written into the case database next to the events they rest on, and every
    scan is recorded whether or not anything fired. A case with no findings and a case
    nobody scanned would otherwise look identical, and those are opposite conclusions.
  redact_note: >-
    This rule does not quote what it matched. The matched value is a credential, and a
    finding is exported and pasted into reports, so the value stays in the event it came
    from.
  aggregate_note: >-
    Fires on a count rather than on one event, grouped by
  severity_order_note: >-
    Rules are listed by pack, and within a pack by id.
  untranslated_marker: "[EN]"
  translation_note: >-
    Rule files are English, like the code and the architecture decision records, so
    most paragraphs below are marked [EN]. A rule may carry a translation, and the
    ones that do are not marked.
